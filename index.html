,{"id":"p31-b2","pageNumber":31,"indexInPage":2,"text":"Por lo tanto, en cualquier caso, tiene el hombre que aceptar la espera con amor, rechazar su razonamiento completamente, y creer que “Todo es para bien”. Y mientras tanto, seguira rezando y retornando al buen camino hasta que tenga el privilegio y los instrumentos adecuados para lograr exito en el servicio al Creador."},{"id":"p31-b3","pageNumber":31,"indexInPage":3,"text":"¿Gran maestro espiritual o un simple empleado? Una historia verdadera cuenta sobre un famoso maestro espiritual contemporaneo, que por diferentes razones fue obligado a dejar sus estudios sagrados e ir a trabajar como... ¡un simple empleado de banco! Se da por entendido que precedieron circunstancias que aparentemente le empujaron a esto, finalmente se encontro un claro dia sentado tras del escritorio de un banco, en lugar de estar estudiando la Ley Divina como le gustaria."},{"id":"p31-b4","pageNumber":31,"indexInPage":4,"text":"Este erudito estaba sentado detras del escritorio en el banco, y pensaba: “¿Como llegue a este lugar? ¿Que hago aca? ¿Por que no estoy en el seminario estudiando?”. De pronto llego a la conclusion que esto seguramente no es casual, sino que tiene una mision y una correccion espiritual en ese lugar y debe aceptarlo con amor. No dejo que la tristeza y la desesperacion se apoderaran de el, ni tampoco intento desembarazarse y escaparse de la realidad. No tuvo ningun enojo o rencor hacia el Creador ni se culpo."},{"id":"p31-b5","pageNumber":31,"indexInPage":5,"text":"Por el contrario, tomo el camino mas practico posible, durante la pausa del mediodia en lugar de almorzar, con lagrimas en los ojos rezaba y suplicaba en un cuarto lateral al Todopoderoso, que lo devuelva al seminario. Sin embargo, durante el resto del dia estaba alegre y trabajaba con toda fidelidad."},{"id":"p31-b6","pageNumber":31,"indexInPage":6,"text":"Finalmente llegaron los resultados. No llevo ni una semana ni dos, pero despues de un tiempo se encontro sentado estudiando en el querido seminario sirviendo al Creador. Se cuenta sobre un sencillo comerciante que a los ochenta años tuvo un sueño."},{"id":"p31-b7","pageNumber":31,"indexInPage":7,"text":"Soñó que llegaba hasta él un Justo manteniendo en su mano un cáliz y le daba de beber… Cuando el hombre vive con la fe que todo esta bajo la Divina Supervision y que “Todo es para bien”, y no sospecha que el Creador lo llevara por mal camino, se parece al hombre que esta viajando en un autobus confiando en el conductor que sabe como manejarlo y adonde se dirige. Por cierto esta comodamente sentado en su asiento, mira el paisaje que desfila frente a sus ojos y goza de cada momento."},{"id":"p31-b8","pageNumber":31,"indexInPage":8,"text":"Por el contrario, el hombre al que le falta fe se parece al viajero nervioso que piensa que el mismo es el conductor. Piensa que sabe el camino y trata de dirigir el autobus desde su asiento. Esta todo el tiempo frustrado y amargado debido a que el conductor no viaja en la direccion que el quiere, tambien esta preocupado y molesto por la forma que conduce, una vez se molesta porque viaja demasiado rapido, otra vez porque viaja demasiado lento, ahora el conductor dobla violentamente, ahora el autobus salta..."},{"id":"p31-b9","pageNumber":31,"indexInPage":9,"text":"La verdad es que el no sabe por completo adonde viaja, no sabe nada de su vida, solo vive con pesar y con preocupaciones, y todo debido a que no confia en el conductor. Todo el tiempo que el hombre piensa que dirige el curso de su vida, no puede desechar sus deseos ni tampoco puede aceptar su camino con amor. Cada vez que sus cosas no se desarrollan como el quiere, se pone nervioso, se persigue a si mismo, se desespera, se deprime, etc."},{"id":"p31-b10","pageNumber":31,"indexInPage":10,"text":"En general, hay muchas personas que simplemente no estan dispuestas a aceptar el hecho que en este mundo es necesario pasar “correcciones”. Ellos solo se quejan y lloran todo el tiempo, y la existencia en este mundo les es insoportable. Pero esta es una realidad a la que es imposible escapar – nunca la vida se desarrolla exactamente como deseamos, hay sorpresas y cambios inesperados en nuestros planes. Desde el Cielo estamos dirigidos adonde debemos corregir nuestros errores."},{"id":"p31-b11","pageNumber":31,"indexInPage":11,"text":"Por lo tanto, en lugar de rezongar y lamentarnos nuevamente cada vez que encontramos obstaculos en nuestros planes y de vivir amargados con la sensacion de constante enojo, debemos fortalecernos en la creencia que “Asi el Creador quiere”, y que “Todo es para bien”. En cada cosa debemos buscar al Creador y el mensaje que nos quiere trasmitir. En otras palabras, debemos contemplar la Inteligencia"}],"rawCharCount":4850},{"pageNumber":32,"blocks":[{"id":"p32-b0","pageNumber":32,"indexInPage":0,"text":"Divina que existe en cada cosa."},{"id":"p32-b1","pageNumber":32,"indexInPage":1,"text":"La paciencia es recompensada Un hombre poseedor de fe que ve que las cosas no le salen bien, ¿que dice? “¡Asi el Creador quiere! ¡Todo es para bien!”, y hace lo que puede con alegria y de todo corazon, sin abandonar por eso sus deseos ni el esfuerzo para lograr lo deseado. Y tanto mas, esta alegre cuando le va bien. Si el hombre siente que no esta contento, debe trabajar sobre estas dos creencias porque solo el que es poseedor de fe esta siempre satisfecho con su vida y vive el paraiso ya en este mundo."},{"id":"p32-b2","pageNumber":32,"indexInPage":2,"text":"Y por el contrario – el unico infierno en la vida es la sensacion de amargura y la insatisfaccion. Vemos entonces que la falta de fe del hombre es en si misma su castigo… Se cuenta sobre un sencillo hombre que casi toda su vida fue comerciante y nunca consiguió dedicarse al estudio de la Ley Divina y los Preceptos. Pero a pesar de todo, nunca abandono su anhelo de hacerlo, y en todas sus transacciones comerciales no dejo de desear cuando podria llegar al estudio espiritual con profundidad. A los ochenta anos tuvo un sueno."},{"id":"p32-b3","pageNumber":32,"indexInPage":3,"text":"Sono que llegaba hasta el un Justo manteniendo en su mano un caliz y le daba de beber. Cuando desperto de su sueno, descubrio que la Ley Divina completa estaba clara y evidente frente a sus ojos, ¡y hasta los ochenta y dos anos alcanzo a escribir unos cuarenta libros!"},{"id":"p32-b4","pageNumber":32,"indexInPage":4,"text":"Una mente libre Cuando el hombre esta alegre, esta preparado para el tercer nivel de la fe. Porque por medio de la alegria su mente esta libre para buscar y entender correctamente el mensaje del Creador – que es lo que le insinua, y adonde El lo dirige. Tambien su corazon esta abierto para rezarle al Creador que le ilumine para saber que tiene que hacer ahora, y que cambios debe realizar en su vida."},{"id":"p32-b5","pageNumber":32,"indexInPage":5,"text":"Estos detalles – como entender los mensajes del Creador, como despertar, como corregir lo que se debe – todos pertenecen al tercer nivel de la fe, al cual es imposible llegar sin haber cumplido bien el segundo nivel. ¡Por lo tanto, es importante recordar!: antes que el hombre pase al tercer nivel y empiece a pensar que tiene que hacer en este mundo, debe estudiar y fijar bien dentro de su corazon la creencia que “Todo es para bien”."},{"id":"p32-b6","pageNumber":32,"indexInPage":6,"text":"Si le llegara una prueba – la recibira con amor, y solo despues podra acercarse al proximo nivel: entender cual es Su mensaje."},{"id":"p32-b7","pageNumber":32,"indexInPage":7,"text":"Es muy importante acordarse de esta regla. Porque mientras no sintamos que poseemos de verdad la fe que “Todo es para bien”, nos esta prohibido empezar a usar nuestro razonamiento y pensar cual es el mensaje que manda el Creador. Si tratamos de entender Su mensaje sin esa creencia que nos lleva a la alegria, solamente nos deterioraremos mas. Unicamente cuando el hombre esta alegre y libre de presiones y preocupaciones, solo entonces puede su cerebro funcionar libremente y llegar a la verdadera claridad mental."},{"id":"p32-b8","pageNumber":32,"indexInPage":8,"text":"Subir de nivel La conclusion que sacamos de lo antedicho es, que cuando el hombre posee el segundo nivel de la fe – es decir que vive con la creencia que “Todo es para bien” y Le agradece y ensalza al Creador – por supuesto vive una vida muy hermosa, tranquila y agradable. Aparentemente, pareceria que es suficiente con adquirir el nivel intermedio de la fe, entonces ¿por que seguir adelante?, ¿que falta?"},{"id":"p32-b9","pageNumber":32,"indexInPage":9,"text":"Debemos saber que si el hombre no aprovechara los acontecimientos que el Creador le trae con el fin de conocerlo y conectarse con El, ni meditara y no tratara de entender lo que El le insinua, no podria sostenerse en el segundo nivel. Si le llegara una prueba dificil, no la resistiria y decaeria su fe que “Todo es para bien”. De por si, inmediatamente decaeria tambien su alegria y su agradecimiento."},{"id":"p32-b10","pageNumber":32,"indexInPage":10,"text":"Porque la creencia que “Todo es para bien” pertenece principalmente al hombre que relaciona todo con la eterna finalidad, pues la esencia de lo bueno que se extrae de todos los sufrimientos es merecer por medio de ellos acercarse al Creador y conectarse con Él, que es el objetivo de todo lo que le pasa al hombre. Por lo tanto, el tercer nivel es necesario porque es la perfeccion de la fe. Por medio de el, el hombre lograra llegar a su proposito, a su mision en este mundo y a cumplir su correccion."},{"id":"p32-b11","pageNumber":32,"indexInPage":11,"text":"El Creador le dice a cada una de sus criaturas: “¡Mi querido hijo! Por ahora, a pesar que tienes mucho para corregir, Me glorifico contigo, estoy contento contigo, y sólo deseo beneficiarte más y más… El Nivel Superior de la Fe – “¿Qué quiere el Creador de mí?” El tercer nivel es la firme creencia que en todo lo que le sucede al hombre hay un mensaje que pertenece a su finalidad – a su conexion con el Creador."},{"id":"p32-b12","pageNumber":32,"indexInPage":12,"text":"Por supuesto, que cada cosa que el Creador hace tiene un objetivo, y este es el motivo por el cual el hombre creyente debe buscar que es lo que el Creador quiere de el. Esto es obligatorio incluso segun el sentido comun, el"}],"rawCharCount":4761},{"pageNumber":33,"blocks":[{"id":"p33-b0","pageNumber":33,"indexInPage":0,"text":"Creador no le trae al hombre tal y tales acontecimientos sin alguna especifica razon, sino para ensenarle algo o para estimularlo a corregir una cosa determinada, o arrepentirse de un pecado o una falta, o fortalecerse en el cumplimiento de un Precepto, o para despertarlo pues esta espiritualmente dormido o, por el contrario, porque se conduce con una grandeza que no es adecuada a su verdadero nivel espiritual y debe ser limitado, etc."},{"id":"p33-b1","pageNumber":33,"indexInPage":1,"text":"Cada uno debe esforzarse segun su nivel para entender cual es el mensaje del Creador y corregir lo que haga falta. El mensaje general que conecta entre todas las cosas que nos ocurren en la vida es la fe, debido a que la esencia de la Voluntad del Creador es aproximar al hombre a ella. Por lo tanto, en todo lo que nos pasa, el Creador nos dirige a estudiar la fe, y debemos buscar y contemplar la Inteligencia Divina que existe en cada cosa, con el objeto que ella nos ilumine para acercarnos a El."},{"id":"p33-b2","pageNumber":33,"indexInPage":2,"text":"Muy profundo y muy amplio es el tema de la busqueda del mensaje del Creador. Todo este libro se ocupa de esta busqueda. Pero el primer fundamento que debe el hombre poner en su corazon para lograr este nivel que es la perfeccion de la fe, es el fundamento siguiente: “No hay tribulaciones sin transgresiones”. ¿Por qué tengo sufrimientos? El hombre que tiene todo tipo de tribulaciones debe antes que nada examinarse a si mismo, si esta satisfecho consigo mismo y si esta satisfecho con lo suyo."},{"id":"p33-b3","pageNumber":33,"indexInPage":3,"text":"Porque cada hombre esta obligado a ver el bien que posee, su belleza, sus puntos buenos, los Preceptos que cumple, sus buenas cualidades, su misericordia, su buena voluntad, que esta lleno de buenos deseos y que en verdad no quiere hacer nada mal, sino cumplir con la Voluntad del Creador. El debe simplemente amarse a si mismo, estar contento consigo mismo, mirarse afirmativamente y juzgarse en forma completamente positiva. ¡El hombre que no ve su propia belleza no podrá creer en el Creador!"},{"id":"p33-b4","pageNumber":33,"indexInPage":4,"text":"El Creador le dice a cada una de sus criaturas: “¡Mi querido hijo! Por ahora, a pesar que tienes mucho para corregir, estoy satisfecho contigo así como eres; Yo me glorifico contigo, estoy contento contigo y sólo deseo beneficiarte más y más. Yo te amo, ¿por qué entonces no te amas a ti mismo? Yo estoy contento contigo, ¿por qué entonces no estás contento contigo mismo? Yo me glorifico en ti, ¿por qué entonces no ves tu propia gloria?"},{"id":"p33-b5","pageNumber":33,"indexInPage":5,"text":"Yo te espero pacientemente y no te persigo, ¿por qué entonces te persigues a ti mismo? ¿Por qué no tienes la creencia que Yo te amo? Ciertamente crees que Yo soy todopoderoso y que te puedo ayudar fácilmente en todo lo que necesitas. ¿Por qué entonces estás desesperado? ¿Piensas que es demasiado difícil para Mí salvarte en la situación en que te encuentras? Yo deseo que estés alegre por todo lo que te he ayudado hasta hoy, deseo que reflexiones sobre esto y luego me pidas que te siga ayudando más adelante”."},{"id":"p33-b6","pageNumber":33,"indexInPage":6,"text":"De hecho, la primera cosa sobre la que se juzga al hombre es sobre su fe, porque la tristeza, el perseguirse a si mismo, la angustia y la amargura son todas falta de fe. Ciertamente si creyeramos con fe completa que el Creador esta siempre presente y oye nuestras plegarias, no sentiriamos ninguna tristeza, pereza o pesadez en nuestra plegaria y rezariamos como se debe, prolongando nuestros ruegos pidiendole al Creador que nos ayude en todas nuestras necesidades."},{"id":"p33-b7","pageNumber":33,"indexInPage":7,"text":"Porque tener fe significa “estar contento con lo suyo”, y como aprendimos, la fe es plegaria. Si el hombre no esta contento con lo que tiene y no se ocupa de rezar, este es el primer juicio que se le hace. Por lo tanto, al hombre que no tiene alegria le esta prohibido juzgar sus acciones o arrepentirse, porque en el estado en que esta, solo llegara a culparse, perseguirse y caera en una terrible tristeza que lo llevara a dejar de creer que el Creador lo ama. Todo el trabajo de este hombre debe ser sobre la alegria."},{"id":"p33-b8","pageNumber":33,"indexInPage":8,"text":"Es decir, que debe buscar en si mismo buenas calificaciones y concentrarse unicamente en la belleza y el bien que hay en el. Solo entonces, cuando este satisfecho consigo mismo y tenga buena disposicion, podra creer en el Creador. De por si, su arrepentimiento sera facil, y podra ocuparse en su examen de conciencia y confesar lo que debe, ya que cree que el Creador le ama, que es todopoderoso y El fácilmente le ayudara a cambiar y rectificar lo que haga falta."},{"id":"p33-b9","pageNumber":33,"indexInPage":9,"text":"El gran peligro Hay que saber que no existe nada que trae tantos estrictos Juicios sobre el hombre como la tristeza y la amargura. Como vemos en el Pentateuco en la seccion de las reprimendas, que todas las terribles maldiciones escritas llegan por la falta de alegria, como esta escrito (Deuteronomio 28:47): “Por no haber servido al Eterno, tu Di-s, con alegria y con regocijo de corazon”. El reproche es aun mas grande cuando el hombre cumple con la Ley Divina, pero evita la alegría que debe sentir al cumplir los Preceptos y el amor a"}],"rawCharCount":4868},{"pageNumber":34,"blocks":[{"id":"p34-b0","pageNumber":34,"indexInPage":0,"text":"Quien los ordeno, lo cual es una parte integral y muy importante del servicio al Creador; quien evita esta alegria merece ser castigado segun lo que esta escrito en el mencionado versiculo. El Creador es justo, El se comporta con el hombre con misericordia, no con estricta justicia. Pero cuando el hombre esta insatisfecho, demuestra que no cree que la Supervision Divina sea justa y compasiva, cree que el Creador se comporta con el injustamente, sin rectitud y no con la verdad."},{"id":"p34-b1","pageNumber":34,"indexInPage":1,"text":"Esto inmediatamente despierta el atributo del Juicio estricto que es celoso del honor del Creador, porque no existe una mayor profanacion del Nombre de Di-s que esta. Al Creador no le gusta ser deudor de nadie, por consiguiente, inmediatamente se abren y se examinan los libros de ese hombre para ver si son justos sus reclamos, y si en verdad no esta siendo tratado correctamente."},{"id":"p34-b2","pageNumber":34,"indexInPage":2,"text":"Por supuesto, se descubre la verdad, que el es el deudor, y que segun sus meritos y sus deudas el Creador se porto con el hasta ahora muy lejos de lo que debia segun Su Ley, con benevolencia y misericordia. Por lo tanto, el atributo del Juicio estricto demanda que se haga justicia con el. Si ese hombre no se hubiera quejado y se hubiera sentido satisfecho con lo suyo, entonces no hubiera sido examinada la Misericordia del Creador para con el."},{"id":"p34-b3","pageNumber":34,"indexInPage":3,"text":"Pero en su insatisfaccion, su tristeza y amargura, supuestamente reclama juicio, y entonces el atributo del Juicio estricto determina que sea juzgado rigurosamente. Pobre del hombre con el cual el Creador se conduce segun todo el rigor de la Ley, como esta escrito (Salmos 143:2): “No entres en Juicio con Tu siervo, porque ante Ti ningun hombre viviente puede justificarse”."},{"id":"p34-b4","pageNumber":34,"indexInPage":4,"text":"El hombre que vive según el fundamento que “No hay tribulaciones sin transgresiones”, incluso hasta lo que está en contra de su voluntad, sólo lo acerca al Creador... No hay tribulaciones sin transgresiones Sobre la base que “No hay tribulaciones sin transgresiones” depende y reposa toda la fe y el mundo entero. ¡El hombre no tiene parte en la Ley Divina hasta que cree que todas las cosas y hechos que le suceden son milagros! No son resultado de la naturaleza ni de las costumbres, tanto en general como en particular."},{"id":"p34-b5","pageNumber":34,"indexInPage":5,"text":"Solo si cumple los Preceptos, gozara de su recompensa, pero si los transgrediera, sufrira su castigo; todo esta decretado desde lo Alto. En otras palabras, solo quien vive con la creencia de que todos los sucesos del hombre provienen por Decreto del Creador segun sus acciones, y que no existen tribulaciones sin transgresiones, vive la verdadera fe."},{"id":"p34-b6","pageNumber":34,"indexInPage":6,"text":"Existen dos posibilidades para explicar el error de quien dice que cree en la Supervision Individual del Creador pero no atribuye sus tribulaciones, hasta la mas pequena, a sus transgresiones: a) La primera es el pensamiento erroneo que el Creador castiga a sus criaturas sin causa. ¡Como si El hubiera creado el mundo para atormentar a sus criaturas! Por supuesto que esto lo comprende bien todo hombre razonable, que es una perversión pensar una cosa asi del Creador, el Bueno y Benefactor."},{"id":"p34-b7","pageNumber":34,"indexInPage":7,"text":"Como ya lo dijo el Rey David (Salmos 145:17): “Justo es el Eterno en todos Sus caminos, y benevolente en todas Sus obras”, y tambien (id. 92:16): “… el Eterno es recto. Es mi Roca en la que no hay injusticia”. Vemos que hasta las mas viles criaturas hacen todo para beneficiar a sus descendientes, ¿sera entonces posible pensar que el Creador es peor que ellos?"},{"id":"p34-b8","pageNumber":34,"indexInPage":8,"text":"Esta bien claro que la fe del quien siente esto esta muy corrompida. b) La segunda posibilidad es la falta de creencia en la Supervision Individual que se manifiesta en atribuir los sufrimientos a la naturaleza o al azar, tambien el inculparse a uno mismo o a otras personas, lo que es una completa herejia."},{"id":"p34-b9","pageNumber":34,"indexInPage":9,"text":"La conclusion que sacamos es, que el hombre que cree en la Divina Supervision Individual, es decir que todo proviene del Creador, debe creer que cada pesar y privacion que tiene también provienen de El, y obligadamente tienen una causa. De por si, el debe llegar a la conclusion que sus pecados y transgresiones son con justicia la causa de sus sufrimientos, y que la intencion del Creador con las tribulaciones que le trae es para su bien. ¿Y cual es ese bien?"},{"id":"p34-b10","pageNumber":34,"indexInPage":10,"text":"Estimularlo para que corrija sus acciones y que enderece su camino para merecer la buena finalidad y la vida feliz. Vemos que el hombre que vive segun el fundamento que “No hay tribulaciones sin transgresiones”, incluso hasta lo que esta en contra de su voluntad, lo acerca al Creador. Este hombre busca como conocer y conectarse con el Todopoderoso por medio de cada cosa que le sucede, y trata de entender por medio de sus sufrimientos como el Creador desea acercarlo. Esto significa poseer la fe completa."}],"rawCharCount":4684},{"pageNumber":35,"blocks":[{"id":"p35-b0","pageNumber":35,"indexInPage":0,"text":"Temor a Di-s"},{"id":"p35-b1","pageNumber":35,"indexInPage":1,"text":"El titulo “Temeroso de Di-s” se puede aplicar solo al hombre que se hace examen de conciencia cada dia, confiesa al Creador sus transgresiones, Le pide perdon y se esfuerza en rectificar sus acciones. El hombre que no hace esto demuestra que vive con la sensacion de que es el dueño de si mismo y no tiene a Quien informar de sus acciones. Ese hombre siente que puede hacer lo que quiere porque no hay Quien lo castigue, lo que demuestra que incluso esta alejado del mas bajo y basico grado del temor a Di-s llamado “Temor al castigo”."},{"id":"p35-b2","pageNumber":35,"indexInPage":2,"text":"Si poseyera el mas simple “Temor al castigo” tendria miedo de ser castigado por sus faltas. Seguramente se haria examen de conciencia cada dia, confesaria al Creador sus pecados, y pediria perdon por cada transgresion o falta que comete. Tambien, pediria y suplicaria ser salvado de pecar o transgredir en el futuro. En verdad, el que no examina su conciencia cada dia, esta lejos de la minima rectitud y decencia. Incluso segun el criterio de este mundo, cuando un hombre ofende a otro o lo dana, debe dirigirse a el y pedirle disculpas."},{"id":"p35-b3","pageNumber":35,"indexInPage":3,"text":"Y si es obligatorio debido a la virtud de la honradez portarse asi respecto a otras personas, con mayor razon es obligatorio comportarse asi cuando aflige al Creador que le dio la vida, que lo anima y lo beneficia en cada momento. Y por supuesto que este hombre esta lejos del segundo grado llamado “Temor al pecado”, que significa saber que la transgresion es muy perniciosa y hacer todo lo posible para no pecar."},{"id":"p35-b4","pageNumber":35,"indexInPage":4,"text":"Tanto mas que esta lejos del grado superior llamado “Temor a la grandeza del Creador”, que significa avergonzarse de transgredir e incluso cometer la mas pequena falta contra el Rey del Universo. Encontramos entonces, que la esencia del temor a Di-s empieza cuando el hombre cree en la recompensa y castigo que hay en este mundo."},{"id":"p35-b5","pageNumber":35,"indexInPage":5,"text":"Es decir, que cree que todo lo que le sucede – sus exitos, o sus sufrimientos – todos provienen del Creador, que lo recompensa o lo castiga segun sus acciones, y por consiguiente realiza un examen de conciencia cada dia. Esto es posible solo cuando se vive desde la base que “No hay tribulaciones sin transgresiones”. Todo hombre desea que todo le vaya como se debe, triunfar en la vida, que todo este bien, etc.;"},{"id":"p35-b6","pageNumber":35,"indexInPage":6,"text":"y cuando sabe que si pecara sera castigado ya en este mundo, ciertamente se despierta en el temor al Creador que lo estimula a examinarse a si mismo cada dia y rectificar sus acciones, para que no le lleguen sufrimientos. Cuando ve que fracaso y transgredio, se arrepiente y confiesa al Creador sus pecados, y tanto mas cuando ya le llegaron tribulaciones es estimulado a arrepentirse para que le abandonen."},{"id":"p35-b7","pageNumber":35,"indexInPage":7,"text":"Tambien teme que si no retornara al Creador será castigado todavia mas, porque cuando el hombre no se despierta por las tribulaciones, ellas se intensifican mas y mas. Todo el tiempo que el hombre atribuye sus sufrimientos a algo de este mundo y no a sus transgresiones, es señal que está completamente lejos del temor a Di-s, y está muy claro que vive sin rendir cuentas de sus acciones al Creador."},{"id":"p35-b8","pageNumber":35,"indexInPage":8,"text":"Y no sólo que no se despierta con todo lo que le sucede para retornar de su mal camino, sino que cae más y más profundamente en un sueño espiritual, en apatía y en oscuridad. Solo por el fundamento que “No hay tribulaciones sin transgresiones” podra haber temor a Di-s; porque el hombre sabe claramente: hay sufrimientos en el mundo, hay castigos, esta la vara, y se despierta en el el “Temor al castigo”. Desde ahi el hombre empieza a subir los grados del temor hasta que logra llegar al “Temor a la grandeza del Creador”."},{"id":"p35-b9","pageNumber":35,"indexInPage":9,"text":"Todo el miedo que tenemos de todo tipo de aflicciones es solo debido a que el temor se “viste” en estas aflicciones para despertar en el hombre el “Temor al castigo” y eventualmente llevarlo al puro y lucido temor al Creador. El Creador con frecuencia emplea el método de “medida por medida” para enseñarle a una persona la causa por la que sufre… ¿Debido a qué llegan los sufrimientos? Este es el lugar para volver a lo que ya mencionamos mas arriba sobre la tristeza bajo el titulo: “¿Por que tengo sufrimientos?”."},{"id":"p35-b10","pageNumber":35,"indexInPage":10,"text":"El primer pecado por el que el hombre es juzgado, es el pecado de la tristeza. La razon por la que nos adelantamos a escribir sobre ese tema al comienzo del capitulo, es porque si empezabamos con el fundamento que “No hay tribulaciones sin transgresiones”, mucha gente se asustaria y caeria en la depresion o la tristeza, y no continuaría leyendo hasta donde escribimos que el hombre debe estar contento consigo mismo, inclusive siendo como es."},{"id":"p35-b11","pageNumber":35,"indexInPage":11,"text":"Por lo tanto, recordemos bien que antes de empezar a investigar y buscar la causa por la que nos llegaron sufrimientos, la primera cosa que hay que"}],"rawCharCount":4677},{"pageNumber":36,"blocks":[{"id":"p36-b0","pageNumber":36,"indexInPage":0,"text":"examinar es donde fracasamos con lamentaciones inutiles y falta de gratitud, y luego trabajar sobre la alegria y el agradecimiento al Creador. Solo cuando el hombre esta verdaderamente contento consigo mismo – contento de cada punto bueno que puede encontrarse, contento con lo suyo y agradece al Creador y Lo glorifica, sintiendo que en verdad todo lo que tiene es un regalo misericordioso – solo entonces puede empezar su autocritica, como enseguida aclararemos."},{"id":"p36-b1","pageNumber":36,"indexInPage":1,"text":"Las causas comunes de los sufrimientos son: a) “Entre una persona y otra” – los sufrimientos mas grandes que se prolongan por mucho tiempo llegan generalmente por las transgresiones entre una persona y su projimo. Cada pesar, incluso el mas pequeno, que le hace un hombre a otro, es un grave pecado que no puede ser expiado hasta que sea perdonado por el hombre que fue danado. Y durante todo el tiempo que no es perdonado, hay un estricto Juicio en el Cielo sobre el ofensor."},{"id":"p36-b2","pageNumber":36,"indexInPage":2,"text":"Por eso, nada de lo que se hace ayuda contra esas tribulaciones, incluso el arrepentimiento. Tambien si ese hombre es un perfecto justo respecto al Creador, no le servira de nada hasta que no se concilie con el hombre ofendido."},{"id":"p36-b3","pageNumber":36,"indexInPage":3,"text":"Solo entonces el pecado podra ser expiado, y los sufrimientos lo dejaran. b) El cumplimiento de los Preceptos – los sufrimientos pueden insinuarle al hombre que transgrede los Preceptos Negativos, es decir que hace cosas prohibidas por el Creador; o que no cumple los Preceptos Positivos, que son las cosas que el Creador nos ordena hacer. c) Orgullo – de hecho, cada pecado o transgresion son consecuencia del orgullo, tal como esta escrito (Deuteronomio 8:14): “Cuando tu corazon se vuelva arrogante te olvidaras del Eterno, tu Di-s”."},{"id":"p36-b4","pageNumber":36,"indexInPage":4,"text":"Por lo tanto, todos los sufrimientos les llegan al hombre para insinuarle que no vive con la conviccion que “No hay mas nada fuera de El”, y que el mismo no es nada sin el Creador. Todas las caidas del hombre provienen de su orgullo, como esta escrito (Proverbios 16:18): “La soberbia precede a la ruina; la arrogancia a la caida”. Vemos que antes de cada crisis o fracaso que le llega al hombre, predomino en el el orgullo. Y si meditara sobre esto, veria esta regla en todo lo que le sucede."},{"id":"p36-b5","pageNumber":36,"indexInPage":5,"text":"El hecho que los sufrimientos le llegan al hombre para romper su orgullo es un gran favor, puesto que el orgulloso no puede acercarse al Creador. Y como han ensenado los Sabios, sobre cada hombre arrogante dice el Creador – “Yo y el no podemos vivir juntos en este mundo”, como esta escrito"},{"id":"p36-b6","pageNumber":36,"indexInPage":6,"text":"(Salmos 101:5): “... al que es altanero de ojos y arrogante de corazon, Yo no lo tolerare”. Es decir, que donde existe el orgullo, el Creador supuestamente abandona y no supervisa ni ayuda a esa persona. De por si, el hombre se derrumba porque, ¿quien puede prosperar sin que el Creador este con el? Dado que la finalidad del hombre es la fe, y el orgullo es todo lo contrario a la fe, el Creador abandona al orgulloso."},{"id":"p36-b7","pageNumber":36,"indexInPage":7,"text":"Y debemos saber que no hay orgullo mas grande que la tristeza, porque ella es el resultado de que el hombre piensa que merece tal y cual cosa y que se le debe algo. Por lo tanto, el Creador abandona tambien al que esta triste..."},{"id":"p36-b8","pageNumber":36,"indexInPage":8,"text":"Medida por medida"},{"id":"p36-b9","pageNumber":36,"indexInPage":9,"text":"Para poder interpretar los insinuaciones del Creador, y entender debido a que transgresion nos llegaron las tribulaciones, debemos saber que el Creador conduce el universo “medida por medida”, es decir que los sufrimientos estan orientados en una forma que segun ella podamos saber cual fue nuestra falta. Por ejemplo, si se refiere la falta a un Precepto Divino que se relaciona con la mano izquierda, entonces es muy probable que suframos de la mano izquierda, etc."},{"id":"p36-b10","pageNumber":36,"indexInPage":10,"text":"Algunos ejemplos El Creador con frecuencia emplea el metodo de “medida por medida” para ensenarle a una persona la causa por la que sufre. Por ejemplo, un conductor de taxi que oculto las ganancias a sus supervisores, se encuentra de pronto con dos llantas desinfladas y una multa que se apresura el dia siguiente por la manana a arreglar y pagar, haciendole perder la suma exacta que habia ganado trabajando ilegalmente."},{"id":"p36-b11","pageNumber":36,"indexInPage":11,"text":"Otro ejemplo: un empleador que injustamente acuso a un empleado de robo, fue poco despues acusado por las autoridades fiscales de engano en el pago de impuesto sobre sus ingresos. El modo de obrar del Todopoderoso de “medida por medida” no es un castigo; es un método Divino de educacion. En la medida que el hombre se conduce – con esa misma medida el Creador se conduce con el."},{"id":"p36-b12","pageNumber":36,"indexInPage":12,"text":"Sanson, el gran heroe, fue detras de sus ojos y eligio a la filistea Dalila – una adoradora de idolos, hija de una nacion enemiga y una persona de caracter traidor – y por eso sus ojos fueron arrancados por filisteos (vease Jueces, cap. 16); Absalon, hijo del Rey David que se rebelo"}],"rawCharCount":4700},{"pageNumber":37,"blocks":[{"id":"p37-b0","pageNumber":37,"indexInPage":0,"text":"contra su padre, se enorgullecio de su cabellera. Un dia, montando en su mula, su pelo se enredo en las ramas de un roble, la mula siguio andando, y Absalon quedo colgado de su cabellera hasta su muerte (Vease Samuel II, cap. 18); Miriam, la hermana de Moises, se escondio junto al Nilo y esperó alli durante una hora supervisando a su pequeno hermano que fue colocado en una cesta de mimbre y echado al rio para tratar de salvarlo de los egipcios, hasta que la hija del Faraon lo descubrio (Vease Exodo 2:4)."},{"id":"p37-b1","pageNumber":37,"indexInPage":1,"text":"Anos despues, en el desierto, cuando Miriam estuvo enferma, todo el pueblo de Israel le esperó siete dias hasta que se curo (vease Numeros, cap. 12). Ensenaron los Sabios que hay ciertas enfermedades como la Difteria, que llegan por la maledicencia. Empiezan en los intestinos y culminan en un crecimiento fatal que bloquea la garganta. Asi tambien el hombre empieza su pecado con un mal sentimiento en su interior que sube y se materializa en su boca en forma de una calumnia. Otro ejemplo mas."},{"id":"p37-b2","pageNumber":37,"indexInPage":2,"text":"Se cuenta de un gran Sabio, al que le fermentaron cuatrocientos toneles de vino: Cuando llegaron sus colegas a visitarlo, le dijeron: “Parece que tu debes investigarte a ti mismo y buscar la transgresion por la cual el Creador fermento tu vino”. Les respondio el Sabio: “¡¿Acaso soy sospechoso ante vuestros ojos de pecar?!”. Le contestaron: “¿Acaso el Creador es sospechoso de castigar sin causa?”. Les dijo: “El que sabe de una transgresion que he cometido – que me lo diga”."},{"id":"p37-b3","pageNumber":37,"indexInPage":3,"text":"Le dijeron: “Escuchamos que su senoria no da su parte de las ramillas de la vid a su siervo”. “¡Ese siervo me roba en todo!”, proclamo el Sabio. “Por lo menos las ramillas de la vid no comparto con el”. Los Sabios dijeron: “Aun asi, tu sabes lo que dice la gente – „Tambien el que roba a un ladron prueba el gusto del robo...‟”. “Estoy de acuerdo”, les dijo, “acepto todo lo que me dijeron. Me arrepentire frente el Creador y le devolvere a mi siervo su legitima parte de las ramillas de la vid”."},{"id":"p37-b4","pageNumber":37,"indexInPage":4,"text":"En el momento que el Sabio acepto corregir sus acciones, aunque todavia no lo habia hecho, sucedio algo completamente antinatural, el precio del vinagre encarecio subitamente y llego al mismo precio del vino asi que no tuvo ninguna perdida. La aceptacion de la Justicia Divina invirtio la situacion del Juicio severo por una Compasion milagrosa."},{"id":"p37-b5","pageNumber":37,"indexInPage":5,"text":"El Sabio transgredio con las ramillas de la vid, y fue castigado posteriormente por via de su vino. Con tales mensajes de “medida por medida”, el Creador nos ayuda a entender lo que tenemos que corregir. Quien quiere andar por el sendero de la fe, debe saber que existen dos obstáculos esenciales que pueden privarle triunfar en las pruebas que le llegan… Los sufrimientos – si ya les llegaron al hombre – son un gran bien, porque todo el tiempo que el hombre ha hecho una transgresion, ella le oculta la Luz del Creador y abruma su alma."},{"id":"p37-b6","pageNumber":37,"indexInPage":6,"text":"Pero por medio de las tribulaciones que le llegan se despierta para retornar a El, y entonces Su Luz lo ilumina y su vida se transforma en bella y dulce. Cuando al hombre al que le llegaron tribulaciones no logra entender lo que el Creador quiere de el, debe hablar sobre eso mismo con el Todopoderoso y pedirle que le muestre por que les llegaron. El debe suplicar mucho y decir: “Amo del Universo, por favor, compadécete de mí, que merezca saber por qué pecado me castigas, ya que mi voluntad es corregir lo pervertido...”."},{"id":"p37-b7","pageNumber":37,"indexInPage":7,"text":"Y de este modo debe seguir hasta que El le muestre lo que debe rectificar. Sin embargo, si despues de todo esto el hombre todavia no logra entender por lo que tiene que arrepentirse, debe fortalecerse en la creencia que ciertamente no existen tribulaciones sin transgresiones, y que no hay ninguna equivocacion o azar en lo que sufre."},{"id":"p37-b8","pageNumber":37,"indexInPage":8,"text":"Se dirigira al Creador y le dira: “Rey del Universo, seguramente no hay ninguna equivocación o azar en lo que sufro, y yo creo con completa fe que estos sufrimientos provienen de Ti debido a mis transgresiones. Pero, a pesar mío, no logro entender por qué me llegaron, y qué debo corregir. Por favor Creador, frente a Ti todo está claro y evidente, sólo Tú sabes por qué causa me mandaste estas tribulaciones, por favor perdóname por el pecado que me causó todo esto y ayúdame a lograr corregirlo mientras vivo...”."},{"id":"p37-b9","pageNumber":37,"indexInPage":9,"text":"Si tambien despues de todo eso sigue sufriendo, debe el hombre dejar de lado su razonamiento y creer que “Todo es para bien”, aceptando todo con amor y sumision. Y dira en su corazon: “¿No es suficiente que enoje al Creador hasta obligarle a mandarme sufrimientos, y ahora vengo con quejas a El? Es posible que estos sufrimientos me hayan llegado por causa de transgresiones que tuve en encarnaciones anteriores. Por lo tanto, los aceptare con amor y sumision, y seran la expiacion de mis pecados”."}],"rawCharCount":4732},{"pageNumber":38,"blocks":[{"id":"p38-b0","pageNumber":38,"indexInPage":0,"text":"¡Cuando el hombre cumple también el tercer nivel de la fe, demuestra que posee la fe con perfección! Impedimentos El hombre que quiere andar por el sendero de la fe que aprendimos, debe saber que existen dos obstaculos esenciales que pueden privarle triunfar en las pruebas que le llegan: a) El primer obstaculo es que piensa: “No puedo aprobarlo”, que significa que el hombre no cree que podra lograr pasar la prueba con exito porque no tiene conocimiento de su poder, y piensa que es demasiado dificil para el."},{"id":"p38-b1","pageNumber":38,"indexInPage":1,"text":"Para sobreponernos a este impedimento, debemos saber claramente que el Creador no le da al hombre una prueba que no pueda afrontar. Es decir, que cuando el Creador nos da una prueba o dificultad, esta todo determinado exactamente por Su Supervision Individual segun la fuerza y capacidad especifica de cada uno de nosotros."},{"id":"p38-b2","pageNumber":38,"indexInPage":2,"text":"¡Si no tuvieramos el poder para afrontar esta prueba, el Creador no nos probaría! b) El segundo obstaculo es que piensa: “No tengo ganas”, o “Dejadme vivir en paz”, que significa que el hombre no esta dispuesto para la dificultad y la labor para afrontar la prueba. El solo quiere que le dejen tranquilo, vivir en paz y en calma sin correcciones espirituales, sin arrepentimiento, sin los altos y bajos de la vida."},{"id":"p38-b3","pageNumber":38,"indexInPage":3,"text":"En otras palabras, el quiere vivir sin ninguna conexion con su finalidad, no le interesa conseguir el verdadero exito en este mundo, no se pregunta que es lo que el Creador del Universo quiere de el y que pasara con el en el Mundo Venidero. El solo quiere una cosa – no tener sufrimientos y tribulaciones… Para sobreponernos a este impedimento, debemos saber claramente que la Voluntad del Creador es que recibamos lo que nos llega y que afrontemos esta prueba con todos sus detalles."},{"id":"p38-b4","pageNumber":38,"indexInPage":4,"text":"Tambien debemos saber, que esta prueba esta dirigida desde lo Alto por el Creador que sabe cual es nuestra correccion de alma y mision en este mundo. Solamente si afrontaremos esta prueba, podremos llegar a la paz, a la tranquilidad y al verdadero reposo. Pero, si tratamos de escaparnos y escurrirnos de ella, esta se transformara en mucho mas dificil."},{"id":"p38-b5","pageNumber":38,"indexInPage":5,"text":"Porque el Creador no es indulgente, El no deja al hombre hasta que le trae a su nivel espiritual y a su entera correccion, incluso si sera necesario traerlo de vuelta a este mundo en una nueva encarnacion. Esta es la regla – hay cosas en la vida que si el hombre quiere o no, esta obligado a experimentar. Su voluntad de vivir en paz es una imaginacion, pues como dijeron los Sabios: “A pesar"},{"id":"p38-b6","pageNumber":38,"indexInPage":6,"text":"tuyo – vives...”, es decir, con todo lo que se desprende de esto: altos y bajos, dificultades, pruebas, y “... a pesar tuyo – moriras, y a pesar tuyo estas destinado a rendir cuentas frente al Rey de todos reyes, el Creador” – El es el que juzgara si nos esforzamos en nuestra corrección espiritual, que significa que examinamos los acontecimientos de nuestra vida para acceder por medio de ellos a la verdad."},{"id":"p38-b7","pageNumber":38,"indexInPage":7,"text":"El hombre no tiene la posibilidad de determinar que el esta “fuera de juego” – si esta aqui en este mundo es porque tiene lo que corregir. Nada le ayudara, el esta obligado a corregirlo. Su libre albedrio es solo: o recibirlo con amor – y entonces disfrutar de los frutos de su trabajo en este mundo y tener una recompensa esperandolo en el Mundo Venidero; o, contrariamente, tratar de escapar de las pruebas, resistirlas, rezongar y murmurar – y entonces sufrir..."},{"id":"p38-b8","pageNumber":38,"indexInPage":8,"text":"Si el hombre trabaja y triunfa con fe en las pruebas que debe pasar, se merecera una gran elevacion y muchos mas altos niveles espirituales con cada buena accion, con cada Precepto que cumplira u otro servicio al Creador, y tambien tendra una real satisfaccion en su vida. Pero si se debilitara en la correccion de su alma, sus tribulaciones solo se intensificaran. Por eso, debemos fortalecernos y esforzarnos a afrontar las pruebas con exito, lo que significa mantenernos en la fe, la plegaria y en el temor al Creador."},{"id":"p38-b9","pageNumber":38,"indexInPage":9,"text":"En los proximos articulos aclararemos como debe el hombre aplicar los principios de la fe en su vida cotidiana. El hombre al que le falta fe, cree que el policía es quien determina el castigo que recibirá, como si fuera un acto natural y no un Decreto Divino… Este mundo es una “Escuela de fe”. Toda la finalidad de la vida del hombre es aprender la fe, y por lo tanto, todos los sucesos que nos ocurren en nuestra vida cotidiana son examenes de fe."},{"id":"p38-b10","pageNumber":38,"indexInPage":10,"text":"Traeremos ejemplos de incidentes comunes que parecen casuales y naturales pero, en verdad, son dirigidos por la Divina Supervision – en todos los detalles – para el examen de la fe. Aprendamos, con la ayuda del Creador, como aprobar esos examenes con exito. La calificación del hombre demuestra su grado de fe, y que tipo de vida tendra en este mundo y en el venidero. ¡Pare al costado de la ruta! Un hombre que es detenido por un policia de transito, con justicia o no, esta pasando una prueba"}],"rawCharCount":4816},{"pageNumber":39,"blocks":[{"id":"p39-b0","pageNumber":39,"indexInPage":0,"text":"de fe, y debe conducirse segun las “Tres Reglas de la Fe” que aprendimos: a) Creerá que “Así el Creador quiere”, y de por si, no culpara a nadie; no a si mismo y no al otro conductor por el cual se vio envuelto en esta infraccion de transito: no a su esposa que lo apremio a viajar rapido, ni tampoco al policia que lo molesta, porque incluso si lo detuvieron injustamente y no segun las leyes de este mundo, segun las Leyes del Creador, todo es verdaderamente justo. b) Creerá que “Todo es para bien”, dejando de lado su razonamiento."},{"id":"p39-b1","pageNumber":39,"indexInPage":1,"text":"Debe ignorar lo que su mente entiende y determina que lo que le pasa no es bueno. El debe alegrarse y agradecer al Creador que le mando a este policia, y creer que seguramente se oculta en este acontecimiento una salvacion que es para su bien eterno. c) Creerá que cada cosa tiene una causa y finalidad, que no hay tribulaciones sin transgresiones, y que este policia es solo la vara del Creador que le fue enviado para estimularlo a arrepentirse por alguna falla o pecado."},{"id":"p39-b2","pageNumber":39,"indexInPage":2,"text":"Aunque existe una causa natural por la que fue detenido, esta es solo una causa desencadenada desde lo Alto segun lo que le fue decretado en el Tribunal Celestial. Por esto, examinara sus actos y buscara el motivo de lo que le ocurre. Habla con el Creador Por lo tanto, antes de empezar a hablar con el policia, examinara sus actos, se arrepentirá interiormente, y Le dira al Creador: “Señor del Universo, ante Ti todo está al descubierto; Tú sabes por qué transgresión me mandaste esta prueba."},{"id":"p39-b3","pageNumber":39,"indexInPage":3,"text":"Por favor, ayúdame a triunfar en este examen y pasarlo con fe. Ten la bondad de perdonarme, y ayúdame a saber lo que quieres de mí. Por mi parte, me comprometo a donar una determinada cantidad para caridad... Por favor, no me castigues por medio de este policía, apiádate de mí; dame las buenas condiciones para que logre reparar la transgresión por la cual debo ser castigado”. Y, por supuesto, no se quejara y no se enojara con el policia, no lo adulara, de ninguna manera discutira con el, y por supuesto no lo insultara o humillara."},{"id":"p39-b4","pageNumber":39,"indexInPage":4,"text":"Si se comporta asi, su calificacion en el examen de la fe sera muy buena y disfrutara de su recompensa en el Mundo Venidero. Obviamente saldra sin dano de su encuentro con el policia, pero incluso si es danado, lo recibira con amor y con la creencia de que todo es para bien, y que esto no le causara ningun pesar ni tristeza. Encontramos, que gracias a la fe podra el hombre lograr una buena vida ya en este mundo."},{"id":"p39-b5","pageNumber":39,"indexInPage":5,"text":"Contrariamente, el hombre al que le falta fe, cree que el policia es quien determina el castigo que recibira, como si fuera un acto natural y no un Decreto Divino. Por eso, enseguida adula al policia y se complica todavia mas, pues esto es un principio en la conducta del Creador, quien no confia en El sino en alguna otra persona o cosa, le retira Su Supervision y lo deja en las manos de lo que confia. Por lo tanto, cuando adula al policia, en la mayoria de los casos, el policia se vuelve mas cruel."},{"id":"p39-b6","pageNumber":39,"indexInPage":6,"text":"Y cuando este no lo complace, empieza a maldecir y despreciarlo… Y entonces el resultado es claro: enojo, amargura, frustracion, etc. Muchas veces el policia ofendido le agrega una multa mayor, busca mas cosas para reportar y, lo peor de todo, es muy probable que al hombre se le sume otro grave pecado, el de “Entre una persona y otra”, porque generalmente la ofensa al policia es injustificada, y tendra que pagar por ese pecado si no se arrepiente."},{"id":"p39-b7","pageNumber":39,"indexInPage":7,"text":"Es importante acentuar que el arrepentimiento por pecados de “Entre una persona y otra” no es facil, porque ademas de tener que pedir disculpas al Creador por haber transgredido su Precepto y afligido a otro hombre, tambien tendra que buscar al policia ofendido y apaciguarlo hasta que le perdone completamente. Sin el perdon de la persona ofendida, no le servira al hombre el arrepentimiento y el retorno al Creador, porque El no perdona en lugar del hombre ofendido."},{"id":"p39-b8","pageNumber":39,"indexInPage":8,"text":"De esto debemos entender cuanto cuidado se necesita en los asuntos de “Entre una persona y otra”. Pues durante el tiempo en que hay en el mundo gente ofendida que no le perdona al hombre su ofensa, existe sobre el un Juicio muy grave, que es la causa de la mayoria de sus angustias."},{"id":"p39-b9","pageNumber":39,"indexInPage":9,"text":"Aunque en los asuntos entre el hombre y el Creador, El contiene su ira y perdona mas facilmente; tambien, existen tiempos especiales de Misericordia en el cual todos los pecados delhombre se perdonan, pero todo esto no es suficiente para expiar los pecados de “Entre una persona y otra”. El Creador no puede perdonar la ofensa del hombre ofendido, hasta que ese hombre mismo se concilia y perdona de todo corazon."},{"id":"p39-b10","pageNumber":39,"indexInPage":10,"text":"Encontramos, que quien quiere corregir sus transgresiones de “Entre una persona y otra”, debe acordarse de toda la gente que ofendio, encontrarlos y apaciguarlos... Brevemente, es casi imposible corregir un pecado de este tipo, y por eso, hay que cuidarse desde un principio para no ofender a nadie. Por supuesto, que ese tipo de comportamiento es resultado de la falte de fe, pues el hombre se"}],"rawCharCount":4964},{"pageNumber":40,"blocks":[{"id":"p40-b0","pageNumber":40,"indexInPage":0,"text":"comporta segun el principio de “Con mi propia fuerza y el poder de mi mano” (Deuteronomio 8:17). Al comienzo piensa: “Yo se como calmar al policia”, pero cuando no tiene exito, trata de usar la fuerza o intimidarlo. La calificacion de este hombre en la prueba de la fe es muy baja y su resultado vera en este mundo y en el venidero. Ya en el mundo presente su vida estara llena de angustia, sufrimientos y penas; andara todo el dia enojado, enfurrunado y amargado por causa del policia."},{"id":"p40-b1","pageNumber":40,"indexInPage":1,"text":"Todo debido a su falta de fe, por ver al policia como una existencia independiente, lo que en verdad es falso, pues “No hay mas nada fuera de El”. Muchas de las multas y pérdidas económicas que les llegan al hombre, provienen de su falta de suficiente caridad... La caridad previene penalidades Aqui es el lugar apropiado para hacer notar, que muchas de las multas y perdidas económicas que les llegan al hombre, provienen de su falta de caridad."},{"id":"p40-b2","pageNumber":40,"indexInPage":2,"text":"Ensenaron los Sabios que el sustento del hombre esta determinado en el comienzo del ano, y asi tambien sus privaciones y perdidas. Si se lo merecera – dara a la caridad el dinero que le fue decretado perder, y si no lo merecera – lo perdera por medio de multas, impuestos, doctores, deterioros, etc. En otras palabras, la caridad previene penalidades."},{"id":"p40-b3","pageNumber":40,"indexInPage":3,"text":"El relato siguiente nos lo demostrara: Se cuenta sobre un gran Sabio que tuvo un sueno a comienzo del ano, en el cual se le revelo que los hijos de su hermana estaban destinados a perder ese ano la suma exacta de setecientos dinares. ¿Que hizo el Sabio? Durante todo el ano visito a sus sobrinos una y otra vez, y les pidio caridad con todo tipo de excusas y convencimientos, una vez para esta causa y otra vez para otra, hasta que recolecto casi toda la suma excepto diecisiete dinares que no logro llevarse."},{"id":"p40-b4","pageNumber":40,"indexInPage":4,"text":"El dia de fin de ano al anochecer, llego a la casa de los sobrinos un recaudador del emperador, y en su mano una orden para cobrarles diecisiete dinares. Despues que le dieron el dinero y el recaudador se fue, se quedaron los sobrinos del Sabio con el temor de que la oficina de impuestos habia puesto sus ojos sobre su dinero, y volverian ahora a recolectar mas y mas. Cuando contaron su pesar a su tio, este los tranquilizo y les dijo: “¡No tengan miedo!"},{"id":"p40-b5","pageNumber":40,"indexInPage":5,"text":"Los diecisiete dinares que pagaron son suficientes, y no tendran que pagar mas”. “¿Y como lo sabes?”, preguntaron escepticos los sobrinos, “¿Acaso tienes contactos con los recaudadores de impuestos, o acaso eres un profeta?”. Les"},{"id":"p40-b6","pageNumber":40,"indexInPage":6,"text":"contesto el Sabio: “No tengo ningun contacto con los recaudadores de impuestos del emperador, y no soy un profeta ni un hijo de profeta. Pero contactos con el Encargado Superior – el Creador del Universo – si que tengo. Ya en el principio del ano me fue mostrado exactamente cuanto dinero perderian, y recolecte casi toda la suma para caridad. Quedaron solamente esos diecisiete dinares que no logre recolectar, y los recaudadores de impuestos vinieron a completar el trabajo."},{"id":"p40-b7","pageNumber":40,"indexInPage":7,"text":"Deben saber bien, que si no les hubiera recolectado el dinero para caridad, tendrian que haber pagado todos lo setecientos dinares obligatoriamente, no para bien y con mucha pena por el dinero que se hubiera llevado el fisco. Pero ahora ustedes tuvieron el merito de donar el dinero para objetivos importantes, y ganaron mucho mas con los privilegios y la recompensa por la caridad que hicieron. Es tambien muy probable que se enriqueceran, porque cada uno que abre su mano para hacer caridad, esta bendecido en todo lo que hace”."},{"id":"p40-b8","pageNumber":40,"indexInPage":8,"text":"Se lamentaron los sobrinos por su gran esfuerzo y le dijeron: “¡Querido tio! ¿Por que no nos contaste desde el principio que asi fue decretado desde lo Alto? Lastima que te cansaste una vez tras otra para venir y convencernos de hacer caridad. Nos hubieras advertido que nos fue decretado perder los setecientos dinares, y hubieramos dado toda la suma de una vez al comienzo del ano”. “Yo quise que lograran hacer caridad por la caridad en si, sin ningun interes personal y no para salvarse de un Decreto Celestial”, les respondio el Sabio."},{"id":"p40-b9","pageNumber":40,"indexInPage":9,"text":"Los sobrinos le agradecieron, y debido a que asi eran las cosas y que aceptaron que cada ano se le decreta al hombre cuanto perdera, desde aquel momento ellos buscaron todas las posibilidades y oportunidades para hacer cuanta mas caridad posible, entendiendo el gran poder de este elevado Precepto. Hemos visto que muchas veces el hombre tiene que pagar multas solamente para completar la suma que le fue decretada perder en ese ano."},{"id":"p40-b10","pageNumber":40,"indexInPage":10,"text":"Porque hay una contabilidad en el Cielo que se preocupa de que el hombre pierda la suma entera que le fue decretada. Pero, si lo mereciera y se hubiera adelantado y dado ese dinero en caridad, se hubiera salvado de toda pena en forma de pago de multas, y lo mas importante – lograria cumplir el gran Precepto de la caridad, que ciertamente lo salvaria de muchas penas y tribulaciones."}],"rawCharCount":4840},{"pageNumber":41,"blocks":[{"id":"p41-b0","pageNumber":41,"indexInPage":0,"text":"Expiación de pecados Ademas de lo que al hombre le fue decretado perder segun el Tribunal Celestial en el comienzo del año, hay veces que le llegan perdidas adicionales para expiar sus pecados. Aqui también tiene la alternativa: dar su dinero en caridad por su libre albedrio con alegria, y merecer asi la expiacion de los pecados y la recompensa por el cumplimiento del Precepto de la caridad; o poder perder su dinero a pesar suyo con afliccion, y esa sera su expiacion. De aqui debe el hombre aprender a no cerrar su mano a la caridad."},{"id":"p41-b1","pageNumber":41,"indexInPage":1,"text":"Al contrario, debe buscar caminos y subterfugios para donar grandes sumas en cada oportunidad, porque es muy probable que ese mismo dinero que da, le fue decretado perder. En lugar de perderlo en desarreglos, impuestos, multas y en aflicciones, lograra el merito de cumplir el gran Precepto de sostener a los servidores del Creador y a los pobres, y de difundir la conciencia de la fe autentica en el Creador alrededor del mundo – mediante la difusion de articulos, libros, y CDs sobre este tema – y sus pecados seran expiados."},{"id":"p41-b2","pageNumber":41,"indexInPage":2,"text":"Por lo tanto, cuando el hombre comete una infraccion de transito y es detenido por un policia, inmediatamente debe hacer el calculo, si no dio el diezmo de su dinero ese mes para caridad, o si generalmente no dona lo suficiente, y entonces determinara donar una gran suma y declarara: “Yo me comprometo a dar tal y tal suma para caridad”. Es una gran accion comprometerse a donar dinero para caridad."},{"id":"p41-b3","pageNumber":41,"indexInPage":3,"text":"Incluso si el hombre no fue juzgado en el Cielo por la falta de caridad y fue detenido por otra razon, el merito de comprometerse a hacerlo inclina a la Justicia del Tribunal Celestial en su favor. El hecho de ser declarado inocente por la Corte Divina, se expresa en este mundo en forma de que todo se le transforma para bien: el hombre se salva de multas, de mostrar sus licencias, de juicios y de otras condenas. Gracias a la caridad, toda situacion puede ser cambiada para bien."},{"id":"p41-b4","pageNumber":41,"indexInPage":4,"text":"Cuando un hombre logra arrepentirse como se debe, verá con sus propios ojos cómo el Creador transforma al juez o al acusador mismo a ser su defensor... De acusador a defensor El hombre que es procesado en un tribunal esta en una prueba de fe, y debe conducirse según sus tres reglas. Debe saber que hay un Juicio estricto sobre el en el Cielo, y por eso no hay ninguna diferencia si es absuelto y segun las leyes del pais es inocente, o es culpable sin"},{"id":"p41-b5","pageNumber":41,"indexInPage":5,"text":"esperanza de ser declarado inocente. De cualquier manera, debe arrepentirse y retornar al Creador pues se le esta insinuando claramente desde lo Alto que esta bajo un Juicio estricto. El hombre debe saber, que tambien el resultado del juicio en la Tierra esta determinado en el Cielo. Cuando se enfrente a un juez de carne y hueso, en ese mismo momento sera siendo juzgado por el Tribunal Celestial segun sus meritos y deudas."},{"id":"p41-b6","pageNumber":41,"indexInPage":6,"text":"El veredicto decidido en el Cielo sera puesto en el corazon del juez del tribunal humano, para su bien o para su mal... El hombre creyente, aunque antes de presentarse al tribunal hace esfuerzos materiales como tomar los servicios de un buen abogado, sabe claramente que al Tribunal Celestial no se le puede enganar; ningun artificio del abogado defensor cambiara el Veredicto Celestial; y segun lo que sentenciaran desde lo Alto, ese sera el veredicto en la Tierra."},{"id":"p41-b7","pageNumber":41,"indexInPage":7,"text":"Por lo tanto, la esencia de su esfuerzo es frente al Creador, porque El es Quien determina cuales seran los resultados del juicio. Aunque este hombre sabe que segun las leyes del pais no tiene ninguna esperanza de ser declarado inocente, no se asusta sino que se dirige al Creador y se confiesa frente a El, pide perdon, se arrepiente, se compromete a corregir sus acciones y nunca repetirlas, y luego adopta la decision de cambiar para bien."},{"id":"p41-b8","pageNumber":41,"indexInPage":8,"text":"En resumen, el tratara de retornar al Creador de la mejor manera posible, porque sabe que solamente esto le ayudara en su juicio. Por el contrario, incluso si sabe que segun la ley del pais debe ser declarado inocente en el juicio, el hombre creyente no confiara en esto, sino que se arrepentira cuanto le es posible, pues no sabe si en el Tribunal Celestial sera declarado inocente. Porque, si alli es culpado, obligatoriamente sera culpado en el tribunal humano, aunque sea inocente segun las leyes del pais."},{"id":"p41-b9","pageNumber":41,"indexInPage":9,"text":"Por lo tanto, se arrepentira de todas maneras, y tendra la esperanza que en el verdadero Juicio, en el Cielo, saldra inocente. Por supuesto, que si se esforzo lo mas posible para arrepentirse, incluso si no sale completamente limpio en el juicio humano, le ayudara de una manera u otra a mitigar su veredicto y a aliviar la forma en que pasara lo que le fue ordenado."},{"id":"p41-b10","pageNumber":41,"indexInPage":10,"text":"Pero debe también prepararse mentalmente a la posibilidad de no salir inocente, pues quien sabe si su arrepentimiento es suficiente para eximirlo completamente del Juicio Divino. Por lo tanto, si no fue declarado completamente inocente, su prueba de fe es no atribuir esto a"}],"rawCharCount":4884},{"pageNumber":42,"blocks":[{"id":"p42-b0","pageNumber":42,"indexInPage":0,"text":"causas naturales como su falta de esfuerzo o la incapacidad del abogado, ni por la crueldad o insensibilidad del juez, sino solamente porque no se arrepintio y no retorno lo suficiente al Creador. Y ahora, debera aceptar el veredicto con amor y verlo como la expiacion de sus pecados, y empezara a esforzarse en su arrepentimiento y plegarias, hasta lograr salir de su angustia completamente."},{"id":"p42-b1","pageNumber":42,"indexInPage":1,"text":"Cuando un hombre logra arrepentirse como se debe, vera con sus propios ojos como el Creador transforma al juez o al acusador mismo a ser su defensor y declararlo inocente."},{"id":"p42-b2","pageNumber":42,"indexInPage":2,"text":"El hombre que se conduce en la forma mencionada, logra la calificacion “excelente” en el examen de la fe, y ya en este mundo gozara de sus frutos: a) Se salvara de castigos. b) Se arrepentira y fortalecera su fe en el Creador, lo que lo aproximara a El. c) Se salvara de maledicencia, de enojo, frustracion, amargura, resentimiento, de hablar mal de los demas, y lograra la alegria y la fe."},{"id":"p42-b3","pageNumber":42,"indexInPage":3,"text":"Todo esto lo logra ya en este mundo, y por supuesto tambien tiene una gran recompensa esperandolo en el Mundo Venidero, donde tambien lograra un gran acercamiento al Creador, por su exito en la prueba de la fe durante su vida en este mundo lleno de ocultaciones y confusiones. Contrariamente, el hombre falto de fe piensa que el juez es quien determina su veredicto, y por lo tanto esta lleno de miedos, mentiras y quejas contra el y los testigos. Toda su confianza esta sobre su esfuerzo y su inteligencia o la de su abogado."},{"id":"p42-b4","pageNumber":42,"indexInPage":4,"text":"Es muy probable que su abogado mismo sea la causa de su condena en el juicio, puesto que si confia en el unicamente, el Creador lo condenara por su medio a proposito; pues existe una regla espiritual que dice que cuando el hombre pone su confianza en un ser humano y no en el Creador, ¡entonces El lo condenara a proposito a traves de ese hombre en quien confia! Tal hombre fracaso en el examen de la fe. No solo perdio la alegria del acercamiento al Creador, sino que tambien su vida esta llena de sufrimiento debido a su falta de fe."},{"id":"p42-b5","pageNumber":42,"indexInPage":5,"text":"Hubo muchos casos de personas que se enfrentaron con un juicio dificil, y aceptaron conducirse segun las reglas mencionadas. Ellas se arrepintieron, rezaron y le pidieron al Creador que les anulara el edicto. Finalmente, el juez mismo tomo el rol del defensor y fueron declarados inocentes en el juicio."},{"id":"p42-b6","pageNumber":42,"indexInPage":6,"text":"Acuérdate! Tú eres sólo como la mano larga del Creador. Puedes elegir ser una mano acariciante o una mano que golpea; ser Su respaldo o Su vara..."},{"id":"p42-b7","pageNumber":42,"indexInPage":7,"text":"Los funcionarios Todo tipo de autoridades, como policias, jueces, maestros, oficiales del ejercito, jefes, y todo tipo de responsables y conductores, deben saber que estan viviendo una prueba muy grande. Si lograran aprobarla – podran lograr grandes niveles espirituales y una gran recompensa, cumpliran su mision, e incluso llegaran a corregir todo su pasado y encarnaciones anteriores. Pero si no la aprobaran – tendran grandes danos y muchisimos pecados, cuya expiacion es muy dificil."},{"id":"p42-b8","pageNumber":42,"indexInPage":8,"text":"Y esto por tres razones principales: a) Un hombre que no posee un cargo publico, tiene generalmente contacto solo con una limitada cantidad de gente, principalmente con su familia, sus colegas de trabajo o de estudio. Por lo tanto, el no puede danar sino a un limitado numero de personas."},{"id":"p42-b9","pageNumber":42,"indexInPage":9,"text":"Pero el que posee un cargo que le hace tener contacto con muchisima gente cuyas vidas estan influenciadas directamente por sus decisiones y su comportamiento, por un lado, si lograra cumplir su cargo con fe, tendra el merito de ayudar a mucha gente, sera bendecido en todas las areas de su vida, y tendra una recompensa en el Mundo Venidero."},{"id":"p42-b10","pageNumber":42,"indexInPage":10,"text":"Pero por otro lado, si no aprendiera a utilizar el dominio que tiene en sus manos con fe, afligira a la gente que esta bajo su responsabilidad, y hara muchas transgresiones de “Entre una persona y otra”. Y como ya fue mencionado, eso es muy dificil de corregir, porque debera encontrarlos a todos y conciliarse con cada una de las personas a las cuales ofendio, lo que es casi imposible de hacer."},{"id":"p42-b11","pageNumber":42,"indexInPage":11,"text":"Encontramos entonces, que este hombre se prepara con sus propias manos grandes problemas, asi que no debera asombrarse si recibe golpes de todos lados y su vida se transforma en una pesadilla. b) Un hombre que tiene un cargo responsable posee una gran obligacion sobre sus hombros, puesto que el exito de la vida de los que estan bajo su responsabilidad depende en gran medida de su comportamiento."},{"id":"p42-b12","pageNumber":42,"indexInPage":12,"text":"Por ejemplo: la conducta de un maestro con su alumno influye a lo largo de toda su vida, para bien o para mal; un funcionario de un ministerio puede con una breve"}],"rawCharCount":4536},{"pageNumber":43,"blocks":[{"id":"p43-b0","pageNumber":43,"indexInPage":0,"text":"decision ayudar u obstaculizar; el veredicto de un juez puede determinar la vida o la muerte; un policia puede danar sin razon o salvar vidas, etc. c) Un hombre con cargo de responsabilidad debe corregir los rasgos de su caracter mucho mas que un hombre comun, porque tiene muchas y mas variadas pruebas, que sin buenas cualidades no podra superar."},{"id":"p43-b1","pageNumber":43,"indexInPage":1,"text":"En cada momento tiene este hombre el libre albedrio de beneficiar a la gente o causarle mal, conducirse con misericordia o con crueldad; dar beneficios o impedirlos; dar una condena grave o leve, e incluso perdonar el castigo completamente. Tambien tiene la elección de conducirse con cortesia y respeto con quien esta frente a el, o por el contrario, despreciarlo, ignorarlo o avergonzarlo."},{"id":"p43-b2","pageNumber":43,"indexInPage":2,"text":"Por eso, este hombre debe, mas que cualquier otro, conducirse con temor al Creador, buscar siempre cual es Su Voluntad en cada decision suya, y tener presente que el Creador lo juzgara por cada cosa que decida. Esta es la regla: cuando el hombre tiene un cargo de autoridad, debe verlo como una misión Divina en la cual el es solo un emisario del Creador. Por consiguiente, debe hacer el bien a la gente, y con eso cumple su rol."},{"id":"p43-b3","pageNumber":43,"indexInPage":3,"text":"Pero si se enorgullece por su cargo y piensa que el es el dueño de los que estan bajo su responsabilidad, fracasara y sera castigado por eso. ¡Acuerdate! Tu eres solo como la mano larga del Creador. Puedes elegir ser una mano acariciante o una mano que golpea; ser Su respaldo o Su vara. Y debido a que el Creador causa un mal acto mediante un deudor y un buen acto mediante una persona recta, entonces debes saber que cuando afliges a alguien, es senal que eres un deudor y fuiste elegido para ser la vara."},{"id":"p43-b4","pageNumber":43,"indexInPage":4,"text":"Y cuando beneficias a alguien, es senal de que eres justo y fuiste elegido para ser el respaldo. Por lo tanto, el hombre poseedor de un cargo publico, mas que cualquier otro, no debe dejar pasar ni un dia sin tener una hora entera de examen de conciencia frente al Creador, en la cual se arrepentira, y entonces siempre sera recto y sera elegido para ser el respaldo de los demas. Este hombre debe hacer todo lo que esta en su poder para cumplir su cargo en forma positiva."},{"id":"p43-b5","pageNumber":43,"indexInPage":5,"text":"No sera cruel, no ignorara las emociones de la gente y no despreciara a nadie. Por el contrario, debe aprovechar el mando que recibio sobre las personas para ayudarles y beneficiarlos. Y cuando necesita, en ejercicio de su cargo, corregirlas e incluso castigarlas, debe hacerlo con gran misericordia y explicarles sus consideraciones educativas, y con eso los apaciguara."},{"id":"p43-b6","pageNumber":43,"indexInPage":6,"text":"¡Debemos saber! Segun las Leyes del Creador, el hecho de poseer un cargo no nos da el derecho de cometer transgresiones de “Entre una persona y otra”. Si un hombre en el mundo se afligiera gratuitamente por nosotros, entonces incluso si nos arrepintieramos y pidieramos al Creador miles de disculpas, todo el tiempo que no nos reconciliemos con el hombre que afligimos, habra una gran acusacion sobre nosotros en el Cielo."},{"id":"p43-b7","pageNumber":43,"indexInPage":7,"text":"Contrariamente, si beneficiaramos a alguien y le ayudaramos a mejorar sus acciones, entonces nuestra recompensa sera infinita, porque esto influira sobre todas las futuras generaciones de esa persona durante toda la eternidad. Debemos recordar muy bien la siguiente regla de los Sabios – “Hay encima de ti un Ojo que ve, un Oido que oye, y todos tus actos estan inscriptos en Su Libro”. Otra prueba difícil es la prueba de honores. Generalmente, complace al hombre dueño de un cargo que la gente lo necesite, lo lisonjee, etc."},{"id":"p43-b8","pageNumber":43,"indexInPage":8,"text":"Pero, él debe destruir esa imagen... Crueldad frente misericordia La prueba mas grande del hombre dueno de un cargo publico, es con respecto a su instinto de crueldad. En cada hombre existe este instinto que se complace en satisfacer, pero mientras no posee un cargo autoritario, su instinto de crueldad esta dormido. Pero en el momento que recibe un cargo y llega a una posicion de fuerza, se imagina que le esta permitido conducirse segun su voluntad, y puede complacerse en satisfacer su crueldad."},{"id":"p43-b9","pageNumber":43,"indexInPage":9,"text":"Este es su examen de fe – seguir detras de su crueldad o detras de su atributo de misericordia. Porque asi como existen muchos funcionarios crueles, por el contrario existen tambien muchos funcionarios que se conducen con una gran compasion, e inmediatamente logran una recompensa muy grande por sus acciones. Los Sabios ensenaron que “En el porvenir, el Creador demandara de los jinetes por la injuria a sus caballos”. Entonces, con mayor razon la ofensa a los seres humanos."},{"id":"p43-b10","pageNumber":43,"indexInPage":10,"text":"Por lo tanto, el funcionario debe rezar mas que cualquier otra persona para lograr destruir el instinto de crueldad que posee y conducirse con misericordia."},{"id":"p43-b11","pageNumber":43,"indexInPage":11,"text":"Honores Otra prueba dificil es la prueba de honores. Generalmente, complace al hombre dueno de un cargo que la gente lo necesite, lo lisonjee, etc. Pero, el debe destruir esa imagen y no buscar honores y adulacion pues ese es un placer ilusorio. Y como ensenaron los Sabios: “¿Cual es el honorable? – el que respeta a los demas”, cuyo significado es que el verdadero honor del hombre es unicamente cuando respeta a todos, y no cuando lo honran a el."}],"rawCharCount":5048},{"pageNumber":44,"blocks":[{"id":"p44-b0","pageNumber":44,"indexInPage":0,"text":"Con mayor razon, si aprovechara su posicion para recibir beneficios o sobornos para satisfacer sus apetitos o toda otra cosa contra la moral. Un hombre que siente auto-importancia y arrogancia, ciertamente caera en desgracia, porque “La soberbia precede a la ruina”."},{"id":"p44-b1","pageNumber":44,"indexInPage":1,"text":"Al comienzo, el goza de los honores y empieza a pensar que es importante, y esta es la causa por la que despues recibe golpes – en su casa, donde lo desprecian por todo el orgullo que colecto durante el dia; en su lugar de trabajo, por medio de la presion de sus jefes, o por sus subordinados que se rebelan contra el; y asi mas desprecios parecidos, y todo debido a su arrogancia. Humillaciones Otra prueba es cuando el hombre sufre injurias, insultos o humillaciones en el marco de su trabajo."},{"id":"p44-b2","pageNumber":44,"indexInPage":2,"text":"Tambien en estos casos el hombre se enfrenta con un examen de fe. Incluso si según las leyes de este mundo pareciera que lo desdenan injustamente, segun las Leyes del Creador todo es justo y con justicia. Ciertamente no hay ningun equivoco en el Cielo, y el hombre se merece sufrir esas humillaciones. La simple explicacion es que el Creador tiene una cuenta con el que debe pagar, y El solo usa al ofensor para castigarlo."},{"id":"p44-b3","pageNumber":44,"indexInPage":3,"text":"Se cuenta sobre un gran Justo que pregunto una vez a sus discipulos: “¿De que manera quieren ustedes expiar sus pecados?, ¿quieren sufrir pobreza?”. “No”, le contestaron. “¿Enfermedades?”. “No”. “¿Conflicto con vecinos?”. “No”. “¿Exilio?”. “No”. Les dijo: “Entonces, reciban todos los desdenes que les llegan con amor, y esa sera vuestra expiacion de pecados”. Por lo tanto, hay que recibir todo con amor y arrepentirse."},{"id":"p44-b4","pageNumber":44,"indexInPage":4,"text":"El hombre no debe pensar que le esta permitido devolver insultos, o usar su autoridad para vengarse del que lo desdena o lo maldice. Porque si aflige al hombre que lo enfrenta, el debera presentar una rendicion de cuentas adicional al Creador. Y desde el Cielo le diran: “¡¿No es suficiente que ignoraste los sufrimientos que te fueron mandados, ni te estimularon para arrepentirte, sino que agregas otro pecado sobre tu delito, y cometes la transgresion de „Entre una persona y otra‟?!"},{"id":"p44-b5","pageNumber":44,"indexInPage":5,"text":"Deberias entender que esas humillaciones provienen del Creador, y tu problema es con El, no con el hombre que te desdeña y no tienes ningun permiso para afligirlo”. Esto aprendemos del Rey David. Cuando escapo de Jerusalen como consecuencia de la"},{"id":"p44-b6","pageNumber":44,"indexInPage":6,"text":"rebelion de su hijo Absalon, lo enfrento Simi hijo de Guera, lo insulto e injurio con enérgicas maldiciones, humillandolo frente a todo el pueblo, tal como esta escrito (Samuel II, 16:5–7): “Y he aqui, sale de alli un hombre de la familia de la casa de Saul, y su nombre es Simi hijo de Guera, y sale maldiciendo. El arrojaba piedras a David, y a todos sus servidores, a pesar de que todo el pueblo y todos los guerreros estaban a la derecha y a la izquierda del rey."},{"id":"p44-b7","pageNumber":44,"indexInPage":7,"text":"Y al maldecirlo, asi decia Simi: „¡Sal, sal de aqui, hombre sanguinario y vil!‟”. Cuando quiso Abisai, el general del ejercito del Rey David, castigar al desvergonzado Simi y matarlo, como esta escrito (id. versiculo 9): “Abisai, hijo de Seruia, dijo al rey: „¿Como se atreve este perro muerto a maldecir a mi senor, el rey?"},{"id":"p44-b8","pageNumber":44,"indexInPage":8,"text":"¡Dejame pasar y le cortare la cabeza!‟”, el Rey David no lo permitio, a pesar que tenia la posibilidad y el permiso para castigarlo, ya que todos sus valientes guerreros estaban con el, y ¿quien les objetaria que se vengaran del hombre que desprecio al rey? Pero el Rey David no vio ni escucho frente a el a un hombre maldiciendolo, el solo sabia que eso provino del Creador y solo de El, y por eso les dijo: “¿Que tengo que ver yo con ustedes, hijos de Seruia? Si el maldice, es porque el Eterno le ha dicho: „¡Maldice a David!‟."},{"id":"p44-b9","pageNumber":44,"indexInPage":9,"text":"¿Y quien podrá entonces preguntarle por que lo hiciste?...”. “Dejenlo que maldiga, porque asi el Eterno se lo ha dicho”. ¡Y asi abandono el Rey David la ciudad real con humillaciones e insultos sin responder ni una palabra! Como esta escrito (id. versiculo 13): “… y como David y sus hombres siguieron por el camino, Simi iba por la ladera de la montana, enfrente de el; andando y maldiciendo, arrojando piedras y esparciendo polvo contra el”."},{"id":"p44-b10","pageNumber":44,"indexInPage":10,"text":"En el momento que el Rey David dijo estas palabras: “El Eterno le ha dicho: „¡Maldice a David!‟”, fue gratificado con uno de los mas elevados niveles espirituales que existen. Por lo tanto, el hombre al que le llegan tribulaciones en el marco de su trabajo, las debe aceptar con amor como expiacion de sus pecados, y no vengarse del hombre que lo humilla. Sino por el contrario, debe sobreponerse y comportarse con misericordia, porque el hecho de que ese hombre peca contra el no le permite a el tambien pecar."},{"id":"p44-b11","pageNumber":44,"indexInPage":11,"text":"Un empleado que tiene que servir al público tiene un muy importante cargo y está"}],"rawCharCount":4691},{"pageNumber":45,"blocks":[{"id":"p45-b0","pageNumber":45,"indexInPage":0,"text":"pasando una prueba de fe. Debe creer que desde el Cielo fue ubicado en ese cargo porque... Un funcionario poseedor de fe Existe una gran diferencia entre la manera que el poseedor de fe y el que la carece cumplen con sus cargos. El dueno de la fe sabe que hay sobre el “Un Ojo que ve y un Oido que oye”, y que debe pensar en la Voluntad del Creador en cada movimiento que hace, porque si no se comporta correctamente tendra que pagar su culpa."},{"id":"p45-b1","pageNumber":45,"indexInPage":1,"text":"Contrariamente, el que no posee la fe piensa que debido al poder que tiene en sus manos puede hacer lo que quiere, como encarnizarse con la gente o aprovecharse de su condicion para su propio bien y su gozo personal. Traeremos algunos ejemplos de las pruebas que los funcionarios deben pasar. Y cada uno podra entender de ellas sobre su propio tipo de cargo, cual es su propia prueba y como podrá superarla con exito."},{"id":"p45-b2","pageNumber":45,"indexInPage":2,"text":"El empleado público Un empleado que tiene que servir al publico tiene un muy importante cargo y esta pasando una prueba de fe. Debe creer que desde el Cielo fue ubicado en ese cargo porque tiene una correccion que hacer con las personas a las que hizo dano, o a las que indujo a cometer alguna falta. ¿Y cual es su correccion? – beneficiarlas en la presente encarnacion. Por eso mismo fue ubicado en tal posicion, para tener la oportunidad de reencontrarse con todas esas almas."},{"id":"p45-b3","pageNumber":45,"indexInPage":3,"text":"Este hombre necesita saber que con muchas de las personas que estan esperando turno cada dia para que les atienda, esta relacionado o tiene una deuda con ellos desde una pasada encarnacion. Si les trata con benevolencia, completara su correccion espiritual con ellos. Por lo tanto, debe utilizar su cargo para ayudar a quien se dirige a el y conducirse con respeto y paciencia con todos. Y no es necesario decir que no despreciara ni sera cruel con ningún hombre."},{"id":"p45-b4","pageNumber":45,"indexInPage":4,"text":"Incluso si algunas veces los que se dirigen a el lo desprecian o lo danan, debe creer que todo eso proviene del Cielo. Esta es su prueba de fe: tener paciencia y arrepentirse por las transgresiones por los cuales se merece las tribulaciones. Calculen la cantidad de personas que el funcionario publico atiende cada dia."},{"id":"p45-b5","pageNumber":45,"indexInPage":5,"text":"Si en verdad aprovechara su cargo para ayudarlos y beneficiarlos, lograria cumplir su correccion del alma, haria muchos actos bondadosos y recibiria abundancia de bendiciones, pues “Aquel que es amado „Abajo‟, es sabido que es amado „Arriba‟”."},{"id":"p45-b6","pageNumber":45,"indexInPage":6,"text":"Pero si no cumpliera su cargo con fe y no se esforzara bastante segun su poder para ayudar a los que se dirigen a el, o aun peor, si se comportara cruelmente con ellos, ignorandolos, despreciandolos u ofendiendoles, no solo que no rectificaria lo que vino a corregir en este mundo, sino que arruinaria todo aun mas. Se le agregarian nuevas correcciones y grandes problemas, ya que se encontraria en un embrollo del que no podria liberarse debido a la cantidad de personas que estan enfadadas con el."},{"id":"p45-b7","pageNumber":45,"indexInPage":7,"text":"El policía El cargo de los policias es muy importante: mantener el orden y prevenir danos a las personas. Como ensenaron los Sabios, se debe rezar por el bienestar del reino, porque si no fuera por el temor a la autoridad, el hombre se “tragaria” vivo a su semejante... Es decir, que sin las l
