e odia!"},{"id":"p102-b10","pageNumber":102,"indexInPage":10,"text":"¡No tengo ningun valor!; debo ser un malvado completo y no tengo esperanza; el Creador no me tolera mas y decidio castigarme. ¡Basta ya, no puedo mas!, ¡mejor que ponga fin a esta vida y acabe con estos sufrimientos!”... ¡Sin embargo, José el Justo se fortaleció! Se desembarazó de su razonamiento, comprendió que no entendía nada, y se reforzó en la fe que el Creador es siempre bueno; que todo lo que el Creador hace – es todo para bien; que el Creador lo ama siempre."},{"id":"p102-b11","pageNumber":102,"indexInPage":11,"text":"Y de pronto, ¡comenzó a bailar!, ¡se alegró!, ¡Le agradeció al Creador por todo! Se esforzó en ocupar cada instante libre en cumplir la Voluntad Divina lo mejor posible, particularmente realizando “Aislamientos” rezando al Creador, que es de hecho lo"}],"rawCharCount":4764},{"pageNumber":103,"blocks":[{"id":"p103-b0","pageNumber":103,"indexInPage":0,"text":"mejor que podía hacer en la cárcel. El exito de Jose en la prision se debe a dos elementos. El primero es, como ya fue dicho, que brincaba y bailaba en la carcel sintiendose contento con lo que le tocaba en suerte, y por eso merecio que el Creador este con el y le ayude. El segundo, es que mencionaba al Creador incesantemente, y decia por cada cosa: “Con la ayuda de Dios”, “Si el Creador lo quiere”. Por lo tanto, el Creador le hizo tener exito, y todos los largos anos en prision pasaron de una manera agradable."},{"id":"p103-b1","pageNumber":103,"indexInPage":1,"text":"Finalmente, ¡Jose fue merecedor de reinar sobre toda la tierra de Egipto, todo gracias a su fortalecimiento espiritual, creyendo que “Todo es para bien”! Aprender de la experiencia de los demás Cada uno de nosotros que tiene problemas que le impiden estar alegre, debe acordarse de Jose el Justo. Debe reflexionar sobre la realidad que vivio Jose cuando fue arrojado a la carcel sin sentencia judicial, sin saber cuantos anos estaria alli, y que simplemente, en su colera, su amo lo echo alli arbitrariamente."},{"id":"p103-b2","pageNumber":103,"indexInPage":2,"text":"Y como en aquella epoca la expresion “derechos humanos” no era conocida, ¿entonces quien tendria piedad de este esclavo perdido e indigente y consideraria la injusticia cometida? Segun el desarrollo “normal” de las cosas, no tendria ninguna posibilidad de salir alguna vez."},{"id":"p103-b3","pageNumber":103,"indexInPage":3,"text":"Por consiguiente: Una persona que tarda en encontrar pareja y esta segura que esto justifica no estar alegre, debe recordar que a Jose tampoco se le propuso ninguna pareja mientras estaba encarcelado, y aunque probablemente debia quedarse alli hasta el final de su vida – estaba pleno de alegría."},{"id":"p103-b4","pageNumber":103,"indexInPage":4,"text":"Una persona que no tiene hijos y esta segura que no hay ninguna posibilidad de estar alegre en esta situacion, debe recordar que Jose tampoco vio ninguna posibilidad de tener hijos, ya que estaba encarcelado posiblemente para toda su vida, y sin embargo – estaba pleno de alegría."},{"id":"p103-b5","pageNumber":103,"indexInPage":5,"text":"Una persona sin apartamento para vivir, o que tuvo que cerrar su comercio o que fue condenada a servicios comunitarios, y esta segura que tiene justificada razon para estar triste, debe recordar que Jose tampoco tenia casa, ni comercio y fue forzado a servir a los otros prisioneros, y sin embargo – estaba pleno de alegría."},{"id":"p103-b6","pageNumber":103,"indexInPage":6,"text":"Una persona que observa sus desventajas espirituales, que le es dificil rezar y sufre grandes impedimentos para servir al Creador, o que posee muy malos rasgos o que esta llena de apetitos, y esta segura que la tristeza es un deber, debe"},{"id":"p103-b7","pageNumber":103,"indexInPage":7,"text":"recordar que Jose tambien, en prision, tenia dificultades y enfrento innumerables obstaculos: el no podia servir al Creador, ni rezar ni cumplir ningun Precepto. Sin embargo – él estaba alegre. Una persona que tiene dificultades en su vida conyugal hasta tal punto que vivir en compania de su conyuge le parece una prueba insoportable, debe saber que esto es incomparable con la prueba de Jose, que estuvo obligado a vivir en prision con todo tipo de asesinos, violadores y ladrones, y tuvo que arreglarse lo mejor posible con ellos."},{"id":"p103-b8","pageNumber":103,"indexInPage":8,"text":"Y sin embargo, Jose estaba convencido que era todo para bien – y estaba alegre. Una persona sin familia ni amigos, que se siente sola y miserable, debe recordar que tambien Jose el Justo estaba muy solo. El no recibia correo; no gozaba de horas de visita en la carcel y estaba convencido que nunca veria mas a su familia, sin embargo... ¡estaba alegre!"},{"id":"p103-b9","pageNumber":103,"indexInPage":9,"text":"¡Así, si cada uno de nosotros empezara a creer que también su situación proviene de que “Así el Creador quiere” y que “Todo es para bien”, se sentiría alegre en toda situación! – aun sin hijos, sin conyuge (o con el peor de los conyuges), sin ahorros, sin apartamento. Y tanto mas, cuando en la mayoria de los casos, la situacion no es tan terrible y solo la falta de fe, el descontento de su rol y de su mision en la vida, enfatizan y agravan las dificultades de su prueba."},{"id":"p103-b10","pageNumber":103,"indexInPage":10,"text":"La guerra contra los malos pensamientos Y si el lector dice: “¡¿Jose?! ¿Que ejemplo es este? ¡El era un Justo! ¡Todo le resultaba facil!” – esto es incorrecto. Jose tambien se enfrento con malos pensamientos: pensamientos de desesperacion y de tristeza; pensamientos que quedaria soltero toda su vida; que nunca engendraria hijos; que nunca tendria su propia casa, ni ahorros ni comercio; estaba seguro que habia caido en el olvido sin que nadie se preocupe por el."},{"id":"p103-b11","pageNumber":103,"indexInPage":11,"text":"El pensaba que nunca progresaria espiritualmente; que nunca se acercaria al Creador; que zozobraria entre los idolatras y los violadores sin poder cumplir los Preceptos Divinos, rodeado de idolatria e impureza. Jose, tenia pues, todas las razones para perseguirse a si mismo, culparse por todo, y encolerizarse con el Creador, quejandose, refunfunando y llorando."},{"id":"p103-b12","pageNumber":103,"indexInPage":12,"text":"No debemos olvidar que la prueba de Jose fue mucho mas dificil que la de cada uno de nosotros, pues segun la naturaleza de las cosas parecia claro que debia quedarse en la carcel toda la vida, ¿y que valor tenia esa vida? ¿Que pequeno estimulo o"}],"rawCharCount":4867},{"pageNumber":104,"blocks":[{"id":"p104-b0","pageNumber":104,"indexInPage":0,"text":"asistencia se le podria dar? ¿Que rayo de luz podria alumbrar su oscura existencia? Y en especial despues de su estancia en prision durante varios anos y sobre todo en su duodecimo ano. ¡Que pensamientos de desesperacion podrian llegar a su mente! ¡Pero Jose lucho contra esos pensamientos! ¡Se fortalecio! ¡Grito su plegaria pidiendo fe del Creador, pidiendo la creencia que “Todo es para bien”! Rechazo su razonamiento y decidio que no comprendia nada, solo creyo que “Asi el Creador quiere”."},{"id":"p104-b1","pageNumber":104,"indexInPage":1,"text":"Creyo que posiblemente esa era la correccion de su alma en este mundo – Tener fe en el Creador del Universo en todas esas dificiles condiciones hasta el fin de su vida, pues esta es Su Voluntad. Asi, siguio alegre, ¡cantando, bailando y agradeciendo al Creador! Se dijo a si mismo: “¡Jose!, o tu crees en el Creador, o no crees. Si tu crees que todo proviene de El, entonces debes creer tambien que “Todo es para bien” – y entonces, ¡regocijate, baila y agradecele!”."},{"id":"p104-b2","pageNumber":104,"indexInPage":2,"text":"Cuando Jose tenia los mayores motivos para estar triste, se decia a si mismo: “Puede que tengas razon que existen todas las causas para sentirte triste, pero por medio de este razonamiento perderas todo. En el instante en que caigas en la tristeza, el Creador te abandonara. Perderas la fe, la poca espiritualidad que tienes, y te llegaran muchos problemas y maldades. Por lo tanto, en lugar de tener razon, se mejor inteligente."},{"id":"p104-b3","pageNumber":104,"indexInPage":3,"text":"Comprende que todo este “razonamiento” es tu perdicion, es un hecho de la Mala Inclinacion que pretende hacerte caer en la mas completa desesperacion. ¡No tengas razon! Justifica al Creador, porque El evidentemente tiene La razon. ¡Cree en El – y veras tu salvacion!”. Asi, si cada hombre justificara al Creador y decidiera que cree en El, que todo esta bajo Su Supervision y que “Todo es para bien”, tambien podria regocijarse de todo lo que le llega – sea lo que sea – ¡y veria luego grandes logros! ¡No entiendo nada!"},{"id":"p104-b4","pageNumber":104,"indexInPage":4,"text":"Cuando la Mala Inclinacion le dijo a Jose: “Mira donde caiste, acabaras tu vida en la carcel y nunca te casaras”, ¿como reacciono Jose? Empezo a bailar y cantar: “¡No entiendo nada! ¡No me importa nada! Que sea lo que el Creador quiere que sea, pues lo que El hace, es todo para bien; Si no me casare, es para bien. ¡Te agradezco por todo, Señor del Universo! No comprendo nada, creo solamente que el hombre debe estar alegre y bailar toda su vida”. Ésta es toda la elección del hombre en cada"},{"id":"p104-b5","pageNumber":104,"indexInPage":5,"text":"instante de su vida: estar alegre o estar triste. Y escoger la alegría es posible sólo gracias a la fe. Asi tambien se condujo Jose cuando la Mala Inclinacion le dijo: “Nunca engendraras hijos”, “Nunca tendras ahorros”, “Mira con que tipo de personas insoportables deberas pasar tu vida”, “Estas clavado en esta tierra impura, ¿que sera de ti? ¿Cuando te arrepentiras? „No existen tribulaciones sin transgresiones‟ – ¡debes ser el peor de los impios y pecadores!”."},{"id":"p104-b6","pageNumber":104,"indexInPage":6,"text":"Frente a todos estos pensamientos, Jose bailo, canto y agradecio al Todopoderoso: “Creador del Universo, muchas gracias por todo; no entiendo nada, sólo creo que todo es para bien y que la finalidad del hombre es creer en Ti; Te agradezco, puesto que estoy cumpliendo mi meta en este mundo, porque creo en Ti; ¡bailo, estoy alegre y Te agradezco por la fe que me das!”. La Fe y los Rasgos del Carácter – Tristeza #7: Cada uno de nosotros que tiene problemas que le impiden estar alegre, debe acordarse de José el Justo."},{"id":"p104-b7","pageNumber":104,"indexInPage":7,"text":"Debe reflexionar sobre la realidad que vivió José cuando fue arrojado a la cárcel... La alegría – tu salvación En cada asunto espiritual o material, cuando el hombre llega a una cierta situacion contraria a su voluntad, debe fortalecerse y creer que esto esta dirigido por la Supervision Divina para su bien, y aceptar su situacion con alegria. Solamente entonces podra salir de su “prision” personal."},{"id":"p104-b8","pageNumber":104,"indexInPage":8,"text":"¡Hasta que el hombre no se regocija de su situación, hasta que no baila en su propia “prisión” durante un cierto período – no saldrá de allí! Y es importante saber, que es solamente cuando el hombre esta alegre que puede rezar. Por lo tanto, mientras es incapaz de orar, es senal que no alcanzo todavia la alegria y la creencia que “Todo es para bien”, la que deberia llevarlo a rezar con facilidad por todo, y continuamente. El buen final Estimados lectores, ¿saben como acabo la historia de Jose el Justo?"},{"id":"p104-b9","pageNumber":104,"indexInPage":9,"text":"Tuvo el merito de casarse, de tener hijos justos y sobresalientes, tener alimento, merecio la riqueza hasta la opulencia y mantuvo a toda su generacion, incluso a su padre y hermanos, como esta escrito (Genesis 42:6): “Y Jose era el gobernador en aquella tierra. El era quien vendia el trigo a todo el pueblo del pais”. Tambien merecio una gran sabiduria mediante el angel Gabriel que se le revelo y le enseno en la carcel, asi como muchas otras grandes cualidades y virtudes, todo a causa de su fe inalterable que “Todo es para bien”."},{"id":"p104-b10","pageNumber":104,"indexInPage":10,"text":"Sin la fe,"}],"rawCharCount":4839},{"pageNumber":105,"blocks":[{"id":"p105-b0","pageNumber":105,"indexInPage":0,"text":"Jose habria caido en la tristeza y en la depresion; ciertamente no habria logrado la Inspiracion Divina y no habria podido interpretar los suenos del escanciador y el panadero del Faraon, que estaban con el en la carcel. Ellos contaron al Faraon – el cual estaba muy molesto por haber tenido un sueno que nadie sabia dilucidar – que hay en la carcel un esclavo que sabe interpretar los suenos. Y asi Jose fue sacado de la prision."},{"id":"p105-b1","pageNumber":105,"indexInPage":1,"text":"Sin la fe, el habria sido impotente para afrontar al Faraon y a sus magos e interpretar el sueno, y entonces habria sido olvidado y abandonado en la carcel, terminando alli sus dias. Solamente gracias a que Jose fue vendido como esclavo a Egipto, todo el pueblo de Israel pudo ser salvado y liberado de la esclavitud, porque superando pruebas tan dificiles, Jose quebro la dura corteza de impureza espiritual del pais."},{"id":"p105-b2","pageNumber":105,"indexInPage":2,"text":"La razon por la que el Creador nos ensena estas historias de los grandes Justos y antiguos Sabios, es para que aprendamos una leccion aplicable a nuestra vida. Si Jose hubiera reaccionado como mucha gente, con tristeza, desesperacion y colera, nunca se habria transformado en “Jose el Justo”, sino en Jose el desesperado o Jose el desgraciado, el amargado o el loco."},{"id":"p105-b3","pageNumber":105,"indexInPage":3,"text":"A toda persona que se fortalezca con la fe, se le transformara todo para bien, y lograra elevacion espiritual y exito en todos sus asuntos; asi como Jose que se elevo literalmente de un pozo profundo al pinaculo material y espiritual: de un esclavo humillado a gobernador de Egipto; de un hombre pobre y necesitado al hombre mas rico del mundo; de un hombre expulsado, odiado y no querido – al mas amado, de quien todos buscaron estar cerca."},{"id":"p105-b4","pageNumber":105,"indexInPage":4,"text":"Sin embargo, no debemos equivocarnos con la fantasia de que si tenemos fe durante solo unos dias o semanas todo se transformara para bien, sino que debemos creerlo durante todo el tiempo que el Creador lo desea, sin limites. El camino de los Justos Tambien el Rey David atraveso durante su vida todos los sufrimientos y persecuciones imaginables, y tuvo todos los motivos para caer en la tristeza y la desesperacion. Pero David, tal como Jose, solo se alegro, bailo y canto, agradeciendo al Creador por todo."},{"id":"p105-b5","pageNumber":105,"indexInPage":5,"text":"Asi logro escribir el sagrado libro de los Salmos, que en su mayoria son plegarias, cantos y agradecimientos al Creador. Esta es la razon por la que el tambien merecio alcanzar los mas altos niveles. Todo Justo tuvo su cuota de dificultades, y si no fuera por su fortalecimiento de la fe, nunca hubiera"},{"id":"p105-b6","pageNumber":105,"indexInPage":6,"text":"podido superar las dificiles pruebas que sufrio. Lo esencial de su fe era que “Todo es para bien”, y estuvo basada en la comprension que a pesar de sus planes, el Todopoderoso tiene los Suyos para el. Es evidente que tambien los Justos hubieran preferido servir al Creador tranquilamente, tener un facil sustento, gozar de buenos hijos, Y en realidad, no esta prohibido aspirar a todos esos bienes."},{"id":"p105-b7","pageNumber":105,"indexInPage":7,"text":"Pero cuando alguno de esos deseos no se realizo como quisieron, anularon su voluntad frente a la del Creador, y aceptaron con amor todo lo que sucedio. Ellos sabian que el Todopoderoso es Quien decide el curso de sus vidas y que Sus intenciones son buenas. Ellos pues, rezaron, se fortalecieron, esperaron y meditaron sobre cada cosa, con el fin de acercarse mediante esas acciones al Creador, y asi fueron luego merecedores de grandes logros."},{"id":"p105-b8","pageNumber":105,"indexInPage":8,"text":"Con razon, Jose el Justo y el Rey David merecieron que el Mesias sera parte de su descendencia, porque el Creador los escogio por su fe completa, a pesar de las terribles tribulaciones y persecuciones que sufrieron sin pronunciar la menor queja, solo bailando y agradeciendole. La Fe y los Rasgos del Carácter – Tristeza #8: En lugar de entristecernos por las pérdidas despilfarrando un tiempo precioso, podemos ganar muchísimo en cada instante..."},{"id":"p105-b9","pageNumber":105,"indexInPage":9,"text":"El bien contra el mal Una de las tacticas mas efectivas de la Mala Inclinacion para hundir al hombre en la tristeza, consiste en acentuar sus defectos y privaciones frente a sus propios ojos, ocultando totalmente sus buenos puntos en el campo material, y especialmente en lo espiritual. Asi el hombre es atrapado en una red de tristeza y desesperacion sin ninguna razon, porque en cada hombre se encuentra mucho bien y realiza mucho bien."},{"id":"p105-b10","pageNumber":105,"indexInPage":10,"text":"Si el hombre hubiera visto todo lo bueno que posee, se fortaleceria diciendose que si lo logro hasta ahora, ciertamente podra en adelante alcanzar mucho mas y tener exito. De esta forma siempre estaria contento y nada le podria hacer caer de esa alegria. ¿A que es esto comparable? A un hombre que trabaja en la bolsa de valores y gana millones de dolares a cada instante. De pronto, llega alguien y le fastidia: “¡Oye, no prestaste atencion, recien perdiste unos miles de dolares! ¡Ay, que pena!, ¿¿que vas a hacer??”."},{"id":"p105-b11","pageNumber":105,"indexInPage":11,"text":"El comerciante le responde: “¿Piensas que esto debe preocuparme? En cada instante gano millones de dolares. Es una lastima perder mi tiempo pensando de unos pocos miles. Mas tarde, al"}],"rawCharCount":4893},{"pageNumber":106,"blocks":[{"id":"p106-b0","pageNumber":106,"indexInPage":0,"text":"final del dia, reflexionare sobre esto y vere cual fue el problema para no repetirlo. Ahora, ¡prosigue tu camino, me estas molestando a ganar mis millones!”. Asi es con cada uno de nosotros, en lugar de entristecernos por las perdidas despilfarrando un tiempo precioso, podemos ganar muchisimo en cada instante si continuamos observando los Preceptos Divinos, pues cada uno de ellos vale mas que millones y alegra al hombre que los cumple, tal como esta escrito (Salmos 19:9–11): “Los Preceptos del Eterno son rectos, alegran el corazon..."},{"id":"p106-b1","pageNumber":106,"indexInPage":1,"text":"Son mas deseables que el oro, mas que el oro fino”, y tambien (Salmos 119:72): “La Ley de Tu boca es mejor para mi que millares de monedas de oro y plata”. Por consiguiente, el hombre debe ser inteligente y no considerar lo malo que hay en el, sino solamente lo bueno; debe aumentarlo, desarrollarlo y regocijarse por ello el dia entero. Solamente despues, en su hora de “Aislamiento” (“Hitbodedút”), realizara un examen de conciencia donde considerara los aspectos en su vida que no son como es debido, para intentar corregirlos."},{"id":"p106-b2","pageNumber":106,"indexInPage":2,"text":"No obstante, en el resto del dia estara alegre, sin prestarles atencion. La Fe y los Rasgos del Carácter – La Ira #1: Puesto que el hombre viene a este mundo con el propósito de corregir su alma, es prácticamente imposible evitar situaciones que estimulen sentimientos de enojo... La ira destruye vidas. Es un atributo extremadamente grave que destruye la vida no solo del hombre colerico, sino de todo su alrededor."},{"id":"p106-b3","pageNumber":106,"indexInPage":3,"text":"Las diferentes formas y grados de la ira: Algunos se enojan interiormente y andan malhumorados y amargados; otros expresan su colera con palabras duras y firmes. Hay algunos que gritan, maldicen, y humillan; estan tambien los que pierden la cabeza, desgarran sus ropas y rompen objetos en medio de su furia. El enojo puede ser infundado, hay gente que se encoleriza sin causa o por razones imaginarias; hay algunos que aparentemente tienen muy buenas razones para enojarse..."},{"id":"p106-b4","pageNumber":106,"indexInPage":4,"text":"Hay que saber que todas las reprobaciones y advertencias contra la ira, se aplican tambien cuando es perfectamente justificada, y tanto mas cuando no lo es. Expresada bajo cualquiera de las dos formas, toda ira es el resultado de una falta de fe. Porque si el hombre tuviera la creencia que “Asi el Creador quiere”, nunca se encolerizaria. Puesto que el hombre viene a este mundo con el proposito de corregir su alma, es practicamente imposible evitar"},{"id":"p106-b5","pageNumber":106,"indexInPage":5,"text":"situaciones que estimulen sentimientos de enojo. El Creador nos enfrenta con todo tipo de situaciones y eventos que no son de nuestro agrado: defectos y problemas, contrariedades, actos de la gente contra nuestra voluntad, etc. Si el hombre mirara cada cosa con fe; decidiria aceptar todo sin oponerse, recordandose que esta en una prueba del Creador; comportandose segun las “Tres Reglas de la Fe” – nunca se encolerizara."},{"id":"p106-b6","pageNumber":106,"indexInPage":6,"text":"Sin embargo, cuando los acontecimientos de la vida estan desconectados de la fe y son atribuidos a diferentes causas o personas, es inevitable llegar a la colera en todo tipo de ocasiones. Conciencia Espiritual Resulta de esto, que evitar la ira depende de la conciencia espiritual del hombre, de mirar la vida con fe a fin de conocer al Creador en todo acontecimiento, y meditar como acercarse a El en cada instante de la vida."},{"id":"p106-b7","pageNumber":106,"indexInPage":7,"text":"Por eso, un hombre colerico debe rezar repetidamente: “Creador del Universo, dame la inteligencia de la fe; dame el conocimiento espiritual para creer que no hay nada fuera de Ti; que el azar no existe, que todo lo que me llega proviene de Ti. Ayúdame a creer que no hay nadie que me pueda hacer algún daño; que todo proviene de Ti, y que Tú lo haces para mi propio bien”. Como dijo el Rey Salomon (Eclesiastes 7:9): “La ira reside en el seno de los necios”."},{"id":"p106-b8","pageNumber":106,"indexInPage":8,"text":"En efecto, toda la colera es resultado de la necedad que significa ignorancia, que es lo opuesto a la conciencia. Cuanto mas limitada es la conciencia espiritual del hombre, mas se encoleriza, como los ninos que se enojan facilmente cuando las cosas no son segun su gusto, pues todavia no han desarrollado esta conciencia. En un nivel mas alto se encuentra el hombre que tiene mas conciencia, y comprende que no todo puede andar como el quisiera."},{"id":"p106-b9","pageNumber":106,"indexInPage":9,"text":"En el nivel superior se encuentra el hombre creyente, cuya conciencia espiritual esta muy desarrollada, y comprende que cada cosa tiene una razon particular. Hasta cuando sufre una dificil prueba, o se lo humilla y lo danan, mira todo con los ojos de la fe, y entiende que el Creador le hace todo eso con el fin de acercarlo a El y facilitar la rectificacion de su alma. Por lo tanto, no se opone a lo que le llega y lo vive a traves de la reflexion y la comprension."},{"id":"p106-b10","pageNumber":106,"indexInPage":10,"text":"La conclusion es, que incluso si la ira no arrastrara tantos danos, segun el punto de vista de la fe, tampoco tendria ninguna justificacion. La Fe y los Rasgos del Carácter – La Ira #2: El hombre no debe descansar y no"}],"rawCharCount":4851},{"pageNumber":107,"blocks":[{"id":"p107-b0","pageNumber":107,"indexInPage":0,"text":"calmarse hasta que no haya hecho lo máximo para desarraigar de sí todo lo que conduce a perder su alma, y especialmente... En realidad, la ira dana el cuerpo y el alma mas que toda otra transgresion, porque el hombre colerico, aunque cumpla muchos Preceptos y haga innumerables buenas acciones, pierde todo. Cuando el hombre se encoleriza pierde su alma sagrada con la cual cumplio todos esos meritos, y en su lugar, un espiritu impuro llega para residir en su cuerpo."},{"id":"p107-b1","pageNumber":107,"indexInPage":1,"text":"Resulta que el hombre colerico no tiene ninguna posibilidad de alcanzar algun nivel espiritual, porque aunque cumple todos los Preceptos y se dedica al servicio del Creador dia y noche, tan pronto como tenga un gran enojo, perdera todo. Si pudiera comenzar luego de cero, seria un consuelo parcial, pero el cae en un lugar tan impuro que debera trabajar muy duro para salir de alli."},{"id":"p107-b2","pageNumber":107,"indexInPage":2,"text":"Por lo tanto, la recuperacion del colerico es posible solo si se arrepiente profundamente, es decir, si emprende la tarea de no enojarse nunca mas, pase lo que pase, y se esfuerza desde ahora en adelante para aprender el camino de la fe y vivir segun ella. Es solamente entonces, que su alma santa volvera. Explicación de todos los enigmas Segun lo que precede, podremos comprender muchos enigmas de este mundo: Un hombre no encuentra pareja y nadie puede comprender la razon, ya que es bien parecido, inteligente y talentoso."},{"id":"p107-b3","pageNumber":107,"indexInPage":3,"text":"La explicacion es que la ira le hizo perder el alma, lo que causo la perdida de la pareja que le estaba destinada. Un hombre casado cuya mujer repentinamente esta en su contra y no puede tolerarlo mas. Exige el divorcio vehementemente y ella misma es incapaz de explicar la causa. Antes vivian juntos en paz y amor, y de repente todo se arruino. El marido por su parte, no comprende por que todo lo que hace no ayuda y nada la puede apaciguar."},{"id":"p107-b4","pageNumber":107,"indexInPage":4,"text":"La explicacion es que la colera le hizo perder el alma, y su mujer perdio pues toda afinidad con el. Un hombre que era completamente cuerdo, de repente pierde la cabeza, se enloquece y nadie entiende que le paso. La explicacion es que estallo en un enojo terrible que le hizo perder su alma, y un mal espiritu lleno el vacio, aterrorizandolo y torturandolo con terribles sufrimientos espirituales. Un hombre que se ganaba la vida facilmente, de pronto y sin ninguna razon aparente, tiene una drastica caida en sus ganancias."},{"id":"p107-b5","pageNumber":107,"indexInPage":5,"text":"Tambien aqui la explicacion es que su alma,"},{"id":"p107-b6","pageNumber":107,"indexInPage":6,"text":"a la que le fue determinada una cierta abundancia, se ha perdido por su ira. Todo tipo de enfermedades y diversas angustias que le llegan al hombre sin que se les encuentre algun remedio, se deben a la ira. Enseguida que el alma santa desaparece, un mal espiritu ocupa su sitio y provoca toda clase de danos y enfermedades. El alma de un hombre que se enoja se debilita, y entonces miedos, ansiedades y tristezas le hostigan constantemente."},{"id":"p107-b7","pageNumber":107,"indexInPage":7,"text":"Hacer la cuenta correcta A luz de lo que escribimos, comprendemos cuanto la gente debe efectuar un examen de conciencia antes de que se le presente la prueba del enojo. Debe cada uno aclarar sus pensamientos, y reflexionar si existe alguna cosa en el mundo que valga la pena enojarse por ella y perder asi su alma, su pareja, su sustento, su salud, su espiritualidad, y todos los valiosos Preceptos."},{"id":"p107-b8","pageNumber":107,"indexInPage":8,"text":"Por consiguiente, el hombre no debe descansar y no calmarse hasta que no haya hecho lo maximo para desarraigar de si la herejia y la ignorancia que conducen a perder su alma. Debe rezar, pedir y suplicar mucho al Creador que le ayude a no encolerizarse nunca, pase lo que pase, aun cuando se opongan a el, lo desprecien, no lo obedezcan, cuando le causan danos reales, fisicos o economicos, incluso cuando tenga toda la razon."},{"id":"p107-b9","pageNumber":107,"indexInPage":9,"text":"Cuando se pierde el alma santa a traves de la ira, se pierde tambien toda la abundancia material y espiritual que la acompana, y queda un vacio por donde entran las fuerzas impuras del mal, conduciendonos a terribles danos materiales y espirituales. Ahora se comprende mejor aun lo que dijo el Rey Salomon, que solo un hombre insensato y totalmente ignorante esta dispuesto a perder tanto y caer en tal abismo espiritual de impureza, por el instantaneo placer de descargar su colera. ¡El daño ocasionado por la ira es lo más terrible!"},{"id":"p107-b10","pageNumber":107,"indexInPage":10,"text":"¡Nada en el mundo vale la pena como para perder por ello el alma! La Fe y los Rasgos del Carácter – La Ira #3: El hombre no piensa para qué vino al mundo; que tiene una misión que incluye pasar todo tipo de pruebas; que debe trabajar para conocer el Creador más y más cada día... Un hombre que carece de fe esta siempre en disputa con el Creador. El Creador lo supervisa en una forma precisa, con el fin de conducirlo a la correccion de su alma y a cumplir su mision en este mundo."},{"id":"p107-b11","pageNumber":107,"indexInPage":11,"text":"Algunas veces, El lo estimula al arrepentimiento, otras a prestar atencion a una cosa especifica; algunas veces lo estimula a"}],"rawCharCount":4791},{"pageNumber":108,"blocks":[{"id":"p108-b0","pageNumber":108,"indexInPage":0,"text":"aprender tal concepto de la fe, otras a rezar sobre un determinado tema durante un cierto tiempo; algunas veces lo orienta a operar un cambio en su vida, etc. Sin embargo, este hombre comprende todo esto de otro modo – cree saber mejor que el Creador lo que es bueno para el... Quiere que todo le vaya bien, tener una vida facil sin necesidad de aprender lo que debe corregir, sin trabajar sobre si mismo, sin confrontar las cosas, solo descansar y vivir con calma y tranquilidad – consumiendo su vida..."},{"id":"p108-b1","pageNumber":108,"indexInPage":1,"text":"De hecho, esta es la pereza que proviene de la falta de fe. El hombre no piensa para que vino al mundo; que tiene una mision que incluye pasar todo tipo de pruebas; que debe trabajar para conocer el Creador mas y mas cada dia. Y que realmente, la sabiduria que el cosecha en este trabajo, le traera vitalidad, agilidad, alegria y fuerza. Por lo tanto, si el hombre adquiere fe, tendra la fuerza y el animo para realizar todo lo necesario para superar cada prueba, y solo asi podra lograr la autentica tranquilidad de espiritu."},{"id":"p108-b2","pageNumber":108,"indexInPage":2,"text":"Quien desea solo descansar en este mundo, debe saber que se le opondran numerosos obstaculos y no podra gozar ni un solo instante del verdadero reposo. Solamente aquel que esta dispuesto a trabajar y esforzarse, tendra paz y descanso en este mundo."},{"id":"p108-b3","pageNumber":108,"indexInPage":3,"text":"Vemos entonces, no solo que el hombre no debe enojarse cuando las cosas no van segun su voluntad, sino que debe anularse a si mismo delante de la Supervision Divina, meditando sobre los mensajes que El le envia, porque solo asi podra alcanzar la correccion de su alma y cumplir su mision en la vida. La regla esencial He aqui una regla esencial que el hombre nunca debe olvidar: ¡Cada vez que te enojas, en realidad, te enojas con el Creador!"},{"id":"p108-b4","pageNumber":108,"indexInPage":4,"text":"¡Porque según la fe, todo lo que te llega proviene del Creador, y si te encolerizas, te encolerizas realmente con Él por no haber hecho las cosas según tu voluntad! La Fe y los Rasgos del Carácter – La Envidia #1: Hace mucho tiempo, existió un gran Sabio llamado Josué, que era una de las personalidades más grandes y sabias de su generación, pero era muy feo..."},{"id":"p108-b5","pageNumber":108,"indexInPage":5,"text":"Hay que saber que la Supervision del Creador sobre cada criatura es totalmente precisa hasta en el mas pequeno detalle, exactamente segun su propia alma, sus previas reencarnaciones, y segun el cumplimiento de su mision sobre la Tierra. Esta bien entendido que existen infinitos detalles que distinguen a un hombre de otro; cada persona es unica, tiene su"},{"id":"p108-b6","pageNumber":108,"indexInPage":6,"text":"propio objetivo, su propia correccion del alma, y no se parece a ninguna otra. Cada uno de nosotros tiene su propio sendero particular en la vida y debe seguirlo con fe, sin mirar a los demas, y con mayor razon, sin envidiar a nadie. ¡Vive según tu finalidad! Toda la envidia que el hombre experimenta en este mundo, debe estimularlo a comprender que alejado esta de su autentica finalidad."},{"id":"p108-b7","pageNumber":108,"indexInPage":7,"text":"Si se examinara, veria que todas sus aspiraciones conciernen a lo mundano, arrastrandolo a querer siempre mas, y envidiar lo que pertenece a su projimo. El exito de otro le hace dano en el corazon. Envidia el coche de su vecino, su apartamento, su dinero, su inteligencia, etc. Una mujer esta celosa de la belleza de otra, de sus vestidos, etc. La causa de todo eso es la falta de fe."},{"id":"p108-b8","pageNumber":108,"indexInPage":8,"text":"Quien posee la fe es feliz con lo que tiene en la vida, jamas envidia lo que pertenece a otro y nunca se entristece por sus faltas, pues sabe que cada uno tiene su propia mision y su propia prueba. Tomemos por ejemplo a una persona que tiene una incapacidad fisica, tambien debe creer que este es su estado de perfeccion, es decir que el Creador considera que solamente asi podra llegar a su correccion espiritual."},{"id":"p108-b9","pageNumber":108,"indexInPage":9,"text":"Este hombre, si posee fe, considerara siempre su finalidad, y asi su situacion no le molestara, apenara o debilitara su seguridad en si mismo. El tampoco envidiara a aquellos sanos de cuerpo. El merecera alcanzar altos niveles con todas sus limitaciones, y vera con sus propios ojos como ellas fueron un factor esencial en su exito. Otro ejemplo: un hombre cuya prueba es la fealdad, debe creer que esa misma es su perfeccion, pues el Creador ha visto que no podria alcanzar de otro modo su correccion y perfeccion en este mundo."},{"id":"p108-b10","pageNumber":108,"indexInPage":10,"text":"Podremos entender eso mediante una historia que acontecio unos 2000 anos atras – la historia del gran Sabio y la hija del Cesar: Hace mucho tiempo, existio un gran Sabio llamado Josue, que era una de las personalidades mas grandes y sabias de su generacion, pero era muy feo. Cierta vez paso junto a el la hija del Emperador, y al verlo, se acerco y le pregunto despreciativamente: “¿Como puede tal magnifica sabiduria residir en un recipiente tan feo?”, pues no podia comprender tal contradiccion."},{"id":"p108-b11","pageNumber":108,"indexInPage":11,"text":"Sonrio el Sabio y luego le pregunto: “Dime por favor, ¿como tu padre, el gran Cesar, almacena sus mejores vinos?”. “Que pregunta tan rara, ¡en tinajas de terracota, por supuesto!”, contesto ella. El Sabio le dijo"}],"rawCharCount":4864},{"pageNumber":109,"blocks":[{"id":"p109-b0","pageNumber":109,"indexInPage":0,"text":"asombrado: “¿Pero como?... ¿No es ridiculo que el Emperador Romano, el hombre mas rico del mundo, almacene su vino en simples recipientes de barro? ¡Dile a tu padre que ponga su vino en honorables recipientes de oro, como es adecuado!”. La hija del Cesar estuvo de acuerdo, y ordeno transferir el mejor vino de su padre a tinajas del oro mas puro. Despues de un tiempo, el Cesar pidio un vaso de su vino favorito. El vino estaba completamente acido."},{"id":"p109-b1","pageNumber":109,"indexInPage":1,"text":"El Cesar convoco a su maestro real de vino y exigio una explicacion. “¡Su Majestad”, contesto apabullado el maestro de vino, “la princesa ordeno que transfiriera todo su mejor vino a tinajas de oro!”. El Cesar llamo a su hija y exigio una explicacion. ¡”No es mi culpa, padre!”, lloro, “¡Josue el Sabio me dijo que lo haga!”. Las guardias del Emperador aprendieron al Sabio y lo trajeron al tribunal real."},{"id":"p109-b2","pageNumber":109,"indexInPage":2,"text":"Serenamente, el gran Sabio le conto al Cesar lo que le dijo su hija y anadio: “Su Majestad, le respondi a su hija segun su propio punto de vista. A ella no le gustan los envases feos, pero asi como el vino se conserva solo en un feo recipiente de barro, y se deteriora cuando se lo coloca en un lujoso recipiente de oro, asi tambien la sabiduria reside en mi por merito de mi fealdad. Si yo fuera hermoso ella no podria existir en mi, pues me enorgulleceria y la olvidaria”."},{"id":"p109-b3","pageNumber":109,"indexInPage":3,"text":"A la luz de esta historia aprendemos que el “defecto” de Josue, el gran Sabio, era necesario para que pudiera alcanzar su perfeccion. Puesto que el poseia la fe, sabia que no habia ningun error en la Supervision Divina, y que solo a traves de su fealdad podria alcanzar su finalidad y correccion. Por lo tanto, su apariencia antiestetica no le molestaba para cumplir su mision con alegria y determinacion, y merecio en efecto ser un gran personaje en su tiempo."},{"id":"p109-b4","pageNumber":109,"indexInPage":4,"text":"Si Josue el Sabio no hubiera poseido la fe y hubiera estado celoso de la gente hermosa, gastando su tiempo en la busqueda de la perfeccion fisica, se hubiera transformado en un amargado y frustrado individuo, perdiendo asi la oportunidad de perfeccionar su alma, por algo secundario e insignificante. La Fe y los Rasgos del Carácter – La Envidia #3: No entendemos nada… Sólo el Creador conoce exactamente las necesidades de cada uno, su nivel y en qué etapa de su corrección se encuentra. Por eso..."},{"id":"p109-b5","pageNumber":109,"indexInPage":5,"text":"El Creador es Quien decide El libre albedrio del hombre concierne solo a lo espiritual. El resto de las cosas estan bajo el Decreto del Creador,"},{"id":"p109-b6","pageNumber":109,"indexInPage":6,"text":"segun la necesidad de cada persona. Por lo tanto, el hombre que posee una completa fe no envidia a nadie, pues sabe que el exito de su projimo proviene del Creador segun la correccion de su alma, y no tiene nada que ver con el. Por otro lado, cuando carece de fe, el hombre piensa que el otro consiguio lo que tiene por sus propias fuerzas, inteligencia, talento, buena estrella, y entonces se despiertan los celos en su corazon, “¿por que yo no tuve tanto exito como el?”."},{"id":"p109-b7","pageNumber":109,"indexInPage":7,"text":"Este es un gran error, pues todo el exito en los asuntos mundanos proviene unicamente del Creador y no depende del hombre. Por el contrario, esta misma es la prueba del exitoso, que pese a todo su exito material vivira con la fe que todo le llego del Creador, aunque pareciera ser el resultado de su diligencia y de su trabajo."},{"id":"p109-b8","pageNumber":109,"indexInPage":8,"text":"Resulta, que las dos personas, la que proclama su exito y se enorgullece y la que lo envidia – se equivocan, porque el dominio material depende total y unicamente del Decreto Divino, no dejando ningun sitio al libre albedrio del hombre. “Y en todo lo que hace, tendrá éxito” (Salmos 1:3) Un hombre exitoso en todas sus empresas en forma prodigiosa, llego a tal punto que temia que debido a su gran exito seria victima del “mal de ojo” de los demas. ¿Que hizo?"},{"id":"p109-b9","pageNumber":109,"indexInPage":9,"text":"Invirtio una suma de su dinero de manera que con seguridad lo perderia, con el fin de que la gente de su ciudad viera que no tenia tanto exito, y asi dejarian de admirarlo. No obstante, todos sus esfuerzos fueron vanos, y continuo prosperando contra toda logica. El hombre, quebrado, fue a consultar con su maestro espiritual y le conto su problema. El guia le aconsejo que interrumpa sus esfuerzos, ya que el exito o el fracaso no dependian de el."},{"id":"p109-b10","pageNumber":109,"indexInPage":10,"text":"Si le fue decretado que debia triunfar, incluso si intentara escapar del exito o fracasar intencionalmente – no le serviria para nada... Podemos explicar asi el consejo: el maestro trataba de decirle que si tenia fe y comprendia que su exito dependia del Creador, no debia temer de ningun “mal de ojo”. Porque cuando se cree que todo esta en las manos del Creador, nada podra ayudarle o perjudicarle, sino por Su Decreto."},{"id":"p109-b11","pageNumber":109,"indexInPage":11,"text":"A la inversa, cuando se le es decretado al hombre que no prosperara en un determinado campo, nada de lo que haga lo podra cambiar. Se cuenta de un gran Sabio, al que todas las tentativas de salir de su gran pobreza resultaban un fracaso, y que solia decir con humor: “La pobreza me persigue de tal manera que si"}],"rawCharCount":4871},{"pageNumber":110,"blocks":[{"id":"p110-b0","pageNumber":110,"indexInPage":0,"text":"fuera vendedor de candelas, el sol no se pondria mas; y si vendiera mortajas, la gente dejaria de morir”... No sabemos nada Solo el Creador conoce exactamente las necesidades de cada uno, su nivel y en que etapa de su correccion se encuentra. Por eso, es inutil observar a los demas y envidiarles, porque nunca se puede conocer lo que realmente sucede con lo otros, y si su exito es real o no. Y tambien si su projimo realmente tiene exito, el que esta unido a su finalidad, debe regocijarse por eso."},{"id":"p110-b1","pageNumber":110,"indexInPage":1,"text":"Porque el proposito del Creador en este mundo es que todos alcancen su rectificacion espiritual, por lo tanto, el exito de aquel que sale de su propia oscuridad es para el bien de todos, porque el mundo se desembaraza asi de un promotor de disturbios y confusiones. Si el Creador se regocija con el exito de todo individuo, entonces cada uno de nosotros debe desear el exito de los demas, con el fin de agradar al Todopoderoso."},{"id":"p110-b2","pageNumber":110,"indexInPage":2,"text":"La expresion “Estar contento con lo suyo” significa ser feliz con todo lo que tienes, aunque la cosas no vayan como quieras, pues tienes la fe que lo que pasa es para bien. No envidiar a nadie, estar contento haciendo tu trabajo con alegria, y asi lograr el exito autentico de este mundo – encontrar tu mision en la vida y cumplirla. La Fe y los Rasgos del Carácter – La Avaricia #1: Una de las repercusiones más graves de la tacañería es la del avaro con respecto a su familia."},{"id":"p110-b3","pageNumber":110,"indexInPage":3,"text":"El hombre tacaño no entiende las necesidades de su mujer y sus niños... La avaricia es un rasgo muy grave y cruel. Al hombre avaro le gusta el dinero hasta tal punto que su corazon esta cerrado para sentir el dolor del projimo. A causa de esto se conduce con crueldad, no tiene compasion por las criaturas necesitadas y no se acerca a ayudarles con caridad."},{"id":"p110-b4","pageNumber":110,"indexInPage":4,"text":"Hasta no se da cuenta de su crueldad y cree que la justicia esta de su lado, porque el amor al dinero le enceguece, como esta escrito (Deuteronomio 16:19): “Pues el soborno ciega los ojos de los sabios, y pervierte las palabras de los justos”. El hombre avaro es pues generalmente odiado y todos le maldicen, lo que evidentemente no es una bendicion, ni para su vida ni para su dinero. Existen varios tipos de avaros: Algunos son avaros solo con los extranjeros, no con sus allegados."},{"id":"p110-b5","pageNumber":110,"indexInPage":5,"text":"Algunos se conducen contrariamente: por fuera son gastadores, pues buscan los honores; pero en sus hogares son avaros. Otros son avaros con todo el mundo; pero para su propio placer"},{"id":"p110-b6","pageNumber":110,"indexInPage":6,"text":"estan dispuestos a gastar mucho dinero con gran facilidad, mimandose a si mismos. • Y hay avaros con todo el mundo, que tampoco se permiten sacar provecho del dinero que disponen. Ellos esconden su dinero en algun lugar y, finalmente, todo se pierde o queda para el beneficio de otros. ¡Esto es mío!"},{"id":"p110-b7","pageNumber":110,"indexInPage":7,"text":"El mal rasgo de la avaricia encuentra su fuente en el concepto de “Con mi propia fuerza y el poder de mi mano logre este acierto” – la erronea creencia que el dinero se consigue exclusivamente gracias al esfuerzo del hombre, le hace creer que le pertenece exclusivamente a el, y quiere guardarlo para si mismo. Es la falta de entendimiento que el Creador enriquece y empobrece; que si El quiere que tenga el hombre dinero, aunque lo gaste, siempre seguira teniendolo y no habra nadie que pueda tocarlo, incluso ni un solo centimo."},{"id":"p110-b8","pageNumber":110,"indexInPage":8,"text":"Pero si el Creador no quiere que tenga dinero, ninguna astucia sera util y sus esfuerzos por guardarlo seran vanos. Aunque lo esconda en mil cajas de caudales, El se lo tomara. Un buen marido Una de las repercusiones mas graves de la tacaneria es la del avaro con respecto a su familia. El hombre tacano no entiende las necesidades de su mujer y sus ninos, es cruel con ellos y no responde a sus carencias."},{"id":"p110-b9","pageNumber":110,"indexInPage":9,"text":"Cada gasto en el hogar le parece superfluo, lo que le lleva a encolerizarse con la gente de su casa, renir con ellos y amargarles la vida. No existe una afliccion mas grande para una mujer que la de tener un marido avaro, porque la esposa por naturaleza necesita la influencia de dinero de su marido. Y hasta cuando el marido es tan pobre que no tiene nada para darle, incluso comprendiendo la situacion, esto es muy penoso para ella y le hace quejarse."},{"id":"p110-b10","pageNumber":110,"indexInPage":10,"text":"Con mayor razon, cuando el marido tiene dinero y no es generoso con ella, sino que lo derrocha para si y para otros. Si el esposo creyera en la ensenanza de los Sabios, que afirman que el que honra a su mujer se enriquece, la honraria, le compraria ropa y adornos, no la criticaria y no se encolerizaria por sus gastos, incluso cuando estos son verdaderamente superfluos. Este hombre debe recordar que: a) la ira causa la perdida de la subsistencia, b) honrar a la esposa aporta subsistencia."},{"id":"p110-b11","pageNumber":110,"indexInPage":11,"text":"Tambien ensenaron los Sabios que honrar a la esposa es tan importante a los ojos del Creador, hasta el punto que el hombre debe: “Comer y beber siempre por debajo de sus medios, vestirse y cubrirse según sus medios, y honrar a su mujer y a sus ninos por encima de"}],"rawCharCount":4870},{"pageNumber":111,"blocks":[{"id":"p111-b0","pageNumber":111,"indexInPage":0,"text":"sus medios”. Es este uno de los pocos Preceptos donde el Creador exige que el hombre gaste por sobre sus posibilidades. Hasta para el cumplimiento de un Precepto en forma glorificada, nuestros Sabios ensenaron que el hombre gastara solo hasta un tercio mas de su valor, y en muchos lugares se menciona que la Ley Divina no alienta el gasto del dinero."},{"id":"p111-b1","pageNumber":111,"indexInPage":1,"text":"Sin embargo, honrar a la esposa es tan importante, que el Creador le ordena al hombre que aunque no tenga los medios para hacerlo, no se sienta liberado de su obligacion, sino que haga todo lo posible para honrarla, rezar por ello, perseverar, esforzarse, e incluso pedir prestado, si tiene la posibilidad real para devolverlo, aunque sea con dificultad."},{"id":"p111-b2","pageNumber":111,"indexInPage":2,"text":"Debemos saber que si el marido tiene la profunda voluntad de honrar a su mujer y a sus ninos hasta mas alla de sus posibilidades, el Creador seguramente le ayudara y le dara los medios, porque El le ordeno hacerlo."},{"id":"p111-b3","pageNumber":111,"indexInPage":3,"text":"Lo que no es el caso de otros Preceptos, que incluso si el hombre desea muchisimo cumplirlos por sobre sus posibilidades – por ejemplo, hacer algo muy importante como construir casas de estudios de la Ley Divina y mantener a sus estudiantes – y le pide al Creador que le ayude, no es seguro que su peticion sea aceptada, pues El no le ordeno ejecutar otros Preceptos por encima de sus medios."},{"id":"p111-b4","pageNumber":111,"indexInPage":4,"text":"Por consiguiente, aun cuando el hombre se encuentra en una situacion economicamente dificil, nunca le dira a su esposa: “No tengo dinero”, sino que le dira: “¡Si, esposa mia, te comprare lo que deseas, no ahorrare ningun esfuerzo! Yo voy a rezar por ello, y con la ayuda del Todopoderoso recibiras lo que deseas”. Cuando el Creador vea su autentica voluntad, le ayudara, y merecera honrar a su mujer y a sus hijos por encima de sus posibilidades."},{"id":"p111-b5","pageNumber":111,"indexInPage":5,"text":"La Fe y los Rasgos del Carácter – La Avaricia #2: El hombre poseedor de la fe sabe, que Quien le da la vida, el Creador Mismo, le dará también con qué vivir: vivienda, ropa, alimento... En otras palabras – una pensión completa... Una separación difícil El hombre creyente no es avaro, pues cree y confia en el Creador y no en su dinero. El sabe que hay una regla inmutable: ¡El dinero y el hombre no coexisten – o se le quita el dinero al hombre, o se quita al hombre de su dinero!"},{"id":"p111-b6","pageNumber":111,"indexInPage":6,"text":"Segun esta regla, el que confia en su dinero, se fia de hecho en algo destinado a perderse por una de las dos formas mencionadas: a) O se le quita su dinero – como vemos"},{"id":"p111-b7","pageNumber":111,"indexInPage":7,"text":"todo el tiempo, personas que corrieron y trabajaron duro toda su vida para amontonar dinero y guardarlo preciosamente, finalmente lo perdieron todo y murieron empobrecidos. Todo lo que dejaron a sus herederos fue solo un gran paquete de deudas. b) O se le quita de su dinero – es decir que aunque el dinero quedara, el hombre mismo debera dejarlo atras."},{"id":"p111-b8","pageNumber":111,"indexInPage":8,"text":"Sea simplemente por su muerte, o incluso antes, por no poder aprovecharlo mas, como vemos en el mundo de los multimillonarios cuando sufren todo tipo de enfermedades, y estan entonces incapacitados de sacar provecho de su dinero. Ellos admiten abiertamente que preferirian la salud a la riqueza, la cual no puede salvarles de su desgracia. Resulta que ellos destruyeron su salud por amontonar su fortuna y ahora la gastan toda para retornarla."},{"id":"p111-b9","pageNumber":111,"indexInPage":9,"text":"Pensión completa El hombre poseedor de la fe sabe, que Quien le da la vida, el Creador Mismo, le dara tambien con que vivir: vivienda, ropa, alimento... En otras palabras – una pension completa. Por lo tanto, el sabe que mientras el Creador desea que viva, no tiene de que preocuparse; pero tambien cuando el Creador quiera que muera, no tiene que preocuparse, pues todo el dinero del mundo no podra salvarlo. ¿Acaso podra el hombre sobornar con dinero al Angel de la muerte para que lo deje vivir?"},{"id":"p111-b10","pageNumber":111,"indexInPage":10,"text":"Resulta entonces, que el hombre creyente vive apacible y tranquilamente gracias a su fe, pues sabe que el mundo posee un buen “Director General” que se preocupa por el y por todas las ademas criaturas. El Creador goza de tu alegría El hombre creyente sabe, que Quien le ha dado el dinero hoy, puede darselo tambien manana, por lo tanto, no tiene miedo de gastarlo. Y no solo no es avaro, sino que es feliz de usar su dinero para todas sus necesidades, porque cree que es precisamente para eso que el Creador se lo ha dado."},{"id":"p111-b11","pageNumber":111,"indexInPage":11,"text":"En cambio, el hombre carente de fe tiene miedo de utilizar su dinero, pues teme que no le quedara para el dia siguiente. Sobre este tipo de persona han dicho los Sabios: “Todo aquel que tiene pan en su cesta y se pregunta „¿Que comere manana?‟, es un hombre de muy poca fe”. Debemos saber que el Creador Mismo tiene complacencia y gozo cuando el hombre utiliza su dinero con alegria. ¿A que es esto comparable? Al padre que le da dinero a su hijo querido, con el fin de que viva bien y que no le falte nada."},{"id":"p111-b12","pageNumber":111,"indexInPage":12,"text":"Cuando un padre ve que su hijo utiliza su dinero para comprar las cosas que necesita"}],"rawCharCount":4814},{"pageNumber":112,"blocks":[{"id":"p112-b0","pageNumber":112,"indexInPage":0,"text":"y que lo complacen, y al mismo tiempo trata de alegrar a sus hermanos, esto le causa un gran regocijo, pues todo padre goza sabiendo que sus hijos estan contentos. Tambien tiene la satisfaccion que su hijo sabe que le contenta con su alegria y que cuando el dinero se acabe, su padre le dara mas. Pero si ve que su hijo vive en la pobreza, restringiendose y sin sacar provecho del dinero que recibio, el padre se aflige y piensa: ¿Para que le di dinero, sino para que viva bien y que no le falte nada?"},{"id":"p112-b1","pageNumber":112,"indexInPage":1,"text":"¿Por que vive en la pobreza y en la escasez? Como se entiende, lo mismo ocurre con el Creador, nuestro Padre en el Cielo. Cuando nos da dinero, es para que vivamos ampliamente y para que tambien abramos nuestra mano a nuestros hermanos. Esta es Su Voluntad y Su placer, que el hombre utilice su dinero alegremente. No obstante, hay gente a la que le fue decretado vivir en la pobreza, y es esta tambien Su Voluntad, pues es lo mejor para ellos segun la correccion que sus almas necesitan."},{"id":"p112-b2","pageNumber":112,"indexInPage":2,"text":"Pero a quien esto no le fue decretado y tiene dinero, y a pesar de ello limita sus gastos viviendo una vida de miseria – causa pena al Creador. La Fe y los Rasgos del Carácter – La Avaricia #3: Quien tiene fe sabe, que todo lo que posee y el dinero que le llega, no le pertenece, sino que le es entregado por el Creador para que lo utilice correctamente según la fe..."},{"id":"p112-b3","pageNumber":112,"indexInPage":3,"text":"Gastos reconocidos En el mismo instante que el hombre gasta dinero para el cumplimiento de un Precepto Divino, incluyendo el honrar a su mujer y a sus hijos, se revela su confianza en el Creador y no en su dinero. Ese hombre sabe que debido a que gasto dinero para cumplir con la Voluntad Divina, con seguridad no se le causara ninguna privacion."},{"id":"p112-b4","pageNumber":112,"indexInPage":4,"text":"Un hombre que da caridad, es considerado como quien presta al Creador Mismo, como esta escrito (Proverbios 19:17): “El que es benevolente para con los pobres – presta al Eterno”, y el Creador debe reembolsarle ese dinero. Es una de las razones por las cuales el que dona el “diezmo”, la decima parte de sus ganancias, tiene el merito de enriquecerse, porque al ser caritativo con el dinero que el Creador le da, El continua prodigandole Sus beneficios."},{"id":"p112-b5","pageNumber":112,"indexInPage":5,"text":"Existe tambien la regla siguiente: “Todo el que se compadece de las criaturas, se compadecen de el en el Cielo”. En el Cielo se conducen con el hombre “medida por medida”, por lo tanto, si el hombre se comporta cruelmente, se conducen con el tambien asi desde lo Alto, y la"},{"id":"p112-b6","pageNumber":112,"indexInPage":6,"text":"Misericordia Divina se aparta de el. Entonces seguro que conocera grandes desgracias a causa de su crueldad, y no podra gozar mas de su dinero. En resumen, el hombre creyente siente alegria al gastar su dinero en todo lo que conforma la Voluntad del Creador. Un depositario fiel Quien tiene fe sabe, que todo lo que posee y el dinero que le llega, no le pertenece, sino que le es entregado por el Creador para que lo utilice correctamente segun la fe."},{"id":"p112-b7","pageNumber":112,"indexInPage":7,"text":"Desde luego, como todo depositario fiel, ese hombre sopesa convenientemente como utilizar ese dinero segun la Voluntad de su Dueno. Cuando el Creador comprueba que es un depositario fiel y que utiliza el dinero correctamente, lo designa intermediario de la abundancia y de la Misericordia para Sus criaturas. Deposita en este hombre dinero para que lo distribuya convenientemente – una parte para la subsistencia de su familia, y la otra para las necesidades de los demas."},{"id":"p112-b8","pageNumber":112,"indexInPage":8,"text":"Sin embargo, un hombre cuya fe esta ausente o es debil, cree que el dinero es un bien propio, que lo puede utilizar como le plazca y no lo distribuye a quien lo necesita, entonces el Creador ve que es imposible confiar en el, y decide a veces recuperar ese dinero para depositarlo en las manos de otra persona. La siguiente historia demostrara lo antedicho: Un dia, un gran maestro espiritual recibio la visita de un pobre hombre que debia casar a su hija y necesitaba una gran suma de dinero."},{"id":"p112-b9","pageNumber":112,"indexInPage":9,"text":"El maestro lo envio a la casa de un hombre rico con una carta, donde le pedia darle al pobre la suma que necesitaba para casar a su hija. El pobre se presento al hombre adinerado y le entrego la carta, este, al leerla, se ofendio y enfurecio. Luego se volvio hacia el pobre con rabia y le dijo: “¿Quien se cree que es tu maestro para exigir una suma tan importante de mi dinero? ¿Y por que tengo que obedecerle?"},{"id":"p112-b10","pageNumber":112,"indexInPage":10,"text":"¡Si me pidiera cortesmente darte una suma mas razonable, lo comprenderia, pero el me ordena lisa y llanamente darte esta suma, como si fuera el propietario de mi dinero! Ve y dile que no estoy obligado a obedecerle”. El pobre salio avergonzado de la casa, volvio a su maestro y le conto lo sucedido. El Justo suspiro, y le ordeno ir a casa de uno de sus discipulos y decirle que le ordenaba darle una determinada suma, la cual era mucho mas pequena que la pedida al hombre adinerado."},{"id":"p112-b11","pageNumber":112,"indexInPage":11,"text":"El hombre pobre se acerco a la casa del discipulo y vio que vivia en una casa ruinosa. Era evidente que no podria darle incluso una suma tan"}],"rawCharCount":4878},{"pageNumber":113,"blocks":[{"id":"p113-b0","pageNumber":113,"indexInPage":0,"text":"pequena. Sin embargo, cumplio lo mandado, entro en la casa y le transmitio las palabras del Justo. Tan pronto como el discipulo escucho que el maestro le ordeno darle al pobre esa suma, se levanto con diligencia y exclamo: “¡Seguro, seguro! ¡El Justo lo ordeno! ¡Voy a ver que puedo hacer! Sientate aqui y descansa; voy a recolectar el dinero que necesitas”. Inmediatamente informo a su mujer la orden del maestro."},{"id":"p113-b1","pageNumber":113,"indexInPage":1,"text":"Hablaron entre ellos durante unos minutos y decidieron que ella buscaria en la casa algo para vender y que durante ese tiempo, el se apresuraria a invitar a los habitantes y comerciantes de la ciudad, a participar en el cumplimiento del Precepto de ayudar a realizar la boda de una joven pobre. Dos horas mas tarde, el discipulo volvio y en sus manos traia una considerable suma."},{"id":"p113-b2","pageNumber":113,"indexInPage":2,"text":"La junto con el dinero que su mujer habia conseguido a cambio de la venta de objetos de plata que tenian desde su matrimonio, y he aqui – el dinero recolectado correspondia exactamente a la suma que el maestro habia ordenado dar al hombre pobre. El discipulo y su mujer se regocijaron mucho por haber tenido la oportunidad de cumplir ese gran Precepto, satisfaciendo al mismo tiempo la voluntad del Justo. El pobre tambien estaba muy feliz por el buen corazon y la generosidad de la pareja."},{"id":"p113-b3","pageNumber":113,"indexInPage":3,"text":"Fue a recolectar el dinero que todavia le faltaba y, poco tiempo despues, pudo casar a su hija dignamente. Despues de un tiempo, aumento la buena suerte del discipulo que tan prontamente ayudo, comenzo a tener exito en todas sus empresas y se hizo muy rico. En cuanto al hombre rico que no obedecio al Justo, tuvo un reves de fortuna hasta perder finalmente sus propiedades y, poco tiempo despues, se empobrecio."},{"id":"p113-b4","pageNumber":113,"indexInPage":4,"text":"Entonces su mujer le dijo: “Todo esto es en castigo por haber desobedecido al gran maestro espiritual, y por haberte comportado insolentemente. Anda a verlo y pidele perdon, tal vez esto lo apaciguara y nuestra situacion y sustento mejoraran”. El hombre escucho a su mujer y se apresuro a visitar al Justo, avergonzado y con la cabeza baja. El maestro lo recibio con benevolencia y le pregunto la razon de su visita. El rico caido en desgracia le dijo: “Mi senor, perdoname por haberte deshonorado y ofendido”."},{"id":"p113-b5","pageNumber":113,"indexInPage":5,"text":"El Justo le respondio: “¿De que ofensa estas hablando?”. “Desprecie la orden de su senoria”, respondio el hombre, “me negue a darle al pobre la suma que necesitaba, y por eso he sido castigado con la"},{"id":"p113-b6","pageNumber":113,"indexInPage":6,"text":"pobreza”. Le dijo el maestro: “Ah... ¿eso?, no es un castigo, sino que abusaste de tu cargo”. “¿Abuse de mi cargo? ¡¿Que cargo?!”, pregunto el hombre asombrado. “Voy a contarte algo”, replico el maestro. “Antes que mi alma descendiera a este mundo, quisieron en el Cielo darme riquezas y que viva con fortuna y honores. No obstante, me negue, alegando que al ocuparme del dinero y los bienes habria reducido el tiempo necesario para servir al Creador, y por eso no deseaba esa riqueza."},{"id":"p113-b7","pageNumber":113,"indexInPage":7,"text":"Sin embargo, en el Cielo me dijeron que no tenia eleccion y que estaba obligado a descender a este mundo con una gran suma de dinero. Me empecine, porque de ningun modo estaba dispuesto a vivir una vida de rico, yo me satisfago con poco, mi solo deseo era servir al Creador, ¿por que tengo que sufrir las preocupaciones del rico?"},{"id":"p113-b8","pageNumber":113,"indexInPage":8,"text":"El Tribunal Celeste delibero sobre mi problema y eventualmente propuso que yo escogiera un alma en la que queria que mi riqueza fuera depositada... yo te escogi a ti, asi que en realidad toda la riqueza de la que disponias me pertenecia. Pero, cuando yo he necesitado una suma importante para darsela al pobre, te lo envie, pero te negaste a darle de mi dinero que te fue depositado..."},{"id":"p113-b9","pageNumber":113,"indexInPage":9,"text":"Por lo tanto, cuando comprobe que tu no eras un depositario fiel de mi dinero, escogi depositar mi riqueza en mi discipulo, porque comprobe que feliz era al cumplir mi voluntad, hasta el punto de sacrificarse para cumplir el Precepto de la caridad”. El hombre rico se arrepintio por su mala conducta y rogo al Justo: “¡maestro, maestro! ¡Toda mi vida he estado acostumbrado a una vida facil, y esta pobreza me vuelve loco! ¿No tendrias algo de sustento para darme y ahorrarme la humillacion de la miseria?”."},{"id":"p113-b10","pageNumber":113,"indexInPage":10,"text":"El Justo le sonrio, apelo al discipulo que se habia enriquecido y le ordeno concederle al rico en desgracia un apoyo financiero mensual, con el fin de que viva con alivio el resto de sus dias. Asi, retorno el hombre a su hogar, satisfecho y con el corazon alegre despues de aprender una buena leccion de caridad. La Fe y los Rasgos del Carácter – La Humildad #1: Se equivocan mucho en el mundo respecto al verdadero significado de la humildad."},{"id":"p113-b11","pageNumber":113,"indexInPage":11,"text":"La auténtica humildad no consiste en pensar: “No tengo ningún valor”… El gran error Se equivocan mucho en el mundo respecto al verdadero significado de la humildad. La autentica humildad no consiste en pensar: “No tengo ningun valor”, su significado es"}],"rawCharCount":4805},{"pageNumber":114,"blocks":[{"id":"p114-b0","pageNumber":114,"indexInPage":0,"text":"que el hombre reconoce sus cualidades, pero sabe que todo le proviene del Creador. La autentica humildad consiste tambien en reconocer nuestras carencias, nuestra bajeza y nulidad, sabiendo que las podemos colmar solo con la ayuda del Creador. El hombre humilde sabe que su mision en este mundo es rectificar esas carencias, y entonces esta feliz con lo suyo. Cuando tenemos exito, debemos evidentemente regocijarnos, pues el Creador nos ayudo."},{"id":"p114-b1","pageNumber":114,"indexInPage":1,"text":"Es muy importante, que cada uno considere sus triunfos y sus cualidades sabiendo que el Creador le prodigo el exito, y seguir siempre pidiendo Su ayuda, con plegaria y humildad. Aun cuando fracasamos o vemos todas nuestras carencias, no debemos perder la cabeza, sino saber que el Creador nos muestra nuestra situacion con el fin de despertarnos a la realidad que Lo necesitamos. Eso debe estimularnos a rechazar el concepto que lo que logramos es “Con mi propia fuerza y el poder de mi mano”, y reforzarnos en la plegaria."},{"id":"p114-b2","pageNumber":114,"indexInPage":2,"text":"Es entonces cuando el Todopoderoso nos ayuda facilmente. Por regla general, el orgullo significa que el hombre se aparta del Creador y que considera solo su “yo”. Cuando tiene exito se enorgullece porque “yo triunfe”, y con su fracaso se desmorona porque “yo fracase”. Pero la humildad significa que el hombre relaciona todo con el Creador: en sus exitos Le agradece, y en sus fracasos Le reza. ¡Hay que recordar bien que el Creador no viene con quejas a Sus criaturas!"},{"id":"p114-b3","pageNumber":114,"indexInPage":3,"text":"Pues “Cada dia la Mala Inclinacion se intensifica en el hombre, y si no fuera por la ayuda del Todopoderoso, no podria dominarla”. El Creador sabe que el hombre no es un angel y Su unico reproche despues de cada transgresion es: “¿Por que no pediste Mi ayuda? ¿Por que creiste que podrias vencer solo a tu Mala Inclinacion?”. Por consiguiente, el hombre que fracasa, aunque haya cometido el pecado mas grave, debe acordarse ante todo que “arrepentirse” no significa culparse y caer en la tristeza."},{"id":"p114-b4","pageNumber":114,"indexInPage":4,"text":"El “arrepentimiento” significa la confesion al Creador, el remordimiento y la peticion de perdon; lo que es imposible de realizar sin la alegria. Por eso, ante todo, debe el hombre decirse: “„¡No hay mas nada fuera de El!‟. El Creador quiso demostrarme que nada puedo sin El, porque El me ama y quiere que este cerca Suyo. Fui sin El y mira donde cai... Pero, ahora que fracase, ¿que quiere el Creador de mi?, ¿que me embargue la tristeza?, ¿que me sienta culpable? Conducirme"},{"id":"p114-b5","pageNumber":114,"indexInPage":5,"text":"de esa manera es como si yo fuera una realidad independiente, como si las cosas estuvieran en mis manos; pensar asi, es como volver al mismo error por el cual fracase, es decir vivir sin El. ¿O acaso El quiere que me esfuerce en estar alegre, en creer que El es la Unica Existencia, lo que me conducira a la oracion y al arrepentimiento?”. Luego dira: “¡Dueño del Mundo! Te agradezco por mostrarme que no puedo hacer nada sin Ti. Ayúdame para que desde ahora en adelante tenga el mérito de no olvidarte nunca."},{"id":"p114-b6","pageNumber":114,"indexInPage":6,"text":"Que te pida toda cosa que necesito y no emprenda nada sin la plegaria”. Es solo despues, cuando el hombre esta alegre y su cerebro liberado y cuerdo, que puede abordar su trabajo de arrepentimiento y su examen de conciencia, sin culpa ni tristeza, solo pidiendo y rogando al Creador que le ayude en el futuro a cumplir Su Voluntad. Que El le permita, con Su Bondad, relacionarse y conectarse con la fe, que su luz le alumbre, pues mediante ella podra salir de la oscuridad, y que le de a su corazon el puro temor y el amor a Di-s."},{"id":"p114-b7","pageNumber":114,"indexInPage":7,"text":"Con el fin de ilustrar lo que precede, traeremos la semana que viene una historia contada por el gran Justo Rabi Najman de Breslev. Hay que saber que el conocimiento de la mente no basta para eliminar nuestros defectos de carácter, sino que debemos hacer penetrar el intelecto en nuestro corazón… La Fe y los Rasgos del Carácter – Conclusión: Aprendimos la gravedad de los malos rasgos y como todos provienen de la falta de fe. Tambien aprendimos que maravillosas son las buenas cualidades y como se basan en la fe."},{"id":"p114-b8","pageNumber":114,"indexInPage":8,"text":"Practicamente, seria posible escribir un libro entero sobre cada rasgo. Sin embargo, nos fiamos del entendimiento del lector, que comprendera por si mismo como la fe es la via abierta a la rectificacion de todos los malos rasgos y a la adquisicion de las buenas cualidades."},{"id":"p114-b9","pageNumber":114,"indexInPage":9,"text":"Para permitirles trabajar sobre todos los rasgos del caracter y corregirlos, mencionaremos aqui brevemente los puntos de la fe que conciernen a estos rasgos que no desarrollamos: El Orgullo – El creyente no tiene orgullo, porque sabe que todo lo que tiene y todos sus exitos, son un regalo del Creador. El Apetito de Comer – El creyente no esta preso de su apetito, porque sabe perfectamente que el Creador es Quien le da vida, no el alimento."},{"id":"p114-b10","pageNumber":114,"indexInPage":10,"text":"La Confianza – El creyente tiene confianza total en el Creador, porque lo esencial de la fe es creer que El le supervisa de la mejor forma"}],"rawCharCount":4817},{"pageNumber":115,"blocks":[{"id":"p115-b0","pageNumber":115,"indexInPage":0,"text":"posible, y que se encuentra en buenas manos. La Indulgencia – El creyente es siempre indulgente, porque sabe que la Voluntad del Creador es que asi se conduzca. Por eso siempre tiene exito, pues el Creador esta con el. La Alegría – El creyente esta siempre alegre, porque la fe significa creer que no existe mal en el mundo, ni tampoco la privacion; todo es bueno y todo es para bien. La Lisonja – El creyente esta alejado de toda lisonja, porque sabe que los hombres son solo titeres en las manos del Creador."},{"id":"p115-b1","pageNumber":115,"indexInPage":1,"text":"Por eso, el no teme ni adula a nadie, pues le es evidente que todos se encuentran en las manos del Creador y que solo El decide su vida. Los Honores – El creyente no desea los honores y no los busca, porque sabe que todo el honor pertenece al Creador. La Maledicencia – El creyente no difama y no habla de nadie en absoluto, porque conoce su sitio como criatura, que no puede decidir ni juzgar quien es una buena persona y quien no."},{"id":"p115-b2","pageNumber":115,"indexInPage":2,"text":"El sabe que el mundo posee un Gobernante, y una de Sus funciones es juzgar a Sus criaturas; por eso, se niega a juzgar a los hombres y hablar de ellos, tomando el papel del Creador. La Polémica y la Disputa – El creyente esta alejado de toda disputa y conflicto, porque acepta las pruebas que pasa como provenientes del Creador. Por consiguiente, no se deja arrastrar ni se complica en una polemica, sino que huye hacia el Todopoderoso y asi acaba la disputa."},{"id":"p115-b3","pageNumber":115,"indexInPage":3,"text":"La Paciencia – El creyente es paciente en la vida, paciente consigo mismo, y paciente con los demas. Tiene paciencia hasta que le lleguen las cosas que necesita, pues sabe que todo – cuando y como, ya sea respecto a las cosas materiales o espirituales – son determinadas por el Creador. Del cerebro al corazón Abordamos ahora el metodo practico para trabajar sobre los distintos rasgos y corregirlos."},{"id":"p115-b4","pageNumber":115,"indexInPage":4,"text":"Hay que saber, que el conocimiento de su mente no basta para eliminar los defectos, sino que el hombre debe hacer penetrar el intelecto en su corazon, como esta escrito (Deuteronomio 4:39): “Sabe hoy y lleva a tu corazon”. “Sabe hoy” – es el conocimiento del cerebro, y luego “lleva a tu corazon” – significa introducir ese conocimiento en el corazon. Porque todo el tiempo que el conocimiento queda solo en el intelecto, no es un conocimiento completo y el hombre no se conduce segun el."},{"id":"p115-b5","pageNumber":115,"indexInPage":5,"text":"Es solamente cuando se introduce el conocimiento dentro del corazon, que se puede corregir el mal rasgo, porque el corazon es"},{"id":"p115-b6","pageNumber":115,"indexInPage":6,"text":"el “dibujante” de los rasgos del caracter. La evidencia es que mucha gente inteligente y hasta genios poseen malos rasgos, y algunos hasta tienen rasgos absolutamente corruptos, debido a su corazon impuro y sucio. En cambio, muchas veces hay personas simples, que no son sabias, pero que poseen cualidades maravillosas a causa de su corazon puro y limpio. El camino para introducir el conocimiento del cerebro al corazon, es el estudio y la repeticion de todo lo que ha sido dicho a proposito del rasgo que se quiere corregir."},{"id":"p115-b7","pageNumber":115,"indexInPage":7,"text":"Cuando deseamos trabajar sobre la rectificacion de un determinado mal rasgo que poseemos, debemos estudiar en los libros todo lo relacionado con la ignominia de esa caracteristica y la ventaja de lo contrario. Y por supuesto, por lo que aprendimos que la raiz de todas las buenas cualidades es la fe, estudiaremos seriamente las reglas de la fe que conciernen a ese rasgo. Debemos insistir en nuestro estudio hasta que eche raices en nuestro corazon."},{"id":"p115-b8","pageNumber":115,"indexInPage":8,"text":"Luego, rezaremos por cumplir lo aprendido, porque sobre todo lo que se quiere cambiar, lo esencial es la plegaria. Ademas, debemos juzgarnos cada dia hasta que punto hemos llegado en nuestro trabajo. Por cada exito que hemos conseguido en dominar el mal rasgo, hasta el mas pequeno, debemos agradecer al Creador. Y en lo que hemos fallado, comprenderemos que todavia nos faltan muchas plegarias."},{"id":"p115-b9","pageNumber":115,"indexInPage":9,"text":"Entonces nos confesaremos al Creador, Le pediremos perdon, y Le imploraremos que nos de el merito de rezar la cantidad de plegarias necesarias para eliminar definitivamente nuestro mal atributo, sin fallar nunca mas. En efecto, cuando se reza por algo, se introduce el conocimiento intelectual dentro del corazon, lo que significa obtener un conocimiento completo."},{"id":"p115-b10","pageNumber":115,"indexInPage":10,"text":"Entonces, empezamos a vivir en la realidad lo estudiado y nos conducimos segun ese conocimiento, esto es lo que se llama tener buenos rasgos, que se manifiestan en el gozo de una vida muy bella y feliz. Una mente clara, fuerte y firme No obstante, muchos se quejan que aun despues de escuchar las ensenanzas, de estudiar e incluso despues de muchas plegarias, no cambian en absoluto."},{"id":"p115-b11","pageNumber":115,"indexInPage":11,"text":"Por ejemplo, una persona se quejo de haber escuchado un CD sobre la ira, de haber considerado las ensenanzas sobre el tema, y que desde hace mucho tiempo reza para eliminar este defecto; sin embargo, no parece que las plegarias tengan"}],"rawCharCount":4766},{"pageNumber":116,"blocks":[{"id":"p116-b0","pageNumber":116,"indexInPage":0,"text":"efecto. A pesar que reza pidiendo no ceder a la colera, se enoja todo el tiempo. ¿Que hacer? ¿Que sucede aqui en realidad? ¿Cual es el problema? ¿Que le falta a esta persona que no puede cambiar a pesar de sus rezos? La respuesta es la siguiente: la falta de claridad y serenidad mental, la falta de un conocimiento lucido. Al obtenerlo, el hombre logra cambiar y retornar a su Creador. Esta es la pieza faltante en el culto del hombre. Pero, ¿como se logra la claridad mental?"},{"id":"p116-b1","pageNumber":116,"indexInPage":1,"text":"¿Como se llega a tal estado mental que nos conducira al cambio esperado? Para comprender esto, debemos comentar la siguiente ensenanza del Justo de Breslev sobre este tema: “La esencia de una mente serena, es reflexionar y pensar sanamente cual es la finalidad de todos los apetitos y de todos los asuntos mundanos… Es necesario que el hombre se esfuerce para consagrar un tiempo para meditar sobre las acciones que emprende, y preguntarse si es conveniente malgastar sus dias en tales actos."},{"id":"p116-b2","pageNumber":116,"indexInPage":2,"text":"Debido a que el hombre no reflexiona sobre eso – no tiene conocimiento, incluso si alcanza a veces una cierta claridad mental, no le dura y desaparece enseguida; y tambien si el poco conocimiento que si tiene no es fuerte y firme, no entiende las tonterias de este mundo. Sin embargo, si el hombre gozara de una mente clara fuerte y firme, comprenderia que todo es solo tonteria y vanidad...”. ¡Extraemos de aqui una instructiva definicion! “El hombre que no reflexiona – no tiene conocimiento”."},{"id":"p116-b3","pageNumber":116,"indexInPage":3,"text":"Es decir que el hombre sólo tiene conocimiento cuando logra claridad mental. Si lo pensamos, esto es realmente muy comprensible, pues el estado de confusion no puede llamarse conocimiento. Debemos comprender que todas las confusiones – la enorme cantidad de pensamientos y consejos contradictorios que el hombre posee, todos sus cambios de opinion – todo esto define la falta de conocimiento, la falta de una mente sana."},{"id":"p116-b4","pageNumber":116,"indexInPage":4,"text":"Poseer conocimiento implica saber claramente cual es la verdad de cada situacion; cual es la finalidad; que es lo que se debe hacer y cual es el camino justo. Y aun cuando existen ciertas cosas que no le son claras al hombre, pero por lo menos tiene conciencia de eso, y sabe que debe aclararlas y determinar de que tratan, esto tambien es considerado claridad mental, pues sabe que en tal o cual dominio, todavia ignora donde esta la verdad."},{"id":"p116-b5","pageNumber":116,"indexInPage":5,"text":"Entonces, toda persona que reza para rectificar su ira, o por la paz domestica, o por la alegria, o por"},{"id":"p116-b6","pageNumber":116,"indexInPage":6,"text":"cuidar su mirada, o por toda otra cosa, debe obtener claridad y serenidad mental antes de su plegaria. Debe obtener el conocimiento que es el resultado de “una mente clara, fuerte y firme”, y asi reconocera cual es la verdad y cual es la Voluntad Divina, de tal modo que nada en el mundo podra desviarlo de eso. Es solo entonces que debera rezar y pedir al Creador el merecer vivir segun ese conocimiento. La explicacion de lo que precede es simple: la accion de la plegaria consiste en hacer penetrar el conocimiento dentro del corazon."},{"id":"p116-b7","pageNumber":116,"indexInPage":7,"text":"Si el hombre no medita como se debe y no tiene claridad mental – lo que se manifiesta en que esta todavia preso de confusiones y de dudas sobre cual es la verdad – entonces cuando ruega, introduce un conocimiento confuso dentro de su corazon. Por consiguiente, fracasa en la prueba... Aunque rece, la Mala Inclinacion lo atrapa y lo controla en donde todavia tiene dudas. En cambio, cuando el hombre posee bien claro en su mente lo que introduce en su corazon por medio de la oracion, esto se llama que posee el conocimiento."},{"id":"p116-b8","pageNumber":116,"indexInPage":8,"text":"Y como dijeron los Sabios, “Si conocimiento adquiriste, ¿que mas te falta?...”. La Mala Inclinacion no puede apoderarse del hombre que vive segun un claro conocimiento y derribarlo. ¿A que es esto comparable? A un hombre que construye un muro para protegerse de sus enemigos. Si es perfecto y sin fallas, sera eficaz y le protegera ante toda tentativa de asalto. Sin embargo, si este muro tiene grietas en varios lugares, aunque sea grueso y solido, el enemigo penetrara por ellas y el muro no servira para nada."},{"id":"p116-b9","pageNumber":116,"indexInPage":9,"text":"Tal como esta escrito (Proverbios 25:28): “Como una ciudad derribada y sin muralla, es el hombre cuyo espiritu no tiene restricciones”. La mente es el muro del hombre. Un muro frente a todos los apetitos y confusiones. Cuando el hombre medita y aclara su mente introduciendo ese conocimiento en el seno de su corazon, es como si construyera una pared perfecta. Pero cuando no lo hace, aunque rece, construye un muro con grietas, y no debe sorprenderse si todavia cede a los malos rasgos."},{"id":"p116-b10","pageNumber":116,"indexInPage":10,"text":"Tomemos otra vez el ejemplo de la ira: aunque el hombre reza verdaderamente para superarla, ¡si es honrado consigo mismo, reconocera que en el mismo momento en que rogaba, todavia no estaba seguro que nada en el mundo le encolerizaria! Y si medita sobre esto, vera que segun su conocimiento todavia existen casos en los"}],"rawCharCount":4809},{"pageNumber":117,"blocks":[{"id":"p117-b0","pageNumber":117,"indexInPage":0,"text":"cuales siente la necesidad, incluso hasta un deber o una obligacion, de enojarse. Resulta entonces que no reza por esos casos, sino pide no encolerizarse solamente en aquellos en que a él le parece que es necesario. El Creador ciertamente le ayudara en las situaciones sobre las cuales rezo, mientras que en aquellas en que no le esta claro que esta prohibido ceder a la colera no le ayudara, pues en esos casos no pidio nada, ¡porque según su conocimiento esas situaciones no responden a la definición que la ira está prohibida!"},{"id":"p117-b1","pageNumber":117,"indexInPage":1,"text":"No
