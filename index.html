 acercarlo al Creador, no alejarlo."},{"id":"p16-b8","pageNumber":16,"indexInPage":8,"text":"En conclusión, como ya dijo uno de los grandes Justos: “El que tiene fe – su vida es vida. Este Hombre disfruta siempre de sus días. Cuando le va como desea – por supuesto se siente bien, y Cuando no es así y hasta tiene sufrimientos, también está bien, pues está seguro que de todas Maneras el Creador se compadecerá del mas adelante y finalmente todo mejorara. Porque en Vista que todo proviene del Creador, por supuesto que todo es para bien. Pero, el que no Tiene fe, su vida no es vida en absoluto."},{"id":"p16-b9","pageNumber":16,"indexInPage":9,"text":"En el momento que le sucede una desgracia, pierde toda Su vitalidad. No tiene con qué consolarse y animarse, no puede ver nada bueno pues vive sin el Creador y sin Su Supervisión. Pero si tuviera fe, que buena y hermosa podría ser su vida...”. Para el hombre creyente – que sabe que es un ser creado – la vida es fácil y muy Agradable. Él se esfuerza por cumplir su misión y trata de entender cuál es la voluntad de Quien lo envió…"},{"id":"p16-b10","pageNumber":16,"indexInPage":10,"text":"“El Eterno reprende a quien ama” Está escrito en el sagrado libro del Zohar como se conduce el Creador con el que ama: “A quien El Creador ama, lo reprende para guiarlo por el camino recto. Como el padre que ama, a su hijo, Y por su amor, está siempre la vara en su mano para dirigirlo por el recto camino, para que no se Desvié a la derecha o a la izquierda. Como está escrito (Proverbios 3:12): „Porque el"}],"rawCharCount":4641},{"pageNumber":17,"blocks":[{"id":"p17-b0","pageNumber":17,"indexInPage":0,"text":"Eterno Reprende a quien ama, como un padre al hijo en quien se complace‟. Y a quien el Creador no Ama, retira de él la reprimenda, retira del su vara…”. Pero para el hombre creyente – que sabe que es un ser creado – la vida es fácil y muy Agradable. Él se esfuerza por cumplir su misión y trata de entender cuál es la voluntad de Quien Lo envió. Para este hombre no se necesita grandes sufrimientos para dirigirlo a su finalidad, pues Con pequeñas tribulaciones y algunas pocas insinuaciones se lo estimula a andar por el buen Camino."},{"id":"p17-b1","pageNumber":17,"indexInPage":1,"text":"Pero el hombre que no posee fe e ignora que es solo un ser creado que ha sido enviado a este Mundo para cumplir una determinada misión, y que no es el dueño de su vida y no puede decidir Solo que hacer en este mundo, su vida está llena de sufrimientos. El Creador, debido a Su gran Amor hacia él, no cede y lo golpea con Su vara más y más para estimularlo y para que decida Tomar conciencia de sus insinuaciones buscando su misión."},{"id":"p17-b2","pageNumber":17,"indexInPage":2,"text":"Y en verdad, eso es un gran favor Del Creador, porque quien no se despierta de todos los golpes y sufrimientos Él le manda para Enderezarlo, pobre de él y de su alma, ya que El deja de corregirlo y reprenderlo, abandonándolo A vivir en equivocación, lo que indica, según el Zohar, que el Creador no le ama."},{"id":"p17-b3","pageNumber":17,"indexInPage":3,"text":"“Tu vara y Tu cayado” (Salmos 23:4) El modo de proceder del Creador es llamar al hombre inmediatamente cuando ve que perdió la Senda de la prudencia, para que vuelva al buen camino. A cada uno según su condición: esta al Que llama con alusiones, esta al que llama directamente, y esta el que es golpeado y pateado… Y como han dicho los Sabios: “Al inteligente – una insinuación, al tonto – una piedra…”."},{"id":"p17-b4","pageNumber":17,"indexInPage":4,"text":"En consecuencia, incluso las más difíciles privaciones – todas son para el bien del hombre, Porque solo el Creador sabe cuál es el camino y el objetivo al que necesita llegar aunque a el Mismo le está oculto. Por eso algunas veces el Creador debe interrumpir los planes que hizo el Hombre y bloquearle caminos para obligarlo a dirigirse en la correcta dirección, para que no se Pierda. Todo el trabajo del hombre es encontrar en lo que le sucede, que es lo que el Creador quiere de Él; que le insinúa y a que finalidad le dirige y le guía."},{"id":"p17-b5","pageNumber":17,"indexInPage":5,"text":"A pesar que puede parecerle lo que le pasa Como una privación o una pena, e"},{"id":"p17-b6","pageNumber":17,"indexInPage":6,"text":"incluso a veces sienta que le destruyeron su mundo, en Realidad, esa privación es realmente una perfección, porque solo por ella el merecerá – si la Recibirá Con fe – llegar a la buena finalidad para la cual fue creado, y a una verdadera vida de Felicidad para toda la eternidad. Por medio de la fe el estará satisfecho con lo suyo y agradecerá Al Creador por cada privación que tiene, pues entiende que es necesaria para cumplir su meta."},{"id":"p17-b7","pageNumber":17,"indexInPage":7,"text":"Y Así, siempre estará alegre y feliz, que es la condición esencial para saber cuál es su camino Particular en la vida. Por consiguiente, el hombre que trata de tener éxito en la vida, pero cuando se dirige hacia la Derecha, el Creador lo frena; y cuando se dirige a la izquierda – el Creador lo traba, sin la fe Podría sentirse frustrado y amargado, y pensar que no le va nada bien en la vida."},{"id":"p17-b8","pageNumber":17,"indexInPage":8,"text":"Pero por medio De la fe que hay una Supervisión Individual del Creador sobre cada criatura – no se asusta, no se Deprime y no se confunde por nada. Cree que también la falta de éxito es para su bien, y busca Entender en que camino y a que dirección el Creador trata de dirigirlo. Solo así lograra llegar a su Objetivo, a cumplir su misión y llegar a su perfección – todo con facilidad, agradablemente y con Simpleza pues esta alerta a las insinuaciones."},{"id":"p17-b9","pageNumber":17,"indexInPage":9,"text":"Pero el hombre que carece de fe, está asustado, Confundido, obstinado y es casi imposible corregirle. En otras palabras – así como un niño disciplinado no necesita castigo, sino que con un poco de Orientación se mueve en la dirección correcta, así el hombre poseedor de fe no necesita pasar Muchos sufrimientos. Pero el que no tiene fe, se parece al niño que piensa que sabe más que Todos, no obedece a sus padres y maestros e ignora sus enseñanzas – ciertamente eligió para si Una vida muy difícil."},{"id":"p17-b10","pageNumber":17,"indexInPage":10,"text":"Falta de comunicación El hombre que no busca en las alusiones que el Creador le insinúa, no medita sobre todo lo que Le pasa, a que le lleva y a que camino lo dirige, simplemente vive incomunicado con el Creador. Desde el Cielo El trata de dirigirlo en una determinada dirección – para su propio bien – y el Insiste en caminar hacia otro lado. El Creador, de nuevo lo detiene, lo pellizca, lo golpea, y el Persiste en lo suyo."},{"id":"p17-b11","pageNumber":17,"indexInPage":11,"text":"Y así pasan los días de su vida con dificultades y amargura, y todavía el Hombre se asombra por que las cosas no le van bien. El que se empecina en ir detrás de sus apetitos y malos rasgos, muy probable que reciba golpes"}],"rawCharCount":4717},{"pageNumber":18,"blocks":[{"id":"p18-b0","pageNumber":18,"indexInPage":0,"text":"Muy duros. Porque esta desconectado completamente de lo que el Creador quiere de él, y Solamente trata una vez tras otra en satisfacer sus fantasías. Tan apasionado esta con sus Apetitos, que no está dispuesto a prestar atención y a entender que se le insinúa que no va por el Buen Camino. Por lo tanto es golpeado enérgicamente, para que descubra el error en que vive."},{"id":"p18-b1","pageNumber":18,"indexInPage":1,"text":"Pero también Quien está en el camino de la verdad y persiste en dedicarse al servicio al Creador según su propia comprensión, punto de vista, voluntad y aspiraciones, sin estar atento a Lo que Él le insinúa, tendrá muchos sufrimientos en su vida. A veces insiste en hacer una cosa Determinada, y no esta alerta a las alusiones que le indican que esa no es su misión, pero el otra Vez insiste y otra vez fracasa, lucha, y no pregunta al Todopoderoso que es lo que Verdaderamente quiere de él."},{"id":"p18-b2","pageNumber":18,"indexInPage":2,"text":"Entonces, a pesar que está estudiando las Leyes Divinas y cumple Todos los Preceptos, tampoco podrá llegar a su meta en el mundo, y su vida estará llena de Guerras vanas y sufrimientos superfluos."},{"id":"p18-b3","pageNumber":18,"indexInPage":3,"text":"El hombre debe pedir lo que pidió el Rey David (Salmos25): “Guíame en Tu verdad”, “Muéstrame Tus caminos, oh Eterno”, “Enséname Tus sendas”, y También (id., 73): “Me guiaras con Tu consejo”, y otros versículos similares… Por eso, con la ayuda del Creador, aprenderemos en este libro como entender lo que El Verdaderamente quiere de nosotros en todos los caminos que transitamos, para que cada uno Logre llegar a la finalidad para la que fue creado."},{"id":"p18-b4","pageNumber":18,"indexInPage":4,"text":"Y así, además de lo que se ahorró el hombre en Sufrimientos y dificultades, lograra también probar un gusto paradisiaco en su vida, y tanto más En el Mundo Venidero. Al salir a las calles de la ciudad, vemos frente a nosotros un mundo inquieto y enojado. Todos están apurados y tensos, y en todos lados se escuchan discusiones y querellas – Todo esto es el resultado de la falta de fe… Sin la fe, la vida no tiene ningún sentido porque a su fin espera indudablemente la trampa de la Muerte."},{"id":"p18-b5","pageNumber":18,"indexInPage":5,"text":"Entonces, encontramos que todo lo que el hombre se fatiga y se esfuerza en conseguir – Es en vano. Porque aunque llegue a lo que deseaba, no podrá gozar eternamente de los frutos De su duro trabajo, pues morirá y como está escrito (Eclesiastés 5:14): “Así como salió del vientre de su madre, desnudo volverá a irse como vino, y nada cargara de su esfuerzo que pueda llevar en sus manos”. Con mayor razón porque el hombre no sabe cuándo llegara su fin y todos sus planes pueden interrumpirse."},{"id":"p18-b6","pageNumber":18,"indexInPage":6,"text":"Debe saber que de todas maneras, va ser llevado de este mundo sin conseguir todo lo que espero"},{"id":"p18-b7","pageNumber":18,"indexInPage":7,"text":"obtener y como han dicho los Sabios: “No existe el hombre que morira y la mitad de sus deseos en su mano”. Y tambien mientras vive, todo el curso de su vida esta lleno de tribulaciones y dificultades mucho mas que sus momentos de gozo, como esta escrito (id., 2:23): “Porque todos sus dias son dolores y enfado”. Ya dijo uno de los grandes Justos: “Todos dicen que existe ‛este mundo‟ y el ‛Mundo Venidero‟. Nosotros creemos que el „Mundo Venidero‟ existe. ¿Pero es posible que tambien exista ‛este mundo‟ en algun lugar?"},{"id":"p18-b8","pageNumber":18,"indexInPage":8,"text":"Porque por los grandes sufrimientos que todos siempre padecen, pareceria ser este el infierno. Asi que verdaderamente – ¡„este mundo‟ no se encuentra en absoluto!”. Cuando observamos a nuestro alrededor – la vida de nuestros vecinos, conocidos y parientes, vemos que todos tienen siempre sufrimientos: problemas de salud, con la crianza de los hijos, con su espiritu, su cuerpo o su dinero."},{"id":"p18-b9","pageNumber":18,"indexInPage":9,"text":"Incluso hasta en las “historias de exito” como las de los ricos y famosos, si observamos bien vemos que detras de la historia de exito hay un hombre muy desgraciado y sufrido. Y sabemos cuantas quiebras, suicidios, divorcios y otras cosas semejantes acompanan a estos “exitosos”. Todo esto nos muestra la realidad en forma clara – ningun hombre tiene verdadero gozo en este mundo sin la fe, pues sin ella la vida no tiene sentido. Pero, por medio de la fe hay un sentido en cada cosa y todo tiene una causa."},{"id":"p18-b10","pageNumber":18,"indexInPage":10,"text":"Incluso el hombre que toda su vida tuvo dolor y sufrimientos, encontrara un verdadero y fuerte consuelo en la fe. Y si al mismo tiempo recibiera una correcta guia de como arrepentirse y retornar al Creador, lograria salvarse de toda tribulacion. ¡Acuerdate bien! El Creador no quiere castigar al hombre, todo el objetivo de los sufrimientos es despertar al hombre a retornar a El, para que merezca empezar a vivir su meta y gozar de la vida."},{"id":"p18-b11","pageNumber":18,"indexInPage":11,"text":"Paz y tranquilidad Al salir a las calles de la ciudad, vemos frente a nosotros un mundo inquieto y enojado. Todos estan apurados y tensos, y en todos lados se escuchan discusiones y querellas – todo esto es el resultado de la falta de fe. Si los seres humanos tuvieran fe, estarian todos tranquilos y alegres; todo se desarrollaria como sobre aguas tranquilas, pues cada uno sabria que su vida esta regida por la Divina Supervision, y por lo tanto no hay lugar para la tension, el enojo, los nervios y cosas parecidas."},{"id":"p18-b12","pageNumber":18,"indexInPage":12,"text":"Una persona que tiene fe se siente maravillosamente bien y transmite paz y alegria a todo su alrededor. Si"}],"rawCharCount":5062},{"pageNumber":19,"blocks":[{"id":"p19-b0","pageNumber":19,"indexInPage":0,"text":"todos fueramos duenos de la fe – ciertamente el mundo seria un lugar muy hermoso y agradable para vivir. Y en realidad, esta es la Redencion del mundo, a la que tanto espera la humanidad entera. Incluso las guerras entre los pueblos, no tendrian completamente ningun valor si hubiera fe en el mundo. Cada pueblo se contentaria con lo suyo y aceptaria la Supervision del Creador con amor. Y no se necesita decir, que por cierto cada pueblo actuaria con el otro con justicia, bondad y ayuda mutua."},{"id":"p19-b1","pageNumber":19,"indexInPage":1,"text":"Por eso, en la profecia del Fin de los Dias esta escrito (Isaias 11:6–9): “Y el lobo morara con el cordero, y el leopardo reposara con el cabrito… Ellos no haran mal ni pecaran en toda Mi Santa Montana, porque la Tierra estara llena del conocimiento del Eterno, como las aguas cubren el mar” – es decir, que al llenarse el mundo del conocimiento del Creador – que es la fe – regira una paz maravillosa."},{"id":"p19-b2","pageNumber":19,"indexInPage":2,"text":"La existencia del mundo Sin la fe, no hay ninguna explicacion por que el hombre debe hacer el bien y alejarse del mal. Por que se debe vivir una ordenada vida social y fundar una familia. Por que se necesita moralidad y responsabilidad. Si no hay Juicio y no hay Juez, si la muerte es definitiva y no hay continuacion despues de ella, ¿Por que abstenerse del asesinato y del robo?, ¿quien nos obliga?"},{"id":"p19-b3","pageNumber":19,"indexInPage":3,"text":"Pero por medio de la fe todo esta perfectamente esclarecido – existe un solo y unico Creador que observa y juzga, y a Quien el hombre debera rendir cuentas de todos sus actos. Sin la fe, cada hombre hara lo que es recto a sus ojos, y todas las injusticias le pareceran justas frente al apetito que le devora."},{"id":"p19-b4","pageNumber":19,"indexInPage":4,"text":"Traicionara sin dudar a su esposa, se ira con la mujer de otro hombre, incluso siendo la de su mejor amigo, sin prestar atencion siquiera que transgrede uno de los principios mas elementales de la decencia – no tocar y no desear lo que no es suyo. Unicamente por medio de la fe podra el hombre superar a su Mala Inclinacion y recordar que es solamente un ser creado, y que toda criatura tiene la parte que le ha sido dada por el Creador. Debe alegrarse y satisfacerse con lo que ha recibido y dejar a las otras criaturas vivir su parte."},{"id":"p19-b5","pageNumber":19,"indexInPage":5,"text":"Sin la fe es posible llegar a razonamientos que son completamente lo contrario a la verdad, como probar que robar y asesinar es justo y moral. Se sabe de muchos casos en que en nombre de “la verdad y la justicia” aparecieron bandas que robaban a los ricos con el pretexto de ayudar a los pobres, sin dejar de lado el asesinato y otros pecados. Si"},{"id":"p19-b6","pageNumber":19,"indexInPage":6,"text":"hubieran tenido fe, no hubieran llegado a esas perversas ideas, porque sabrian que el mundo posee un Creador y solo El decide quien sera rico y quien sera pobre, y ninguna persona esta autorizada a hacer justicia por si misma, o tratar de cambiar la Supervision Divina. El mundo entero esta lleno de errores como estos. Sin la fe cada uno puede decidir cual es su propia “verdad” – la cual es de hecho una gran mentira que puede traer hasta la destruccion del mundo."},{"id":"p19-b7","pageNumber":19,"indexInPage":7,"text":"Asi se desarrollaron los movimientos destructivos y revolucionarios, como el fscismo, el comunismo, las revueltas militares, etc. Incluso hoy hay todavia movimientos que invierten el orden de la Creacion en nombre de la “verdad”. Pero por medio de la fe nos conectamos a la Verdad del Creador, que es unica. Pues mentiras hay muchas pero Verdad hay solo una, y jamas cambia. Por lo tanto, encontramos que la fe es el fundamento que mantiene el mundo y por la cual puede realmente existir."},{"id":"p19-b8","pageNumber":19,"indexInPage":8,"text":"Aunque hay Preceptos conocidos y explícitos versículos que dicen lo que está permitido y lo que está prohibido, todavía la mayoría de los hombres tiene dificultad para cumplirlos. Necesitan un dirigente para el servicio al Creador que sepa guiar a cada uno según su propio espíritu… La Verdad Ya aprendimos que el Creador tiene una finalidad en la creacion del hombre pero, ¿seria posible que El demandara de nosotros llegar a nuestra meta sin decirnos cual es?"},{"id":"p19-b9","pageNumber":19,"indexInPage":9,"text":"¿Seria posible que el Creador nos diera recompensa y castigo sin decirnos que esta permitido y que esta prohibido? ¿Es posible pensar que el Creador confia que el hombre encontrara por sí mismo la finalidad?"},{"id":"p19-b10","pageNumber":19,"indexInPage":10,"text":"Por supuesto que el Creador debio dar al hombre claras instrucciones respecto a la finalidad de su existencia en el mundo, y por eso, en un unico y exclusivo acontecimiento de la historia humana, el Creador se revelo en el Monte Sinai en presencia de millones de hombres y mujeres, viejos y jovenes, y entrego Su eterna Ley con todos Sus Preceptos."},{"id":"p19-b11","pageNumber":19,"indexInPage":11,"text":"A traves de ellos y de los verdaderos Justos y Sabios, que como explicaremos mas adelante ensenan como cumplirlos correctamente, el hombre llega a saber cual es la finalidad, y asi le es inculcada la Verdad para que pueda llegar a la autentica fe. La Ley Divina, que es practicamente las “Leyes de la Vida”, se divide en la “Ley Escrita”, que incluye a los Diez Mandamientos y a todo el resto de los"}],"rawCharCount":4856},{"pageNumber":20,"blocks":[{"id":"p20-b0","pageNumber":20,"indexInPage":0,"text":"Preceptos Divinos; y en la “Ley Oral”, que heredaron los Sabios desde Moises, y que es la clave para entender la “Ley Escrita” y cumplirla correctamente. La Ley Escrita se encuentra unicamente en los Cinco Libros de Moises (Genesis, Exodo, Levitico, Numeros y Deuteronomio) conocidos como el Pentateuco o la Torá, y heredada exactamente sin ninguna modificacion, hasta nuestros dias. Solo por medio de cumplir las Leyes del Creador que reflejan Su Verdad, se puede llegar a la fe real."},{"id":"p20-b1","pageNumber":20,"indexInPage":1,"text":"En caso contrario, puede cada uno decidir cual es su meta segun sus caprichos y apetitos, llegando asi a tremendos errores, como constatamos claramente en el mundo en que vivimos."},{"id":"p20-b2","pageNumber":20,"indexInPage":2,"text":"El correcto camino"},{"id":"p20-b3","pageNumber":20,"indexInPage":3,"text":"Quien va en contra de los Preceptos del Creador, ciertamente vive con grandes errores y confusiones. Uno decide correr tras la fortuna y otro tras las mujeres, el tercero tras este apetito y el cuarto tras otra fantasia. Errores casi tantos como la cantidad de personas que viven, hasta que el mundo entero se transforma en un lugar donde es insoportable vivir – lleno de odio, envidia, competencia, maledicencia, pillaje, venganza, crueldad, injusticia, asesinatos, traicion, etc."},{"id":"p20-b4","pageNumber":20,"indexInPage":4,"text":"Sin embargo, cuando los hombres viven segun la Voluntad Divina y tienen verdadera fe, el mundo es muy bello. Cada uno esta feliz con lo suyo – el hombre no mira a la mujer de su projimo, no toca lo que no le pertenece, respeta y quiere el exito de todos, hace favores y caridad a la gente, hace el bien a sus semejantes, ejecuta sus actos y transacciones con fidelidad, sin mentiras, fraudes o enganos – todo con fe segun la Ley Divina."},{"id":"p20-b5","pageNumber":20,"indexInPage":5,"text":"Resumiendo – por medio de la verdadera fe el mundo es muy dulce y maravilloso y para llegar a esto, hay que vivir por el camino de los Preceptos y obtener asi una buena vida. Pero el cumplimiento de los Preceptos y su estudio tampoco son utiles para quien no busca la fe por su intermedio. Tambien el puede errar en su objetivo y llegar a cometer grandes errores que, en muchos aspectos, son peores que los errores de alguien que no los estudia y trata de practicarlos. ¿Por que?"},{"id":"p20-b6","pageNumber":20,"indexInPage":6,"text":"Porque lo esencial de la verdad que es la fe, se recibe solo por medio del acercamiento a los grandes Justos, unicos en su generacion, desde Moises hasta nuestros dias."},{"id":"p20-b7","pageNumber":20,"indexInPage":7,"text":"Quien no se acerca a ellos, no puede encontrar la fe, inclusive si estudia los Preceptos y los cumple. ¿Quieren una evidencia? ¡Solo miren a las muchas personas que tienen una forma de vida religiosa y muy observante, pero no tienen ninguna relacion con la fe!"},{"id":"p20-b8","pageNumber":20,"indexInPage":8,"text":"Ellos no hablan con el Creador sobre lo que les sucede, no le piden Su ayuda, y cuando tienen algun problema, hacen precisamente lo que una persona sin fe hace – corren al medico por cualquier enfermedad, se enojan por cualquier cosa que no es de su agrado, salen de sus cabales por conseguir su sustento, se vengan y guardan rencor en caso de conflictos monetarios o de herencia... Un hombre de espíritu Entre una generacion y otra hay un hilo que las conecta y que jamas se rompe."},{"id":"p20-b9","pageNumber":20,"indexInPage":9,"text":"En cada generacion hay Justos que recibieron el camino de la Ley Divina de sus antepasados desde Moises que la recibio en Sinai y la transmitio a Josue, quien a su vez la transmitio a los Ancianos y ellos a los que vinieron despues, y asi sucesivamente... Ellos – y todos los que siguen su camino – son los que guian al hombre en la comprension de la Ley Divina, sus Preceptos y la finalidad."},{"id":"p20-b10","pageNumber":20,"indexInPage":10,"text":"Por eso, debe cada uno buscar muy bien un verdadero Lider Espiritual que posea la Inspiracion Divina, para que le ensene el camino para llegar a cumplir la Ley. Y no es suficiente que se acerque a un maestro – aunque sea muy grande – si este no recibio la herencia de los Maestros anteriores desde Moises, de como hacer llegar a cada hombre a su meta."},{"id":"p20-b11","pageNumber":20,"indexInPage":11,"text":"Porque a pesar de que hay Preceptos conocidos y explicitos versiculos que dicen lo que esta permitido y lo que esta prohibido, todavia la mayoria de los hombres tiene dificultad para cumplirlos. Necesitan un dirigente para el servicio al Creador que sepa guiar a cada uno segun su propio espiritu. Como explicaron los Sabios el versiculo (Numeros 27:18): “Un hombre de espiritu” – un Justo que por la Inspiracion Divina que posee, puede conocer la condicion espiritual de cada uno y tambien las cosas ocultas."},{"id":"p20-b12","pageNumber":20,"indexInPage":12,"text":"El sabe como estimular a cada uno, fortalecer su alma y llevarlo a cumplir perfectamente la Ley Divina. Este Lider debe ser absolutamente devoto y piadoso, dueno de un nivel espiritual muy elevado y tener una clara herencia desde Moises, el primer Maestro Espiritual, para corregir a los que se le acercan. El que no busca un guia como este, entonces puede estudiar la Ley Divina toda su vida y no encontrar la meta, viviendo en falta. Sobre esto esta escrito (Proverbios 14:12): “Hay un camino que le parece recto al hombre, pero su"}],"rawCharCount":4773},{"pageNumber":21,"blocks":[{"id":"p21-b0","pageNumber":21,"indexInPage":0,"text":"fin son los caminos de la muerte”. Debemos cuidarnos no ser de los que se extravian de la senda correcta. Hay dos tipos de extraviados, los que se extravian completamente del camino de la fe, y aquellos que creen que estan en ese camino, pero en verdad se equivocan debido a que no buscan quien los guie para cumplir la Ley del Creador."},{"id":"p21-b1","pageNumber":21,"indexInPage":1,"text":"Por lo tanto debemos saber que todo depende esencial y fundamentalmente en conectarse con el Justo de la generacion y aceptar todo lo que dice; la cosa pequena y la cosa grande, sin desviarnos a la derecha o a la izquierda aun cuando no lo entendamos. Debemos desprendernos de todas las astucias, y anular nuestra opinion, como si no tuvieramos ningun razonamiento, excepto el que recibira del Justo de la generacion."},{"id":"p21-b2","pageNumber":21,"indexInPage":2,"text":"Todo el tiempo en que queda en nosotros algo de nuestro propio razonamiento, no estamos conectados completamente con el Justo… En verdad, se necesita buscar y buscar mucho hasta encontrar un Lider verdadero, y es necesario pedir mucho al Creador el merecerlo, para poder lograr la fe autentica en su totalidad. Porque por medio de acercarse a un falso lider se llega a falsas creencias y esta es la razon por la cual se debe buscar y rebuscar mucho un Lider autentico y acercarse a él."},{"id":"p21-b3","pageNumber":21,"indexInPage":3,"text":"¡Advertencia importante! Es muy importante destacar aqui, que la busqueda y pedido de un verdadero Lider, se consigue solamente por medio de la plegaria, porque saber quien es el Guia verdadero y quien es un guia falso, no esta en la mano del hombre. Es imposible encontrarlo y determinarlo por nuestro propio razonamiento y entendimiento; el que tratara de conseguirlo de este modo, es muy probable que llegara a la polemica, la maledicencia y a grandes errores."},{"id":"p21-b4","pageNumber":21,"indexInPage":4,"text":"Solo quien se mantiene muy fuerte en el atributo de la paz, se aleja definitivamente de toda sombra de polemica y se cuida con toda su alma de no despreciar a ningun hombre, y con mayor razon a ningun dirigente o grupo, solo el puede encontrar al Guia verdadero por medio de la plegaria."},{"id":"p21-b5","pageNumber":21,"indexInPage":5,"text":"Por lo tanto, no hay ningun otro consejo ni otra posibilidad, que no sea por medio de muchos rezos y suplicas al Creador, merecer acercarse al verdadero Lider para lograr la verdadera fe. “Por supuesto que estoy de acuerdo que todo proviene del Creador, pero… ¿Pero por qué mi esposa me hace eso? ¿Qué le hice? ¿No entiende que arruina a nuestros hijos?”…"},{"id":"p21-b6","pageNumber":21,"indexInPage":6,"text":"Como ya hemos mencionado, todas las cosas que el hombre cree que le causan sufrimientos se incluyen en tres categorias – o que provienen de una causa natural, o por medio de otra persona, o por los errores y fracasos de uno mismo. Cuando los sufrimientos le llegan al hombre a traves de una causa natural como una enfermedad, aunque tambien en este caso puede pasar dificiles pruebas de fe, a pesar de todo le es mas facil entender que es solamente una causa que proviene del Creador, y que debe dirigirse a El para que le ayude."},{"id":"p21-b7","pageNumber":21,"indexInPage":7,"text":"Tambien si pone sus esperanzas en las medicinas, al final, cuando vea que estas realmente no le ayudan, se dirigira a la fe, y no empezara a hablar con los microbios, a suplicarles o a amenazarles... Por otro lado, cuando el hombre sufre un pesar debido a otra persona, comunmente se equivoca y piensa que esto no esta unicamente en la mano del Creador, pues esta frente a un hombre que posee libre albedrio y supuestamente es posible dirigirse a El directamente e influir para que cambie su comportamiento y sus actos."},{"id":"p21-b8","pageNumber":21,"indexInPage":8,"text":"Por esto, no piensa de ningun modo rezarle al Creador, pues su razon le dice: “Despues de todo, frente tuyo se encuentra un hombre con libre albedrio – habla y arreglate con él, o lucha con el”... Pero por supuesto que esta no es la verdad, porque “No hay mas nada fuera de Él” y todos los seres humanos estan en la mano del Creador. El les endurece o les ablanda el corazon segun lo que desea que reciba el hombre que esta frente a ellos."},{"id":"p21-b9","pageNumber":21,"indexInPage":9,"text":"Por lo tanto, tambien aca el consejo principal es la plegaria, y cuando el hombre apaciguara al Creador, El cambiara el corazon de esas personas que le hicieron dano y las transformara en sus bienhechores."},{"id":"p21-b10","pageNumber":21,"indexInPage":10,"text":"Lo único que tienes es tu libre albedrío ¡Debemos saber! Ciertamente la persona que nos enfrenta tiene el libre albedrio para hacer el bien o el mal, y por supuesto si hara el mal tendra que rendir cuentas al Creador. Pero en vista de que el Creador sabe que alguien debe sufrir un pesar, entonces le hace cumplir su deuda por medio de un hombre culpable que sera Su vara para golpearle."},{"id":"p21-b11","pageNumber":21,"indexInPage":11,"text":"De por si, no tenemos ninguna posibilidad de influir en el libre albedrio de quien nos enfrenta, la unica eleccion que tenemos es mejorar nuestras acciones, rezar y conversar con el Creador, apaciguarlo para que nos perdone y pedirle que nos salve. Podemos explicar esto por lo que se cuenta de un gran Sabio que vio flotando sobre las aguas el craneo de un asesinado. Se dirigio al craneo y"}],"rawCharCount":4813},{"pageNumber":22,"blocks":[{"id":"p22-b0","pageNumber":22,"indexInPage":0,"text":"dijo: “Es porque ahogaste que fuiste ahogado; y el fin del que te ahogo – que lo ahogaran”. La moraleja es la siguiente: el asesinado lo fue con justicia por el Juicio del Creador. El asesinado no podria salvarse del asesino de ningun modo, solo si hubiera hecho arrepentimiento y retorno al Creador, pero el hombre que lo asesino tambien sera castigado por haber elegido el mal."},{"id":"p22-b1","pageNumber":22,"indexInPage":1,"text":"No hay culpables No existe un error mas grande que inculpar a otros por nuestro pesar. En el momento que inculpamos a alguien por nuestros sufrimientos – sea quien sea – es una gran falta de fe. Esto causa que el Creador retire su Supervision sobre esta persona, e incluso lo coloque bajo la mano del mismo hombre al que culpa."},{"id":"p22-b2","pageNumber":22,"indexInPage":2,"text":"Lo que ocurre en la mente y corazon del que vive este error es una de las siguientes posibilidades: • Cuando no tiene la posibilidad de hacer algo contra los que le afligen, por ejemplo: bancos, autoridad, jueces, policia, etc., el hombre cae en completa desesperacion."},{"id":"p22-b3","pageNumber":22,"indexInPage":3,"text":"Y hay aquellos que inclusive llegan a pensar en el suicidio, porque piensan que en este tipo de casos el Creador no los puede ayudar. • Cuando quien aflige al hombre es simplemente una persona como el, por ejemplo: su esposa, su vecino, su socio, etc., entonces todo su tiempo lo ocupa con pensamientos como: “Le mandare a fulano para que influya sobre el”; o “yo me vengare”; o “yo le hare tal y cual cosa”; o “yo le mandare unos matones”."},{"id":"p22-b4","pageNumber":22,"indexInPage":4,"text":"No puede dormir por las noches, se agita su alma; en un momento piensa esto y en otro momento piensa lo otro. El puede llegar a todo tipo de bajas situaciones de adulacion y humillacion, o de enojo y crueldad, de odio y venganza. Incluso es capaz de causar un pesar o perjuicio a quien piensa es el causante de sus angustias, transformandose de un perseguido en un perseguidor, y entonces pobre de el y de su alma, porque asi despierta la Ira del Creador y se le abrira una nueva cuenta a la cuenta por la que le llegaron esos sufrimientos."},{"id":"p22-b5","pageNumber":22,"indexInPage":5,"text":"Vemos entonces que los sufrimientos y amargura del hombre que inculpa a los otros son terriblemente duros, y siente que no tiene ningun escape para salvarse de ellos. Entonces, ¿Qué se puede hacer? Debemos saber que por cierto hay lo que hacer. Nuestra vida esta en nuestras propias manos y no en las de otros, pues podemos dirigirnos y hablar con el Dueno del Mundo, con el Unico que determina lo que sucedera"},{"id":"p22-b6","pageNumber":22,"indexInPage":6,"text":"en nuestra vida, el Unico de Quien podemos recibir todo el bien y toda la salvacion necesaria. Debemos acordarnos que nuestro beneficio y perjuicio estan en las manos del Creador. Y si nos parece que hay otros hombres causantes de nuestro dano, pensaremos favorablemente de ellos y sospecharemos de nosotros mismos, de nuestras malas acciones. Debemos suplicar al Todopoderoso y pedirle que expie nuestros pecados."},{"id":"p22-b7","pageNumber":22,"indexInPage":7,"text":"Entonces, hasta nuestros enemigos empezaran a amarnos y se transformaran en nuestros leales amigos, como esta escrito (Proverbios 16:7): “Cuando el Eterno se complace con los caminos del hombre, tambien sus enemigos se reconcilian con él”."},{"id":"p22-b8","pageNumber":22,"indexInPage":8,"text":"¿Es posible ayudar? Al hombre que no esta dispuesto a instruirse en la fe es imposible ayudar, puesto que quiere que lo ayuden segun su errado entendimiento, ya sea forzando a la gente, con cadena de deudas, demostracion de fuerza, amenazas, hipocresia, etc. Estos caminos no resuelven nada – y la evidencia es que el mismo trato de ir por estos caminos y solo se enredo. ¿Saben por que? ¡Porque el Creador quiso que se enredara! Porque todo tiempo que el hombre piensa que hay alguien que determina algo fuera de El, no prosperara."},{"id":"p22-b9","pageNumber":22,"indexInPage":9,"text":"Y por supuesto, nadie podra ayudarlo en cosas contrarias a la Voluntad del Creador. El resultado de esto es que el hombre que vino en su ayuda, solo se enredara tambien con las mismas angustias que el sufre, hundiendose juntos. El unico consejo para la solucion de todos los problemas es instruirse en la fe, siguiendo los consejos y la senda que ensenaremos en este libro."},{"id":"p22-b10","pageNumber":22,"indexInPage":10,"text":"Por medio de una correcta orientacion y guia, se puede ayudar a quien esta dispuesto a prestar atencion y andar por estos caminos y asi resolvera facilmente todo su problema. Pero, quien viene a pedir ayuda y quiere un consejo segun su humano razonamiento y entendimiento, se parece al enfermo que va al medico y le pide que lo cure segun su propia comprension del problema. ¿Que contestara el doctor a este tipo de hombre? “Si tu sabes como curarte, ¿para que viniste a mi?"},{"id":"p22-b11","pageNumber":22,"indexInPage":11,"text":"¡Si quieres curarte, no opines y escucha mis instrucciones, y si Di-s quiere – te sanaras!”. Mitad y mitad Hay quienes confian en la fe a medias. Como el caso de un hombre que viene a pedir consejo para sus problemas domesticos y matrimoniales a un"}],"rawCharCount":4645},{"pageNumber":23,"blocks":[{"id":"p23-b0","pageNumber":23,"indexInPage":0,"text":"guia espiritual. El guia le explica que todo el pesar que su esposa le inflige proviene del Creador, y por lo tanto, lo unico que le ayudara es arrepentirse y retornar al Creador. Entonces contesta el hombre: “Por supuesto que estoy de acuerdo que todo proviene del Creador, pero… ¿Pero por que mi esposa me hace eso? ¿Que le hice? ¿No entiende que arruina a nuestros hijos?…”."},{"id":"p23-b1","pageNumber":23,"indexInPage":1,"text":"Despues de todo todavia hay gente que se queda con el “pero”, siguen viendo a la persona que les produce pesar como la culpable, tal como ladra el perro a la vara que lo golpea y no a quien la sostiene. Esta gente no entiende que su salvacion esta tan cerca, si solo prestaran atencion a lo que tienen que corregir en si mismos; pero mientras tanto, se quedan con sus aflicciones, sufrimientos, acusaciones y todos sus “justos” argumentos. A este tipo de persona debemos decir: “¿Quieres tener la razon? – no hay problema."},{"id":"p23-b2","pageNumber":23,"indexInPage":2,"text":"Sigue siendo el que todo lo sabe, pero debes saber que tu vida sera un verdadero infierno… Por el contrario, si quieres ver la verdad, que el problema esta en ti y corregirte, empieza viviendo con la fe que 'No hay mas nada fuera de El' y ya viviras el Paraiso en este mundo”. No se puede escapar a la realidad – el hombre debe vivir con fe. Punto."},{"id":"p23-b3","pageNumber":23,"indexInPage":3,"text":"Debemos creer que todo problema que tenemos proviene del Creador; que solo con El tenemos intereses; que estamos solo en Sus manos; que nuestros sufrimientos pasaran unicamente cuando El lo decida. Debemos entender muy bien – ¡tenemos libre albedrio sobre nuestra vida y nuestro destino! ¡Esto esta en nuestras manos y no en la de otros! La vida de cada uno de nosotros es exactamente como nuestras acciones, y no existe la realidad de que el hombre sufra sin causa."},{"id":"p23-b4","pageNumber":23,"indexInPage":4,"text":"Cuando verdaderamente retornamos al Creador, todo se transforma para bien. Cada hombre creyente confiesa, que si se equivocó en su elección, fue solamente porque no tuvo ayuda desde lo Alto, y tiene que recibir sus fracasos con fe y amor…"},{"id":"p23-b5","pageNumber":23,"indexInPage":5,"text":"“En las manos de hombre no caeré...” Un hombre esta en peligro: adelante de el – el abismo, detras de el – hombres que lo quieren matar, ¿que es lo que debe hacer? Mejor sera que salte al abismo que caer en sus manos, como ha dicho el Rey David (Samuel II, 24:14): “Caere mejor en la mano del Eterno, porque muy grande es Su Misericordia, y en las manos de hombre no caere”. Esto es por la misma"},{"id":"p23-b6","pageNumber":23,"indexInPage":6,"text":"razon anterior, porque cuando el hombre creyente esta frente a un peligro natural, se apoya unicamente en el Creador rogandole con todas sus fuerzas que lo salve, entonces El lo supervisa y le hace un milagro. Pero si por el contrario, cuando el esta frente a otras personas dirigiendo sus esfuerzos en su direccion y no levanta sus ojos solamente al Creador, entonces El no lo vigila con completa Supervision y puede el hombre caer en las manos de sus rivales."},{"id":"p23-b7","pageNumber":23,"indexInPage":7,"text":"Tanto mas si se olvida completamente de la existencia del Todopoderoso y ve solo hombres enfrente de el, entonces el Creador le retira Su Supervision completamente, y el cae bajo las manos de sus enemigos."},{"id":"p23-b8","pageNumber":23,"indexInPage":8,"text":"Hombres o serpientes En el Genesis se encuentra el siguiente relato: Jose el Justo fue el undecimo de los doce hijos de Jacob los cuales formaron las doce tribus de Israel. Siendo el hijo mas querido por su padre y teniendo suenos en los que aparecia alzado por encima de sus hermanos, provoco la envidia de ellos. Lo odiaban tanto hasta el punto que decidieron matarlo. Cuando vio Ruben, uno de los hermanos, que los otros estaban decididos a realizar su mala decision, lo quiso salvar."},{"id":"p23-b9","pageNumber":23,"indexInPage":9,"text":"Por eso, les propuso que lo echaran a un pozo vacio… Es decir, vacio de agua pero – ¡lleno de escorpiones y serpientes venenosas!... Supuestamente, hay aca una gran contradiccion. ¡¿Que penso Ruben?! ¿Que acto de salvacion es este? ¿De que serviria tirar a Jose a un pozo lleno de alimanas venenosas? – ¡Ciertamente cuando cayera sobre ellas, lo morderian y lo matarian! Seria mejor que quedara Jose en las manos de sus hermanos y posiblemente podria despertar su compasion y no le matarian..."},{"id":"p23-b10","pageNumber":23,"indexInPage":10,"text":"La respuesta es la siguiente: Ruben sabia que Jose el Justo es dueno de la fe; estaba convencido que en el momento que Jose sintiera el peligro de las serpientes y los escorpiones, Le gritaria al Creador con todo su corazon y ciertamente El lo salvaria."},{"id":"p23-b11","pageNumber":23,"indexInPage":11,"text":"Porque asi lo establecio el Creador y advirtio al regimen de la naturaleza y a todos los angeles designados a la conduccion del mundo: inmediatamente despues que el hombre Le gritara pidiendo ayuda con todo su corazón – la naturaleza estara obligada a cambiar y a hacer su voluntad, a tal punto que transformara el mar en tierra firme, detendra el sol en el cielo, el fuego no quemara y los leones no atacaran ni desgarraran."}],"rawCharCount":4670},{"pageNumber":24,"blocks":[{"id":"p24-b0","pageNumber":24,"indexInPage":0,"text":"Por esta misma razon, Ruben estaba completamente convencido y seguro que asi salvaria a Jose, a pesar de que sabia que el pozo estaba lleno de serpientes y escorpiones. Por eso es que esta escrito “y lo libró de sus manos” – con firmeza, y no trato de librarlo de sus manos – en forma dudosa. Porque los Justos saben la fuerza de la plegaria; ellos saben con completa claridad que cuando el hombre grita al Creador con toda su alma inmediatamente la naturaleza se transforma."},{"id":"p24-b1","pageNumber":24,"indexInPage":1,"text":"Ruben no confio en la fe de su Justo hermano en la prueba frente a seres humanos poseedores del libre albedrio, porque sabia la dificultad de resistencia en un examen como ese, y temio que en el momento de la prueba Jose se confundiera y se dirigiera a sus hermanos con suplicas de clemencia o con tentativas de apaciguamiento y convencimiento, diciendoles: “Soy vuestro hermano, de vuestra propia sangre”, o “Tengan compasion de nuestro padre”, etc."},{"id":"p24-b2","pageNumber":24,"indexInPage":2,"text":"Y entonces, en vista que no confiaria únicamente en el Creador, Su Supervision no seria completa sobre el, y los hermanos lo matarian sin ningun impedimento. Y asi fue que cuando Jose fue echado al pozo, no se dirigio a las serpientes ni a los escorpiones con suplicas para que lo dejaran en paz, sino que clamo al Creador con todo su corazon, y El lo salvo de ellos. “Sabe ante Quién estás parado”"},{"id":"p24-b3","pageNumber":24,"indexInPage":3,"text":"Cuando un hombre esta frente a una persona que le lastima, por ejemplo: un conductor a quien detuvo un policia, o un marido a quien su esposa o sus hijos le apesadumbran, o la esposa a quien su marido o sus hijos afligen, u otros ejemplos semejantes, tiene que decidir en forma inequivoca ante quien esta parado."},{"id":"p24-b4","pageNumber":24,"indexInPage":4,"text":"Si esta ante el Creador del Universo y tiene fe en El, y no ante sus hijos, su esposa o el policia, entonces el nunca lisonjeara, nunca suplicara, nunca hara ningun esfuerzo para influir sobre la otra persona para que le deje o que le obedezca. Tampoco se enojara, no despreciara y no maldecira, sino que se dirigira a Quien le supervisa y le trajo esta prueba, el Unico que le puede ayudar – el Creador."},{"id":"p24-b5","pageNumber":24,"indexInPage":5,"text":"Y hay en esto distintos grados, porque incluso si recibio lo que le sucede con fe, es decir que hablo con el Creador y se arrepintio, pero despues, a pesar de todo, se dirige a la otra persona tratando de influir sobre ella – esto es tambien un defecto en su fe, pues demuestra que todavia quedo en el lugar para pensar que el hombre que se encuentra enfrente suyo es una realidad por si misma, y que tiene alguna decision en sus manos."},{"id":"p24-b6","pageNumber":24,"indexInPage":6,"text":"Este hombre no vive la verdadera fe de que todos los seres humanos estan en las manos del Creador, y que se deben dirigir solo a El y no a ningun hombre."},{"id":"p24-b7","pageNumber":24,"indexInPage":7,"text":"El que dice “yo fracasé” es un orgulloso Tambien cuando el hombre sufre como consecuencia de sus propios errores, fracasos y cosas parecidas que supuestamente dependen de su libre eleccion, debe saber con certeza que solamente antes de errar tuvo el libre albedrio, pero ahora, despues que ya se equivoco, tiene que saber – ¡Asi lo quiso el Creador! – y no perseguirse con auto-acusaciones, cayendo en el desaliento."},{"id":"p24-b8","pageNumber":24,"indexInPage":8,"text":"Cada hombre creyente sabe muy bien que cuando prospera en su eleccion es solo porque es ayudado por el Creador – esto lo confiesa con todo su corazon. Quien no piensa asi, demuestra simplemente que tiene orgullo, como si estuviera diciendo “yo prospere”. Tambien, cada hombre creyente confiesa, que si se equivoco en su eleccion, fue solamente porque no tuvo ayuda desde lo Alto, y tiene que recibir sus fracasos con fe y amor."},{"id":"p24-b9","pageNumber":24,"indexInPage":9,"text":"Pero cuando el hombre no acepta sus fracasos con fe creyendo que tambien son obras del Creador, se debe a su arrogancia. El que relaciona sus fracasos consigo mismo, esta claro que tambien relaciona sus exitos a si mismo. Por lo tanto lo que dice le gente cuando tiene exito: “Gracias a Di-s”, “Con la ayuda del Senor”, “Por la Misericordia de Di-s”, y cosas parecidas, en la mayoria de los casos son completamente superficiales."},{"id":"p24-b10","pageNumber":24,"indexInPage":10,"text":"Porque la verdadera prueba de la fe es precisamente cuando el hombre fracasa y tiene que confesar que esa fue la Voluntad del Creador, y que El tiene un mensaje al no ayudarlo ahora. Por eso no tiene que inculparse y perseguirse, solo empezar a hacer la correcta eleccion desde el presente punto de partida. Ahora mismo tiene la nueva eleccion de aprender del pasado y rezar por el futuro. La regla que se deduce de esta seccion es que en cada pesar o falta que tiene el hombre, sin excepcion, tiene que creer – “¡Así el Creador quiere!”."},{"id":"p24-b11","pageNumber":24,"indexInPage":11,"text":"¿Por qué y por qué? El hombre que esta en el primer nivel de la fe, es decir que cree en la Divina Supervision Individual, esta en la direccion correcta hacia una vida de alegria y felicidad. No obstante le falta el segundo nivel, porque pese a que cree que todo proviene del Creador, todavia puede hacerse las conocidas y famosas preguntas, y tener quejas y rencores como por ejemplo: “¿Por que el Creador me hizo esto?... No lo merezco. Soy una buena persona. ¿Por que tengo que sufrir?"},{"id":"p24-b12","pageNumber":24,"indexInPage":12,"text":"¡Fulano o mengano es mas mala persona que yo y no sufre!, ¿por que?”."}],"rawCharCount":4995},{"pageNumber":25,"blocks":[{"id":"p25-b0","pageNumber":25,"indexInPage":0,"text":"Esto es de hecho un gran defecto en la fe en el Creador. Si se cree que todo proviene del Creador, se debe creer que todo es ciertamente para bien pues el Creador es bueno, y ningun mal proviene de El – por lo tanto, el mal realmente no existe. Encontramos entonces que es imposible que el hombre diga “yo creo en el Creador” y al mismo tiempo piensa que lo que le sucede es malo, porque se contradice a si mismo. ¡Segun la verdad y según la fe todo es para bien!"},{"id":"p25-b1","pageNumber":25,"indexInPage":1,"text":"Por eso, para llegar a la fe completa, se debe trabajar sobre el segundo nivel. Un hombre se apura para llegar a su trabajo, llega a la estación de ómnibus exactamente cuando el vehiculo comienza a viajar, el chofer le cierra la puerta en la cara e ignora sus llamadas…"},{"id":"p25-b2","pageNumber":25,"indexInPage":2,"text":"El Nivel Intermedio de la Fe – “Todo es para bien” El segundo nivel de la fe es la firme creencia que “Todo es para bien”. Debemos creer que todo lo que nos sucede es para nuestro propio bien, a pesar de que nos parece lo contrario. En muchos casos se puede ver claramente como algo que parecia malo se revela como un bien. Toda persona observadora lo ve en el curso de su vida."},{"id":"p25-b3","pageNumber":25,"indexInPage":3,"text":"Por ejemplo: un hombre se apura para llegar a su trabajo, llega a la estacion de omnibus exactamente cuando el vehiculo comienza a viajar, el chofer le cierra la puerta en la cara e ignora sus llamadas… Naturalmente este hombre no puede recibir con amor lo que le paso, tanto por el desden del chofer como por el atraso que le fue causado."},{"id":"p25-b4","pageNumber":25,"indexInPage":4,"text":"Mas tarde, cuando se descubre que el omnibus al que queria subir tuvo un accidente fatal, recibe lo que paso en forma “un poco” distinta… agradece al Creador con lagrimas de emocion por haberle salvado, y bendice con miles de bendiciones al mismo chofer que solo poco antes le parecio una mala persona. Naturalmente, en el momento de la prueba, no tiene el hombre la posibilidad de saber que pasara mas tarde, porque el no puede adivinar o prevenir el futuro. Por lo tanto, se enoja por el obstaculo que le impide seguir con sus planes."},{"id":"p25-b5","pageNumber":25,"indexInPage":5,"text":"Pero el Creador, que sabe todo el futuro, siempre cuida al hombre, tal como esta escrito (Salmos 116:6): “El Eterno cuida a los candidos”. Y tambien si no sucedio ninguna tragedia, hay muchas razones ocultas por las que no debia"},{"id":"p25-b6","pageNumber":25,"indexInPage":6,"text":"subir a ese omnibus, razones que solo el Creador conoce. El hombre debe simplemente creer que “Todo es para bien” sin culpar al chofer o al que le demoro, ni a si mismo. Eso es solo un ejemplo simple y superficial, porque en verdad, en todas las situaciones que pasa cada uno, tiene el Creador distintas consideraciones y motivos por los que nos conduce de tal manera, y que nos estan ocultos en el momento de la prueba."},{"id":"p25-b7","pageNumber":25,"indexInPage":7,"text":"Si resistiremos las pruebas de la fe, podremos, en la mayoria de los casos, entender que lo que sucedio fue para nuestro bien; aunque hay cosas que quedaran ocultas hasta mas tarde en nuestra vida o que quedaran ocultas hasta despues de nuestra muerte, o hasta el final de los tiempos cuando llegara el Mesias y contara a cada uno exactamente que le sucedio, y como todo fue para su bien. Esta es la regla – solo el Creador ve y sabe en profundidad el sendero por el que el hombre tiene que pasar en su vida, material y espiritualmente."},{"id":"p25-b8","pageNumber":25,"indexInPage":8,"text":"Por eso, El es el Unico que sabe el bien que crecera de cada cosa. Debemos saber que obligadamente no podra el hombre ver el bien en el momento de la prueba, porque si fuera asi, no seria ninguna prueba. Por consiguiente, la unica forma de triunfar en ella es por medio de la conviccion que “Todo es para bien”. ¡Alcanzable para todos! Si tu piensas que la creencia que “Todo es para bien”, es un elevado nivel espiritual exclusivo de los grandes Justos y piadosos, ¡estas equivocado!"},{"id":"p25-b9","pageNumber":25,"indexInPage":9,"text":"Toda persona lo puede alcanzar si solo trabajara sobre si misma. El Creador no nos demanda lo que no podemos lograr. Por medio de la guia que se encuentra en este libro se lo puede conseguir y llegar a cumplirlo mejorando asi nuestra vida. “Todo” y no “casi todo” Es muy importante enfatizar, cuando decimos que “Todo lo que el Creador hace es para bien” – es realmente “todo” no “casi todo” ¡completamente todo! No se puede decir: “Yo creo que „Todo es para bien‟ excepto en tal y tal caso”, y en esto la mayoria se equivoca."},{"id":"p25-b10","pageNumber":25,"indexInPage":10,"text":"Incluso la gente que esta dispuesta a decir que “Todo es para bien”, es solo hasta un cierto limite, hasta que le sucede algo que no esta dispuesta a aceptar. Por ejemplo, cuando sus planes fueron obstaculizados, o algo “toca” su bolsillo, su honor, o simplemente choca con su deseo – entonces ya no esta dispuesta a aceptar esta creencia. Pero la verdad es inamovible, “Todo es para bien”, completamente todo, sin excepcion. Ademas, como se ha dicho anteriormente, la creencia que “Todo"}],"rawCharCount":4666},{"pageNumber":26,"blocks":[{"id":"p26-b0","pageNumber":26,"indexInPage":0,"text":"es para bien” no es algo separado de la creencia en la Divina Supervision, sino es una expresion de la fe en ella. Cuando no creemos en esto, demostramos de hecho que no creemos que todo proviene del Creador. Es imposible separar las dos cosas: si se cree que todo proviene de El – se cree tambien que “Todo es para bien”."},{"id":"p26-b1","pageNumber":26,"indexInPage":1,"text":"¿Qué es la fe? Cada suceso que el hombre entiende por su propio razonamiento que es para bien, todavia no es suficiente para decir que posee la fe que “Todo es para bien”. Porque lo que se entiende por medio del intelecto, no tiene relacion alguna con la fe. La esencia de la fe esta solo en el lugar donde la razon cesa y no se entiende con el intelecto."},{"id":"p26-b2","pageNumber":26,"indexInPage":2,"text":"Dicho de otro modo, donde la razon del hombre le dice que algo es malo, y se desprende de ella y cree que es para bien, se alegra y Le agradece al Creador con todo su corazon – solo entonces se puede decir que posee la fe que “Todo es para bien”. Cuando al hombre le sucede algo que contradice a su voluntad, el debe anularla frente a la Voluntad Divina. Y esto es imposible realizar sin la creencia que “Todo es para bien”, porque ¿quien aceptara que le llegue algo malo?"},{"id":"p26-b3","pageNumber":26,"indexInPage":3,"text":"Pero por medio de esta creencia, el hombre entiende que el Creador tiene un determinado motivo para cada cosa. Solo El sabe su camino y por lo tanto, con la fuerza de esta fe puede anular su voluntad frente a la de El, recibiendo con amor todo lo que debe pasar en este mundo. El interés del hermano religioso creció muchísimo. Un nuevo mundo se reveló frente a él, un mundo que estuvo frente a sus ojos todo el tiempo y simplemente no lo vio…"},{"id":"p26-b4","pageNumber":26,"indexInPage":4,"text":"Todo es bueno Cuando el hombre se fortalece en la creencia que “Todo es para bien”, en realidad todo le ira bien. Tal como ha dicho un gran Justo: “Porque en verdad, si todos hubieran obedecido a los Justos que enseñan a creer siempre que todo lo que el Creador hace es para bien, y que se debe alabarle y agradecerle en cada situación sea como sea, ciertamente que se desvanecerían todas las angustias y todos los exilios, y entonces la completa Redención ya habría llegado al mundo”."},{"id":"p26-b5","pageNumber":26,"indexInPage":5,"text":"Incluso el hombre que todavia no logro cumplir la Ley Divina y sus Preceptos, y segun ella tendria que sufrir aflicciones, si cree que “Todo es"},{"id":"p26-b6","pageNumber":26,"indexInPage":6,"text":"para bien” y agradece al Creador por todo, es suficiente para que se le anulen la mayoria de los castigos y de los sufrimientos. Esto es debido a que en su simple fe el cumple el objetivo de la Creacion, y asi mitiga una gran parte de la Ira Divina. Porque la esencia de la Ira Divina que hay en el mundo, y por la que llegan todos los castigos y sufrimientos, es por la fe deficiente que es el aspecto de la idolatria. Cuando desaparece este tipo de idolatria del mundo, entonces tambien desaparece la Ira Divina."},{"id":"p26-b7","pageNumber":26,"indexInPage":7,"text":"Con mayor razon, el hombre que se esfuerza para cumplir con los Preceptos Divinos, aunque todavia fracasa al tratar de hacerlo, si solo mantiene esta virtud de aceptar todo con amor, ciertamente que tendra una vida muy dulce. El maestro, autor de este libro, se encontro con un caso que demuestra esto en forma extraordinaria. Al terminar una de sus lecciones, se le aproximo un hombre que parecia estar lejos de observar los Preceptos."},{"id":"p26-b8","pageNumber":26,"indexInPage":8,"text":"Le conto al maestro que llego a su leccion despues de escuchar un CD suyo sobre el agradecimiento y la fe que “Todo es para bien”. Le conto que ya un tiempo antes de recibir ese CD empezo a vivir de esa forma, a agradecerle al Creador por cada cosa y observo como siempre todo le salia bien, por eso, cuando escucho el CD que habla de ese tema, quiso encontrar al maestro y atestiguar sobre la veracidad de las cosas. “¿Como llegaste a esta creencia?”, le pregunto el maestro. Conto el hombre que un dia leyo en la Biblia el libro de Job."},{"id":"p26-b9","pageNumber":26,"indexInPage":9,"text":"Llego a la parte donde la esposa de Job trata de persuadirlo a no creer en el Creador que le trae tantos sufrimientos, y la respuesta de Job fue (Job 2:10): “Tú hablas como una de las impías. ¿Hemos de recibir acaso el bien de Di-s y no hemos de recibir el mal?”. Estas palabras le penetraron en el corazon, y lo estimulo a entender que esta es ciertamente la verdad absoluta; el hombre tiene que recibir el mal con amor. El adopto que desde ese momento agradeceria todo y aceptaria todo con alegria, sea lo que sea."},{"id":"p26-b10","pageNumber":26,"indexInPage":10,"text":"¡Y he aqui, que maravilla! ¡Su vida cambio totalmente para bien! Desde que comenzo a hablar cada dia con el Creador y agradecerle, consultarle y pedirle todo lo necesario en su propia lengua, ve todo el tiempo milagros y prodigios – ve como el Creador lo supervisa y le convierte todo para bien, tiene exito en todos sus asuntos y ocupaciones. En resumen, el vive una feliz vida de fe."},{"id":"p26-b11","pageNumber":26,"indexInPage":11,"text":"¡¿Cómo no estar alegre?! Este hombre vino a la leccion con su hermano – un hombre muy religioso y observante. Este se acerco tambien al maestro, y contrariamente a su hermano “alejado” de la Ley Divina, quien conto que esta alegre y que le va"}],"rawCharCount":4851},{"pageNumber":27,"blocks":[{"id":"p27-b0","pageNumber":27,"indexInPage":0,"text":"bien en la vida, comenzo a quejarse que la suya esta llena de sufrimientos y preocupaciones, y no tiene exito. El conto que sobrelleva todo solamente gracias a su hermano que lo apoya, lo alienta, y que le recuerda que “Todo es para bien”. Queria preguntarle sobre una queja que tiene sobre la conducta del Creador: “Estimado maestro, yo no lo entiendo... ¿Esta es la Ley Divina y su recompensa?"},{"id":"p27-b1","pageNumber":27,"indexInPage":1,"text":"¿Por que yo – que cumplo los Preceptos Divinos – tengo una vida amarga, sin felicidad ni exito; y mi hermano que no cumple casi nada, esta alegre y tiene buena vida?”. Le contesto el maestro: “Hay una regla espiritual que dice:„No hay tribulaciones sin transgresiones‟."},{"id":"p27-b2","pageNumber":27,"indexInPage":2,"text":"Aparentemente, hay sobre ti Juicios estrictos y debes arrepentirte y retornar al Creador”. “¡¿De que tengo que arrepentirme?!”, pregunto el hermano. “Yo observo las festividades, practico la caridad, estudio la Ley Divina y mando a mis hijos para que la estudien, vivo la vida con modestia y observo todos los Preceptos, tanto los faciles como los dificiles. ¿Que hago que no esta bien? Yo entiendo que no hay sobre la Tierra un hombre que haga siempre el bien y nunca peque pero, ¿por que semejantes aflicciones? ¿Debido a que y por que?”."},{"id":"p27-b3","pageNumber":27,"indexInPage":3,"text":"Le contesto el maestro: “La razon por la cual el Juicio Divino se ejerce contra ti es completamente distinta de lo que crees. Tu piensas, que el Juicio llega al hombre solo cuando traspasa un Precepto o una Ley. Pero tu no sabes que el hombre es demandado esencialmente porque no da las gracias; porque no acepta la Supervision del Creador con amor y con fe; porque esta triste y nunca esta satisfecho. Todas estas reclamaciones son de mucho peso en el Cielo, pues la fe es la satisfaccion del Creador."},{"id":"p27-b4","pageNumber":27,"indexInPage":4,"text":"El no tiene satisfaccion de los Preceptos cumplidos por el hombre si no lo llevan a vivir con fe y aceptar todo lo que le sucede con alegria. Y tu mismo trajiste la evidencia cuando dijiste que tu hermano transgrede muchos Preceptos y a pesar de todo su vida es muy linda y alegre. Debes saber que esto es solo debido a que el cree en el Creador y Le agradece todo, y por eso no hay Juicios estrictos sobre el y no le llegan sufrimientos."},{"id":"p27-b5","pageNumber":27,"indexInPage":5,"text":"Pero tu, tienes una vida dificil porque realmente no crees en El, no Le agradeces todas las cosas, y por eso te llegan castigos. ¡Debes entender muy bien! La mayoria de los sufrimientos son debidos generalmente a que no se agradece por todo. Pero tu hermano, que si lo hace, esta mas cerca de la finalidad que tu, y el Creador siente mucho mas placer de el tal como es, solo debido a que cree en El”. “¿¡Que?!”, se"},{"id":"p27-b6","pageNumber":27,"indexInPage":6,"text":"sublevo el hermano religioso. “¿¡El esta mas cerca de la finalidad que yo?! ¿Qué hace el? ¡No cumple casi nada!”. Le dijo el maestro: “Ven y te mostrare lo que escribe uno de los grandes Sabios, que demuestra que tu hermano cumple muchas cosas”. Abrio un libro y empezo a leer un comentario sobre “Exodo”, el segundo libro del Pentateuco: “... y el objetivo de todos los Preceptos, es que creamos en nuestro Di-s, y que Le agradezcamos a El que nos creo. Y esta es la intencion de la Creacion y no hay otra razon."},{"id":"p27-b7","pageNumber":27,"indexInPage":7,"text":"No tiene el Creador otra voluntad salvo que el hombre sepa esto, y que Le agradezca”. La explicacion es que el reconocimiento en el Creador, la creencia en Su Liderazgo y el agradecimiento que llega despues, esa es la finalidad de la creacion del universo, y si no fuera por eso, no tendría el Creador ninguna voluntad en Sus criaturas..."},{"id":"p27-b8","pageNumber":27,"indexInPage":8,"text":"Nueva claridad El hermano religioso estaba asombrado, se le aclaro que estaba mucho mas lejos de su meta que su hermano a quien siempre menosprecio. Le golpeo el conocimiento que no tiene ninguna ventaja sobre el al cumplir los Preceptos, si no lo llevan a la fe que todo proviene del Creador, y que “Todo es para bien”. El maestro continuo: “Ahora entiendes que tu hermano, que siempre te parecio estar lejos del cumplimiento de la Ley Divina, esta en verdad mas cerca de su cumplimiento que tu."},{"id":"p27-b9","pageNumber":27,"indexInPage":9,"text":"Porque el cree que “Todo es para bien”, acepta todo lo que el Creador le hace con amor, conversa con El sobre cada cosa y le da las gracias por todo, que como vimos, esa es Su Voluntad en la creacion del mundo. Mientras que tu eres en efecto \"religioso\", pero no vives la fe y la Supervision Divina. Cada vez que algo no se realiza segun tu voluntad, no estas contento. Te quejas y te culpas. Excepto decir \"Bendito sea Su Nombre\" por costumbre, nunca estas verdaderamente satisfecho con lo que te pasa."},{"id":"p27-b10","pageNumber":27,"indexInPage":10,"text":"No conversas con el Creador, no Le participas en todo lo que te sucede y por supuesto que no Le agradeces. Por eso, no cumples la finalidad de la Creacion con la observacion de los Preceptos, y esto despierta el estricto Juicio sobre ti, más que cualquier otra transgresión\". El interes del hermano religioso crecio muchisimo. Un nuevo mundo se revelo frente a el, un mundo que estuvo frente a sus ojos todo el tiempo y simplemente no lo vio. Pregunto al maestro:"}],"rawCharCount":4871},{"pageNumber":28,"blocks":[{"id":"p28-b0","pageNumber":28,"indexInPage":0,"text":"“Pero cumplir los Preceptos es parte de la Voluntad Divina. Yo entiendo que cuando mi hermano conversa con el Creador y Le agradece, hace algo muy importante, ¿pero que con todos los Preceptos? ¿Como se puede ignorar que no cumple con la Voluntad del Creador en todo lo que ha ordenado?”."},{"id":"p28-b1","pageNumber":28,"indexInPage":1,"text":"Le dijo el maestro: “El Creador tiene mucha paciencia, en vista que tu hermano se acerco al mas profundo y verdadero punto de la fe, que es la finalidad de toda la Ley Divina y los Preceptos, ciertamente llegara tambien a su cumplimiento, por esto al Creador le vale la pena esperar. El Creador no viene con quejas a Sus criaturas, y no espera de un hombre alejado de El que se transforme en “Moises”, el gran Justo, en un solo dia. Todavia veras que se acercara como es debido a la practica de los Preceptos con mucha alegria y amor."},{"id":"p28-b2","pageNumber":28,"indexInPage":2,"text":"En vista que conversa con el Creador y lo hace participe de lo que sucede en su vida, todo desde el punto de vista que “Todo es para bien” y no por miedo o calculos sobre el Mundo Venidero, de por si llegara a cumplir la Ley Divina completamente, se arrepentira y retornara al Creador desde el amor. Pero tu, que ya cumples los Preceptos, podrias facilmente conectarte con la fe, porque esta es la meta de toda la Ley Divina y sus Preceptos."},{"id":"p28-b3","pageNumber":28,"indexInPage":3,"text":"Mientras tanto, hay sobre ti una gran exigencia – ¿Por que no te diriges en la practica de los Preceptos hacia la fe? ¿Por que no conversas con el Creador sobre cada cosa? Te pareces a un hombre que recibio un automovil de su lugar de trabajo para viajar a un determinado destino, y no llego a el. Tu recibiste la Ley Divina con la cual podrias llegar al objetivo – que es la fe – y no llegaste. Tu hermano se parece al hombre que ha llegado a su destino sin un vehiculo, porque llego directamente a la fe."},{"id":"p28-b4","pageNumber":28,"indexInPage":4,"text":"Cuando tambien el reciba el automovil – la Ley Divina y los Preceptos – lograra que su fe solo vaya hacia adelante y crezca. Por lo tanto, el Creador te mando los sufrimientos para estimularte al ver el error en el que vives."},{"id":"p28-b5","pageNumber":28,"indexInPage":5,"text":"Si desde ahora empiezas a trabajar sobre la creencia que “Todo es para bien”, agradeceras al Creador cada dia sobre todo, conversaras con El y Le participaras en todo lo que te sucede, entonces con certeza veras como se mitigaran completamente todos los Juicios que hay sobre ti, y viviras una vida llena de alegria”."},{"id":"p28-b6","pageNumber":28,"indexInPage":6,"text":"Este hecho real debe estimular a cada uno de nosotros a cambiar toda concepcion de vida, y entender que lo esencial es la fe. No se puede medir a ningun hombre para saber su verdadero valor, porque es imposible saber su nivel de fe. Por supuesto que no satisface solamente tener simple fe sin el cumplimiento de la Ley Divina. Porque la fe tiene niveles sin fin; y hay comprensiones de la fe, que sin cumplir la Ley Divina y los Preceptos no se puede llegar a ellas."},{"id":"p28-b7","pageNumber":28,"indexInPage":7,"text":"El mismo Creador que ordeno creer en El, ordeno tambien cumplir los Preceptos. El mensaje principal de este hecho es que el hombre observante debe poner todo el enfasis en su trabajo sobre la fe, y que su intencion en cada Precepto y estudio de la Ley Divina sea llegar, por medio de ellos, a la fe completa. Si no hace esto, resulta que el hombre no utiliza las herramientas que le dio el Creador con Su Misericordia para la meta adecuada, sino para otra."},{"id":"p28-b8","pageNumber":28,"indexInPage":8,"text":"Ésta es una regla en la vida: hay cosas, que el hombre debe pasar – quiera o no quiera – sin poder escaparse de ellas, y toda su elección es sólo cómo las pasará. … El Creador dirige a cada uno en cada momento de su vida por el curso correcto por el que debe marchar, y donde, a pesar suyo, hay tambien cosas que no son de su voluntad. Por ejemplo, es posible que en un momento de su vida debera el hombre tener contactos con ciertas personas que lo af ligen y que ciertamente se hubiera alegrado de no conocer nunca."},{"id":"p28-b9","pageNumber":28,"indexInPage":9,"text":"Sin embargo, el Creador quiere que tenga esas relaciones, debido a que tiene que hacer una cierta “correccion” con ellos. Hay lugares en los que tendra que pasar o permanecer en ellos tambien en contra de su voluntad, sin que pueda entender por que llego alli – porque tiene lo que corregir en esos lugares. Y asi todo tipo de pruebas – fisicas, espirituales o financieras que el debe pasar a pesar suyo, porque son parte del curso por el que el Creador quiere que marche, incluso aunque no le parezca."},{"id":"p28-b10","pageNumber":28,"indexInPage":10,"text":"Todas esas pruebas y dificultades le llegan al hombre sorpresivamente, sin consideracion por sus planes. Y debido a que el hombre mismo no sabe cuales seran las correcciones que tendra que hacer en su vida, se confunde con cada cosa que no le va como lo ha planeado y le parece que su vida esta complicada."},{"id":"p28-b11","pageNumber":28,"indexInPage":11,"text":"Pero si se fortaleciera a creer que los acontecimientos de su vida no son casuales sino segun los planes del Creador, entonces sabria que no hay ningun error o confusion en su vida sino que esta pasando en ese momento una prueba, y que todo va exactamente segun la planificacion del"}],"rawCharCount":4840},{"pageNumber":29,"blocks":[{"id":"p29-b0","pageNumber":29,"indexInPage":0,"text":"Todopoderoso para acercarlo a El. Como resultado, aceptaria todo lo que le sucede con la conviccion que “Todo es para bien”. “A pesar tuyo – vives” Un hombre que esta pasando una prueba debe reforzarse en comprender que a pesar suyo debe pasar esta prueba, y la unica forma de hacerlo es fortalecerse en la fe que “Todo es para bien”. Es decir, estar alegre con lo suyo, y tratar de buscar cual es el mensaje que el Creador le manda."},{"id":"p29-b1","pageNumber":29,"indexInPage":1,"text":"Pero, tambien, si no logra entender el mensaje, debe recibir todo con amor y estar alegre con lo suyo, y eso mismo es un servicio al Creador, tal como dijeron los grandes Sabios: “Debe el hombre bendecir el mal con completo conocimiento y con buena voluntad, de la misma manera que bendice el bien con alegria. Porque el mal para los servidores del Creador, es su alegria y su bien, puesto que aceptan con amor lo que el Creador les decreto. Encontramos, que en su aceptacion del mal el sirve al Creador, lo que es su alegria”."},{"id":"p29-b2","pageNumber":29,"indexInPage":2,"text":"Esta es una regla en la vida: hay cosas, que el hombre debe pasar – quiera o no quiera – sin poder escaparse de ellas, y toda su eleccion es solo cómo las pasara. Si lo hara con la creencia que “Todo es para bien” – sera dichoso y feliz, porque vera como se le transforman para bien. Pero si el vive sin esa creencia, entonces solo estara amargado, insatisfecho y quebrado; se quejara, se culpara a si mismo y a los otros y toda su vida sera amarguras y oscuridad. Probablemente tambien se traera sobre si mismo otras calamidades..."},{"id":"p29-b3","pageNumber":29,"indexInPage":3,"text":"Los sufrimientos no existen Debemos saber que los unicos sufrimientos que hay en el mundo provienen de la falta de fe. Quien sabe que todo esta bajo la Supervision Divina no siente ningun sufrimiento o pesar. Todo el tiempo que el hombre se mantiene en la creencia que “Todo es para bien” y Le agradece al Creador por todo, tambien por las cosas que no son buenas, una gran felicidad fluye sobre el, se llena con una alegria interior y todo se le transforma en bien."},{"id":"p29-b4","pageNumber":29,"indexInPage":4,"text":"Encontramos, que en verdad, el unico castigo que hay en este mundo es cuando se le quita al hombre la fe. Por lo tanto, cuando sentimos que no nos va bien, pidamos al Creador que nos devuelva la fe que “Todo es para bien”. Luego, empezaremos a agradecer todo, incluso aunque todavia no sentimos que las cosas son buenas, porque por medio del agradecimiento, nos iluminara de nuevo la luz de la fe y nos llegara la alegria."},{"id":"p29-b5","pageNumber":29,"indexInPage":5,"text":"El verdadero reposo En el primer libro del Pentateuco se elogia a una de las Doce Tribus de Israel, la tribu de Isajar, en los siguientes terminos (Genesis 49:15): “Aunque ve que el reposo es bueno y que la tierra es agradable, ofrece su hombro a la carga y se somete al trabajo”. Aprendemos aqui una gran leccion – ¿cuando logra el hombre el verdadero buen reposo? Cuando “ofrece su hombro a la carga”, es decir cuando puede soportar todo lo que le sucede, sin ninguna inquietud."},{"id":"p29-b6","pageNumber":29,"indexInPage":6,"text":"Pero, ¿cuando puede el hombre soportar todo?, ¡solo cuando cree que los acontecimientos de su vida son supervisados desde lo Alto y para bien! Solo entonces podra soportarlo todo, y solo asi tendra reposo. Porque el unico reposo de todas las preocupaciones y sufrimientos de este mundo es solamente la fe."},{"id":"p29-b7","pageNumber":29,"indexInPage":7,"text":"Sin la simple fe que “Todo es para bien”, este mundo es el infierno mismo, y todavia peor, porque el Juicio de los malvados en el infierno esta limitado a doce meses, pero en este mundo hay gente que tiene un infierno continuo de decenas de anos. ¿Y cual es su infierno? La sensación de amargura e insatisfaccion que esta incubada siempre dentro de sus corazones. Porque no existe un sufrimiento más grande que el estar amargado e insatisfecho."},{"id":"p29-b8","pageNumber":29,"indexInPage":8,"text":"Y, usualmente, esto esta acompanado con otras formas de infierno – disputas y conflictos, ira, preocupaciones y presiones, envidia, venganza, tristeza y depresion, abatimiento; todo eso debido al escepticismo, porque no se recibe con fe completa que todo lo que sucede proviene del Creador. Pero quien posee la fe y cree que todo proviene del Todopoderoso, su vida es un paraiso."},{"id":"p29-b9","pageNumber":29,"indexInPage":9,"text":"Una historia verdadera cuenta sobre un famoso maestro espiritual contemporáneo, que por diferentes razones fue obligado a dejar sus estudios sagrados e ir a trabajar como... ¡un simple empleado de banco!…"},{"id":"p29-b10","pageNumber":29,"indexInPage":10,"text":"La alegría es el comienzo del libre albedrío En cada momento de su vida, el hombre tiene frente a el el libre albedrio. La mayoria de la gente piensa que su eleccion siempre empieza con las consideraciones pertinentes – ¿cual es la cosa adecuada para hacer?, ¿como hacerla?, etc. Pero en verdad, el libre albedrio empieza antes – con la eleccion de estar contento con lo que se tiene o no. Encontramos entonces que el libre albedrio se divide en dos etapas:"}],"rawCharCount":4649},{"pageNumber":30,"blocks":[{"id":"p30-b0","pageNumber":30,"indexInPage":0,"text":"a) la eleccion de estar alegre o no; b) la eleccion pertinente. Solamente si el hombre eligio correctamente en la primera etapa y esta alegre, solo entonces puede pasar a la segunda etapa que es elegir en forma aplicable – con todas las dudas que tiene – que hacer y como hacerlo, si es la cosa adecuada, o tal vez sera mejor hacer algo distinto. Sin embargo, si elige bien en su primera eleccion y esta alegre, entonces casi no tendra ninguna duda, y la eleccion de lo que debe hacer le sera muy facil."},{"id":"p30-b1","pageNumber":30,"indexInPage":1,"text":"Pero si en su primera eleccion no eligio correctamente y no esta contento con lo suyo, entonces no puede acercarse a la segunda etapa, porque por medio de la tristeza el hombre pierde completamente la capacidad del libre albedrio. Esa es la causa que cuando el hombre esta triste, no tiene la capacidad de pensar correctamente y tomar adecuadas decisiones; hasta ni tiene la fuerza para moverse y actuar. Ademas, por la tristeza el Creador lo abandona, y por supuesto que sin Su ayuda no podra hacer nada."},{"id":"p30-b2","pageNumber":30,"indexInPage":2,"text":"Alegría cotidiana Por lo tanto, el hombre debe siempre estar satisfecho con el curso que lleva su vida, y estar alegre con lo que hace; porque con esto estara seguro que por lo menos cumple con la primera etapa de su libre albedrio. Vemos a muchas personas insatisfechas con su vida sin una razon especial y si les preguntaras por que no lo estan, no sabrian contestarte. Simplemente sienten una sensacion de perdida constante, no estan seguros si eligieron el camino correcto."},{"id":"p30-b3","pageNumber":30,"indexInPage":3,"text":"Sin embargo, a la luz de lo que recien explicamos, esta claro que debido a que no estan satisfechos, en cada momento de sus vidas no eligen correctamente. La sensacion de que quizas no hacen lo correcto, es un gran error que se debe rectificar antes de toda otra accion. Incluso cuando le esta claro al hombre que debe hacer cambios espirituales o materiales, lo que supuestamente es una causa real para estar insatisfecho, tambien entonces su libre albedrio comienza necesariamente a estar contento con lo suyo."},{"id":"p30-b4","pageNumber":30,"indexInPage":4,"text":"Por esto, el Creador esta con el y puede pensar con claridad, tomar decisiones y adoptar cambios en su vida. Con mayor razon, cuando el hombre no sabe lo que tiene que cambiar y que es lo bueno para el, debe estar entonces contento con la realidad en la que vive y al menos estara seguro que cumple con la primera etapa de su libre albedrio adecuadamente. Por lo tanto, en cada cosa que hace el hombre, como cuando cuida a sus hijos, arregla sus asuntos, o tambien cuando reza, estudia la Ley Divina,"},{"id":"p30-b5","pageNumber":30,"indexInPage":5,"text":"cumple uno de los Preceptos o hace beneficencia, hara todo con alegria. No dejara que su Mala Inclinacion le de una sensacion de perdida, como si tuviera que hacer otra cosa. Porque esta es la conducta de la Mala Inclinacion, confundir al hombre en todo lo que trata de hacer para que jamas este satisfecho. Pero este no es el camino. Lo principal de todo es que el hombre este complacido con lo suyo, y haga todo con alegria. Si despues entiende que tiene que hacer otra cosa – la hara, pero tambien con alegria."},{"id":"p30-b6","pageNumber":30,"indexInPage":6,"text":"En resumen, cuando la vida se desarrolla sin obstaculos especiales, ciertamente que debemos creer que “Todo es para bien”. Asi estaremos alegres y podremos buscar hasta encontrar la mision en lo que hacemos. Pero, si cuando no tenemos problemas especiales no estamos contentos, ¿como podremos alegrarnos cuando nos llegan imprevistos e insolitos obstaculos, a los que es imposible sobreponerse sin fortalecerse en reconocer que “Todo es para bien?”."},{"id":"p30-b7","pageNumber":30,"indexInPage":7,"text":"Aspiraciones Cuando el hombre tiene problemas y quiere hacer algunos cambios en su vida, como el trabajo que no le satisface, o su departamento que es pequeno, y no esta en sus manos poder hacerlo, es una senal que la Voluntad del Creador es que por el momento esta sea tu realidad. Debe aceptar la Voluntad Divina con alegria, sabiendo que “Todo es para bien”."},{"id":"p30-b8","pageNumber":30,"indexInPage":8,"text":"No necesitas dejar de lado tus deseos de cambio, sino mientras tanto aceptar la realidad con amor y establecer un determinado tiempo cada dia – poco o mucho – para rezar a Quien en Cuya mano esta cambiar cada cosa, pidiendole el cambio requerido y el resto del dia estaras alegre. El hombre debe creer que a cada cosa le esta determinado su tiempo y este llegara segun la Voluntad del Creador."},{"id":"p30-b9","pageNumber":30,"indexInPage":9,"text":"Incluso en los temas espirituales, cuando el hombre desea estudiar mas la Ley Divina y no puede; o quiere corregir una mala cualidad de su caracter o sobreponerse a un mal apetito – y no lo logra, tiene que continuar deseando el cambio y hacer todo lo que esta en su poder – aprender sobre ese tema y rezar. Pero hasta que merezca que el Creador cumpla su deseo, debe recibir su realidad con amor. Esto le aliviara mucho, y tambien le reducira los danos que esas faltas o defectos le producen."},{"id":"p30-b10","pageNumber":30,"indexInPage":10,"text":"Es necesario saber que la falta de exito en el servicio al"}],"rawCharCount":4764},{"pageNumber":31,"blocks":[{"id":"p31-b0","pageNumber":31,"indexInPage":0,"text":"Creador es tambien un tipo de sufrimiento, porque ciertamente es muy agradable estar libre de apetitos, ser dueno de perfectas cualidades de caracter, ser perseverante en el estudio espiritual, etc."},{"id":"p31-b1","pageNumber":31,"indexInPage":1,"text":"Esa falta de exito puede ser debida a las siguientes razones: a) Es posible que los sufrimientos le llegan desde lo Alto para expiar por todo el tiempo que estuvo alejado del servicio al Creador, o no se esforzo lo suficiente para ello. b) Es posible que la demora desde lo Alto se deba a que el hombre no tiene todavia los instrumentos necesarios para recibir el determinado nivel espiritual que pide, pues si lo recibiera inmediatamente lo llevaria a la arrogancia y lo danaria."}
