  </style>

  <script type="application/json" id="book-data">{"title":"El Jardín de la Fe","fileName":"El_Jardin_de_La_Fe.pdf","totalPages":126,"pages":[{"pageNumber":1,"blocks":[{"id":"p1-b0","pageNumber":1,"indexInPage":0,"text":"Este mundo está lleno de preguntas: ¿Cuál es el sentido de la vida? ¿Adónde voy? ¿Hacia dónde se dirige la humanidad? ¿Cómo debería yo vivir mi vida? ¿Seré feliz alguna vez? La lista es interminable..."},{"id":"p1-b1","pageNumber":1,"indexInPage":1,"text":"Hasta ahora, no se ha encontrado una guía práctica para la vida. Si eres de los que solo bajas pero no subes recuerda; abemos personas que lo subío también tenemos hambre"}],"rawCharCount":371},{"pageNumber":2,"blocks":[{"id":"p2-b0","pageNumber":2,"indexInPage":0,"text":"Aprobaciones rabínicas:"},{"id":"p2-b1","pageNumber":2,"indexInPage":1,"text":"Presentamos extractos de algunos de los elogios y aprobaciones que hemos recibidos de las principales figuras rabínicas de Esta generación para la versión original de este libro:"},{"id":"p2-b2","pageNumber":2,"indexInPage":2,"text":"Se ha alegrado mi corazón y mi alma se deleitó al leer las páginas del libro el jardín de la fe que brilla con las palabras luminosas es la obra de un artista el brillante justo y humilde rabino shalom Arush shit a pleno conocimiento de todas quién Ilumina la oscuridad como la luz del día que goce de muchos días felices."},{"id":"p2-b3","pageNumber":2,"indexInPage":3,"text":"Gran rabino Ovadia yosef shit. El rishon letzion y el presidente del consejo de los sabios de la Tora."},{"id":"p2-b4","pageNumber":2,"indexInPage":4,"text":"Me siento impresionado hasta lo más profundo de mi alma ante este libro tan valioso e importante el jardín de la fe que trata del el tema de la paz y el honor en la presencia divina en cada ser a través de la verdadera Paz y en el Moto respeto ante todo este libro debe encontrarse en cada hogar y cada uno debería esforzarse en difundirlo hasta que no hay hogar alguno Que no lo tenga qué quién obtenga este libro se ha bendecido con todas las bendiciones posibles amén"},{"id":"p2-b5","pageNumber":2,"indexInPage":5,"text":"Rabino Eliezer berland shit. Presidente de la yeshiva shiru barmin Jerusalén."},{"id":"p2-b6","pageNumber":2,"indexInPage":6,"text":"El nuevo libro en español \"En el Jardín de la Fe\" trata los antiguos enigmas de la vida en forma simple y clara. Magistralmente, el Maestro Arush trae las profundas enseñanzas de los grandes Justos y Sabios de todas las generaciones - los mayores doctores del alma que alguna vez vivieron - a nivel del lector contemporáneo. Da al lector probados instrumentos para afrontar con eficacia las situaciones más desafiantes de la vida."},{"id":"p2-b7","pageNumber":2,"indexInPage":7,"text":"\"En el Jardín de la Fe\" ha aparecido ya en varios idiomas y ahora en español, y ha sido aclamado por líderes espirituales y lectores de todo el mundo."},{"id":"p2-b8","pageNumber":2,"indexInPage":8,"text":"Una vez que leas este libro, te preguntarás cómo pudiste vivir sin él.. Prefacio de la nueva edición española"},{"id":"p2-b9","pageNumber":2,"indexInPage":9,"text":"En la lectura del libro \"En el Jardín de la Fe\", las personas han encontrado la alegría de vivir, la felicidad y el fortalecimiento interior. Enfermos graves encontraron apoyoy lograron curarse. Los que habían perdido la voluntad de vivir volvieron literalmente a la vida."},{"id":"p2-b10","pageNumber":2,"indexInPage":10,"text":"Cada uno que lo ha leído atestiguó que le trajo apaciguamiento y calma, y que no pudo dejarlo. Muchas personas consagraron un tiempo fijo para su estudio. Estudiantes y profesores aseveraron que entre innumerables libros que habían leído, este era el único que se dirigía a sus corazones, por la sencillez y la veracidad que se desprenden en cada página."},{"id":"p2-b11","pageNumber":2,"indexInPage":11,"text":"Varios Justos contemporáneos declararon que este libro reavivará las almas y que es un gran mérito publicarlo y difundirlo."},{"id":"p2-b12","pageNumber":2,"indexInPage":12,"text":"Este libro ha tenido éxito en varios idiomas y su ímpetu sigue creciendo. Hemos recibido reacciones asombrosas de todas partes. Gente de todo tipo, ha certificado que este libro ha cambiado dramáticamente sus vidas."},{"id":"p2-b13","pageNumber":2,"indexInPage":13,"text":"En resumen, este libro fue acogido con mucho amor y con una gran sed por parte de todos los estratos de la sociedad, más allá de toda expectativa. Hasta incrédulos y agnósticos, despertaron a la creencia en el Creador del Universo. La única explicación posible, es que la enseñanza de la fe y su"}],"rawCharCount":3120},{"pageNumber":3,"blocks":[{"id":"p3-b0","pageNumber":3,"indexInPage":0,"text":"difusión en todas partes del mundo expresan la Voluntad Divina, pues esta es la finalidad de la Creación entera – la fe."},{"id":"p3-b1","pageNumber":3,"indexInPage":1,"text":"Prácticamente, se nos ha confirmado lo que ya sabíamos, aunque no habíamos comprendido el impacto real de este conocimiento: que el tremendo poder que está contenido en las palabras de la fe auténtica, es una panacea que todo ser humano necesita, busca, quiere y goza, como prueban las reacciones que recibimos sobre esta obra."},{"id":"p3-b2","pageNumber":3,"indexInPage":2,"text":"Palabra personal del autor"},{"id":"p3-b3","pageNumber":3,"indexInPage":3,"text":"Durante el curso de mi trabajo y mi contacto diario con la gente de alrededor del mundo que busca mi consejo y ayuda, he llegado a la clara conclusión que la raíz de todo el sufrimiento humano, no es más que la carencia de la auténtica fe. Por medio del perfeccionamiento de la fe, se satisfacen todas las carencias espirituales y materiales. Por lo tanto la esencia del trabajo espiritual del hombre en este mundo, es perfeccionar su fe."},{"id":"p3-b4","pageNumber":3,"indexInPage":4,"text":"Una y otra vez, he sido testigo de como la gente ha vencido problemas personales, aparentemente insuperables, fortaleciendo su fe; esta fue mi motivación en la escritura de este libro, “que es todo fe”."},{"id":"p3-b5","pageNumber":3,"indexInPage":5,"text":"Debes saber que cada vez que mencionamos la fe, significa la plegaria y estar contento con lo que poseemos. Porque la fe que no lleva al hombre a rezar, no es completa. Siempre que la fe no lleva al hombre a una directa relación con el Creador, y todavía existen situaciones en las cuales no está alegre – es señal que su fe es débil y aún necesita mucho “refuerzo, nutrición, fertilización y riego”."},{"id":"p3-b6","pageNumber":3,"indexInPage":6,"text":"Si mi único deseo hubiera sido escribir un libro que define la fe y alaba sus virtudes, yo no me hubiera molestado; gracias al Creador, hay muchos libros en el mercado que lo hacen mejor que lo que yo podría hacerlo. Pero todo mi objetivo en este modesto volumen, es llevar al lector a la inequívoca conclusión que él o ella tienen que fortalecer su fe, y haciéndolo, podrán ilusionarse con una nueva, más feliz y satisfactoria vida – en este mundo y en el venidero. Por ejemplo, ¿tienes problemas financieros?"},{"id":"p3-b7","pageNumber":3,"indexInPage":7,"text":"Reza por la fe y tus ingresos mejorarán automáticamente. ¿Tu matrimonio está fracasando? Reza por la fe y tendrás felicidad conyugal."},{"id":"p3-b8","pageNumber":3,"indexInPage":8,"text":"¿Sufres de problemas emocionales? El fortalecimiento de la fe es lo más seguro del mundo para la salud emocional. Esto mismo es aplicable para cada problema que tienes en la vida, comoexplicaremos ampliamente en este libro. Quien logra entender este gran principio – que la fe es la llave maestra para la apertura de cualquier puerta en la vida – dedica la mayor parte de su tiempo y esfuerzos para lograr la fe auténtica."},{"id":"p3-b9","pageNumber":3,"indexInPage":9,"text":"En vez de pasar de un consejo a otro, de un subterfugio a otro, y una vez tras otra caer de la esperanza a la desilusión, ese hombre busca una sola cosa – fortalecer su fe."},{"id":"p3-b10","pageNumber":3,"indexInPage":10,"text":"Con la fe, no sólo el hombre logra salvarse de toda calamidad y desgracia, sino que su vida entera toma un giro completamente distinto. Todo el mundo se le transforma en muy bello y dulce; logra una vida de satisfacción, felicidad y paz interior. Y así, viviendo con la fe, cumple la meta de la Creación, que es la fe misma. Sólo quien cumple con esa finalidad logra vivir la más auténtica, buena y agradable vida."},{"id":"p3-b11","pageNumber":3,"indexInPage":11,"text":"Además, quien vive con fe, no sólo merece y logra su propia redención, sino que cumple también su rol en la Redención del mundo entero."},{"id":"p3-b12","pageNumber":3,"indexInPage":12,"text":"Por lo tanto, te pido por favor, querido lector – lee este libro con concentración, y verás cómo la fe es la base de todas las cosas en el mundo, y que por medio de ella se puede lograr todas las bendiciones y todo lo bueno posible."},{"id":"p3-b13","pageNumber":3,"indexInPage":13,"text":"Si un solo lector mereciera tomar conciencia de este profundo asunto y comenzara a concentrar todo sus esfuerzos para aumentar la fe en su vida, será esa mi recompensa y mi complacencia. De ser así, valdría la pena por esa persona especial, todo mi trabajo y esfuerzos para sacar a la luz este libro."},{"id":"p3-b14","pageNumber":3,"indexInPage":14,"text":"He titulado este libro “En el Jardín de la Fe”, aludiendo que la fe conduce a una vida tan hermosa como pasear por los caminos encantados de un exuberante jardín exótico. De hecho, por la fuerza de la fe, el mundo entero es un hermoso jardín que da infinitas y magníficas flores de todo tipo, maravillosos perfumes y deliciosas frutas. La fe tiene el poder de ayudar a la persona a crecer como es debido, sin dañarse con las tormentas y crisis que"}],"rawCharCount":4278},{"pageNumber":4,"blocks":[{"id":"p4-b0","pageNumber":4,"indexInPage":0,"text":"por cierto llegarán a lo largo de su vida. Tal como se siembra un grano en una tierra fértil y crece como se debe y florece, así la fe es la fuerza para desarrollarse y crecer; nada en el mundo conduce tanto al crecimiento y desarrollo personal del hombre como la fe."},{"id":"p4-b1","pageNumber":4,"indexInPage":1,"text":"Un hombre creyente se asemeja a un árbol plantado en un jardín de tierra fértil, que crece y da frutos, tal como dijo el Rey David (Salmos 1:3): “Será cual un árbol plantado junto a corrientes de agua, que da su fruto a su debido tiempo y cuyas hojas no se marchitan...”."},{"id":"p4-b2","pageNumber":4,"indexInPage":2,"text":"Mi rezo al Creador del Universo, que se realice mi deseo: que todos los que lean este libro se esfuercen para lograr la fe auténtica. Bendigo a todos ustedes, queridos lectores, que el aprendizaje de este libro les ayude a acercarse al Creador y conocerlo; que sus problemas desaparezcan y que puedan merecer el rescate personal del cuerpo y del alma, así como vidas largas y felices."},{"id":"p4-b3","pageNumber":4,"indexInPage":3,"text":"Y entonces, lograremos ver juntos la Redención completa del mundo entero, rápidamente y en nuestros días, Amén. R. Shalom Arush"},{"id":"p4-b4","pageNumber":4,"indexInPage":4,"text":"Director de las instituciones “Hilo de Bondad” - “Jut Shel Jésed”. EL JARDIN DE LA FE"},{"id":"p4-b5","pageNumber":4,"indexInPage":5,"text":"¿Qué es lo que desea el Creador de ti, que es por sí mismo tu meta? La respuesta se encuentra el sagrado libro del Zohar..."},{"id":"p4-b6","pageNumber":4,"indexInPage":6,"text":"El enigma de la vida"},{"id":"p4-b7","pageNumber":4,"indexInPage":7,"text":"Este mundo está lleno de preguntas: ¿Cuál es la finalidad de la vida en este mundo lleno de Sufrimiento? ¿Hacia dónde va el mundo y la humanidad? ¿Con quién está la justicia en todas las Ideologías y concepciones de la vida? ¿Cuál es el camino hacia la felicidad? ¿Cómo verdaderamente debemos vivir? ¿Finalmente será todo bueno o no? Y más y más… Las drásticas y aparentemente injustas diferencias entre la vida de una persona y otra y los acontecimientos de sus vidas nos dejan a menudo perplejos."},{"id":"p4-b8","pageNumber":4,"indexInPage":8,"text":"Un hombre tiene una vida fácil, mientras otro una vida difícil y muy penosa. Una persona nace fuerte y sana, mientras otra débil y discapacitada. Uno gana un buen sustento con facilidad, y el otro no. Alguien que fue bueno toda su vida y, como se dice, “no mataba ni a una mosca”, muere de una cruel enfermedad aun siendo joven, mientras otro que es un malvado tiene una larga vida de riquezas y honores. ¿Por qué?..."},{"id":"p4-b9","pageNumber":4,"indexInPage":9,"text":"¿Por qué yo?"},{"id":"p4-b10","pageNumber":4,"indexInPage":10,"text":"En los que más se despiertan estas preguntas son aquellos que más sufren las faltas: Aquel al que le es difícil ganar su sustento pregunta: “¿Por qué fulano tiene una vida de riquezas y bienestar mientras yo vivo una vida de constante escasez y el esfuerzo por mi sustento me saca de mis cabales?”. Alguien que tiene un hijo enfermo pregunta: “¿Por qué todos tienen hijos sanos y fuertes, mientras mi destino es criar un hijo enfermizo que necesita un esforzado tratamiento cotidiano?”."},{"id":"p4-b11","pageNumber":4,"indexInPage":11,"text":"Alguien que esta discapacitado mira a la gente caminando libremente a su alrededor y pregunta: “¿Por qué ellos están enteros de cuerpo mientras yo tengo esta invalidez restrictiva y humillante?”. Alguien que creció en condiciones difíciles ve a aquellos que crecieron en el seno de buenas familias, y se pregunta: “¿Por qué ellos nacieron en una buena y cómoda familia, recibieron calor y amor, fueron mimados, se les"}],"rawCharCount":3107},{"pageNumber":5,"blocks":[{"id":"p5-b0","pageNumber":5,"indexInPage":0,"text":"concedió cada pedido y deseo, mientras yo nací en el seno de una familia difícil y problemática, y únicamente sufrimiento, escasez y humillaciones llenaron Mi vida?”. Alguien que se acerca a los cuarenta años de edad y todavía está soltero, pregunta: “¿Por qué yo, con todas las virtudes que poseo, no logro casarme y fulano que está lleno de grandes defectos, se casó sin demora a edad temprana, con una virtuosa joven de buena familia?”."},{"id":"p5-b1","pageNumber":5,"indexInPage":1,"text":"La regla general es: la gente está llena de preguntas, y cada uno puede agregar a la lista todas las preguntas que se hace a sí mismo."},{"id":"p5-b2","pageNumber":5,"indexInPage":2,"text":"Tiempos cambiantes También sobre la forma que se desarrolla la vida de cada día tenemos preguntas: “¿Porque ayer tuve un día magnifico y todo salió como lo había planeado mientras hoy, sin ninguna razón especial, nada me va bien, todo me sale al revés y siento solo pesar?”. “¿Porque la semana pasada gane mi sustento fácilmente y de repente el cuerno de la abundancia se vacío, y tengo que hacer grandes esfuerzos para traer un pedazo de pan a mi casa?”. “¿Porque ayer tuve tantas satisfacciones de mis hijos que se comportaban como ángeles, disciplinados y simpáticos, y de repente parecería como que el diablo se posesiono de ellos y hacen todo a propósito para enojarme, tanto a mi como a mi esposa?”."},{"id":"p5-b3","pageNumber":5,"indexInPage":3,"text":"Preguntas sin fin…."},{"id":"p5-b4","pageNumber":5,"indexInPage":4,"text":"La respuesta a todas las preguntas Existe una sola y única respuesta a todas las preguntas –la FE. La fe se parece a una llave maestra que abre todos los cerrados dilemas de la vida y por medio de ella la respuesta es simple y bien entendida: el universo posee un supremo y todopoderoso Creador que cuida de cada uno de nosotros en una forma exacta, hecha a medida Según nuestras especificas necesidades, y es lo que se llama Divina Providencia o Supervisión Individual."},{"id":"p5-b5","pageNumber":5,"indexInPage":5,"text":"Él es Quien determina las condiciones exactas en las que viviremos: en el seno de que familia naceremos, con quien nos casaremos, como será nuestro aspecto, cuales serán nuestras cualidades y carácter, cuántos hijos tendremos, cuánto dinero poseeremos, quienes serán nuestros amigos y conocidos, y muchos más datos como arena hay en el mar."},{"id":"p5-b6","pageNumber":5,"indexInPage":6,"text":"Y no solo en forma general, sino también en la vida cotidiana, en cada instante, todo está dirigido desde lo Alto en una Supervisión Individual. Es el Creador quien decreta cuando el hombre prosperara y cuando fracasara, cuando será bien recibido y cuando será despreciado y desdeñado, a quien encontrara y con quien tropezara, e infinitamente más y más detalles."},{"id":"p5-b7","pageNumber":5,"indexInPage":7,"text":"Como está escrito en los Salmos (105:7): “Él es el Eterno nuestro Di-s, sus Juicios están en toda la Tierra” – que significa que todo lo que sucede diariamente en el universo – los éxitos en contraste con los fracasos; la alegría y salvación de unos en contraste con las desgracias y los tormentos que caen sobre otros, todo esto hace parte de los Juicios del Creador, en los cuales son juzgadas las criaturas cada día y cada hora, en general y en particular."},{"id":"p5-b8","pageNumber":5,"indexInPage":8,"text":"Y debemos saber, que la Supervisión del Creador es siempre para el bien eterno de cada hombre, para guiarlo al objetivo, al rango y a la buena y eterna finalidad para la que fue creado. El Creador sabe que tal persona no llegara a la corrección de su alma sin la específica realidad en la que se encuentra, con todas las muchas privaciones que tiene; y que aquella otra llegara a su meta justamente desde una realidad distinta de abundancia y de placeres, etc."},{"id":"p5-b9","pageNumber":5,"indexInPage":9,"text":"Cada dato de la vida del hombre, sin excepción, está bajo una exacta Supervisión Individual, sin Ningún error y no por azar, según lo que el hombre verdaderamente necesita para llegar a su meta y a su corrección espiritual."},{"id":"p5-b10","pageNumber":5,"indexInPage":10,"text":"La Voluntad del Creador ¿Qué es lo que desea el Creador de ti, que es realmente tu meta? La respuesta se encuentra en el sagrado libro del Zohar (Esplendor), la famosa obra esotérica escrita hace casi dos mil años, que declara: “¡El Creador te creo solamente para que Lo conozcas!”. Por lo tanto, todas las condiciones de nuestra vida nos son necesarias, pues el Creador que nos conoce perfectamente, estableció que no podamos conocerlo sino por medio de todas esas especificas condiciones que nos ha dado exactamente."},{"id":"p5-b11","pageNumber":5,"indexInPage":11,"text":"¡No hay ningún error ni azar en ningún detalle de nuestra vida! Este conocimiento se llama tener una “fe completa” y estar “contento con lo suyo”, es decir que el hombre sabe: ¡Yo no entiendo nada y no sé nada, solamente estoy contento con lo que tengo! Y es esto también el primer paso para la elección cierta. Después que el hombre tenga este conocimiento, de ahora en adelante deberá prestar atención como podrá, a través de todos los acontecimientos y sucesos de su vida, conocer al Creador."}],"rawCharCount":4625},{"pageNumber":6,"blocks":[{"id":"p6-b0","pageNumber":6,"indexInPage":0,"text":"Debe el hombre saber perfectamente, que cada detalle de su vida está orientado por El – tanto en el bien como en el mal, “por entendimiento o por fuerza” – para conducirlo a esta meta – que Lo conozca. Muchas veces cuando el hombre no presta atención a las alusiones del Creador, entonces Él le coloca en circunstancias aún más difíciles. Y si todavía no toma conciencia de su meta, el Creador lleva al hombre a situaciones que no tienen ninguna solución natural, hasta que se verá obligado aun contra su voluntad, a apoyarse en la fe."},{"id":"p6-b1","pageNumber":6,"indexInPage":1,"text":"Y como los Sabios han dicho: “No tenemos en quien apoyarnos, sino en nuestro Padre Celestial”. El comienzo de la fe El sagrado libro del Zohar nos ensena, que el comienzo de la construcción de la fe, es el pensamiento y el conocimiento que no existe solo este mundo, sino que existe también un Mundo Venidero. Este es el principio de la memoria, acordarse siempre de esto."},{"id":"p6-b2","pageNumber":6,"indexInPage":2,"text":"Según la siguiente explicación se entenderá porque este conocimiento es necesario para toda persona razonable: Toda persona mentalmente sana, no estará dispuesta a hacer ninguna acción sin que esta tenga un objetivo y una utilidad. Por ejemplo, si se le dice a una persona subir y bajar su brazo durante una hora sin ninguna causa, no lo aceptara de ninguna manera, porque sentirá que hace algo sin una finalidad y sin ningún beneficio."},{"id":"p6-b3","pageNumber":6,"indexInPage":3,"text":"Si así son las cosas en el hombre que es un ser creado, con más razón respecto al Creador que por supuesto no hace ninguna cosa sin finalidad. No puede ser que el Creador haya creado todo el universo – donde infinitos detalles se articulan con una fabulosa precisión y que ilumina con majestuosidad, belleza y maravillosa gracia – sin que haya una razón y finalidad."},{"id":"p6-b4","pageNumber":6,"indexInPage":4,"text":"No puede ser que el Creador haya creado al hombre – una tan maravillosa creación con un cerebro poderoso y profundas fuerzas espirituales – sin que tenga su vida una finalidad. Por consiguiente, cada uno debe preguntarse a sí mismo: ¿Es probable que la meta para la cual el hombre ha sido creado, pueda existir en este mundo, en el cual todo va hacia la perdición y muerte?"},{"id":"p6-b5","pageNumber":6,"indexInPage":5,"text":"¿Es posible pensar que el Creador haya creado un ser humano lleno de sentimiento, creatividad y espiritualidad, para que viva setenta u ochenta años, la mayoría de ellos con sufrimiento y esfuerzo, y luego morir y terminar así su vida? ¿Acaso verdaderamente toda la profundidad del espíritu del hombre y su conocimiento se terminaran y se perderán? Es algo impensable."},{"id":"p6-b6","pageNumber":6,"indexInPage":6,"text":"Necesariamente deberá haber continuación a la vida del alma también después de la muerte del cuerpo, donde lograra una eterna recompensa en el Mundo Venidero, por el cumplimiento de la Voluntad Divina. No obstante, el concepto de “premio y castigo” existe también en este mundo, como un éxito que le llegara a una persona por hacer lo que es recto, o por el contrario – las tribulaciones que le llegaran por sus pecados."},{"id":"p6-b7","pageNumber":6,"indexInPage":7,"text":"Todo eso le llega al hombre solamente para enderezarlo en su camino, para que sepa distinguir, según como su vida se encamina, si transita por la senda justa o no. De esto podemos entender, que los sufrimientos que caen sobre el hombre no son ni un castigo ni una venganza, sino que su objetivo es estimularlo para que examine sus actos y para que no se equivoque en su camino. De hecho, si existiera solamente este mundo, no habría ningún sentido en ellos."},{"id":"p6-b8","pageNumber":6,"indexInPage":8,"text":"A lo largo de su vida, el hombre se encuentra con muchos sucesos que parecen completamente injustos. Pero eso es porque ve sólo una parte del todo. ¿A qué se parece Esto?... En el libro “Éxodo” del Pentateuco, están escritas las leyes de aquel que mata a un hombre involuntariamente: su sentencia es el exilio en una ciudad refugio. Y así está escrito (21:13): “Pero él no le preparo una emboscada – sino que Di-s causó que llegara a su mano...”."},{"id":"p6-b9","pageNumber":6,"indexInPage":9,"text":"Las palabras “no le preparo una emboscada” significan que el hombre que mato lo hizo sin premeditación; él no lo acecho y no se propuso matarlo de ninguna manera. En otras palabras, fue un “accidente”... Pero en lo que está escrito “y Di-s causo que llegara a su mano”, ya nos revela que no había Ningún error. El Creador es el que dispuso este “accidente”. Citaremos un antiguo comentario de los Sabios sobre esta cuestión: “¿Sobre qué habla el escrito?"},{"id":"p6-b10","pageNumber":6,"indexInPage":10,"text":"De dos personas, una que mato involuntariamente y otra que mato premeditadamente, y no hubo testigos que atestiguasen. El que mato premeditadamente no fue castigado a muerte como debería ser castigado un asesino, y el que mato involuntariamente no fue castigado al exilio, a una ciudad refugio como se debería."},{"id":"p6-b11","pageNumber":6,"indexInPage":11,"text":"Pero Di-se les hace justicia, ¿cómo? – dispone que se reúnan en la misma posada, el que mato premeditadamente se sienta bajo una escalera y el que mato involuntariamente sube por ella, de pronto, este cae sobre el que mato premeditadamente – y lo mata. Hay testigos que declaran que el hombre mato involuntariamente, y es obligado entonces al destierro. El resultado es que el que mato involuntariamente es desterrado, y el que mato premeditadamente – murió…”."}],"rawCharCount":4997},{"pageNumber":7,"blocks":[{"id":"p7-b0","pageNumber":7,"indexInPage":0,"text":"De esto aprendemos como la Supervisión Divina está detrás de todos los accidentes que ocurren. Ciertamente, a los ojos de cualquier persona parecería que el hombre que estaba sentado bajo la escalera, es una persona desgraciada que murió sin ninguna razón, y que quien cayó sobre él y lo mato, no lo hizo intencionalmente. No obstante, en verdad, todo fue justo y calculado en todo detalle."},{"id":"p7-b1","pageNumber":7,"indexInPage":1,"text":"Los Sabios cuentan que cuando Moisés quiso saber los caminos de la Supervisión del Creador sobre Sus criaturas, Le pidió (Éxodo 33:13): “Hazme conocer Tus caminos”. La respuesta del Creador fue (Deuteronomio 10:1): “Sube hacia Mí, a la montaña”. En el camino, subiendo a la montaña, vio Moisés un caso muy extraño. Un hombre se acercó a beber agua del manantial, y al inclinarse para hacerlo, sin darse cuenta, se le cayó una cartera repleta de dinero y se fue."},{"id":"p7-b2","pageNumber":7,"indexInPage":2,"text":"Al irse, llego un segundo hombre también a beber agua del manantial, Encontró la cartera del primero y la recogió. Cuando este se fue, llego un tercero para beber del manantial. Mientras bebía, volvió el primero a buscar su cartera, y está por supuesto no estaba. Le dijo el primer hombre al tercero: “¡Tu encontraste mi cartera!”, le contesto el otro: “Yo no encontré nada”. Se enojó el primero, se acercó y lo mato. Cuando Moisés vio esto, quedo completamente sorprendido. Le dijo al Creador: “¡Señor del Universo!"},{"id":"p7-b3","pageNumber":7,"indexInPage":3,"text":"Te pido, dame a conocer Tus caminos”. Esto es lo que he visto y me sorprendió: ¿Por qué el segundo hombre que encontró la cartera perdida ganó, mientras el tercero que nada encontró, murió asesinado?”. Le dijo el Creador: “¡Todo lo que viste – es recto y justo! El primer hombre, quien perdió la cartera, la robo al segundo hombre que la encontró; simplemente llego el verdadero dueño y Encontró lo que le fue robado. El tercero, el que fue asesinado, mato al padre del primer hombre, sin que este lo supiera."},{"id":"p7-b4","pageNumber":7,"indexInPage":4,"text":"Por lo tanto, Yo dispuse la mano del primer hombre para que lo mate y vengara la sangre de su padre”... Aprendemos de esto que el Creador Mismo dispone que a los que les llega penes de muerte, sean ejecutados por los vengadores de la sangre. De estos dos ejemplos vemos que existe una exacta Divina Supervisión sobre todos los sucesos del mundo; hasta lo que parece ser un accidente está realmente dispuesto por el Creador con Supervisión Individual, según Sus justos cálculos."},{"id":"p7-b5","pageNumber":7,"indexInPage":5,"text":"Así, a lo largo de su vida, el hombre se encuentra con muchos acontecimientos que parecen completamente injustos, pero eso es porque ve solo una parte del todo. ¿A qué se parece esto? A una persona que fue a ver un espectáculo y llego con mucho atraso. Cuando entro, la representación ya estaba cercana a su fin. Sobre el escenario había alguien que estaba golpeando violentamente a una persona. Sin pensar dos veces, el hombre que llego tarde lanzo Un grito: “¡Malvado! ¿Qué es esto? – ¡¿golpear así a un pobre hombre?!”."},{"id":"p7-b6","pageNumber":7,"indexInPage":6,"text":"Lo silencio uno de los espectadores y le dijo: “¡SCH… cállate!, si hubieras visto el espectáculo desde el comienzo, hubieras entendido que estos golpes son muy pocos por lo que este malvado tirano le ha hecho…”. Así es el hombre, limitado en su visión. No ve sino una pequeña partícula del todo. El no conoce todo el pasado de cada alma, que le ocurrió en reencarnaciones anteriores, y que cuentas vino a cerrar en esta encarnación."},{"id":"p7-b7","pageNumber":7,"indexInPage":7,"text":"Tampoco sabe lo que hay detrás de las condiciones De vida de cada hombre; porque uno tiene un determinado defecto, porque otro tiene tales condiciones de vida, etc. Si tuviera el hombre el mérito para ver profundamente, sabría que todo está exactamente calculado con el máximo de justicia y misericordia, y no tendría ninguna pregunta..., jamás. Cuando vemos o escuchamos de una persona que murió joven – todos nos estremecemos frente a la realidad de la muerte, pero en verdad..."},{"id":"p7-b8","pageNumber":7,"indexInPage":8,"text":"Cumplir tu misión Cada hombre llega a este mundo con una misión. Su vida en este mundo no es una vida de permanencia, sino empieza y termina según la corrección de su alma y su misión en la vida. Cuando una persona muere – de cualquier manera que sea – su muerte proviene de una ordenanza del Creador, exactamente en el momento y en la forma que El determino."},{"id":"p7-b9","pageNumber":7,"indexInPage":9,"text":"Alguna persona viene a este mundo para vivir setenta años, otra para veinte años, y otra para cinco años...; a uno le fue decretado que no completara sus días, mientras a otro se le agregaran mas Años de vida. Hay muchas diferencias entre un caso y otro, cálculos Celestial ocultos, derechos y deberes, encarnaciones anteriores y más. Hay almas que llegan a corregir algo muy específico, y enseguida después que lo hacen, dejan este mundo y vuelven a su lugar en el Paraíso."},{"id":"p7-b10","pageNumber":7,"indexInPage":10,"text":"Generalmente, después de la muerte de estos seres, la gente que les conoció se da cuenta que eran excepcionales – casi sin inclinación al mal, muy amables y delicados. Por eso no tenemos que sorprendernos cuando vemos"}],"rawCharCount":4837},{"pageNumber":8,"blocks":[{"id":"p8-b0","pageNumber":8,"indexInPage":0,"text":"jóvenes que nunca pecaron, fueron especialmente buenos, e intempestivamente murieron – es que simplemente completaron lo que vinieron a corregir. Debemos saber que existe una regla espiritual muy importante – “Donde la Mala Inclinación se intensifica sobre el hombre – allí mismo está la corrección de su alma”."},{"id":"p8-b1","pageNumber":8,"indexInPage":1,"text":"Por lo tanto, el hecho que aquellas personas fueron tan buenas y especiales, casi sin malas inclinaciones y especialmente bondadosas, indica que vinieron a este mundo únicamente para una muy específica corrección del alma, mientras que la mayoría de la gente, como vemos a nuestro alrededor, está llena de malas inclinaciones, lo que demuestra que vinieron a corregir muchas cosas."},{"id":"p8-b2","pageNumber":8,"indexInPage":2,"text":"El depósito Una verdadera historia cuenta acerca del gran Sabio conocido como “El dueño del milagro”: En un día festivo, murieron los dos hijos del Sabio sin que él lo supiera. Su esposa era una mujer muy creyente y cuando encontró a sus dos hijos muertos, subió sus cuerpos al desván, los Cubrió con una sábana, y lo guardo en secreto. Ella se regocijo con su marido y no le dijo nada, mientras él pensaba que ellos habían salido de la casa."},{"id":"p8-b3","pageNumber":8,"indexInPage":3,"text":"Solo al finalizar el solemne día, cuando el Sabio se dio cuenta que no habían vuelto, le pregunto a su esposa: “Dime, donde están nuestros hijos ”. Su esposa eludió su pregunta y no le contesto nada claro hasta después que ceno. Solamente entonces le dijo: “Sabio, tengo una pregunta”. “Pregunta querida esposa”. “Hace tiempo, alguien dejo en mi poder algo en depósito y ahora vino a recogerlo, ¿qué tengo que hacer?”. Le contesto el Sabio: “Esposa mía, es muy simple, quien tiene un deposito en su poder, lo tiene que devolver a su dueño”."},{"id":"p8-b4","pageNumber":8,"indexInPage":4,"text":"Ella lo tomo de la mano, conduciéndolo al desván y le mostro a sus dos hijos acostados, muertos. El Sabio empezó a llorarlos con mucho dolor. Ella le dijo: “Sabio, ¿no me dijiste que quien tiene en su poder un deposito, lo tiene que devolver?”. Inmediatamente dejo el Sabio de llorar y dijo: “Di-s ha dado y Di-s ha quitado. ¡Sea el nombre de Di-s bendecido!” (Job 1:21). Con su sabiduría, la esposa le dio consuelo y reflexión y fue digna de lo que dice el versículo (Proverbios 31:10): “Mujer virtuosa, ¿quién puede hallarla?”."},{"id":"p8-b5","pageNumber":8,"indexInPage":5,"text":"Se cuenta de otro antiguo Sabio que perdió a sus diez hijos y andaba con un diente de su décimo hijo en la mano. El solía consolar a los afligidos"},{"id":"p8-b6","pageNumber":8,"indexInPage":6,"text":"diciéndoles: “Este es un diente de mi decimo hijo, que murió”. “Miren que yo perdí a diez hijos y estoy sonriendo y alegre, pues entiendo que este mundo no es el esencial. Estas almas que fueron mis hijos, simplemente completaron la corrección de sus almas y su misión en este mundo temporal. ¿Por qué hay que estar triste? En verdad ellos están gozando en el Paraíso , donde todo es completamente bueno..."},{"id":"p8-b7","pageNumber":8,"indexInPage":7,"text":"Somos nosotros los que todavía necesitamos esforzarnos aquí en este bajo mundo, para completar nuestra misión, por la cual llegamos aquí”. Muchos más Sabios, Justos y hombres piadosos pasaron pruebas parecidas u otras, y todos saben que fueron completamente justos y rectos... La muerte es la heredad de todos, sin que tenga nada que ver con la rectitud del hombre, y como ya han dicho los Sabios: “¿Si Moisés Murió, quien no morirá?”."},{"id":"p8-b8","pageNumber":8,"indexInPage":8,"text":"Cuando vemos o escuchamos de una persona que murió joven – todos nos estremecemos frente a la realidad de la muerte, pero en verdad, deberíamos estremecernos y despertarnos mucho más cuando vemos un hombre que muere viejo, en lo máximo de su vida. ¿Por qué? Porque cuando muere una persona joven, eso no demuestra nada ya que es un caso extraño, y todavía podremos pensar que “a mí no me pasara”. Pero cuando muere un anciano, esto demuestra en forma inequívoca que al final – ¡todo hombre morirá!"},{"id":"p8-b9","pageNumber":8,"indexInPage":9,"text":"Esto debe despertar a cada uno de nosotros para que no pasemos toda nuestra vida dormitando en este mundo. No olvidarse del Mundo Venidero A veces una persona que comienza andar por el camino de la fe, recibe un golpe y se pregunta: “¿Porque justamente ahora que comencé a conducirme según la Voluntad Divina, recibo semejante golpe? Ahora que empecé a esforzarme a cumplir los Preceptos Divinos... ¡¿Esta es la fe y su recompensa?!”."},{"id":"p8-b10","pageNumber":8,"indexInPage":10,"text":"O vemos a alguien que comenzó a ir por el recto camino y de pronto le sucedió una desgracia, y preguntamos: “¿Qué es esto? ¿Cómo puede ser? ¿Ahora que se esforzó en cumplir con la Voluntad del Creador, lo apropiado era que viviera muchos años, y sorpresivamente muere?”. Muchos preguntan sobre los grandes desastres y tragedias mundiales como el Holocausto. ¿Cómo permitió el Creador que les sucediera algo así a tantas personas y entre ellos miles y miles de justos y piadosos que cumplieron con Su Voluntad?"}],"rawCharCount":4630},{"pageNumber":9,"blocks":[{"id":"p9-b0","pageNumber":9,"indexInPage":0,"text":"Todas estas preguntas surgen porque la gente se olvida que este mundo no es lo esencial y que el hombre viene acá en una misión. Si nos acordáramos que existe un Mundo Venidero y que el hombre viene a este mundo para cumplir una corrección espiritual, se terminarían todas las preguntas. Por primera vez en mucho tiempo, se durmió con una sonrisa en los labios, sin dar vueltas en la cama. Algo que le fue arrancado de su corazón, algo que le faltaba a su alma, le volvió... La creencia en el Mundo Venidero es la base de la auténtica fe."},{"id":"p9-b1","pageNumber":9,"indexInPage":1,"text":"Muchos de los enigmas de la vida reciben un sentido completamente distinto, cuando se entiende que la existencia del hombre en este mundo es solo una parte de un completo camino que ha empezado mucho antes de su nacimiento, y que seguirá mucho después de su muerte. Aquí una verdadera historia que ejemplifica esto de una forma maravillosa: En una piadosa comunidad, hubo un caso que conmociono a toda la ciudad y despertó muchas cavilaciones y preguntas sobre los caminos del Creador, tanto entre los mayores como entre los pequeños."},{"id":"p9-b2","pageNumber":9,"indexInPage":2,"text":"Una joven señorita, hija de una de las familias más importantes de la ciudad, se casó con un devoto comerciante, quien era un gran benefactor y columna central de la comunidad. Los primeros años de matrimonio fueron bendecidos con felicidad, abundancia e hijos. La esposa se conducía con mucho recato y se ocupaba con diligencia de la crianza de los niños, recitando los Salmos y ayudando a los pobres de la ciudad."},{"id":"p9-b3","pageNumber":9,"indexInPage":3,"text":"El marido viajaba por negocios por todo el país, al mismo tiempo que establecía horas fijas de plegaria y estudio para su servicio al Creador. Sus muchos actos de beneficencia se extendieron sobre varios pueblos, y miles de pobres gozaron De los beneficios de su generosa mano. Sorpresivamente, una desgracia cayó sobre los habitantes de la ciudad. ¿Dónde? ¡Justamente en la casa de la piadosa pareja! ¡En la casa de donde salió solo caridad y bondad! ¡Justamente A ellos les paso una desgracia estremecedora!"},{"id":"p9-b4","pageNumber":9,"indexInPage":4,"text":"Su hijo de tres años fue violentamente asesinado por un borracho desconocido. La ciudad entera estaba conmocionada por el terrible caso. Miles de personas – entre ellas importantes y famosos sabios y líderes espirituales – entraron y salieron de la casa para consolar a los dolientes padres. Muchos se hicieron preguntas, pocos las expresaron a viva voz: ″ ¿Acaso esta es la recompensa a esta piadosa pareja por todas sus buenas acciones? Por qué el Creador les hizo una cosa así"},{"id":"p9-b5","pageNumber":9,"indexInPage":5,"text":"¿Por qué en una forma tan violenta?″. También un resentimiento Sobre los caminos del Creador se infiltro en los corazones de algunos ciudadanos, un rencor que debilito y confundió su fe y los alejo del servicio al Creador. La pareja reacciono frente a este hecho con fe completa, resignación, aceptando el Decreto Divino con amor, y siguiendo con su recto estilo de vida. Pero, no paso mucho tiempo y otra Desgracia cayó sobre ellos."},{"id":"p9-b6","pageNumber":9,"indexInPage":6,"text":"Un terrible rumor se expandió por la ciudad: ¡el justo y modesto comerciante había caído muy enfermo y los médicos estaban preocupados por su vida! Inmediatamente, en toda la ciudad, se organizaron rezos públicos y lecturas de los Salmos para su bienestar. El joven comerciante era amado por todos, muchos se habían beneficiado con su generosa mano, pero no solo eso, él era uno de los principales de la comunidad, responsable de muchas instituciones de caridad y beneficencia."},{"id":"p9-b7","pageNumber":9,"indexInPage":7,"text":"Con toda razón los rezos salieron del fondo del corazón y los lamentos partieron los Cielos. Más y más gente seguía llegando para rezar, cuando cundió la noticia que los médicos lo desesperaron y no le dieron más que una semana de vida. El sabio de la ciudad, que era un gran justo y erudito declaro: “¡Eso no sucederá jamás! ¡No le ocurrirá a este hombre piadoso ningún mal!”."},{"id":"p9-b8","pageNumber":9,"indexInPage":8,"text":"Enorme fue la desilusión de los ciudadanos y muy grande fue su dolor y pena, cuando después de unos cuantos días falleció el joven comerciante, en el comienzo de su vida; el, cuya vida fue dedicada a hacer el bien y a la benevolencia. Tenía treinta y cinco años, y la joven viuda que Perdió su respaldo, su fuente de vivacidad y alegría, no sabía cómo calmar su profundo dolor. Todos sintieron la gran pérdida, y muchas preguntas llenaron sus corazones: ¿Porque fue llevado de este mundo un hombre tan bueno y justo?"},{"id":"p9-b9","pageNumber":9,"indexInPage":9,"text":"¿Por qué no ayudaron tantas plegarias que se rezaron a su favor? ¿Y cómo pudo ser que el justo Sabio de la ciudad decreto que vivirá, y a pesar de todo - falleció? Pasaron unos anos. Un viernes por la noche, el hijo casado de la joven viuda, vino a saludarla con un “feliz fin de semana”, la madre trato de sonreír, pero a su pesar, las lágrimas empezaron a fluir de sus ojos. “Madre”, suplico su hijo, “¡ya pasaron varios años!, ¡basta de lágrimas! Debe haber un límite de tiempo para lamentarse. El que prolonga su pesar"}],"rawCharCount":4800},{"pageNumber":10,"blocks":[{"id":"p10-b0","pageNumber":10,"indexInPage":0,"text":"demasiado, es poseído por él. Somos en verdad creyentes... ¿Que sabemos nosotros de los cálculos de Di-s Todopoderoso? ¡Ciertamente todo lo que el Creador hace – es todo para bien! Por favor mama, nos causas mucho dolor a todos nosotros y también al alma de papa, que en paz descanse, ciertamente él quiere que sigas con tu vida. He aquí, que ya hace unos cuantos meses que te proponen una excelente persona para desposarte y todavía estas dudando."},{"id":"p10-b1","pageNumber":10,"indexInPage":1,"text":"Querida madre, ¡debes fortalecerte en la fe, estar alegre con lo que tienes y continuar adelante!”. La joven viuda respiro profundamente. ¡Basta! decidió en su corazón. ¡Suficiente con el dolor! ¡Suficiente con la incredulidad! ¿Acaso soy más misericordiosa que el Creador? ¡Todo lo que el Creador hace es para bien! ¡Desde ahora me esforzare en estar alegre! Así pensó la viuda en el fondo de su corazón. Y verdaderamente, ese fin de semana estuvo mucho más alegre y sonriente..."},{"id":"p10-b2","pageNumber":10,"indexInPage":2,"text":"Sus jóvenes hijos respiraron con alivio – por fin mama sonríe con verdadera alegría, sin lágrimas que resplandecen en los extremos de sus ojos. Mama vuelve a sí misma, nuevamente nos da fuerza y estimulo. Ellos estaban necesitados de este cambio como aire para respirar. Otro fin de semana de pena y de tristeza los hubiera quebrado mental y espiritualmente. Esa noche, por primera vez en varios años, se acostó la joven viuda en su cama con el corazón liviano y con alegría."},{"id":"p10-b3","pageNumber":10,"indexInPage":3,"text":"Por primera vez en mucho tiempo, se durmió con una sonrisa en los labios. La primera vez en muchas noches que se acostó con tranquilidad, sin dar vueltas en la cama, sin pensar en su fallecido marido, en su sonrisa y en las buenas palabras que le solía decir. Algo que le fue arrancado de su corazón, algo que le faltaba a su alma, le volvió – ¡la fe! Y he aquí que suena un sueño... Se ve parada en un hermoso jardín, iluminado con una agradable luz. Aroma no de este mundo subió hasta su nariz, y entendió que estaba en el Paraíso."},{"id":"p10-b4","pageNumber":10,"indexInPage":4,"text":"Entre los árboles del jardín, distinguió la figura de un hombre anciano, con un noble rostro todo iluminado. Él se acercó a ella, y le preguntó si quería encontrarse con su fallecido marido. Ella aceptó con un movimiento de cabeza y él la guió hacia un enorme salón, repleto de Justos, sentados y escuchando apasionadamente una lección de un joven maestro. Al finalizar la clase el joven se aproximó a ella, y he aquí – ¡era su marido! “¡Mi querido marido!”, se lamentó con emoción, “"},{"id":"p10-b5","pageNumber":10,"indexInPage":5,"text":"Por qué me dejaste sola en los mejores años De Mi Vida? ¿Cómo es que eres un maestro, enseñando aquí en el Paraíso? Fuiste un simple comerciante, no un maestro espiritual, ¿cómo llegaste a esto?”. Su marido sonrió y le dijo: “Debes saber que en mi preexistencia fui un gran erudito y maestro espiritual, sólo que nunca contraje matrimonio. Cuando ascendí a mi lugar en el Paraíso, objetaron que es imposible que permanezca allí sin haber cumplido el primer Precepto – “Fructificaos y multiplicaos” (Génesis 1:28)."},{"id":"p10-b6","pageNumber":10,"indexInPage":6,"text":"Por eso volví en una nueva encarnación para casarme y engendrar hijos, criarlos en el camino de la fe y sustentarlos. Y así fue, descendí al mundo para casarme contigo y procrear hijos. Cuando cumplí el Precepto, y cumplí con la corrección de mi alma, no había ninguna razón para quedarme en el mundo inferior, y por eso morí."},{"id":"p10-b7","pageNumber":10,"indexInPage":7,"text":"Ahora, como ves, estoy gozando de la recompensa por mis buenas acciones y mi servicio al Creador...”. “Pero... tantas plegarias rezamos por ti, y el sabio de la ciudad decretó que no morirías, ¿por qué no sirvió?”, preguntó. Le contestó su marido: “Todas las plegarias que rezaron – fueron todas aceptadas. Algunas me sirvieron para llegar al lugar donde estoy ahora; algunas fueron usadas para ayudar a nuestra comunidad y salvarla de duros edictos."},{"id":"p10-b8","pageNumber":10,"indexInPage":8,"text":"Pero puesto que no tenía ningún otro rol que cumplir en el mundo, no había ninguna posibilidad que me quedara, y por eso tampoco ayudó el decreto del sabio. Pero tú, todavía tienes mucho más que hacer en el mundo – debes casarte por segunda vez y engendrar más hijos, debes también atender a nuestros hijos – todavía no terminaste tu misión. Tienes que esforzarte y continuar adelante para cumplir tu rol y tu objetivo final”. “¿Y nuestro hijo?... ¿Por qué murió nuestro pequeño hijo?”, le preguntó."},{"id":"p10-b9","pageNumber":10,"indexInPage":9,"text":"Le contestó: “Nuestro pequeño hijo fue el alma elevada de un piadoso Justo. En su preexistencia fue raptado de su cuna y llevado a un lejano lugar donde mamó de una malvada mujer. Luego fue rescatado de sus raptores, creció y se transformó en un eminente Justo. Cuando murió, quisieron colocarlo en una alta posición en el Paraíso, pero el tiempo que mamó de la malvada mujer manchó su pura alma. Por consiguiente, lo descendieron nuevamente al mundo en una nueva encarnación, para que mamara de una mujer justa."},{"id":"p10-b10","pageNumber":10,"indexInPage":10,"text":"Tú fuiste la elegida para este privilegio, por tu modestia y rectitud”. “Pero... ¿Por qué murió en una forma tan espantosa?”, se lamentó, acordándose de la terrible visión de su hijo en las manos del borracho."}],"rawCharCount":4929},{"pageNumber":11,"blocks":[{"id":"p11-b0","pageNumber":11,"indexInPage":0,"text":"Le dijo su marido: “Nuestro querido hijo tenía que morir de cualquier manera en vista que cumplió su misión en el mundo. Al mismo tiempo que debía partir del mundo, se decretó un terrible Castigo Celestial sobre los habitantes de nuestra ciudad, un castigo de matanza y persecución por los muchos delitos cometidos por la gente."},{"id":"p11-b1","pageNumber":11,"indexInPage":1,"text":"Puesto que de una manera u otra llegó su momento de salir del mundo, aceptó el alma de nuestro hijo morirse en una forma peculiar, para expiar los pecados de toda la gente de la ciudad, salvando así a muchos adultos y niños de extrañas muertes y tormentos. Por supuesto que para una noble alma como la suya era un gran privilegio, y también por eso ascendió a un tal alto grado en el Paraíso, que ningún ser tiene permiso para verlo, salvo yo, que soy su padre."},{"id":"p11-b2","pageNumber":11,"indexInPage":2,"text":"También tú, cuando llegará el momento, tendrás el privilegio de estar en su cercanía, por la aflicción que pasaste...”. Después agregó: “¡Debes saber! Sólo porque te esforzaste con alegría, me dejaron revelarme a ti. ¡Durante el tiempo que estabas pesarosa, había sobre ti una gran acusación y casi perdiste tu segundo hijo! Todos mis pedidos de revelarme, no fueron aceptados”. Se calló unos segundos y después dijo con voz suave: “Yo cumplí la corrección de mi alma, pero tú tienes mucho más que hacer en la vida."},{"id":"p11-b3","pageNumber":11,"indexInPage":3,"text":"Ve, cásate con el candidato que te fue propuesto, continúa tu vida con alegría. Lástima por el tiempo precioso que estás perdiendo, continua con tu corrección, vete en paz… ve…”. Su marido desapareció de sus ojos, y ella despertó de su sueño... El mundo le pareció nuevo y hermoso. Ahora comprendió lo que debía hacer. Pero sobre todo, entendió que todas las preguntas que ella y los ciudadanos se hacían fueron superfluas y sin sentido. Porque el Creador es justo y recto – esa es la única y absoluta verdad y no puede ser objetada."},{"id":"p11-b4","pageNumber":11,"indexInPage":4,"text":"No siempre se puede recibir contestaciones a preguntas durante el sueño de la noche, por eso el único consejo es fortalecerse en la simple fe que todo está bajo el control del Todopoderoso, y todo lo que hace – es para el eterno bien de cada uno. Cuando el hombre estará alegre con lo Suyo, creyendo que está bajo la Supervisión del Creador y que todo está bajo Su control para su bien eterno, solo entonces podrá saber cuál es su propio camino en la vida."},{"id":"p11-b5","pageNumber":11,"indexInPage":5,"text":"Cuando el hombre está cerca de su meta, y goza de cada momento de la vida cumpliendo su finalidad, entonces todos los asuntos mundanos no tienen ningún significado…"},{"id":"p11-b6","pageNumber":11,"indexInPage":6,"text":"Mortal El hombre en este mundo no sabe cuál es la corrección que vino a completar – no sabe cuándo la completara – y no sabe cómo dejara este mundo. Aun así, es apropiado que consideremos en nuestro corazón la cuestión del día de nuestra muerte. El Rey Salomón, el más Sabio de todos los hombres, aconsejo (Eclesiastés 7:2): “Es mejor ir a la casa de duelo, que a la casa del festín, porque aquello es el fin de todo hombre, y el que está vivo debe poner esto en su corazón”."},{"id":"p11-b7","pageNumber":11,"indexInPage":7,"text":"A primera vista se deduce del Eclesiastés , que es preferible para el hombre ir a la casa de duelo para ver el fin de cada uno y entender que ese será también su fin. Sorprendentemente, vemos que todas las personas son testigos en su vida de muchas muertes y entierros, y a pesar de todo, eso no les estimula a pensar en su fin y en su meta. Hasta médicos y enfermeras en cuyas manos pasan muchos enfermos terminales y agonizantes y son testigos en su vida de muchísimas muertes – no se despiertan de ninguna manera."},{"id":"p11-b8","pageNumber":11,"indexInPage":8,"text":"Por el contrario, algunos de ellos Están sumergidos en la inmoralidad más que otras personas. Incluso los sepultureros que entierran con sus propias manos decenas y cientos de muertos, están sumergidos en las vanidades del mundo y no se despiertan a su meta y a su fin. Por eso es que el Rey Salomón enfatiza en la continuación del versículo “… y el que vive debe poner eso en su corazón…”."},{"id":"p11-b9","pageNumber":11,"indexInPage":9,"text":"La explicación es que también cuando se va a la casa de duelo, el que vive tiene que poner en su corazón el tema de la muerte y decirse a sí mismo: “¡Yo también moriré!, ¡también por mi sentirán dolor!”, y si no hace eso, no despertara de ninguna forma, incluso yendo a todas las casas de duelo del mundo. El hombre debe despertarse a sí mismo no por miedo, sino para observar este mundo con una mirada realista: “¿Que tengo que hacer en este mundo en vista de que moriré?"},{"id":"p11-b10","pageNumber":11,"indexInPage":10,"text":"Incluso llegare a tener una posición De prestigio – ¡pero finalmente moriré! quizás llegare a ser muy rico – ¡pero al final moriré!... Si es así, ¿qué cosa significativa hay que hacer en este mundo?...”. Como consecuencia de esto, lógicamente llegara el hombre a la esencial conclusión que existe un Creador del Universo. Por consiguiente, hablara con Él y Le pedirá que le muestre para que fue creado y cuál es su particular misión en este mundo."}],"rawCharCount":4757},{"pageNumber":12,"blocks":[{"id":"p12-b0","pageNumber":12,"indexInPage":0,"text":"Pasajero ¡En el momento que el hombre se acuerda del día de su muerte, toda la mentira de este mundo se derrumba y nada le puede engañar! El hombre que sabe que morirá, no está dispuesto a gastar esfuerzos en cosas mundanas. Y lo principal – no está dispuesto a malgastar la cosa más preciada que existe – ¡el tiempo!, pues nadie sabe cuánta Vida le fue determinada en este mundo. También si será larga, pasara con la rapidez de un rayo."},{"id":"p12-b1","pageNumber":12,"indexInPage":1,"text":"Por lo tanto, el hombre pensara muy bien en que invertir su tiempo y no lo gastara en cosas temporales de poca importancia y significado. Cuando el hombre está cerca de su meta, y goza de cada momento de la vida cumpliendo su finalidad, entonces todos los asuntos mundanos no tienen ningún significado: no tiene ninguna importancia en que cama dormirá, sobre que mesa comerá, etc. Todo su interés es como aprovechar cada momento para conocer y conectarse con el Creador, cumpliendo su finalidad."},{"id":"p12-b2","pageNumber":12,"indexInPage":2,"text":"Pero los hombres que invierten todas sus energías y todas sus fuerzas en este mundo, sufren mucho con cada cosa que no les sale bien. Pasan difíciles penalidades para tener éxito sin un momento de descanso. Toda su vida corren con mucha dificultad y enormes esfuerzos para conseguir la comodidad y el prestigio anhelado. Una gran parte de ellos desgastan así toda su vida sin lograr nada."},{"id":"p12-b3","pageNumber":12,"indexInPage":3,"text":"Aun aquellos que aparentemente consiguen todas las comodidades mundanas y la posición de prestigio más honorable – a todos les llega la llamada desde lo Alto, y deben dejar todo lo que consiguieron – no solamente sus bienes materiales, sino también todos los honores y posición que lograron con muchísimos esfuerzos – todo queda atrás y son llevados de aquí sin nada."},{"id":"p12-b4","pageNumber":12,"indexInPage":4,"text":"Se entiende entonces, que el que invierte toda su vida en este mundo, pierde el doble: pierde este mundo – porque su vida no es vida – y por supuesto pierde también el Mundo Venidero. Pero el que invierte su vida en la finalidad, gana el doble: gana el Mundo Venidero y también este mundo – porque la gente que vive según su finalidad e invierte sus fuerzas, energías y tiempo para lograrla, vive con tranquilidad, felicidad y alegría, e incluso no le falta nada."},{"id":"p12-b5","pageNumber":12,"indexInPage":5,"text":"El “Atributo del Triunfo” Debemos saber que existe un rasgo de personalidad tan malo y que su daño es tan grande, que el hombre puede perder toda su vida por él. Este es el"},{"id":"p12-b6","pageNumber":12,"indexInPage":6,"text":"“Atributo del Triunfo” que se manifiesta en que el hombre siempre quiere triunfar y tener razón; que decide que la forma en que vive y todo lo que piensa es la absoluta verdad; no está dispuesto a escuchar ninguna otra opinión; nadie puede moverlo, y ciertamente no está dispuesto a confesar sus equívocos y cambiar. Generalmente, el hombre poseedor de este mal atributo se burla y desdeña a todos los demás Creyéndose el mejor en todo. El “Atributo del Triunfo” no puede soportar la verdad."},{"id":"p12-b7","pageNumber":12,"indexInPage":7,"text":"Por lo tanto, un hombre que siempre se justifica a sí mismo y que lo importante para él es ser el vencedor, nunca podrá encontrarla, pues para eso se debe estar dispuesto a conceder todo en favor de la verdad; estar siempre dispuesto a confesar que se equivoca y cambiar el curso de su vida. Y después de pensar que ya ha logrado la verdad, debe estar dispuesto a confesar que también esto fue un error, y nuevamente cambiar el curso de su pensamiento y así en adelante muchas veces más."},{"id":"p12-b8","pageNumber":12,"indexInPage":8,"text":"En resumen, el Hombre siempre debe estar dispuesto a cambiar, a corregirse, y a confesar sus errores. Solamente un hombre"},{"id":"p12-b9","pageNumber":12,"indexInPage":9,"text":"Para eliminar ese mal atributo debe el hombre meditar un poco para ver su mediocridad y nulidad, hasta pensar ¿Que soy yo? Solamente un hombre. No Di-s. Solo un ser humano que es limitado por naturaleza, que en verdad no sabe mucho, no sobre sí mismo y mucho menos sobre la Creación llena de infinitas incomprensiones, asombros y preguntas; la Creación donde están escondidos inteligencia y razonamiento profundos e infinitos, que aun decir que “no sabe mucho” es una subestimación."},{"id":"p12-b10","pageNumber":12,"indexInPage":10,"text":"Si el hombre es honesto consigo mismo, confesara que no sabe nada; que no entiende totalmente que pasa con ; No sabe de dónde vino ni adónde va; no sabe que le espera en el futuro, y no solo en el futuro lejano, sino tampoco sabe que pasara en el próximo segundo, y no tiene ninguna forma de asegurarse contra los accidentes del tiempo y de la naturaleza... Lo principal, tiene que meditar y confesar la verdad, que no puede ayudarse a sí mismo, ni salvarse; tampoco puede ayudar a sus propios hijos, ni a la gente de su pueblo, etc."},{"id":"p12-b11","pageNumber":12,"indexInPage":11,"text":"Una persona que está algo enferma o le duele una parte de su cuerpo, y tanto más si tiene una grave enfermedad, inmediatamente pierde toda su arrogancia y el pensamiento que tiene"}],"rawCharCount":4615},{"pageNumber":13,"blocks":[{"id":"p13-b0","pageNumber":13,"indexInPage":0,"text":"completo control sobre su vida. Se siente desgraciado y desamparado y se llena de miedos y temores. Resumiendo – ¿qué es el hombre?, ¿de qué se enorgullecerá si cada día se acerca a su tumba? … ¡Entonces decides! O te quedaras con tu arrogancia, triunfaras, sintiendo que no hay otro como tú en el mundo, tu eres el exitoso, tu eres el correcto, el que desprecia a todos, y sabes la verdad en su totalidad – y entonces, ¿qué verdad conseguiste?, que sufres en este mundo. No tienes alegría de vivir y pierdes tu eterna finalidad."},{"id":"p13-b1","pageNumber":13,"indexInPage":1,"text":"O decides que tienes mucho que aprender y que de cada hombre puedes hacerlo, como han dicho los Sabios: “¿Quién es el verdadero inteligente? El que aprende de cada hombre”. Toma en cuenta, que por supuesto para lograr la verdad hay que pasar muchas etapas, y en cada una de ellas es probable que estés obligado a destruir lo que construiste hasta ahora."},{"id":"p13-b2","pageNumber":13,"indexInPage":2,"text":"Deberás estar preparado a cambiar cada día, hasta que tu vida se colme de interés, contenido y movimiento, tendrás alegría de vivir y conseguirás la finalidad eterna para la que fuiste creado. ¡Examínate a ti mismo y a tu vida! ¿Qué haces? ¿En qué inviertes tus fuerzas, tu talento, tus esperanzas, tu vida? ¿Sientes que cumples tu misión y meta en la vida?..."},{"id":"p13-b3","pageNumber":13,"indexInPage":3,"text":"He aquí que para demostrar la veracidad de la fe, no hay que ser ni un genio ni muy inteligente, solamente se necesita una voluntad real… La voluntad de encontrar la verdad y anular el \"Atributo del Triunfo\". Ahora, Podremos demostrar la verdad por dos caminos: El primer camino – El Camino de la Negación “Demostración por el Camino de la Negación”."},{"id":"p13-b4","pageNumber":13,"indexInPage":4,"text":"Así como en las matemáticas, algunas veces no hay una forma de demostrar que un especifico resultado es correcto, pero existe la posibilidad de Probar que un resultado con certeza, no lo es. ¿Qué hacemos? Empezamos a examinar lo que no es correcto; este resultado – no es correcto y este otro resultado – tampoco lo es, etc. Hasta que por fin queda un solo resultado, que es imposible demostrar que no es correcto."},{"id":"p13-b5","pageNumber":13,"indexInPage":5,"text":"Aunque por el camino afirmativo no se puede probar que lo es, como el resto de los resultados ciertamente no lo son, demostramos que este si lo es. Si meditáramos bien, podríamos ver que en todos los asuntos de este mundo, se puede demostrar muy fácilmente que cada cosa que el hombre desea hacer e invertir su vida – no es verdad. Porque, ¿qué puedes decir, que tu meta es especializarte en una determinada profesión?, ¿acaso es esta una"},{"id":"p13-b6","pageNumber":13,"indexInPage":6,"text":"finalidad?; o decir que tu meta es atesorar riquezas y bienes, ¿es esto una finalidad?... De este modo, podremos probar fácilmente en cada asunto, que no hay ninguna finalidad o meta en todas las cosas mundanas. Pero la fe – ¡no se puede demostrar de ninguna manera que no es la verdad! Siguiendo la “demostración por el camino de la negación”, ciertamente la conclusión es que la fe es la verdad. Y esto debe dar lugar al examen de conciencia de cada hombre: ¡Busca la verdad! ¡Examínate a ti mismo y a tu vida! ¿Qué haces?"},{"id":"p13-b7","pageNumber":13,"indexInPage":7,"text":"¿En qué inviertes tus fuerzas, tu talento, tus esperanzas, tu vida? ¿Son estas cosas el objetivo final de la Creación? ¿Sientes que cumples tu misión y meta en este mundo? Si eres honesto, podrás demostrarte fácilmente a ti mismo, que esta cosa es mentira, y también esta otra cosa, y aquella otra, etc. ¡Y así, pasaras de una a otra en este mundo y veras que son todas mentiras! Pero cuando llegues a la fe, ¡no podrás demostrar que es mentira! También si trataras de constatar de toda manera posible que la fe no es verdad – ¡no podrías!"},{"id":"p13-b8","pageNumber":13,"indexInPage":8,"text":"Por favor… ¡Inténtalo!... El segundo camino – Abre tu boca Vimos entonces que por el camino de la negación, ciertamente debemos llegar a la conclusión, que la fe es la verdad. Pero, no es suficiente. Aunque llego el hombre a la conclusión Que todo en este mundo es vanidad de vanidades, ciertamente le sirvió para que este mundo no vuelva a confundirlo y esto ya es un gran progreso, pero no es suficiente."},{"id":"p13-b9","pageNumber":13,"indexInPage":9,"text":"Todavía es posible que Quedará en la oscuridad preguntando: “¿Entonces en vista que todo el mundo es mentira, cual si es la verdad?”, aunque entiende en su mente que la fe tiene que ser necesariamente la verdad, Si no la tiene dentro de su corazón, no lo ayudaran todas las evidencias del mundo. Entonces, si es así, ¿qué debe hacer? Aquí llegamos al segundo camino para probar que la fe es la verdad, y esta es la forma más sencilla: ¡dirigirnos al Creador, hablar con Él con simples palabras y pedir que nos demuestre Que nos escucha!"},{"id":"p13-b10","pageNumber":13,"indexInPage":10,"text":"También el que no tiene absolutamente ninguna fe en su corazón, piensa que no hay quien le escuche, y le pareciera que es un loco hablando consigo mismo – de cualquier manera dirá estas palabras aunque sin fe, solo teniendo verdadera voluntad por la verdad. Y así dirá: “Creador del Universo, yo quiero la verdad. Si Tú existes – quiero creer en Ti; quiero conocerte."}],"rawCharCount":4816},{"pageNumber":14,"blocks":[{"id":"p14-b0","pageNumber":14,"indexInPage":0,"text":"Yo sé que no puedo verte, pero puedo pedirte que me demuestres que me escuchas. Pediré que Hagas tal y tal cosa y que Tú me concedas el pedido. Ayúdame aunque la primera vez diré que Fue por casualidad, y también si lo diré la segunda vez, pero por fin estaré obligado a confesar la Verdad – que Tú me escuchas y cumples mis pedidos”. Es aconsejable que le pida al Creador que le ayude en todo tipo de cosas que hace mucho Tiempo no puede lograr."},{"id":"p14-b1","pageNumber":14,"indexInPage":1,"text":"Con esto, vera claramente que las mismas cosas, con las que no tenía Ningún éxito hasta ahora mediante la plegaria están cambiando. Y así hablara con el Creador Hasta que le ayude a creer en El y a conocerlo. El hombre que vaya por este camino, ¡vera con sus propios ojos – si solo lo quiere – a la fe! Porque debemos saber que si lo haremos con una verdadera intención de encontrar la verdad, el Creador escuchara cada palabra que digamos, concederá nuestros pedidos y nos hará creer en El. \"Porque la plegaria está por sobre lo natural."},{"id":"p14-b2","pageNumber":14,"indexInPage":2,"text":"Las leyes de la naturaleza obligan que las Cosas sean de una forma, y la plegaria las cambia...\". En verdad, todo hombre tiene fe, solo que la mayoría de la gente no la “vive”; no sabe cómo Activar la enorme fuerza, la más fuerte y única que tiene en este mundo, la fe. Porque la esencia Del poder de la fe se expresa solo cuando el hombre, por medio de ella, habla con el Creador Sobre todas sus necesidades. Si la fe del hombre no lo lleva a conversar con el Creador, no es Una fe completa."},{"id":"p14-b3","pageNumber":14,"indexInPage":3,"text":"Por lo tanto, siempre que hablamos de fe, su significado es la plegaria. La fe es plegaria, como está escrito (Éxodo 17:12): “Y sus brazos (de Moisés) se mantuvieron Elevados con fe” – y su explicación es que sus manos estaban extendidas en plegaria. Debemos saber que la plegaria está por sobre lo natural. Las leyes de la naturaleza obligan que Las cosas sean de una forma, y la plegaria las cambia. Para esto se necesita fe, para tener la Creencia que hay un Creador y en su mano el poder de innovar cada cosa según Su Voluntad."},{"id":"p14-b4","pageNumber":14,"indexInPage":4,"text":"Hay varias faltas que impiden al hombre vivir con fe: • La falta de creencia en la existencia del Creador en forma perceptible y activa, es decir que no Reconoce que El existe y supervisa cada detalle de su vida. Su fe se resume en que hay un Creador del Universo y en su opinión, El esta ahí en algún lugar en el Cielo y no interviene en la Vida diaria del hombre. Por eso, no piensa en dirigirse a Él ni cuando tiene una gran necesidad."},{"id":"p14-b5","pageNumber":14,"indexInPage":5,"text":"• La falta de creencia que cada persona tiene la fuerza y el derecho de dirigirse al Creador en un Idioma simple, pedirle ayuda en cada asunto, asesorarse con El, contarle sus angustias y Participarlo en todas sus cosas. • La falta de creencia que el Creador escucha sus plegarias y las de toda criatura. • La falta de creencia que el Creador lo ama y que quiere ayudar a cada criatura, especialmente A quien se dirige a Él y le habla. • La falta de creencia que la Misericordia, la Benevolencia y la Bondad del Creador no tienen Límites, ni cantidad ni medida y que Su infinita Compasión es suficiente para ayudarle en cada Situación – también cuando no se lo merece."},{"id":"p14-b6","pageNumber":14,"indexInPage":6,"text":"Debemos creer que el Creador nos ama siempre, espera escuchar nuestras plegarias, atiende Cada palabra que sale de nuestra boca, quiere ayudarnos y beneficiarnos. Debemos creer que Toda la finalidad de la Creación se debe a que Él quiso favorecernos y compadecerse de Nosotros. El más grande placer que tiene el Creador es que el hombre tenga todo lo bueno y que Prospere en la vida. Esto es lo que hace crecer Su Gloria."},{"id":"p14-b7","pageNumber":14,"indexInPage":7,"text":"El Creador posee una infinita e Ilimitada Misericordia que puede ayudarnos y salvarnos hasta en la más dura situación, aunque No lo merezcamos – solo dirigiéndonos a Él. El hombre que cree en esto, ciertamente se dirige al Creador en cualquier momento, le cuenta Todo lo que le pasa y todas las dificultades que tiene, le agradece, le pide cada cosa que le falta Y se aconseja con El. La fuerza de la plegaria ¡Debes comprender bien!"},{"id":"p14-b8","pageNumber":14,"indexInPage":8,"text":"Si tuvieras una verdadera fe, podrías conseguir en tu conversación con El Creador, con tus simples palabras, toda la salvación que necesitas, sin ninguna limitación Natural. Por medio de la plegaria se puede conseguir todo, hasta modificar las leyes de la Naturaleza. Así como el Creador es todopoderoso, todo el que se dirige a El será todopoderoso."},{"id":"p14-b9","pageNumber":14,"indexInPage":9,"text":"Como vemos en el Pentateuco que está Lleno de sucesos sobre los líderes del pueblo de Israel y Sus profetas, quienes hicieron milagros y prodigios completamente sobrenaturales – todo Mediante la fuerza de la plegaria. Hasta a la criatura más Pequeña y miserable – el Creador escucha y ve, le supervisa, quiere su Bien y siempre está dispuesto a ayudarle."},{"id":"p14-b10","pageNumber":14,"indexInPage":10,"text":"Inmediatamente cuando la criatura se dirige al Creador Con fe, con el objetivo de conocerlo y acercarse a Él, con sus propias palabras, con completa Sencillez, podrá conseguir con su pedido cada cosa y reparar toda imperfección que exista. Pues Por medio de la plegaria que se reza con completa fe, supuestamente activamos al Creador a"}],"rawCharCount":5006},{"pageNumber":15,"blocks":[{"id":"p15-b0","pageNumber":15,"indexInPage":0,"text":"Cumplir nuestro pedido. Debemos acordarnos de la regla siguiente: Siempre que hay una carencia – o no se rezó Nada sobre ella, o se rezó poco, el significado es que si el hombre rezara suficientes plegarias, Podría reparar cualquier imperfección. ¿Cuál es la explicación de esto? Existe una ley espiritual, que no es menos infalible que las leyes Conocidas de la naturaleza, que toda plegaria que reza el hombre cuyo objetivo es conocer y Acercarse al Creador, es eficaz."},{"id":"p15-b1","pageNumber":15,"indexInPage":1,"text":"Solo que hay algunas cosas que necesitan una cantidad Determinada de rezos, y hay otras que necesitan otra cantidad, pero ciertamente que una gran Cantidad de rezos es eficaz en todos los casos. Si el hombre cree en esto, prolongara sus Plegarias lo necesario y recibirá su pedido, como dijo un gran Sabio: “Quien prolonga su plegaria – su plegaria no vuelve vacía”."},{"id":"p15-b2","pageNumber":15,"indexInPage":2,"text":"Y así vimos en Moisés: cada vez que le ocurría una desgracia al pueblo de Israel, incluso cuando Di-s por Si Mismo quiso destruirlo – rezo hasta que logro anular el Juicio Divino. Y no solo eso, Sino que incluso recibió en cambio un buen regalo, una extraordinaria salvación para el Pueblo Elegido. Cuentan los antiguos Sabios que cuando se le decreto a Moisés no entrar en la tierra de Israel, ¡Rezo 515 plegarias! El rezo y suplico hasta que Di-s Mismo le dijo (Deuteronomio 3:26): “¡Es Suficiente para ti! No Me sigas hablando de esto”."},{"id":"p15-b3","pageNumber":15,"indexInPage":3,"text":"Entendemos aquí, que si Moisés hubiera Agregado una plegaria más supuestamente hubiera debido Di-s recibirla y permitirle entrar en la Tierra de Israel, en caso contrario no le hubiera ordenado que deje de rezar. Debido a que el Creador no quiso que Moisés entrara en la Tierra Prometida, le impidió seguir rezando, y Moisés Le obedeció. ¿Por qué entonces el Creador espero que Moisés rezara todas esas plegarias menos una, y solo Después lo detuvo?"},{"id":"p15-b4","pageNumber":15,"indexInPage":4,"text":"La primera razón es debido al placer que le dieron las plegarias de Moisés, y la segunda es porque El quería usarlas para ayudar al pueblo de Israel a entrar en la Tierra Santa. El resultado de lo antedicho es que mientras el Creador no ordena al hombre interrumpir su Plegaria, ¡el hombre puede y necesita rezar hasta recibir su pedido! Todo esto es relevante para el hombre cuya intención y voluntad es cumplir su propósito en la Vida, que es conocer y acercarse al Todopoderoso, y entonces seguro que toda plegaria suya es Aceptada."},{"id":"p15-b5","pageNumber":15,"indexInPage":5,"text":"Pero el hombre que reza sobre cosas contrarias a la Voluntad del Creador, que no se"},{"id":"p15-b6","pageNumber":15,"indexInPage":6,"text":"Sorprenda si sus plegarias no son recibidas y todavía conseguirá Su Ira. ¿Esto a que se parece? Al hijo que pide a su padre: “Dame cien mil dólares”. El padre le pregunta: “¿Para que necesitas Tanto dinero?”. “Para comprar muchos camiones llenos de basura, ensuciar tu casa y luego Destruirla”, contesta el hijo. Por supuesto que este padre no solo no le da el dinero que pidió, sino que también se enojara Por su gran desvergüenza."},{"id":"p15-b7","pageNumber":15,"indexInPage":7,"text":"Lo mismo pasa con el hombre que pide al Creador que le conceda malos deseos y apetitos, que Le de suerte para hacer solo mas transgresiones y pecados, destruyendo y ensuciando al mundo. Por otro lado, la plegaria del hombre cuya intención es acercarse a Él y conocerlo, construye el Mundo y lo embellece, y por supuesto que el Creador se alegra con su plegaria y la recibe. Y También si su pedido no es recibido inmediatamente, es debido a que Él está sediento y Añorando más plegarias como esas."},{"id":"p15-b8","pageNumber":15,"indexInPage":8,"text":"Y como ya fue dicho, cada pedido tiene una cantidad de Plegarias que es necesario rezar para recibir. Al Creador no le interesa que demuestres las realizaciones de tus \"caballos\" – todo tipo De fuerzas y todo tipo de artificios de la naturaleza, de la tecnología y cosas semejantes, Sino que Él quiere que... “No la fuerza del caballo Él desea…” Muchos de los antedichos detalles para la aclaración de la fe y otros que aclararemos a Continuación, faltan en los seres humanos."},{"id":"p15-b9","pageNumber":15,"indexInPage":9,"text":"Por eso, los hombres no saben la fuerza que tienen En sus propias manos – la fuerza de la fe – y no la aprovechan para acercarse al Creador y Mejorar sus vidas. Como se ha dicho, hay hombres cuya fe se contenta en que hay un Creador Del Universo, o que creen en una fuerza superior que tiene una oculta influencia sobre sus vidas. Ellos no asocian su vida cotidiana y todos sus detalles con la Divina Supervisión, creyendo que Esa es la Voluntad del Creador."},{"id":"p15-b10","pageNumber":15,"indexInPage":10,"text":"Todas las cosas de la vida, desde los casos más simples, como un niño que no obedece a su Padre, o una mujer que grita a su marido, hasta los casos más graves, como los problemas de Salud o de sustento, todo debe estar relacionado con la fe, creyendo que así el Creador quiere. En cada dificultad o privación que tenemos, debemos hablar con el Creador y pedirle que nos Permita saber cuál es Su Voluntad respecto a nosotros en todo lo que nos sucede."},{"id":"p15-b11","pageNumber":15,"indexInPage":11,"text":"Si tú crees que todo proviene del Creador, ¡¿entonces por qué no hablas con Él de cada Cosa!? Esta es la señal que no crees que sólo Él puede ayudarte. Es señal que debes Fortalecer tu fe."}],"rawCharCount":4943},{"pageNumber":16,"blocks":[{"id":"p16-b0","pageNumber":16,"indexInPage":0,"text":"Es esta la Voluntad del Creador: que el hombre lo reconozca siempre, que en cada cosa que Él le trae a su vida cotidiana se dirija a Él, le pida que le haga entender que es lo que desea de El y solicite Su ayuda. El Creador de ninguna manera está interesado en artificios y grandes esfuerzos de parte de los Hombres, como está escrito (Salmos 147:10–11): “No la fuerza del caballo El desea, ni quiere las Piernas del hombre. El Eterno desea a los que Le temen, a los que esperan Su Misericordia”."},{"id":"p16-b1","pageNumber":16,"indexInPage":1,"text":"Es decir, que al Creador no le interesa que demuestres las realizaciones de tus “caballos”, o sea Todo tipo de fuerzas, de artificios de la naturaleza y de la tecnología Que están a tu disposición; ni La fuerza de tus “piernas”, o sea tu resistencia y dureza frente a las adversidades de la vida, sino Que Él quiere que Le reces, que Le temas y pidas Su Benevolencia. Por medio de nuestra conversación con el Creador sobre cada cosa, nos acostumbramos a creer En El y verlo en cada momento de nuestra vida."},{"id":"p16-b2","pageNumber":16,"indexInPage":2,"text":"Esto nos estimula a agradecerle y a rezar por Todo, sin que seamos forzados a esto por medio de todo tipo de tribulaciones."},{"id":"p16-b3","pageNumber":16,"indexInPage":3,"text":"La fuerza de la fe Vemos que gracias a la fe, no solo este mundo está muy bien entendido, sino que la fe es la Fuerza más grande que tenemos. Gracias a esta fuerza podemos superar fácilmente y con Éxito cada dificultad, prueba o crisis en todas las áreas: sustento, matrimonio, educación de los Hijos, espiritualidad, etc."},{"id":"p16-b4","pageNumber":16,"indexInPage":4,"text":"De verdad, si reflexionamos bien, vemos que la fe es la única fuerza en el mundo que esta Siempre disponible al hombre, y que lo acompaña en todas las situaciones y en todos los Momentos de su vida – incluso después de su muerte. Sin esta fuerza, hay situaciones y Pruebas en las que el hombre queda desesperado y desamparado. Experiencias que destruyen Su espíritu, y pueden llevarlo al desmoronamiento y la destrucción de su vida. Es importante saber que toda desesperación y amargura, se debe solo a la falta de fe."},{"id":"p16-b5","pageNumber":16,"indexInPage":5,"text":"El hombre Piensa que en la situación en que se encuentra, no hay ninguna solución y por eso pierde toda Su esperanza. Pero quien tiene fe, sabe que no hay ninguna situación de la que Dios no pueda Salvarlo. Como vimos en el caso del Rey Ezequías, que cuando el profeta Isaías, hijo de Amos ,"},{"id":"p16-b6","pageNumber":16,"indexInPage":6,"text":"Le profetizo que le fue decretada la muerte, le contesto: “Hijo de Amos – termina tu profecía y Márchate. Esto es lo que he aprendido en la casa de mi abuelo (el Rey David): Incluso Cuando una filosa espada está colocada sobre el cuello del hombre – no se evite a sí Mismo la Misericordia Divina”. Es decir, que el no evito la plegaria que es el estimulante de la Misericordia Divina. Debemos saber, que aunque según la ley de la naturaleza no hay ninguna Posibilidad, ¡por medio de la plegaria ciertamente la hay!"},{"id":"p16-b7","pageNumber":16,"indexInPage":7,"text":"Cuando el hombre sufre experiencias y situaciones difíciles y se fortalece con fe, creyendo que Llegaron por la Supervisión Divina, no por casualidad o por ley natural, y se dirige al Creador, Entonces supera todas las dificultades con éxito. Y no solo esto, sino que ellas mismas Enriquecen su espíritu. Y lo principal – tiene el mérito de conocer al Creador, que es esta la Finalidad por la que fue creado. Por lo tanto, esta es la meta de todas las penas y tribulaciones Que hay en el mundo –
