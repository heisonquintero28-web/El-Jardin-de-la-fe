obstante, si meditara como se debe y se preguntara: “¿Que es la ira? ¿Cual es su definicion? ¿Que dice la Ley Divina sobre ella? ¿Acaso existe alguna situacion en la esta permitido encolerizarse? ¿Existe un solo caso en el cual la ira es provechosa? ¿Quizas esta permitido encolerizarse para educar?, ¿o por la paz domestica?, ¿o por la subsistencia?” – lograria el conocimiento y veria por si mismo donde esta la verdad."},{"id":"p117-b2","pageNumber":117,"indexInPage":2,"text":"Ciertamente llegaria a la conclusion que ninguna situación en el mundo justifica la ira, que cada vez que se encoleriza realiza una muy grave transgresion; y que con cada uno de sus enojos solo pierde mucho. Este conocimiento debera ser claro, fuerte y firme, sin sombra de duda que no se encolerizara bajo ningun pretexto; que la ira no es provechosa en ningun caso; que nunca es aconsejable; que por medio de ella nunca se engendrara ningun bien y no hay ninguna situacion en la que esta permitida."},{"id":"p117-b3","pageNumber":117,"indexInPage":3,"text":"Y cuando esta fuerte y firme claridad mental, penetre dentro del corazon del hombre – ¡ya no se encolerizara! Y es necesario multiplicar las plegarias sobre eso: “Dueño del Mundo, Ten compasión de mí. Ayúdame a saber perfectamente que no existe ninguna situación en el mundo en que la ira es permitida, o que sea provechosa. Apiádate de mí y ayúdame a que mi corazón no me induzca al error de creer que hay veces en que está permitido encolerizarse, o que es justificado o benéfico."},{"id":"p117-b4","pageNumber":117,"indexInPage":4,"text":"Si me encolerizo, debo saber claramente que cometo un pecado... Ayúdame entonces a investigar cómo la Mala Inclinación me incitó a transgredir, cómo me engañó, hasta que mi mente esté clara, fuerte y firme, y así nunca me permitirá, bajo ningún pretexto, encolerizarme; que mi corazón nunca me seduzca...”. El hombre colerico debe rogar cada dia sobre este tema, y realizar un examen de conciencia para juzgar como se porto desde su ultimo examen. Y cuando no logre"},{"id":"p117-b5","pageNumber":117,"indexInPage":5,"text":"superar la ira, debe analizar como la Mala Inclinacion lo incito a errar y que grieta encontro en el. Debera rezar para que la proxima vez ella no salga victoriosa. Pues, al fin de cuentas, ¿cuantas posibilidades existen? Muy pocas. En general, el hombre cede a la colera en las mismas ocasiones: en la educacion de los ninos, en la relacion conyugal, en el trabajo."},{"id":"p117-b6","pageNumber":117,"indexInPage":6,"text":"Entonces verificara de que manera y en que circunstancias la Mala Inclinacion consigue dominarle, meditara serenamente sobre esos casos, y asi podra superar la prueba la proxima vez. Es este el verdadero trabajo para lograr un claro conocimiento. Lo esencial es que cada vez que el hombre sucumbe y se encoleriza, le sea evidente que transgredio y que la Mala Inclinacion le engano y le sedujo."},{"id":"p117-b7","pageNumber":117,"indexInPage":7,"text":"Debera arrepentirse por su ira, hacer examen de conciencia, y preguntarse por que se enojo, como la mala inclinacion lo provoco, y encontrar cuales son sus puntos debiles en donde todavia le falta claridad mental. Recordaremos bien las palabras del Justo, que son realmente cuatro aspectos: obtener una mente, clara, fuerte, y firme. Porque si nos falta solamente uno de ellos, no podremos superar ninguna prueba, pues todavia tendremos dudas y por cierto fracasaremos."},{"id":"p117-b8","pageNumber":117,"indexInPage":8,"text":"Solamente de esta manera es posible trabajar en una cualidad y adquirirla. Este metodo es bueno y util tanto para todos los rasgos del caracter, como para los distintos apetitos. Si el hombre meditara con serenidad como se debiera hasta poseer la claridad mental, si rezara mucho, y si efectuara examenes de conciencia, entonces seguramente cambiaria y retornaria al Creador."},{"id":"p117-b9","pageNumber":117,"indexInPage":9,"text":"Mientras el alma, que es una pequeña chispa del Creador Mismo, estaba en su lugar de origen, en los intangibles mundos superiores de pura espiritualidad, observaba la Luz Divina… La Virtud de la Fe La virtud de la fe es tan grande que desafia toda definicion. La fe es la raiz y el fundamento del trabajo del hombren este mundo. Por eso, cada uno debe examinar su fe y reforzarla, pues gracias a su perfeccion, se logran adquirir todas las buenas cualidades. De hecho, la fe es la base que sostiene al mundo entero."},{"id":"p117-b10","pageNumber":117,"indexInPage":10,"text":"La fe es el canal de la abundancia y de todas las bendiciones, tanto materiales como espirituales. Como esta escrito (Proverbios 28:20): “El hombre creyente esta colmado de bendiciones” – es decir que quien tiene fe es capaz de atraer toda la abundancia y bendicion. La fe es una fuerza espiritual"}],"rawCharCount":4816},{"pageNumber":118,"blocks":[{"id":"p118-b0","pageNumber":118,"indexInPage":0,"text":"muy poderosa. Mediante una fe verdaderamente candida y privada de sofisticaciones, se puede alcanzar la verdadera voluntad, que se manifiesta en los anhelos de acercarse al Creador y cumplir Su Voluntad de todo corazon. La fe es el fundamento y la raiz de la santidad. El hombre que logra poseerla, logra separarse de sus apetitos fisicos y alcanzar la santidad. La fe conduce a la paciencia, a todas las buenas cualidades y desarraiga los malos rasgos."},{"id":"p118-b1","pageNumber":118,"indexInPage":1,"text":"El hombre que posee una fe completa, tiene la creencia que todo lo que le llega proviene de la Supervision Divina, y que todo es para su bien. Esto es lo que le da la fuerza para ser paciente frente a todos los obstaculos y las confusiones, sin inquietarse por ellos."},{"id":"p118-b2","pageNumber":118,"indexInPage":2,"text":"Todavia mas esta escrito en el “Libro de los Atributos” en el tema “Fe”: “Por medio de la fe el hombre es bendecido; Por medio de la fe el hombre se vuelve mas sabio; La fe da al hombre unaperspicacia y conciencia espiritual mas elevada, permitiendole entender mas facilmente los acontecimientos de su alrededor. La falta de fe es un exilio espiritual, por lo tanto, por medio de la perfeccion de la fe llegara la redencion del mundo."},{"id":"p118-b3","pageNumber":118,"indexInPage":3,"text":"El descenso del alma a este mundo Mientras el alma, que es una pequena chispa del Creador Mismo, estaba en su lugar de origen, en los intangibles mundos superiores de pura espiritualidad, observaba la Luz Divina y gozaba de Su presencia. A primera vista, no existe una proximidad al Todopoderoso mas grande que esta. Pero en realidad, estaba alejada del Creador, ya que no Le conocía."},{"id":"p118-b4","pageNumber":118,"indexInPage":4,"text":"El alma solo sabia de Su maravillosa Luz, pero, ¿Quien es este poderoso Iluminador?, ¿cuales son Sus atributos, Sus formas de conducta, Sus acciones, Sus fuerzas y Su Voluntad? Esto no lo sabia.. Podemos ilustrarlo con una parabola. Si se encontrara delante de nosotros un hombre lleno de encanto, belleza y gloria, por cierto querriamos saber quien es esta persona tan especial, hablarle, conocerle, tanto a el como a sus acciones. No nos contentariamos con estar frente a el, aunque gozaramos de su presencia."},{"id":"p118-b5","pageNumber":118,"indexInPage":5,"text":"Asi tambien el alma queria conocer al Creador pero, quedandose en su lugar de origen, no lo podria realizar, pues en el Cielo no existe la Mala Inclinacion, ni dificultades ni pruebas, sino que todo esta alli iluminado con una maravillosa Luz. En el Cielo el alma no necesita la ayuda ni la Compasion del Creador, ni Su paciencia, ni que la acerque a El y que reciba su"},{"id":"p118-b6","pageNumber":118,"indexInPage":6,"text":"arrepentimiento, porque Sus atributos son revelados solo a los que viven en este bajo mundo, con todas sus tribulaciones. Por lo tanto, el alma no podria conocer al Creador, quedandose en su lugar original. Y como explica el Zohar, La finalidad del Creador del Universo en la Creacion fue revelar Su Compasion. Y si no existiera la creacion del mundo, ¿a quien podria pues mostrarla?"},{"id":"p118-b7","pageNumber":118,"indexInPage":7,"text":"Por eso, conocer la eterna e infinita Compasion del Creador, es posible solo en este mundo material, donde la Compasion Divina es necesaria en cada instante. Y por eso el alma descendio a este mundo – para realizar la finalidad de la Creacion y conocerlo a El. ¡Encantada de conocerte!"},{"id":"p118-b8","pageNumber":118,"indexInPage":8,"text":"Con el fin de ilustrar lo que precede, contaremos esta historia rica en ensenanzas: Cierta vez, un alumno del primer discipulo del gran Justo de Breslev, se quejo diciendole: “Que lastima que no tuve tambien el privilegio de conocer profundamente al gran Justo personalmente...”. El maestro le replico severamente: “Y quien piensas que tenia el merito de conocerlo? ¿El Sr. Frunik?”. Conviene explicar que Sr. Frunik era un simple barquero."},{"id":"p118-b9","pageNumber":118,"indexInPage":9,"text":"Todo el dia, llevaba a la gente de un lado del rio a la otra orilla, cercana a la ciudad de Breslev. A menudo tenia la ocasion de transportar al gran Justo, y se jactaba de eso diciendo: “Ooooh, yo solia pasar mucho de mi tiempo con el Gran Maestro – ¡Yo lo conoci muy bien!”. Lo que el primer discipulo del gran maestro queria explicarle a su propio discipulo era que la proximidad fisica no tiene ningun sentido."},{"id":"p118-b10","pageNumber":118,"indexInPage":10,"text":"Lo esencial del conocimiento del maestro no se limita a una simple mirada, sino que engloba un hondo conocimiento de sus concepciones, de aprender y practicar sus ensenanzas. Le explico que aunque alguien nunca hubiera visto al Justo, por medio del estudio de sus libros y el cumplimiento de sus consejos, lo podria conocer verdaderamente. En efecto, este barquero no solo habia visto, sino que tambien habia tocado al Justo varias veces, asistiendole en el barco."},{"id":"p118-b11","pageNumber":118,"indexInPage":11,"text":"Pero, practicamente hablando, estaba tan lejos de el como el norte del sur, porque no conocia verdaderamente a quien estaba a su lado. Solo quien conoce al Justo en el plano espiritual, su sabiduria, sus ensenanzas, sus obras, su capacidad y sus consejos, solo el puede afirmar conocerle verdaderamente. El mismo principio se aplica al conocimiento del Creador: el alma en los mundos superiores se contentaba de la Luz Divina,"}],"rawCharCount":4830},{"pageNumber":119,"blocks":[{"id":"p119-b0","pageNumber":119,"indexInPage":0,"text":"sin verdaderamente conocer al Creador. Esto se parece al barquero que se jactaba de conocer al Justo, cuando en realidad, no conocia nada mas que el color de su barba. En cambio, despues del envio del alma a este mundo, donde el hombre necesita la ayuda constante del Creador en todos los acontecimientos y las pruebas que sufre durante su vida y a cada instante, ella puede realmente acercarse a El y decirle: “¡Encantada de conocerte!”."},{"id":"p119-b1","pageNumber":119,"indexInPage":1,"text":"El hijo de un gran erudito que quiso “empaparse” con la luz de la fe, decidió que inmediatamente después de su matrimonio se acercaría a un gran maestro espiritual que se encontraba en un lejano lugar… “¡Ella lo dice – yo lo sé!” El hijo de un gran erudito que quiso “empaparse” con la luz de la fe, decidio que inmediatamente despues de su matrimonio, se acercaria a un gran maestro espiritual que se encontraba en un lejano lugar, con el fin de aprender de el durante tres anos consecutivos, en un ambiente de santidad y pureza."},{"id":"p119-b2","pageNumber":119,"indexInPage":2,"text":"Consiguio convencer a su mujer y obtener su aceptacion, pero a su padre le enojo mucho la decision – ¿como podia dejar sola a su joven esposa con la que recien se habia casado, mientras que el deberia mantenerla durante tres anos? Trato pues de impedirlo, sin embargo, cuando vio la terquedad de su hijo, le dejo ir, consolandose que volveria ciertamente con un diploma de maestro o un buen cargo, y asi podria gozar de una buena situacion social y economica."},{"id":"p119-b3","pageNumber":119,"indexInPage":3,"text":"Cuando al termino de los tres anos el hijo volvio, su padre le recibio con emocion. Despues de haber descansado del viaje, le interrogo con esperanza: “¡Mi querido hijo! Te ruego, cuentame lo que aprendiste. ¿En que te calificaste? ¿Eres un maestro? ¿Que ensenanzas nuevas recibiste de tu maestro?”. “Mi querido padre”, contesto su hijo, “durante tres anos me esforce muy duro para adquirir conocimiento y sabiduria."},{"id":"p119-b4","pageNumber":119,"indexInPage":4,"text":"Yo he aprendido una sola cosa: ¡El Universo posee un Creador!”. “¡¿Que?!”, exclamo su padre. “¡¿Esto es todo lo que aprendiste durante esos tres anos?!, ¡¿algo que sabe hasta la persona mas simple?!”. Enseguida llamo el padre a la criada y le pregunto: “Dime por favor, ¿quien gobierna y dirige el universo entero, y posee en sus manos la vida de cada criatura?”. “El Creador del Universo”, respondio la criada, “El es Di-s Todopoderoso, Gobernador del Cielo y de la Tierra”. “¿Y quien cura a cada uno de su enfermedad?”, prosiguio el."},{"id":"p119-b5","pageNumber":119,"indexInPage":5,"text":"Y ella respondio: “El Creador"},{"id":"p119-b6","pageNumber":119,"indexInPage":6,"text":"es Quien cura”. “¿Y quien alimenta a cada criatura?”, interrogo. “El Creador es el que alimenta”, respondio la criada. El padre fijo sus ojos en su hijo y le dijo enojado: “Y... ¿ves? ¡Hasta la simple criada sabe que hay un Creador del Mundo, Quien cura y alimenta! ¡¿Para aprender una cosa tan simple, necesitabas abandonar tu hogar durante tres anos?!”. El hijo le contesto tranquilamente: “¡Mi querido padre, ella solo lo dice, pero yo lo sé!...”. Asi exactamente sucede con el descenso del alma a este mundo."},{"id":"p119-b7","pageNumber":119,"indexInPage":7,"text":"Mientras ella residia en el Cielo, es probable que supiera que Di-s es el Todopoderoso Creador del Universo, que es bueno y beneficioso, que Su Misericordia es infinita, etc., pero era solo un conocimiento abstracto, como cuando se sabe algo en teoria sin experimentarlo. Para enterarse practicamente, debia el alma descender a este mundo y vestirse con un cuerpo fisico, con el fin de pasar ejercicios y entrenamientos practicos de fe. Solo asi podria adquirir un conocimiento autentico del Creador."},{"id":"p119-b8","pageNumber":119,"indexInPage":8,"text":"Todo ser razonable lo sabe – despues de pasar la prueba teorica hay que pasar la practica, que es la esencial. El hombre que no esta dispuesto a enfrentarse en la vida con las pruebas de la fe y ejercerla practicamente, nunca la aprendera. ¡Quizas dira de labios para afuera que “hay un Creador del Universo” – como la criada de la historia – pero no lo sabra! Es solamente a traves de los ejercicios practicos que se puede lograr conocer al Creador verdaderamente, lo cual es el objetivo final del hombre."},{"id":"p119-b9","pageNumber":119,"indexInPage":9,"text":"Por derecho y no por caridad Otra razon para el descenso del alma a este mundo, es que el placer que sentia en su estancia original en el Cielo, se manifestaba en forma de recibimiento de “Pan de verguenza”, lo que significa un placer recibido gratuitamente. Al recibir algo sin trabajar por ello, sin merecerlo, es una verguenza, la cual es una pena para el alma. ¿A que es esto comparable? A un hombre honorable que debe participar de una comida sin ser invitado."},{"id":"p119-b10","pageNumber":119,"indexInPage":10,"text":"Con cada bocado que pone en su boca, sufre terriblemente a causa de su verguenza, y el alimento se le atraviesa en la garganta. Por esa razon, la comida no le proporciona ningun placer. Del mismo modo, debido a que el Creador quiso que el alma sintiera un placer perfecto, la hizo descender a este mundo, para que trabaje y sea recompensada por derecho y no por caridad. Cuando el alma desciende a este mundo, cae en un abismo de oscuridad espiritual, donde la Luz"}],"rawCharCount":4854},{"pageNumber":120,"blocks":[{"id":"p120-b0","pageNumber":120,"indexInPage":0,"text":"Divina esta escondida debajo de una capa de ocultación… La ocultación Cuando el alma desciende a este mundo, cae en un abismo de oscuridad espiritual, donde la Luz Divina esta escondida debajo de una capa de ocultacion. Entonces, una persona pensante pregunta: “¿Como es posible que el alma pueda encontrar al Creador y acercarse a El, en un ambiente donde todo parece esconder o negar Su existencia?”."},{"id":"p120-b1","pageNumber":120,"indexInPage":1,"text":"Vemos con nuestros propios ojos que son muy pocas las personas – hasta las llamadas “religiosas” – que logran quebrar los estratos de oscuridad y ocultacion, para revelar la esplendida iluminacion del Todopoderoso y conocerlo en este mundo. A continuacion, vamos a buscar una respuesta examinando los distintos estratos o capas de la ocultacion: La primera ocultación – la naturaleza: Las leyes de la naturaleza parecen absolutas e inmutables, y en consecuencia, esconden a cada ser creado la Divina Supervision Individual."},{"id":"p120-b2","pageNumber":120,"indexInPage":2,"text":"¿Si el Creador quiere que se Le conozca a traves de este mundo, por que no gobierna la Creacion a plena luz por medio de una Supervision manifiesta y milagros, lo que permitiria a todos conocer Su existencia sin dificultad? La segunda ocultación – los seres humanos: Los hombres mismos constituyen una gran ocultacion de la existencia del Creador, ya que aparentemente hacen lo que quieren y pueden hacer el bien o el mal a su antojo. ¿Si es asi, donde esta la Revelacion del Creador, la Supervision Divina y Sus atributos?"},{"id":"p120-b3","pageNumber":120,"indexInPage":3,"text":"Esto es particularmente dificil pues la mayoria de la gente estan lejos de vivir segun la fe, como puede verse por su comportamiento y sus palabras... Todo esto lleva a una enorme ocultacion del Creador. La pregunta es pues la siguiente: ¿Por que el Creador no hizo que todos los hombres poseyeran la fe, haciendo asi las cosas mas faciles para creer en El?"},{"id":"p120-b4","pageNumber":120,"indexInPage":4,"text":"La tercera ocultación – el cuerpo humano: El alma esta revestida de un cuerpo material, lleno de apetitos, inclinaciones y necesidades, que estan en total oposicion a la espiritualidad y la Divinidad. Tal cuerpo solo atrae al hombre hacia las vanidades de este mundo. ¿Por que el Creador no le dio al hombre un cuerpo santo y puro, que lo conduzca naturalmente hacia la Divinidad, permitiendo entonces al alma conocer al Creador con facilidad?"},{"id":"p120-b5","pageNumber":120,"indexInPage":5,"text":"La cuarta ocultación – dificultades y tribulaciones: La misma esencia de la vida, en este mundo material,"},{"id":"p120-b6","pageNumber":120,"indexInPage":6,"text":"esconde la Divinidad de multiples maneras. Los problemas de la vida diaria – dificultades financieras, enfermedades, delitos, presiones emocionales, y muchos mas – todos estos ocultan la Benevolencia Divina. La ocultacion es aun mas fuerte cuando se comprueba todo tipo de horrores: catastrofes, atentados terroristas, accidentes fatales, genocidios, ninos nacidos invalidos, hombres perseguidos, torturados y encarcelados, gente cuya vida y la de sus allegados es verdaderamente insoportable, etc."},{"id":"p120-b7","pageNumber":120,"indexInPage":7,"text":"El que mira tal realidad se interroga: ¿Donde esta Di-s? ¿No podria el Creador habernos dado condiciones de vida mas faciles? ¿Por que no ha hecho que desde el momento de su nacimiento, cada hombre tenga una suma de dinero depositada a su nombre en el banco, una casa de ensueno con piscina y varios coches en el garaje, un avion privado sobre el tejado preparado para despegar, una pareja perfecta, y una salud a toda prueba?"},{"id":"p120-b8","pageNumber":120,"indexInPage":8,"text":"Si hubiera dado todo esto a cada uno indiscriminadamente, el mundo seria hermoso y perfecto…, un paraiso… La quinta ocultación – El cumplimiento de la Ley Divina y los Preceptos: Esta es la mas dura de todas las ocultaciones. Pues hasta la Ley del Creador, que dio al hombre con el fin de que Lo conozca, es por si misma una gran ocultacion."},{"id":"p120-b9","pageNumber":120,"indexInPage":9,"text":"No siempre es bastante clara, y hay muchas opiniones y contradicciones sobre como cumplirla: uno aconseja actuar de tal modo, y otro actuar de otro, y cada uno asegura que es el dueno de la verdad... El hombre esta pues perplejo frente a la multiplicidad de opiniones – ¿Cual es entonces el verdadero camino para cumplir Su Voluntad?"},{"id":"p120-b10","pageNumber":120,"indexInPage":10,"text":"¿Por que el Creador no dio una Ley donde todo esta perfectamente claro?, ¿que tan pronto como sea estudiada, alumbraria al hombre con la Luz Divina?, ¿Que con cada Precepto cumplido difundiria enseguida abundancia Divina, iluminacion, logros, dulzura y amenidad?; ¿por que el Creador no hizo que la senda para conocerlo sea clara, precisa y limitada por barreras que evitarian al hombre desviarse a la izquierda o a la derecha?"},{"id":"p120-b11","pageNumber":120,"indexInPage":11,"text":"Resulta que en este mundo, el hombre se encuentra entre la espada y la pared – la naturaleza le esconde al Creador, tambien los hombres, su cuerpo, los problemas de la existencia y los sufrimientos lo alejan de El. Y despues de todo, al dirigirse al unico consuelo que le queda, la Ley que el Creador le ha dado, tampoco le es simple ni facil de entender, y a veces"}],"rawCharCount":4743},{"pageNumber":121,"blocks":[{"id":"p121-b0","pageNumber":121,"indexInPage":0,"text":"hasta parece alejarlo. ¿Que debe entonces hacer el hombre?... El descubrimiento ¿Saben que? No hay ningun error ni falla en esta realidad, sino que es esta la exacta intencion del Creador – hacer descender el alma a este mundo lleno de tan grandes ocultaciones. Son precisamente las dificultades y el peligro constante que afronta el hombre en este mundo, lo que le conducen a buscar y a acercarse al Creador – con solo quererlo. ¿Por qué esperar los tiempos difíciles?"},{"id":"p121-b1","pageNumber":121,"indexInPage":1,"text":"Cuanto más buscamos al Creador, más mejoramos la calidad de nuestra vida. Incluso si no sufrimos de ninguna dificultad trascendental… Como ya hemos mencionado, no hay ningun error ni falla en la realidad en la que nos encontramos, sino que es esta la exacta intencion del Creador – hacer descender el alma a este mundo lleno de tan grandes ocultaciones. Son precisamente las dificultades y el peligro constante que afronta el hombre en este mundo, lo que le conducen a buscar y a acercarse al Creador – con solo quererlo."},{"id":"p121-b2","pageNumber":121,"indexInPage":2,"text":"La explicacion es la siguiente: cuando el hombre ve y comprende las multiples ocultaciones, peligros y dificultades, se da cuenta de su nulidad y su desamparo, lo que le hace dirigirse al Creador y pedir Su ayuda en cada instante. Por cada prueba que atraviesa, por cada dificultad u obstaculo que se le presenta, pide sin demora la ayuda del Todopoderoso. Asi, resulta que estas mismas ocultaciones solo lo aproximan al Creador, dandole el empuje para conocerle."},{"id":"p121-b3","pageNumber":121,"indexInPage":3,"text":"Sin embargo, el hombre debe fortalecerse mucho a la hora de las dificultades y pruebas, y siempre recordar que estas son para acercarlo y no para alejarlo. Porque toda la esencia de la prueba es cuando se le impide al hombre su conocimiento, y no le queda otra alternativa que rogarle al Creador que le ayude a superarla."},{"id":"p121-b4","pageNumber":121,"indexInPage":4,"text":"Debemos saber que si no nos confrontaramos con tantas ocultaciones, si las condiciones de vida sobre la Tierra nos fueran faciles, si los sufrimientos y tribulaciones no existieran, si el cuerpo fuera ligero e inmaterial, si la Ley Divina fuera clara y limpida – ¡nunca nos acercariamos al Creador! Simplemente no lo necesitariamos, y el alma no tendria ningun beneficio en su descenso a este mundo. Ella podria quedarse bajo el Trono de la Gloria en el Cielo, gozando de la Presencia Divina. Pero, ¿por que esperar los tiempos dificiles?"},{"id":"p121-b5","pageNumber":121,"indexInPage":5,"text":"Cuanto mas buscamos al Creador, mas mejoramos la calidad de nuestra vida. Incluso si no"},{"id":"p121-b6","pageNumber":121,"indexInPage":6,"text":"sufrimos de ninguna dificultad trascendental, aun cuando tambien estudiemos la Ley Divina y cumplamos los Preceptos, deberiamos dirigirnos regularmente al Creador."},{"id":"p121-b7","pageNumber":121,"indexInPage":7,"text":"Porque hasta en estas situaciones necesitamos Su ayuda, para que nos guie, para que nos ayude a dirigirnos hacia la verdad, para tener el merito de cumplir cada Precepto con su correcta intencion, y como imploraba el Rey David muchas veces (Salmos 25, 119): “Guiame en Tu verdad”, “Muestrame Tus caminos”, “Ensename, oh Eterno, el camino de Tus estatutos”, “Concedeme entendimiento y atesorare Tu Ley”, “Guiame por el camino de Tus Preceptos”, “Inclina mi corazon a Tus testimonios”, y mas y mas..."},{"id":"p121-b8","pageNumber":121,"indexInPage":8,"text":"Vemos entonces, que las ocultaciones son un gran bien – ¡ellas provocan la necesidad constante del hombre hacia el Creador! Le necesita con el fin de superar las duras leyes de la naturaleza; Le necesita para dominar su cuerpo y sus apetitos materiales; Le necesita con el fin de superar los impedimentos que provienen de las personas que le rodean; Le necesita para superar las dificultades existenciales; y Le necesita para dirigirse hacia la verdad de Su Ley."},{"id":"p121-b9","pageNumber":121,"indexInPage":9,"text":"Somos testigos que gente que vive en la opulencia, no se acerca tanto al Creador. Sin embargo, ciertamente ellos Le necesitan, pues este mundo por si mismo carece de toda finalidad, por eso sin la Luz del Creador, incluso quien goza de todo exito y logro mundano, tiene una vida vacia y oscura. Hay muchos testimonios de personas que – aunque el mundo entero estaba en sus manos – sentian que no poseian nada, ni vida, ni alegria, sino solamente un sentimiento de vacio y de desolacion."},{"id":"p121-b10","pageNumber":121,"indexInPage":10,"text":"Por lo tanto, hasta el hombre que vive en la opulencia, debe despertarse y meditar que la vida se consume y se va, y a su fin se dejan atras todas las riquezas y los exitos. Entonces, entre tanta abundancia y vida facil, comprendera que necesita al Creador para saciar la sed de su alma que no siente ninguna satisfaccion de las cosas mundanas, y entonces se acercara a El por amor y no por sufrimientos."},{"id":"p121-b11","pageNumber":121,"indexInPage":11,"text":"Vemos que el Creador del Universo creo una realidad donde todas las criaturas necesitan siempre de El: quien tiene dificultades, por supuesto Le necesita; pero tambien quien “nacio con una cuchara de oro en la boca”, Le necesita para encontrar una verdadera y significativa vida, pues sin el Creador, la vida no es vida... Y en verdad, el hombre que vive segun su finalidad, Le habla al Creador de todas sus cosas,"}],"rawCharCount":4826},{"pageNumber":122,"blocks":[{"id":"p122-b0","pageNumber":122,"indexInPage":0,"text":"Le pide consejos y lo que necesita en cada caso y situacion, el Creador no necesita mandarle ningunas tribulaciones, penas, o crisis para estimularlo a acercarse hacia El, y su vida se desarrolla grata y tranquilamente. Cuando el hombre sabe que la finalidad de su vida consiste en conocer al Creador, entonces todo le es bueno y dulce, y en cada acontecimiento encuentra insinuaciones para como acercarse a El. De un suceso aprende a corregir un cierto defecto, de otro, aprende algo que le faltaba saber y que el Creador queria ensenarle."},{"id":"p122-b1","pageNumber":122,"indexInPage":1,"text":"De otra cosa, se despierta para multiplicar sus rezos sobre cierto tema, y de otra se estimula al arrepentimiento, a la buena voluntad, etc. En resumen, todos los acontecimientos de su vida se transforman armoniosamente en una aproximacion al Creador."},{"id":"p122-b2","pageNumber":122,"indexInPage":2,"text":"Así se aprende de los cuatro Sabios que lograron entrar al “Vergel” - alegórico de los mundos espirituales superiores - el primero murió, el segundo se volvió loco, el tercero… He aqui otra explicacion de las ocultaciones que senalamos: ya que la Luz Divina es infinita, no podemos acercarnos directamente sin obstaculos ni pantallas, porque es evidente que nos “consumiriamos” frente a Su intensa Luz y moririamos, o nos volveriamos locos o llegariamos a la herejia."},{"id":"p122-b3","pageNumber":122,"indexInPage":3,"text":"Por lo tanto, el Creador – como un buen entrenador – nos da oportunidades para reforzar nuestra espiritualidad, de modo que seamos recipientes bastante potentes, para poder recibir una mayor porcion de Su Luz. Cada vez que una persona experimenta una prueba de fe, supera un obstaculo en el cumplimiento de un Precepto, lucha y se sobrepone a una tentacion o deseo fisico, o refuerza su alma, se transforma en un recipiente apropiado para recibir un poco mas de Luz Divina."},{"id":"p122-b4","pageNumber":122,"indexInPage":4,"text":"Despues, cuando el apetito le domina y lo supera nuevamente, vuelve a recibir otro poco de Luz, y asi sucesivamente… Este vaiven se repite de muchas formas diferentes por las cuales el hombre sube nivel a nivel, construyendo receptaculos para recibir gradualmente la Luz Divina, sin sufrir por eso el menor perjuicio. Asi se aprende de los cuatro Sabios que lograron entrar al “Vergel”, alegorico de los mundos espirituales superiores."},{"id":"p122-b5","pageNumber":122,"indexInPage":5,"text":"El primero murio, el segundo se volvio loco, el tercero perdio su fe y se hizo hereje, y solo el cuarto entro y salio en paz sin danarse. Los primeros tres entraron precipitadamente y recibieron una exposicion tan alta de Luz Divina, que"},{"id":"p122-b6","pageNumber":122,"indexInPage":6,"text":"fue demasiado fuerte para los receptaculos espirituales que disponian, y cada uno de ellos, segun su caso, fue danado. El cuarto Sabio, por otra parte, entro gradualmente, y por eso la iluminacion no solo no lo dano, sino que le fue gratificante, ya que logro un apropiado receptaculo para esa exposicion de Luz Divina. ¿Como logro ese Sabio alcanzar un tan alto nivel? La respuesta se encuentra en la historia de su vida. El era hijo de pobres forasteros, que no tenian mucha relacion con la fe ni con la Ley Divina."},{"id":"p122-b7","pageNumber":122,"indexInPage":7,"text":"Por lo tanto, debio trabajar muy duro para elevarse de su punto de partida espiritual. El no gozaba ni del merito de sus antepasados, ni de linaje, ni de otra situacion favorable. Mientras sus colegas tenian una vida facil, viniendo de familias de alta posicion social, siguiendo la senda del Creador desde su infancia, el era pobre e incluso ignorante hasta los cuarenta anos, y atraveso numerosas dificultades e impedimentos."},{"id":"p122-b8","pageNumber":122,"indexInPage":8,"text":"No obstante, eso mismo le permitio desarrollar una tremenda voluntad de acercarse al Creador, multiplicar sus plegarias, llorar torrentes de lagrimas para que el Creador le permitiera aprender y entender Su Ley, y merecer finalmente lo que merecio – transformarse de un campesino comun a un Maestro Espiritual extraordinario con decenas de miles de discipulos. Asi es como recibio los magnificos receptaculos espirituales que le sirvieron para recoger la gran Luz Divina, sin sufrir el menor dano."},{"id":"p122-b9","pageNumber":122,"indexInPage":9,"text":"La siguiente es una corroboracion que cada uno debe aprender bien e integrar en su corazon: las dificultades en la vida son para bien, son los vehiculos que realmente refuerzan nuestras almas y nos despiertan para que nos acerquemos al Creador. ¿Cual podria ser un estimulo mas grande que saber que el Creador quiere aproximarnos a El?"},{"id":"p122-b10","pageNumber":122,"indexInPage":10,"text":"De este modo, cuando miramos nuestras vidas con los ojos de la fe, al instante nos hacemos tanto mas fuertes como mas felices, y merecemos finalmente alcanzar los mas altos niveles – mucho mas que todos aquellos que tienen exito facilmente. Por lo tanto, esta claro que el que tiene exito facilmente, pierde todas las ventajas de los obstaculos que le ensenan al hombre su nulidad y le hacen creer en el Creador, volverse hacia El y desear Su proximidad. No te sientas celoso de alguien que tiene una vida facil – esto no es un premio."},{"id":"p122-b11","pageNumber":122,"indexInPage":11,"text":"Cualquier atleta campeon sabe que “No hay miel sin hiel”. La gente que no ha sido probada, pierde todas las ventajas de los obstaculos"}],"rawCharCount":4848},{"pageNumber":123,"blocks":[{"id":"p123-b0","pageNumber":123,"indexInPage":0,"text":"que le ensenan al hombre su nulidad, y es muy limitada en su capacidad de entender la fe y de acercarse al Creador. En otras palabras, quien no conoce dificultades, le es mas dificil progresar en espiritualidad. Ahora que descubrimos las ventajas de las dificultades de la vida, podemos entender claramente por que el Todopoderoso envio nuestras almas a este humilde mundo material."},{"id":"p123-b1","pageNumber":123,"indexInPage":1,"text":"Ya que el alma es espiritual, la dura realidad a la que está expuesta en este mundo le lleva anhelar a su Creador, a tener sed de la Divinidad… Buscar la Luz Cada dificultad superada con el poder de la plegaria, nos trae un conocimiento suplementario de la grandeza del Creador. La oscuridad y las dificultades provienen de una falta de conocimiento espiritual, por lo tanto, cuando deseamos sobreponernos a la ocultacion, deseamos esencialmente el conocimiento del Creador, que es la Luz Divina que nos ha sido escondida."},{"id":"p123-b2","pageNumber":123,"indexInPage":2,"text":"Asi recibimos un nuevo conocimiento, que si no fuera por la dificultad que tuvimos, nunca hubieramos sabido de su falta. Vemos que la ocultacion misma de la Luz Divina, es la que incita y estimula al hombre a buscar el conocimiento espiritual. Ademas, los obstaculos y las dificultades que encontramos, tienen la funcion de dirigirnos hacia nuestra mision personal para la cual llegamos a este mundo."},{"id":"p123-b3","pageNumber":123,"indexInPage":3,"text":"Cuando el hombre choca contra tal o cual dificultad que proviene de alguna de las ocultaciones que senalamos, y se vuelve hacia el Creador pidiendole que le muestre lo que le insinua y que debe corregir, merece entonces encontrar su camino personal en este mundo. “Mi alma está sedienta del Todopoderoso” Ya que el alma es espiritual, la dura realidad a la que esta expuesta en este mundo le lleva anhelar a su Creador, a tener sed de la Divinidad."},{"id":"p123-b4","pageNumber":123,"indexInPage":4,"text":"Tal como dijo el Rey David (Salmos 42:3): “Mi alma esta sedienta del Todopoderoso, del Di-s vivo”. Y ella pregunta con anhelo: “¿Cuando vendre y me presentare ante Di-s?”. El alma no siente ninguna satisfaccion o placer con los asuntos materiales de este mundo."},{"id":"p123-b5","pageNumber":123,"indexInPage":5,"text":"Hay una larga lista de gente que ha sido muy exitosa en el campo material, teniendo todo lo que una persona podria sonar, a pesar de ello muchos vivieron con un gran sentimiento de frustracion, y algunos hasta llegaron al suicidio, porque vieron que poseyendolo todo, no tuvieron verdaderamente nada. Asi es que sintiendo la oscuridad que la rodea, el alma extrana al"},{"id":"p123-b6","pageNumber":123,"indexInPage":6,"text":"Creador, y por eso llega a conocer, amar, y apreciarlo cada vez mas. Una saga continua de dificultades Cuanto mas problemas, dificultades y pruebas tiene el hombre, mas busca al Creador; como alguien que estando en la oscuridad busca la luz. Incluso si Lo busca solo como una solucion a sus problemas, como un alivio, y no porque quiere acercarse a El, descubre Su Misericordia infinita y Su Piedad."},{"id":"p123-b7","pageNumber":123,"indexInPage":7,"text":"Esto han ensenado los Sabios: “De los hijos de los pobres, saldra la Ley”; las dificultades existenciales y las privaciones materiales de los ninos pobres, estimulan en ellos desde la infancia la necesidad de buscar al Creador y gracias a ello, merecer la fe y la confianza en El. El Rey David sufrio indecibles dificultades desde corta edad y asi busco al Creador constantemente, alcanzando por ultimo el nivel de un elegido y de profeta. El escribio el Libro de los Salmos, la principal coleccion de plegarias personales."},{"id":"p123-b8","pageNumber":123,"indexInPage":8,"text":"Nuestros Sabios nos ensenan que las cuatro Matriarcas, Sara, Rebeca, Raquel y Lea eran esteriles porque el Creador deseaba sus rezos. Si ellas hubieran tenido hijos sin dificultad, seguramente habrian rezado mucho menos, tanto en cantidad como en intensidad. Si examinamos las vidas de los grandes Justos, encontraremos casi siempre que sus vidas fueron una saga continua de dificultades, una despues de otra, de esta manera el Creador los acerco a El."},{"id":"p123-b9","pageNumber":123,"indexInPage":9,"text":"Esta es tambien la razon de todos los obstaculos que cada uno atraviesa – el Creador quiere simplemente acercarnos a El. Los impedimentos intensifican el deseo El gran Justo de Breslev escribe: “la medida del deseo del hombre depende del obstaculo que se le presenta. Porque por medio del impedimento, se intensifica el deseo”. Con este principio en mente, podemos ver las dificultades, problemas, procesos, y tribulaciones de la vida con una luz positiva."},{"id":"p123-b10","pageNumber":123,"indexInPage":10,"text":"Tan pronto como una persona se encuentra con un sufrimiento o un obstaculo, deberia despertar de nuevo su deseo, su voluntad, su anhelo del Creador, y el cumplimiento de Sus Preceptos – pues esta es la finalidad de sus sufrimientos, acercarlo a El y conocerlo."},{"id":"p123-b11","pageNumber":123,"indexInPage":11,"text":"Y asi dice el profeta Jeremias (Jeremias 30:7), “Es un tiempo de tribulaciones para Jacob, mas de ellas sera salvado” – es decir que de la desgracia misma proviene el socorro autentico, el conocimiento del Creador; porque la angustia conduce al hombre que reconoce su nulidad, a pedir Su ayuda y buscar Su proximidad."}],"rawCharCount":4787},{"pageNumber":124,"blocks":[{"id":"p124-b0","pageNumber":124,"indexInPage":0,"text":"Como tal, el problema es por ultimo una gema de indecible valor. Y asi esta escrito (Ezequiel 18:23): “„¿Acaso me complazco Yo de la muerte del malvado?‟ – dice Di-s el Eterno – „por el contrario, deseo que retorne de sus caminos y viva‟”. El Creador no desea que el hombre sufra; El quiere que viva una vida recta y que sea feliz."},{"id":"p124-b1","pageNumber":124,"indexInPage":1,"text":"Todas las dificultades de la vida son llamadas de advertencia para iniciar el examen de conciencia en dos niveles, a saber, aguijonearnos a buscarlo, y estimular nuestro arrepentimiento y desarrollo de caracter. Si siempre fueramos exitosos, nos transformariamos seguramente en mas presumidos y arrogantes, nunca buscariamos al Creador, y nunca corregiriamos ni un solo mal rasgo. De este modo, si tuvieramos “todo”, realmente no tendriamos nada."},{"id":"p124-b2","pageNumber":124,"indexInPage":2,"text":"Muchas personas que en este mundo son importantes, grandes, honorables, de la “alta sociedad” – se encuentran en el peldaño más bajo en el Cielo. Lo contrario es también verdad… El propósito de la Ley Divina y de los Preceptos Debemos saber que todo lo que hacemos en el servicio al Creador – ya sea la plegaria, el estudio de Su Ley o el cumplimiento de Sus Preceptos, todo esta dirigido para acercar al hombre a la fe, para que se revele Su Majestad."},{"id":"p124-b3","pageNumber":124,"indexInPage":3,"text":"Eso significa saber y creer que todo lo que pasa en el mundo, en general y con cada uno en particular, es solo por la Voluntad y la Supervision del Creador, sin ninguna intervencion de algun factor natural. No existe la perfeccion del conocimiento autentico – que es la Ley Divina – sin la fe. En otras palabras, el que estudia la Ley sin fe, no puede alcanzar el conocimiento autentico contenido en ella."},{"id":"p124-b4","pageNumber":124,"indexInPage":4,"text":"Tal como dijeron los Sabios que se debe rezar: “Sea Tu voluntad, oh Eterno, que seamos nosotros y nuestros descendientes, conocedores de Tu Nombre y estudiosos de Tu Ley”. Porque solo por medio de ser “conocedores de Tu Nombre”– que es la fe, se logra aprender la Ley Divina como es debido. La fe reforzada conduce a una mayor iluminacion del alma, y mientras mas iluminada este, tendra mayor capacidad de reconocer a su Creador."},{"id":"p124-b5","pageNumber":124,"indexInPage":5,"text":"La regla es que lo esencial de la finalidad del hombre consiste en trabajar y en seguir los caminos delCreador, con el fin de merecer conocerle y acercarse a Él, pues esa es Su Voluntad, que Le conozcamos. No debe el hombre tener otra intención en el servicio al Creador, que cumplir Su Voluntad. Como tal,"},{"id":"p124-b6","pageNumber":124,"indexInPage":6,"text":"estudiar la Ley Divina y cumplir los Preceptos con el proposito de llegar a conocer al Todopoderoso, es el proposito de la existencia del hombre en este mundo, sin motivos ulteriores de beneficio y prestigio personal. El nivel espiritual del hombre Se cuenta sobre el hijo de un gran Sabio, que sufrio una enfermedad que le produjo la muerte clinica. Con la gracia de Di-s, se recupero despues que su alma llego al umbral del Cielo. Cuando se recupero un poco, su padre le pregunto: “Dime hijo, ¿que viste en el Mundo Espiritual?”."},{"id":"p124-b7","pageNumber":124,"indexInPage":7,"text":"Respondio el hijo: “Vi un mundo al reves: los altos estaban abajo y los bajos, arriba”. Asintio el Sabio con la cabeza y dijo: “Hijo, viste un mundo claro”. Muchas personas que en este mundo son importantes, grandes, honorables, de la “alta sociedad” – se encuentran en el peldano mas bajo en el Cielo. Lo contrario es tambien verdad: encontramos en este mundo gente humillada y perseguida – pero Arriba gozan de un alto nivel."},{"id":"p124-b8","pageNumber":124,"indexInPage":8,"text":"Porque para el Creador, el nivel del hombre se mide segun la fe que merecio adquirir en este mundo material, y segun las pruebas de fe que supero en cada instante. La fe es la raiz y el fundamento de toda la vida. Y como dijo el profeta (Habacuc 2:4): “Un hombre justo – por su fe vivira”. La persona con fe tiene asegurada una vida buena, plena y bella, gratificante y significativa, “vivira” tanto en este mundo como en el venidero. Porque tambien en el Mundo Venidero, ella vivira segun la fe que adquirio en este mundo."},{"id":"p124-b9","pageNumber":124,"indexInPage":9,"text":"Todo proviene de la fe, y cuanta mas fe el hombre adquiere, mas elevado es su nivel. Enseñaron los Sabios que la primera pregunta que se hace al hombre después de morir es: “¿Negociaste durante tu vida con fe?”... Grandeza e insignificancia El profeta dice (Samuel I, 16:7): “El hombre ve el exterior, mientras que el Eterno ve el corazon”. En otras palabras, carecemos de las herramientas para ver la fe del otro y saber su verdadero estatus."},{"id":"p124-b10","pageNumber":124,"indexInPage":10,"text":"La gente tiende a valorar a los demas segun su sabiduria, belleza, titulo, fortuna o linaje; tales criterios son tanto falsos como inexactos. Con frecuencia, se refieren a una verdaderamente gran persona como insignificante, o viceversa. Una persona simple e inculta puede poseer un nivel superior al de un medico, o profesor universitario, especialmente si la primera cree y conoce al Creador y la segunda no. La que posee una profunda nocion del Creador supera completamente a quien no tiene idea de"}],"rawCharCount":4794},{"pageNumber":125,"blocks":[{"id":"p125-b0","pageNumber":125,"indexInPage":0,"text":"Quien le creo y Quien le dirige, aunque el primero sea un barrendero y el otro un fisico nuclear. En realidad, quien no conoce a su Creador, se encuentra en un nivel espiritual mas bajo que el de un animal. Tal como se ve cuando el profeta Isaias reprueba al pueblo de Israel por olvidar su fe y le dice (Isaias 1:3): “El buey conoce a su dueno y el asno el pesebre de su amo, pero Israel no conoce (a su Senor), Mi pueblo no tiene entendimiento”."},{"id":"p125-b1","pageNumber":125,"indexInPage":1,"text":"En otras palabras, el buey y el asno estan conscientes de quien lo sustenta, pero quien anda ciegamente tras una vida de placeres fisicos nunca encuentra al Creador. Lo esencial en el hombre es su conocimiento. El que esta privado de el, no puede ser llamado ser humano; es como un animal con apariencia humana. El gran Maestro Moises – que era compasivo, se ocupaba de civilizar el mundo, es decir que ensenaba conocimiento para que el mundo este habitado por “hombres”, por poseedores de conocimiento."},{"id":"p125-b2","pageNumber":125,"indexInPage":2,"text":"Fe – la mayor mercancía A la luz de lo aprendido, toda la ocupacion del hombre en este mundo debe concentrarse en lograr y adquirir la fe, pues es lo mas importante de todo. Ensenaron los Sabios que la primera pregunta que se hace al hombre despues de morir es: “¿Negociaste durante tu vida con fe?”. Como ya mencionamos en el libro “En el Jardin de la Fe”, la interpretacion literal de esta pregunta es si el hombre actuo recta y honestamente en sus negocios – si no engano, robo o mintio."},{"id":"p125-b3","pageNumber":125,"indexInPage":3,"text":"Pero en un mas alto nivel, la pregunta es: “¿Acaso la mercancia que negociabas se llamaba fe? – ¿Adquiriste la fe?; ¿estudiaste la fe?; ¿vendiste la fe?; ¿ensenaste la fe?”. El sagrado libro del Zohar ensena que el Creador mueve mundos enteros para que dos personas puedan encontrarse y hablar sobre su finalidad. ¡La conclusion de lo antedicho, es que todos los encuentros en la vida del hombre son para que aprenda la fe o para que la ensene!"},{"id":"p125-b4","pageNumber":125,"indexInPage":4,"text":"Vemos entonces como la fe es la clave para la autentica felicidad y exito en este mundo y en el Mundo Venidero. Sus beneficios y virtudes son ilimitados e infinitos. Dichoso es quien adquiere la completa y clara fe. Conclusión final “La practica hace al maestro”. Quien ha leido el libro “En el Jardin de la Fe”, debe de repasarlo una y otra vez del principio al final. Cuanto mas se interioriza los principios de la fe, mas facil sera aplicarlos en la vida diaria. Es importante subrayar que los buenos consejos dados en el libro, dependen"},{"id":"p125-b5","pageNumber":125,"indexInPage":5,"text":"esencialmente del conocimiento que “Todo es para bien” – que es el mas grande regalo de este mundo. Y como dijo el gran Justo, el Rabi Najman de Breslev: “Cuando el hombre sabe que todo lo que le sucede es para su propio bien, esta percepción es como un anticipo del Mundo Venidero”. Alcanzar tal conocimiento es imposible sin un diario examen de conciencia durante el “Aislamiento”, donde se examina todo lo que se hizo – desde el de ayer, hasta el de hoy. Asi se logra ese gran regalo."},{"id":"p125-b6","pageNumber":125,"indexInPage":6,"text":"Por lo tanto, cada uno debe afanarse y multiplicar sus plegarias, para lograr cada dia una hora entera de “Aislamiento”, y así merecer ser una persona creyente que no haya sobre ella ningún Juicio, y merecer todas las bendiciones posibles, como esta escrito (Proverbios 28:20): “El hombre creyente esta colmado de bendiciones”. (Editado y extraido del libro \"En el Jardín de la Fe\" por Rabi Shalom Arush, Director de las Instituciones \"Jut shel Jésed\" – \"Hilo de Bondad\")"}],"rawCharCount":3382},{"pageNumber":126,"blocks":[{"id":"p126-b0","pageNumber":126,"indexInPage":0,"text":"ando que nos compartas lo que tu tienes, ¨no comas y bebas solo¨ danos que"}],"rawCharCount":74}],"totalBlocks":1455,"coverDataUrl":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUk   <script>
    (function () {
      var THEME_STORAGE = 'lectura_viva_standalone_theme';
      var FONT_STORAGE = 'lectura_viva_standalone_font';
      var SPEEDS = [0.8, 0.9, 1.0, 1.15, 1.3];
      var FONTS = ['sm', 'md', 'lg'];
      var MAX_CHUNK = 180;
      var NO_VOICE_MSG = 'Tu dispositivo no tiene voz o audio disponible para narrar el libro, pero puedes seguir leyendo el texto con total normalidad.';

      function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
      function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

      var book = {};
      try { book = JSON.parse(document.getElementById('book-data').textContent || '{}'); } catch (e) { book = {}; }
      var pages = Array.isArray(book.pages) ? book.pages : [];
      var currentPageNumber = 1;
      for (var i = 0; i < pages.length; i++) {
        if (pages[i].blocks && pages[i].blocks.length > 0) {
          currentPageNumber = pages[i].pageNumber;
          break;
        }
      }

      var activePointer = null;
      var status = 'ready'; // ready | playing | paused | unavailable
      var speed = 1.0;
      var fontScale = safeGet(FONT_STORAGE) || 'md';
      if (FONTS.indexOf(fontScale) === -1) fontScale = 'md';

      var savedTheme = safeGet(THEME_STORAGE);
      if (savedTheme === 'dark') document.documentElement.classList.add('dark');
      else if (savedTheme === 'light') document.documentElement.classList.remove('dark');

      /* ---------- Voz nativa del navegador ---------- */
      var synth = null;
      try {
        if ('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window) synth = window.speechSynthesis;
      } catch (e) { synth = null; }

      var voices = [];
      var chosenVoice = null;
      var voiceIsMale = false;
      var session = 0;
      var chunks = [];
      var chunkIndex = 0;
      var watchdog = null;
      var currentUtterance = null;

      var MALE_RE = /(jorge|diego|carlos|juan|pablo|enrique|miguel|ra[uú]l|andr[eé]s|antonio|[aá]lvaro|pedro|luis|ricardo|guillermo|jos[eé]|fernando|alejandro|manuel|javier|sergio|rodrigo|eddy|reed|rocko|grandpa|\bmale\b|hombre|masculin)/i;
      var FEMALE_RE = /(m[oó]nica|paulina|helena|laura|sabina|elvira|dalia|luc[ií]a|marisol|paloma|soledad|ximena|esperanza|catalina|ang[eé]lica|francisca|female|mujer|\bflo\b|sandy|shelley|marta|carmen|elena|mar[ií]a|isabela|valentina|camila|salom[eé]|alba|abril|estrella|fernanda|sofia|sof[ií]a|lupe|jimena|renata|\bnia\b)/i;
      var LANG_PREF = ['es-es', 'es-mx', 'es-419', 'es-us'];

      function isSpanish(v) {
        var lang = String(v.lang || '').toLowerCase().replace('_', '-');
        return lang.indexOf('es') === 0 || /espa[nñ]ol|spanish/i.test(v.name || '');
      }

      function scoreVoice(v) {
        var score = 0;
        var name = String(v.name || '');
        var lang = String(v.lang || '').toLowerCase().replace('_', '-');
        var female = FEMALE_RE.test(name);
        var male = MALE_RE.test(name) && !female;
        if (male) score += 100;
        if (female) score -= 100;
        var idx = LANG_PREF.indexOf(lang);
        score += idx !== -1 ? (10 - idx) : 3;
        if (v.localService) score += 3;
        if (v.default) score += 1;
        return score;
      }

      function pickVoice() {
        var spanish = [];
        for (var k = 0; k < voices.length; k++) {
          if (isSpanish(voices[k])) spanish.push(voices[k]);
        }
        if (spanish.length === 0) { chosenVoice = null; voiceIsMale = false; return; }
        spanish.sort(function (a, b) { return scoreVoice(b) - scoreVoice(a); });
        chosenVoice = spanish[0];
        voiceIsMale = MALE_RE.test(chosenVoice.name || '') && !FEMALE_RE.test(chosenVoice.name || '');
      }

      function loadVoices() {
        if (!synth) return;
        try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
        pickVoice();
      }

      function splitText(text) {
        var clean = String(text || '').replace(/\s+/g, ' ').trim();
        if (!clean) return [];
        var sentences = clean.match(/[^.!?…]+[.!?…]*[”"»)\]]*\s*/g) || [clean];
        var out = [];
        var cur = '';
        sentences.forEach(function (s) {
          s = s.trim();
          if (!s) return;
          if (s.length > MAX_CHUNK) {
            if (cur) { out.push(cur); cur = ''; }
            hardSplit(s).forEach(function (p) { out.push(p); });
            return;
          }
          if ((cur + ' ' + s).trim().length > MAX_CHUNK) {
            if (cur) out.push(cur);
            cur = s;
          } else {
            cur = cur ? cur + ' ' + s : s;
          }
        });
        if (cur) out.push(cur);
        return out;
      }

      function hardSplit(s) {
        var words = s.split(' ');
        var res = [];
        var cur = '';
        words.forEach(function (w) {
          if ((cur + ' ' + w).trim().length > MAX_CHUNK) {
            if (cur) res.push(cur);
            cur = w;
          } else {
            cur = cur ? cur + ' ' + w : w;
          }
        });
        if (cur) res.push(cur);
        return res;
      }

      function showNotice(msg) {
        var banner = document.getElementById('error-banner');
        var text = document.getElementById('error-text');
        if (msg) {
          text.textContent = msg;
          banner.classList.add('visible');
        } else {
          text.textContent = '';
          banner.classList.remove('visible');
        }
      }

      function clearWatchdog() {
        if (watchdog) { clearTimeout(watchdog); watchdog = null; }
      }

      function cancelSpeech() {
        if (!synth) return;
        try { synth.cancel(); } catch (e) {}
      }

      function markUnavailable() {
        session += 1;
        clearWatchdog();
        cancelSpeech();
        activePointer = null;
        status = 'unavailable';
        showNotice(NO_VOICE_MSG);
        renderAll(false);
      }

      function stopEngine() {
        session += 1;
        clearWatchdog();
        cancelSpeech();
        chunks = [];
        chunkIndex = 0;
        if (status !== 'unavailable') status = 'ready';
      }

      function speakChunk(my, ptr) {
        if (my !== session) return;
        if (chunkIndex >= chunks.length) {
          var upcoming = findNextPtr(ptr);
          if (upcoming) playBlock(upcoming, 0);
          else { status = 'ready'; renderPlayer(); renderBlocksOnly(false); }
          return;
        }
        var u;
        try { u = new SpeechSynthesisUtterance(chunks[chunkIndex]); }
        catch (e) { markUnavailable(); return; }
        if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang || 'es-ES'; }
        else { u.lang = 'es-ES'; }
        u.rate = speed;
        u.pitch = voiceIsMale ? 0.95 : 0.85;
        u.volume = 1;
        var started = false;
        u.onstart = function () { started = true; clearWatchdog(); };
        u.onend = function () {
          if (my !== session) return;
          clearWatchdog();
          chunkIndex += 1;
          speakChunk(my, ptr);
        };
        u.onerror = function (ev) {
          if (my !== session) return;
          var err = ev && ev.error;
          if (err === 'interrupted' || err === 'canceled') return;
          markUnavailable();
        };
        currentUtterance = u; // evita que el recolector de basura corte la voz
        try { synth.speak(u); }
        catch (e) { markUnavailable(); return; }
        clearWatchdog();
        if (!voices.length) {
          watchdog = setTimeout(function () {
            if (my !== session || started) return;
            markUnavailable();
          }, 6000);
        }
      }

      function playBlock(ptr, startChunk) {
        var blk = getBlock(ptr);
        if (!blk) return;
        if (!synth) {
          showNotice(NO_VOICE_MSG);
          return;
        }
        if (!voices.length) loadVoices();
        session += 1;
        var my = session;
        clearWatchdog();
        cancelSpeech();
        showNotice(null);
        activePointer = ptr;
        currentPageNumber = ptr.pageNumber;
        chunks = splitText(blk.text);
        chunkIndex = startChunk || 0;
        status = 'playing';
        renderAll(true);
        setTimeout(function () {
          if (my !== session) return;
          speakChunk(my, ptr);
        }, 80);
      }

      function pauseSpeech() {
        session += 1;
        clearWatchdog();
        cancelSpeech();
        status = 'paused';
        renderAll(false);
      }

      function setSpeed(val) {
        speed = val;
        if (status === 'playing' && activePointer) playBlock(activePointer, chunkIndex);
        else renderPlayer();
      }

      /* ---------- Datos del libro ---------- */
      function getPage(num) {
        for (var i = 0; i < pages.length; i++) {
          if (pages[i].pageNumber === num) return pages[i];
        }
        return null;
      }

      function getBlock(ptr) {
        if (!ptr) return null;
        var p = getPage(ptr.pageNumber);
        return p && p.blocks ? (p.blocks[ptr.blockIndex] || null) : null;
      }

      function findNextPtr(from) {
        var idx = -1;
        for (var i = 0; i < pages.length; i++) {
          if (pages[i].pageNumber === from.pageNumber) { idx = i; break; }
        }
        if (idx === -1) return null;
        if (from.blockIndex + 1 < pages[idx].blocks.length) {
          return { pageNumber: pages[idx].pageNumber, blockIndex: from.blockIndex + 1 };
        }
        for (var j = idx + 1; j < pages.length; j++) {
          if (pages[j].blocks.length > 0) return { pageNumber: pages[j].pageNumber, blockIndex: 0 };
        }
        return null;
      }

      function findPrevPtr(from) {
        var idx = -1;
        for (var i = 0; i < pages.length; i++) {
          if (pages[i].pageNumber === from.pageNumber) { idx = i; break; }
        }
        if (idx === -1) return null;
        if (from.blockIndex > 0) {
          return { pageNumber: from.pageNumber, blockIndex: from.blockIndex - 1 };
        }
        for (var j = idx - 1; j >= 0; j--) {
          var len = pages[j].blocks.length;
          if (len > 0) return { pageNumber: pages[j].pageNumber, blockIndex: len - 1 };
        }
        return null;
      }

      function findFirstReadable(startPage) {
        var startIdx = 0;
        for (var i = 0; i < pages.length; i++) {
          if (pages[i].pageNumber === startPage) { startIdx = i; break; }
        }
        for (var j = startIdx; j < pages.length; j++) {
          if (pages[j].blocks.length > 0) return { pageNumber: pages[j].pageNumber, blockIndex: 0 };
        }
        for (var k = 0; k < startIdx; k++) {
          if (pages[k].blocks.length > 0) return { pageNumber: pages[k].pageNumber, blockIndex: 0 };
        }
        return null;
      }

      /* ---------- Interfaz ---------- */
      function renderThemeIcon() {
        var isDark = document.documentElement.classList.contains('dark');
        document.getElementById('theme-icon').innerHTML = isDark
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      }

      function renderBlocksOnly(shouldScroll) {
        var sheet = document.getElementById('reading-sheet');
        sheet.className = 'sheet font-' + fontScale;
        var container = document.getElementById('blocks-container');
        container.innerHTML = '';
        var page = getPage(currentPageNumber);

        if (!page || !page.blocks || page.blocks.length === 0) {
          var emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty-page';
          if (currentPageNumber === 1 && book.coverDataUrl) {
            var previewWrap = document.createElement('div');
            previewWrap.className = 'cover-page-preview';
            var previewImg = document.createElement('img');
            previewImg.src = book.coverDataUrl;
            previewImg.alt = 'Portada de ' + (book.title || 'El Jardín de la Fe');
            previewWrap.appendChild(previewImg);
            emptyDiv.appendChild(previewWrap);
          }
          var p1 = document.createElement('p');
          p1.textContent = currentPageNumber === 1
            ? ('Portada · ' + (book.title || 'El Jardín de la Fe'))
            : ('Página ' + currentPageNumber + ' sin texto seleccionable.');
          emptyDiv.appendChild(p1);
          var nextWithText = null;
          for (var i = 0; i < pages.length; i++) {
            if (pages[i].pageNumber > currentPageNumber && pages[i].blocks.length > 0) {
              nextWithText = pages[i];
              break;
            }
          }
          if (nextWithText) {
            var jumpBtn = document.createElement('button');
            jumpBtn.type = 'button';
            jumpBtn.className = 'btn-primary';
            jumpBtn.textContent = 'Ir a la página ' + nextWithText.pageNumber;
            jumpBtn.onclick = function () {
              currentPageNumber = nextWithText.pageNumber;
              renderAll(false);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            emptyDiv.appendChild(jumpBtn);
          }
          container.appendChild(emptyDiv);
          return;
        }

        page.blocks.forEach(function (blk) {
          var isActive = activePointer && activePointer.pageNumber === blk.pageNumber && activePointer.blockIndex === blk.indexInPage;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'block-btn' + (isActive ? ' active' : '');
          btn.onclick = function () { playBlock({ pageNumber: blk.pageNumber, blockIndex: blk.indexInPage }, 0); };

          var top = document.createElement('div');
          top.className = 'block-top';
          var label = document.createElement('span');
          label.textContent = 'Bloque ' + (blk.indexInPage + 1);
          top.appendChild(label);

          var rightHint = document.createElement('span');
          if (isActive) {
            rightHint.textContent = status === 'playing' ? 'Leyendo ahora' : status === 'paused' ? 'En pausa' : 'Seleccionado';
          } else {
            rightHint.textContent = 'Tocar para escuchar';
          }
          top.appendChild(rightHint);

          var p = document.createElement('p');
          p.className = 'block-text';
          p.textContent = blk.text;

          btn.appendChild(top);
          btn.appendChild(p);
          container.appendChild(btn);

          if (isActive && shouldScroll) {
            setTimeout(function () { btn.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 40);
          }
        });
      }

      function renderPlayer() {
        var dispPageNum = activePointer ? activePointer.pageNumber : currentPageNumber;
        var dispPage = getPage(dispPageNum);
        var blkCount = dispPage && dispPage.blocks ? dispPage.blocks.length : 0;
        var activeNum = activePointer ? activePointer.blockIndex + 1 : 0;

        var pct = (blkCount > 0 && activeNum > 0)
          ? Math.round((activeNum / blkCount) * 100)
          : Math.round((currentPageNumber / Math.max(1, book.totalPages)) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';

        var statusEl = document.getElementById('status-line');
        statusEl.className = 'status-line';
        if (status === 'playing') { statusEl.textContent = 'Reproduciendo'; statusEl.classList.add('playing'); }
        else if (status === 'paused') { statusEl.textContent = 'En pausa'; }
        else if (status === 'unavailable') { statusEl.textContent = 'Narración no disponible'; }
        else { statusEl.textContent = 'Listo'; }

        var posText = 'Pág. ' + dispPageNum + '/' + book.totalPages;
        if (blkCount > 0 && activeNum > 0) posText += ' · Bloque ' + activeNum + '/' + blkCount;
        document.getElementById('pos-line').textContent = posText;

        var playIcon = document.getElementById('play-icon');
        if (status === 'playing') {
          playIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
        } else {
          playIcon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
        }

        document.getElementById('btn-stop').disabled = !activePointer;
        document.getElementById('speed-cycle-btn').textContent = (speed === 1.15 ? '1.15x' : speed.toFixed(1) + 'x');

        var group = document.getElementById('speed-desktop-group');
        group.innerHTML = '';
        SPEEDS.forEach(function (opt) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = opt === 1.15 ? '1.15x' : opt.toFixed(1) + 'x';
          if (opt === speed) b.className = 'selected';
          b.onclick = function () { setSpeed(opt); };
          group.appendChild(b);
        });
      }

      function renderCoverThumb() {
        var wrap = document.getElementById('cover-thumb-wrap');
        wrap.innerHTML = '';
        if (book.coverDataUrl) {
          var img = document.createElement('img');
          img.src = book.coverDataUrl;
          img.alt = 'Portada de ' + (book.title || 'El Jardín de la Fe');
          wrap.appendChild(img);
        } else {
          wrap.style.display = 'flex';
          wrap.style.alignItems = 'center';
          wrap.style.justifyContent = 'center';
          wrap.style.padding = '0.5rem';
          wrap.style.textAlign = 'center';
          wrap.style.fontFamily = 'var(--font-serif)';
          wrap.style.fontSize = '0.7rem';
          wrap.style.fontWeight = '600';
          wrap.style.color = '#1c1917';
          wrap.textContent = book.title || 'El Jardín de la Fe';
        }
      }

      function renderAll(shouldScroll) {
        var page = getPage(currentPageNumber);
        var bCount = page && page.blocks ? page.blocks.length : 0;
        document.getElementById('page-meta').textContent = book.totalPages + ' páginas · Página ' + currentPageNumber + ' · ' + bCount + (bCount === 1 ? ' bloque' : ' bloques');
        document.getElementById('bottom-page-counter').textContent = currentPageNumber + ' / ' + book.totalPages;
        var input = document.getElementById('page-jump-input');
        input.max = book.totalPages;
        input.value = String(currentPageNumber);
        document.getElementById('prev-page-top').disabled = currentPageNumber <= 1;
        document.getElementById('prev-page-bottom').disabled = currentPageNumber <= 1;
        document.getElementById('next-page-top').disabled = currentPageNumber >= book.totalPages;
        document.getElementById('next-page-bottom').disabled = currentPageNumber >= book.totalPages;
        renderBlocksOnly(shouldScroll);
        renderPlayer();
      }

      function goPage(num) {
        currentPageNumber = Math.min(Math.max(1, num), book.totalPages || 1);
        renderAll(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('theme-toggle').onclick = function () {
        var isDark = document.documentElement.classList.toggle('dark');
        safeSet(THEME_STORAGE, isDark ? 'dark' : 'light');
        renderThemeIcon();
      };

      function changeFont(delta) {
        var idx = FONTS.indexOf(fontScale) + delta;
        if (idx >= 0 && idx < FONTS.length) {
          fontScale = FONTS[idx];
          safeSet(FONT_STORAGE, fontScale);
          renderBlocksOnly(false);
        }
      }
      document.getElementById('font-dec-btn').onclick = function () { changeFont(-1); };
      document.getElementById('font-inc-btn').onclick = function () { changeFont(1); };

      document.getElementById('prev-page-top').onclick = function () { goPage(currentPageNumber - 1); };
      document.getElementById('prev-page-bottom').onclick = function () { goPage(currentPageNumber - 1); };
      document.getElementById('next-page-top').onclick = function () { goPage(currentPageNumber + 1); };
      document.getElementById('next-page-bottom').onclick = function () { goPage(currentPageNumber + 1); };

      document.getElementById('page-jump-form').onsubmit = function (e) {
        e.preventDefault();
        var n = parseInt(document.getElementById('page-jump-input').value, 10);
        if (isFinite(n)) goPage(n);
      };

      document.getElementById('btn-play-pause').onclick = function () {
        if (!synth) { showNotice(NO_VOICE_MSG); return; }
        if (status === 'playing') { pauseSpeech(); return; }
        if (status === 'paused' && activePointer) { playBlock(activePointer, chunkIndex); return; }
        var target = (activePointer && getBlock(activePointer)) ? activePointer : findFirstReadable(currentPageNumber);
        if (target) playBlock(target, 0);
      };

      document.getElementById('btn-stop').onclick = function () {
        stopEngine();
        activePointer = null;
        renderAll(false);
      };

      function moveBlock(getter) {
        var base = activePointer || findFirstReadable(currentPageNumber);
        if (!base) return;
        var target = getter(base);
        if (!target) return;
        if (status === 'playing') {
          playBlock(target, 0);
        } else {
          if (status === 'paused') { stopEngine(); }
          chunkIndex = 0;
          activePointer = target;
          currentPageNumber = target.pageNumber;
          renderAll(true);
        }
      }
      document.getElementById('btn-prev-block').onclick = function () { moveBlock(findPrevPtr); };
      document.getElementById('btn-next-block').onclick = function () { moveBlock(findNextPtr); };

      document.getElementById('speed-cycle-btn').onclick = function () {
        var idx = SPEEDS.indexOf(speed);
        setSpeed(SPEEDS[(idx + 1) % SPEEDS.length]);
      };

      document.getElementById('error-close').onclick = function () { showNotice(null); };

      window.addEventListener('pagehide', function () { cancelSpeech(); });
      window.addEventListener('beforeunload', function () { cancelSpeech(); });

      if (synth) {
        loadVoices();
        try {
          if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
          else synth.onvoiceschanged = loadVoices;
        } catch (e) {}
        setTimeout(loadVoices, 400);
        setTimeout(loadVoices, 1500);
      } else {
        status = 'unavailable';
        showNotice(NO_VOICE_MSG);
      }

      renderCoverThumb();
      renderThemeIcon();
      renderAll(false);
    })();
  </script>
</body>
</html>
