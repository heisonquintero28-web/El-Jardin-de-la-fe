eyes y su imposicion, el mundo volveria al caos. Pero asi como es grande la importancia y responsabilidad de este cargo, asi es tambien grande la prueba. La prueba principal del policia es no llegar a actos de crueldad y prepotencia."},{"id":"p45-b8","pageNumber":45,"indexInPage":8,"text":"El necesita saber que desde el Cielo recibio este cargo para que pueda corregir su crueldad y su apetito de dominio. El debe ser inteligente para usar el dominio que tiene en sus manos segun la Voluntad del Creador, solo para imponer el orden y educar a las personas, sin ser cruel con ellas o ultrajarlas. Por ejemplo: un policia que detuvo a un hombre que transgredio una ley de trafico."},{"id":"p45-b9","pageNumber":45,"indexInPage":9,"text":"En lugar de dirigirse a el con groseria y atacarlo, causando con esto un comportamiento parecido de la otra parte, le debe hablar suavemente y con cortesia, pues “La lengua suave puede hasta romper un hueso” (Proverbios 25:15). Se dirigira al chofer con afabilidad y le dira: “Buen dia, ¿como estas? Mira, yo no tengo nada personal contra ti, solo que transgrediste la ley – pasaste la velocidad permitida y mi deber es protegerte a ti y a los otros conductores."},{"id":"p45-b10","pageNumber":45,"indexInPage":10,"text":"Debes saber que no solo arriesgas tu vida y la de los que estan en tu coche, sino que tambien arriesgas la vida de los otros conductores y de los peatones. Debes ser justo contigo mismo, confesar la verdad y aceptar la ley con amor”. Tambien, si de acuerdo a la ley, el policia tiene la posibilidad de multarlo rigurosamente e incluso revocarle el permiso de conducir, tratara de comportarse con misericordia y ser lo mas considerado posible. Mas aun, no dar la multa mas alta que determina la ley. Los policias que reciben un"}],"rawCharCount":4765},{"pageNumber":46,"blocks":[{"id":"p46-b0","pageNumber":46,"indexInPage":0,"text":"porcentaje por las multas que dan, deben saber que esta prohibido que eso influya en su juicio. Es importante que sepan que toda su manutencion ya esta determinada desde el comienzo del ano, asi que no perderan nada por no dar multas excesivas o por perdonar cuando se debe, pues el Creador tiene muchos caminos para darles lo que les ordeno recibir y no necesita ayuda..."},{"id":"p46-b1","pageNumber":46,"indexInPage":1,"text":"El juez El juez tiene un muy importante rol por la misma razon anterior: sin el sistema de leyes no podría haber una vida normal sobre la Tierra. Asi que debido a la gran responsabilidad y la fuerte influencia que tiene, se entiende que esta bajo un peligro muy grande. Los jueces deben saber que el Creador es el Supremo Juez del Universo. Ellos deben rezar y suplicar mucho para que El les ayude a no fracasar y errar, pues la vida de la gente depende de sus juicios."},{"id":"p46-b2","pageNumber":46,"indexInPage":2,"text":"Con mayor razon, deben tener cuidado de no conducirse con precipitacion o crueldad, solamente usaran el poder que tienen en sus manos, para educar y ayudar al hombre que esta frente a ellos a mejorar sus actos. Por lo tanto, tambien cuando el juez deba dar un castigo, tiene que tener un mensaje educativo, de manera que ayude al hombre a mejorar sus acciones. El inspector de tránsito Cada hombre debe hacer todo lo posible para que otros no se irriten con el."},{"id":"p46-b3","pageNumber":46,"indexInPage":3,"text":"Los inspectores de transito, aunque su cargo es muy importante para el orden en las calles de la ciudad, evitar embotellamientos y molestias en el trafico y otros actos semejantes, deben tratar de cumplir su cargo con el maximo de consideracion y decencia. Porque incluso cumpliendo su cargo segun la fria ley, pueden ser danados por el enfado de la gente, y con mayor razon si ponen multas sin causa."},{"id":"p46-b4","pageNumber":46,"indexInPage":4,"text":"Por ejemplo, un hombre estaciona por un instante en un lugar que no molesta a nadie y ellos no lo consideran; o aquellos que acechan al hombre que sale de su automovil y le colocan inmediatamente la multa en la ventanilla, en lugar de hacerles una advertencia, etc. En conclusion, el hombre que vive segun la fe, sabe que hay Juicio y hay un Juez, que sobre todos sus actos tendra que dar cuentas, y va ser castigado por cada transgresion que inflige."},{"id":"p46-b5","pageNumber":46,"indexInPage":5,"text":"Por otro lado sabe, que la medida de beneficio del Creador es muy grande, y por cada buena acción que haga se merecera una gran recompensa y lograra"},{"id":"p46-b6","pageNumber":46,"indexInPage":6,"text":"cumplir su mision en este mundo. Por lo tanto, debe pensar sus palabras antes de pronunciarlas y no ir detras de los que se conducen con groseria, crueldad, desprecio o bufoneria, sino dirigir su corazon al Cielo, y hacer sus actos con fe y bondad. Este hombre sera feliz en este mundo y heredara el bien en el Mundo Venidero. José el Justo, el hijo de Jacob, fue encarcelado injustamente, y a pesar de todo aceptó el veredicto con amor y con gran alegría hasta que..."},{"id":"p46-b7","pageNumber":46,"indexInPage":7,"text":"El Liberador de prisioneros Un hombre detenido en la carcel esta ante una prueba de fe. Tiene que saber que esta en prisión solo y unicamente por un Decreto del Creador para expiar sus pecados. Por lo tanto, no debe culpar por su situacion ni al juez, ni al acusador, ni al que lo denuncio, etc. Hay prisioneros, que supuestamente son absueltos incluso segun las leyes del pais. Generalmente, esta gente esta llena de rencor y amargura por la injusticia que sufrieron."},{"id":"p46-b8","pageNumber":46,"indexInPage":8,"text":"Pero en verdad, si hubieran sido honestos consigo mismos y reconocieran la verdad, entenderian muy dentro de su corazon debido a que pecados el Creador los esta castigando de esta manera. Ellos confesarian claramente que no hay aca ningun error y no han sido detenidos gratuitamente. En el Tribunal Celestial conocen todos sus actos, y les dictaminaron estar en prision con justicia. Por lo tanto, deben aceptar su veredicto y castigo con amor, y arrepentirse."},{"id":"p46-b9","pageNumber":46,"indexInPage":9,"text":"Aun si el hombre recibe una sentencia del tribunal humano que tiene que cumplir, debe saber que “El arrepentimiento, la plegaria y la caridad anulan lo malo del Decreto”. Por lo tanto, el debe fijarse un tiempo cada dia para hablar con el Creador, arrepentirse y rezar para que lo saque de la carcel. Este hombre debe confesar sus pecados, arrepentirse y pedir disculpas por ellos, aceptar corregir sus actos y nunca repetirlos."},{"id":"p46-b10","pageNumber":46,"indexInPage":10,"text":"El debe rezar mucho al Creador para que lo compadezca y que se conduzca misericordiosamente con el, que le tenga paciencia hasta que se merezca retornar a El completamente. Debe pedirle al Creador que lo ayude a superar su Mala Inclinacion, y que le de la fuerza, la inteligencia y el consejo para conducirse de ahora en adelante segun Su Voluntad. Tambien debe suplicarle al Creador que lo aleje de todos los malos amigos y mala gente que no se conducen por el recto camino y lo instigan."},{"id":"p46-b11","pageNumber":46,"indexInPage":11,"text":"De esta manera, aumentara sus plegarias con sus propias palabras y en su idioma."}],"rawCharCount":4695},{"pageNumber":47,"blocks":[{"id":"p47-b0","pageNumber":47,"indexInPage":0,"text":"Nota: Este tema de aumento de plegarias y suplicas es relevante en la mayoria de los ejemplos mencionados en este capitulo, porque en toda afliccion, el hombre debe rezar mucho y arrepentirse para despertar hacia el la Compasion Divina. Bailar y regocijarse en la cárcel Un hombre que esta pasando este tipo de prueba – aunque indudablemente es muy dificil – debe sader que si se esforzara a aceptar todo con amor, vera como todo se le transforma para bien."},{"id":"p47-b1","pageNumber":47,"indexInPage":1,"text":"Y esto se aprende en la biblica historia de Jose el Justo, el hijo de Jacob, que fue encarcelado injustamente, y a pesar de todo acepto el veredicto con amor y con gran alegría hasta que “llego a ser un hombre prospero” (Genesis 39:2); los Sabios explicaron que todo el tiempo que estuvo en la carcel, tenia la costumbre de bailar y cantar a pesar de su situacion..."},{"id":"p47-b2","pageNumber":47,"indexInPage":2,"text":"Asi, gracias a su fe, creyendo que todo es para bien y alegrandose, logro agradar al director del presidio hasta tal punto que lo nombro encargado de todos los prisioneros de la carcel, tal como esta escrito (id. 23): “No se ocupaba el carcelero de la carcel en cosa alguna que hacia Jose, porque el Eterno estaba con el y lo que hacia – el Eterno lo prosperaba”, que significa que Jose tenia mano libre en la carcel."},{"id":"p47-b3","pageNumber":47,"indexInPage":3,"text":"Y cuando llego a su fin el tiempo que le fue decretado en el Cielo de estar en prision, inmediatamente fue elevado al grado de grandeza que merecia, como esta escrito (id. 41:14): “... y le hicieron salir rápidamente del calabozo; y se afeito, cambio sus vestimentas y se presento ante el Faraon”. E inmediatamente, ¡el Faraon lo nombro gobernador de todo el reino de Egipto, que era el imperio mas grande en esos tiempos!"},{"id":"p47-b4","pageNumber":47,"indexInPage":4,"text":"Ven y comprueba la fuerza de la fe: he aqui que Jose, de cualquier manera, tenia que estar preso en la carcel el tiempo que le fue decretado. Si no hubiera recibido este encarcelamiento con fe y hubiera empezado a protestar y quejarse de que no era culpable, llegando a la depresion, el Creador lo hubiera abandonado y Jose no hubiera agradado al director de la carcel. Y quien sabe si no le hubieran prolongado el encarcelamiento o hasta hubieran abusado de el o asesinado en la carcel."},{"id":"p47-b5","pageNumber":47,"indexInPage":5,"text":"En resumen, Jose podria haber tenido grandes aflicciones y sufrimientos en la prision, y por supuesto no hubiera logrado el grado de grandeza que merecio. Es sabido de muchos Justos que fueron obligados a pasar un tiempo en la carcel, por varias razones. Ellos aprovecharon el tiempo y las condiciones para el servicio al Creador sin pausa, e incluso lograron escribir alli libros importantes."},{"id":"p47-b6","pageNumber":47,"indexInPage":6,"text":"Estos hechos pueden fortalecer al hombre en todo tipo de situaciones en las cuales se encuentra en un exilio u otro. Debe saber que todo es el Decreto del Creador, y todo el resto son solo causas dispuestas por El. Debe aceptarlo todo con amor, saber ciertamente que de todo saldrá solo el bien, como esta escrito (Jueces 14:14): “… de lo duro salio dulzura”."},{"id":"p47-b7","pageNumber":47,"indexInPage":7,"text":"Y como explica el sagrado libro del Zohar, que si los hijos de Israel hubieran aceptado con amor el Decreto que les fue dispuesto por el pecado de los espias – detenerse en el desierto cuarenta anos mas – y si hubieran ido por el desierto con alegria y con fe, no protestando y quejandose todo el tiempo como realmente sucedio, entonces hubieran recibido al final de los cuarenta anos el merito de entrar con Moises a la Tierra Prometida, y asi hubiera llegado la Redencion completa del mundo."},{"id":"p47-b8","pageNumber":47,"indexInPage":8,"text":"No hay que olvidarse que los ejemplos traidos son de Justos integros, como Jose que fue inocente, que tambien frente al Creador fue un gran Justo, y no obstante acepto todo con amor. Con mayor razon el hombre que no es tan recto y tambien no completamente inocente, debe aceptar de ese modo todo lo que le es decretado. “El Eterno reprende a quien ama” (Proverbios 3:12) El hombre encarcelado debe saber que el Creador lo ama, que escucha sus plegarias en cada lugar y en cada momento, y que siempre desea su arrepentimiento."},{"id":"p47-b9","pageNumber":47,"indexInPage":9,"text":"Si se arrepentira cada dia, aprendera la fe y hara caridad, por cierto el Creador lo hara agraciado con los carceleros y lo salvara, como paso con Jose el Justo. El hombre debe creer que el Creador es el único Liberador de los prisioneros y que tiene muchos caminos para sacarlo de su encierro. Es importante aclarar, que hay una gran acusacion en el Cielo sobre el prisionero que no aprovecha su tiempo en la carcel para el estudio espiritual, la plegaria y el arrepentimiento."},{"id":"p47-b10","pageNumber":47,"indexInPage":10,"text":"Porque el hombre prisionero tiene todas las condiciones para hacerlo: tiene mucho tiempo libre, no tiene que ocuparse de su manutencion y el sustento. Y todo esto esta bien dirigido y programado desde lo Alto, dandole las condiciones optimas para que pueda arrepentirse y retornar al Creador. Segun el sentido comun y, con mayor razon, segun la fe, debe el preso ser disciplinado, aceptar la autoridad de los carceleros y ser bueno con todos los otros prisioneros."},{"id":"p47-b11","pageNumber":47,"indexInPage":11,"text":"El hombre dueno de fe que va por el sendero del arrepentimiento, ciertamente cuida todos los Preceptos relacionados con el tema de “Entre una persona y otra”, lo que hace que sea amado, tanto por"}],"rawCharCount":5056},{"pageNumber":48,"blocks":[{"id":"p48-b0","pageNumber":48,"indexInPage":0,"text":"sus companeros como por los carceleros, porque se comporta con cortesia y los respeta a todos. Todo el buen comportamiento y la buena conducta finalmente se juntan, para que el hombre sea declarado inocente en el Tribunal Celestial y ser liberado rapidamente de la carcel. No solo eso, sino tambien pasa el tiempo que esta detenido en la prision facil y agradablemente, hasta el punto que ni siente que esta en la carcel."},{"id":"p48-b1","pageNumber":48,"indexInPage":1,"text":"Como fue atestiguado por no pocas personas que estuvieron presas por distintas razones y que justamente alli tuvieron el merito de esforzarse en el cumplimiento de la Ley Divina y los Preceptos, lo que les alivio el tiempo pasado en la carcel, y principalmente les ayudo a cambiar para bien, que es un beneficio que los acompanara durante toda la vida. No existe un hombre verdaderamente libre, salvo el que conoce y se dirige por el sendero de la fe."},{"id":"p48-b2","pageNumber":48,"indexInPage":2,"text":"Muchas veces, hombres que no estan encarcelados son verdaderamente prisioneros en la carcel de los apetitos, en una obsesiva persecucion de sustento, en la prision de las angustias, de la turbacion, etc. Por el contrario, existe el que esta preso en la carcel, pero es un verdadero hombre libre debido a que logro conocer al Creador, y encuentra comodo sentarse y ocuparse en servir a El, como quiere y en cada lugar que sea. Tal hombre no ve ninguna diferencia en estar sentado en su casa, en la casa de estudios, o en la carcel."},{"id":"p48-b3","pageNumber":48,"indexInPage":3,"text":"Al parecer la medicina es una ciencia como todas las ciencias naturales; serios y leales investigadores invierten muchas horas y dinero haciendo experimentos y pruebas, pero… “De tus heridas, Yo te sanaré” (Jeremías 30:17) Un hombre que sufre una enfermedad, esta en una prueba de fe."},{"id":"p48-b4","pageNumber":48,"indexInPage":4,"text":"Debe actuar segun las “Tres Reglas de la Fe”: a) Debe saber que el Creador lo enfermo, y no debe atribuir la enfermedad a causas naturales o a errores que cometio. b) Debe saber que es para su bien eterno, y debe agradecer al Creador. c) Debe auto-examinarse y buscar por que transgresion le llego esa enfermedad y arrepentirse. Solo despues, lo apropiado es que rece al Creador para que lo cure."},{"id":"p48-b5","pageNumber":48,"indexInPage":5,"text":"Permiso para curar Al parecer la medicina es una ciencia como todas las ciencias naturales; serios y leales investigadores invierten muchas horas y dinero haciendo experimentos y pruebas, asistiéndose con los mas perfeccionados equipos. Y"},{"id":"p48-b6","pageNumber":48,"indexInPage":6,"text":"cuando descubren cuales son los causantes de una determinada enfermedad y como se la puede tratar, entonces desarrollan medicamentos y nuevas terapias para tratarla. Supuestamente, esto es algo bueno y logico. El Creador le dio al hombre la inteligencia para investigar la naturaleza del universo, y perfeccionar y mejorar la vida. Es la obligacion del hombre utilizar su inteligencia para estos u otros buenos objetivos que traigan bienestar y alegría al mundo."},{"id":"p48-b7","pageNumber":48,"indexInPage":7,"text":"Esto se manifiesta en muchos campos que todos aprovechamos, como la electricidad, distintos instrumentos, tecnologias avanzadas, etc. Entonces, tambien en materia de medicina, es necesario que el hombre utilice la mente y la inteligencia que le regalo el Creador para mejorar la vida, y traer curacion y alivio a los dolores de los seres humanos y sus enfermedades. Este punto de vista se refuerza cuando aprendemos la ensenanza de los Sabios que ensenan que el Creador le ha dado al medico el permiso para curar."},{"id":"p48-b8","pageNumber":48,"indexInPage":8,"text":"Y en verdad, muchos grandes Sabios y Justos se ocuparon de la medicina. La conclusion de todo esto, como hemos mencionado antes, es que la medicina es una ciencia como todas las otras ciencias. Y cuanto mas investigue el hombre esta ciencia, lograra descubrir remedios y medicamentos para tratar las enfermedades, heridas y otros impedimentos en la salud del hombre. El hombre supervisado por el Creador Pero, todo esto seria correcto, si se hablara solamente sobre la medicina del cuerpo, como el de las bestias o animales."},{"id":"p48-b9","pageNumber":48,"indexInPage":9,"text":"Pero debido a que hablamos del ser humano dueno del libre albedrio, entonces por el contrario, es debido saber – ¡en la medicina no existe la naturaleza y no hay ninguna ley! ¡Existe solo la Divina Supervision! Esto es por la simple razon, que debido a que toda la finalidad de la creacion del mundo es solo para el hombre dueno de libre albedrio, entonces se entiende que sobre el especialmente, existe una exacta Supervision Individual sobre cada detalle de su vida, incluso sobre su estado de salud."},{"id":"p48-b10","pageNumber":48,"indexInPage":10,"text":"Aunque toda la naturaleza se conduce por Su poder, cuanto mas alejadas estan las cosas del hombre y no se relacionan con el directamente, asi la Supervision del Creador es menos reconocible. Por lo tanto en general, la naturaleza se conduce con determinados y claros senderos, especialmente los atomos, los cuerpos celestes, etc., excepto en raros y excepcionales acontecimientos en los que el Creador decide cambiarlos. Tal como esta escrito"}],"rawCharCount":4763},{"pageNumber":49,"blocks":[{"id":"p49-b0","pageNumber":49,"indexInPage":0,"text":"(Salmos 148:6): “El los establecio eternamente y por siempre. El les impuso una Ley que no será transgredida”. Encontramos, que la esencia de la Supervision Divina se manifiesta en todas las cosas relacionadas en forma directa con el hombre, como: sustento, hijos, medicina, etc. Alli esta la prueba, y alli se le puede insinuar y estimular para que vea sus errores y sus faltas espirituales. Los sufrimientos del cuerpo y de la mente son los más duros para el hombre."},{"id":"p49-b1","pageNumber":49,"indexInPage":1,"text":"Es bien sabido que en el momento en que el hombre está enfermo, no siente ningún deseo de vivir.... El cuerpo del hombre le es precioso Mas que en todas las cosas que se relacionan con el hombre, existe la Supervision Individual sobre su estado de salud."},{"id":"p49-b2","pageNumber":49,"indexInPage":2,"text":"Las enfermedades fisicas y mentales y sus dolores sirven al Creador mas que todo para insinuarle al hombre que debe rectificarse, y esto por varias razones: La primera – que en todas las otras insinuaciones y pruebas, como cuando el Creador le insinua al hombre por medio de su dinero, puede el hombre quedar indiferente y no ser estimulado por eso. Pero cuando las cosas llegan a su cuerpo y mente – el no puede ignorarlas. Esto lo vemos en la Biblia con Job."},{"id":"p49-b3","pageNumber":49,"indexInPage":3,"text":"Cuando pidio el Angel Acusador al Creador probar a Job con sufrimientos, entonces El le dijo que en un comienzo le puede mandar todo tipo de penas externas, pero no tocarlo ni fisica ni mentalmente. Y asi hizo el Angel. Y he aqui, que todo el tiempo que el Angel Acusador no lo dano a Job fisica y mentalmente, incluso cuando dano su bienes, y cuando mato a sus hijos, Job se sobrepuso a la prueba. Hasta que el Angel Acusador reclamo (Job 2:4-5): \"¡Piel por piel! Todo lo que el hombre posee lo dara por su vida."},{"id":"p49-b4","pageNumber":49,"indexInPage":4,"text":"Pero extiende Tu mano ahora y tocale sus huesos y su carne, y seguramente Te blasfemara en Tu propio rostro\". Es decir, que todo el tiempo que no se dana al hombre, la prueba no es tan dificil, y por eso el Angel pidio permiso para danar a Job mismo. Verdaderamente, cuando Job fue danado por el atributo del Juicio Estricto, y fue castigado con la tina, ya no se sobrepuso a la prueba, y se enfurecio dentro su corazon por la conducta del Creador. Vemos aqui que los sufrimientos del cuerpo y de la mente son los mas duros para el hombre."},{"id":"p49-b5","pageNumber":49,"indexInPage":5,"text":"Y esto es algo que no necesita explicacion. Es bien sabido que en el momento en que el hombre esta enfermo, no siente ningun deseo de vivir. E incluso todo el dinero y todas las riquezas del mundo que posea no le ayudaran en nada, y no le daran ninguna alegria. Tanto mas, ellos"},{"id":"p49-b6","pageNumber":49,"indexInPage":6,"text":"aumentan la sensacion de su desgracia, pues ve que tiene riquezas y no las puede gozar. Particularmente si tiene sufrimientos mentales, aunque su estado fisico este bien, siente que la muerte es preferible a su vida. Por lo tanto, lo que la gente acostumbra decir \"Lo esencial, es la salud...\", esta por si mismo bien entendido, porque el estado de salud del hombre le sirve al Creador como factor para estimularlo, mas que cualquier otra cosa."},{"id":"p49-b7","pageNumber":49,"indexInPage":7,"text":"Otra razon mas – el cuerpo humano y su alma estan compuestos por 248 organos y 365 venas, que estan relacionados con la Tora entera. Cada vena de las 365 – se relaciona con uno de los 365 Preceptos \"Negativos\"; y cada organo de los 248 se relaciona con cada uno de los Preceptos \"Positivos\". Cuando el hombre transgrede un Precepto, El dana el mismo organo o vena que esta relacionado con ese Precepto, y asi el Creador le insinua al hombre exactamente lo que transgredio, para estimularle a arrepentirse."},{"id":"p49-b8","pageNumber":49,"indexInPage":8,"text":"Porque segun el organo lesionado o segun la enfermedad, puede el hombre saber cual fue la transgresion y asi guiarse y dirigirse a su meta y a la correccion de su alma. Y como se cuenta sobre el gran Justo, el Baal Shem Tov, que llego a casa de un enfermo incurable a cuyo lado estaba el medico."},{"id":"p49-b9","pageNumber":49,"indexInPage":9,"text":"Empezo el Baal Shem Tova conversar con el doctor sobre el enfermo, y el medico le dijo, que segun su diagnostico le quedaban al enfermo solo unas cuantas horas de vida, que no habia lo que hacer porque todas sus vasos sanguíneos estaban destruidos. Le dijo el Baal Shem Tov que espere un momento, y se paro cerca del enfermo que estaba acostado e inconsciente. Sorpresivamente abrio el enfermo sus ojos y pidio un poco de sopa, y asi poco a poco se fortalecio hasta que volvio su salud."},{"id":"p49-b10","pageNumber":49,"indexInPage":10,"text":"El medico que no creyo lo que veian sus propios ojos, le dijo al Baal Shem Tov: \"¡No es posible lo que veo aqui! Yo se con certeza que este enfermo tiene todas sus venas destruidas completamente, y no existe ninguna posibilidad que viva en esas condiciones, ¿Que le hiciste? Le dijo el Baal Shem Tov: \"Verdaderamente eres un medico especialista, y no te equivocaste en tu diagnostico, Y tambien yo se que todas sus venas estan completamente destruidas."},{"id":"p49-b11","pageNumber":49,"indexInPage":11,"text":"Pero, como tu sabes, los 365 venas estan relacionadas con los 365 Preceptos Negativos de la Tora; y la causa de su dificil enfermedad es porque transgredio tantas veces esas prohibiciones, hasta el punto que sus venas fueron heridas completamente. Pero ahora hable con su alma, y el acepto"}],"rawCharCount":4983},{"pageNumber":50,"blocks":[{"id":"p50-b0","pageNumber":50,"indexInPage":0,"text":"arrepentirse, por eso mismo le volvio la vitalidad a sus vasos sanguineos, y se sano. \"¿Y al Profesor de Annopol ya visitaste?\" preguntó el Justo. \"No lo visité, y la verdad que jamás escuché hablar de él\"..."},{"id":"p50-b1","pageNumber":50,"indexInPage":1,"text":"Los Cálculos Divinos El Creador conduce al mundo segun los actos del hombre, y como esta escrito en el sagrado libro del Zohar : (Introduccion al Tikuney Zohar, 17) El Creador creo el universo para hacer conocer a los seres humanos su fuerza y su poder; mostrarles como el mundo se conduce, a veces por el atributo del juicio estricto y a veces por el atributo de la misericordia – todo según los actos de los hombres."},{"id":"p50-b2","pageNumber":50,"indexInPage":2,"text":"Si sus actos son buenos, entonces los juicios estrictos se mitigan y se despierta la benevolencia y la Compasion Divina en el universo. Y tambien en el caso contrario, porque en la medida que el hombre se conduce – con esa misma medida el Creador se conduce con el."},{"id":"p50-b3","pageNumber":50,"indexInPage":3,"text":"Debido a que todas las enfermedades del hombre son causa directa de sus malas acciones y pecados, esta bien entendido que la ciencia de la medicina – exacta, perfeccionada y profundizada cuanto sea - no puede tener en cuenta todos los detalles que dependen de los Calculos Divinos, como: los meritos y deudas del enfermo, si se arrepintio o no, que le fue decretado por el Tribunal Celestial, etc. Y ciertamente que no esta en poder de ningun hombre – cuan inteligente y capaz sea - refutar los decretos del Creador."},{"id":"p50-b4","pageNumber":50,"indexInPage":4,"text":"Si El decreto que alguien sufrirá una determinada enfermedad por un determinado tiempo, no le ayudaran ningun remedio o tratamiento. Tambien por el contrario – si se mitigara el veredicto, y fuera abolido el decreto, entonces el enfermo se sanara aunque eso contradiga todo lo que la ciencia de la medicina conoce. Para ilustrar lo precedente reflexionaremos sobre este caso: dos hermanos gemelos que nacieron con las mismas cualidades naturales, crecieron en el mismo ambiente, comieron la misma comida, etc."},{"id":"p50-b5","pageNumber":50,"indexInPage":5,"text":"Es probable que en los primeros anos de sus vidas su estado de salud seria parecido, aunque tampoco es esto seguro, pero cuando crecen, y empiezan a aparecer en cada uno de ellos las debilidades, los dolores y sufrimientos que tienen la gente mayor, se vera que cada uno de ellos tiene su propio \"paquete\" de enfermedades."},{"id":"p50-b6","pageNumber":50,"indexInPage":6,"text":"Por medio de esto vemos con clara evidencia, que el estado de salud del hombre depende de sus acciones y no de las cualidades naturales, porque si dependiera de esto, sus estados de salud deberian ser muy parecidos, y incluso identicos."},{"id":"p50-b7","pageNumber":50,"indexInPage":7,"text":"Milagros y prodigios Este tema, que no existe ningun elemento natural en la salud del hombre, recibe validez viendo con claridad como en el momento que el hombre corrige lo que hace falta en el plano espiritual, enseguida desaparece la enfermedad sin la intervencion de ningun elemento natural. Si la curacion dependiera solo de la naturaleza, mismo despues que el hombre se arrepintio y su Veredicto Divino cambio, deberia esperar el proceso natural de su curacion y tambien ayudarse con medicamentos."},{"id":"p50-b8","pageNumber":50,"indexInPage":8,"text":"Existen situaciones, en las que ya se le causo al hombre un dano irreversible que ya nada le podra ayudar. Pero en vista que las cosas no son completamente asi, se ve sin ninguna duda que en el momento que el hombre corrigio lo necesario, enseguida cambia su situacion de un extremo al otro sin ninguna intervencion de la naturaleza, y se sana inmediatamente. Vemos asi mas y mas claramente, que todo lo que tiene relacion con la curacion – no tiene nada que ver con la naturaleza."},{"id":"p50-b9","pageNumber":50,"indexInPage":9,"text":"Esto es algo que el autor de este libro vio con sus propios ojos, en cientos de casos en que acompano a enfermos dirigiendolos y fue testigo del cambio inmediato y radical de la naturaleza, enseguida despues del arrepentimiento del enfermo; en casos personales que el mismo vivio, vio como la naturaleza cambia completa y inmediatamente enseguida que el hombre entiende lo que tiene que corregir. Uno de estos casos que se puede contar, sucedio en un dia de fiesta."},{"id":"p50-b10","pageNumber":50,"indexInPage":10,"text":"Tuvo el autor una grave infeccion en uno de sus dientes, y sufrio dolores terribles. Le dijo a su familia, \"¡Necesito un tratamiento urgente para mi diente!\" \"¡¿Que?!\" - Se asombraron - \"¿Vas a ir al dentista en pleno dia de fiesta?\" - \"Si\" - Les dijo – \"Es necesario hacer un profundo tratamiento urgentemente. Estoy sufriendo fuertes dolores, ¿es apropiado quedarse sufriendo en pleno dia de fiesta?"},{"id":"p50-b11","pageNumber":50,"indexInPage":11,"text":"¡Yo voy a hacer un profundo tratamiento con el mas grande medico que existe, el Creador!\" Se acerco el autor a un campo que estaba cerca, comenzo a hablar con el Creador y a pedirle que le muestre porque pecado se le produjo esa infeccion en el diente. Entonces se examino a si mismo y se autocritico, no abandono su busqueda hasta que encontro la causa por la que fue castigado. Inmediatamente despues que se arrepintio – ¡Enseguida desaparecio la inflamacion, los dolores pasaron y desaparecieron!"},{"id":"p50-b12","pageNumber":50,"indexInPage":12,"text":"¡Sin antibiotico y sin tener que esperar que baje la"}],"rawCharCount":4874},{"pageNumber":51,"blocks":[{"id":"p51-b0","pageNumber":51,"indexInPage":0,"text":"inflamacion poco a poco, sin ninguna intervencion de la naturaleza! Inmediatamente después que corrigio lo que debía, desaparecio tambien la causa que le llego para estimularlo a la correccion. ¡No existe la naturaleza! Y con esto quisieramos fortalecer a todos los enfermos - ¡No existe ninguna naturaleza! El que andara por el sendero de la plegaria y el arrepentimiento, vera milagros con su propios ojos. Porque cuando el Creador desea sanar a alguien, no necesita ninguna ayuda."},{"id":"p51-b1","pageNumber":51,"indexInPage":1,"text":"Esto es lo que se ensena (Likutey Moharán I, 62), que la esencia del error de los alejados de la fe en el Creador, es debida a que creen que el mundo se conduce por medio de los astros. Por lo tanto, se equivocan cada uno segun su error: hay los que piensan que la naturaleza dirige el mundo entero; y hay los que creen en el Creador pero piensan que debe haber un mediador, como en el caso del becerro de oro, que quisieron hacerlo intermediario entre ellos y El, como dijeron (Exodos 32:1): \"Para que vaya delante nuestro\"."},{"id":"p51-b2","pageNumber":51,"indexInPage":2,"text":"En esto se equivocan muchos, y hacen de las causas un intermediario entre ellos y el Creador. Es decir, que creen en el Creador, pero creen tambien en los intermediarios y dicen que las causas son indispensables."},{"id":"p51-b3","pageNumber":51,"indexInPage":3,"text":"Por ejemplo, creen que la causa de tener sustento son los negocios, y los transforman en lo esencial, como si el Creador no tiene el poder de dar sustento sin la causa del negocio; o por ejemplo que creen que la causa de la curacion son las drogas y los medicamentos, y hacen de ellos lo esencial, ¡como si el Creador no puede curar sin ellos! Pero no es así. Porque el Creador es la causa de todas causas, el motivo de todos motivos, y no necesita ninguno de ellos."},{"id":"p51-b4","pageNumber":51,"indexInPage":4,"text":"Y cuando nos ocupamos de esas causas, debemos creer solo en el Creador y no hacer de ellas lo esencial. Milagros revelados Para reforzar este punto, traeremos dos hechos que tuvieron muchos testigos, y por ellos veremos verdaderamente, que no existe ninguna naturaleza. El primer hecho esta reportado en el libro \"Conversaciones del Rabi Najman de Breslev\" (conversacion no. 187): \"Una vez, se acerco al gran Maestro uno de sus discípulos que estaba enfermo con un fuerte dolor en la mano, hasta tal punto que le era imposible moverla."},{"id":"p51-b5","pageNumber":51,"indexInPage":5,"text":"Tenía la mano atada a su cuello con un pañuelo como se acostumbra, pues le era imposible bajarla por el dolor que sentía. Le"},{"id":"p51-b6","pageNumber":51,"indexInPage":6,"text":"dijeron a nuestro Maestro que el hombre necesitaba beber agua con sal y tomar medicamentos. Este hombre era muy pobre y no tenía dinero para medicinas. El sábado, cuando estaba desayunando, preguntó nuestro gran Maestro a los que estaban sentados alrededor, si ese hombre tenía fe en el Creador, le respondieron: \"Si\". Y repitió su pregunta, y siguió preguntando de si tiene fe, y le contestaron: \"Si\". De repente, nuestro gran Maestro ordenó al hombre que saque la mano del pañuelo y que la baje, el hombre se asustó muchísimo."},{"id":"p51-b7","pageNumber":51,"indexInPage":7,"text":"También todos los presentes se asustaron y se sorprendieron de esta extraña situación, pues ya hacia mucho tiempo que este hombre tenía su mano enferma, hasta el extremo que ya no la podía bajar, ¡¿Y ahora de repente bajarla?! Pero inmediatamente después que nuestro gran Maestro lo ordenó, que fue como un decreto, le sacaron al hombre el pañuelo que le mantenía la mano fija a su cuello, y este bajó la mano."},{"id":"p51-b8","pageNumber":51,"indexInPage":8,"text":"Este fue un milagro revelado a todos, como la mano se curó en ese mismo momento, volvió a estar sana y fuerte como la mano de todo hombre, hasta el día de hoy.\""},{"id":"p51-b9","pageNumber":51,"indexInPage":9,"text":"Este hecho, que tuvo muchos testigos, demuestra que totalmente no existe ninguna naturaleza. Porque segun la naturaleza, no existe ninguna forma de revivir a aquellas celulas y musculos heridos y enfermos en un instante. Porque se puede entender que sea posible curar las células enfermas a lo largo de un tiempo por medio de medicamentos, ¡¿pero curarlas en el momento?! ¿Quien lo puede hacer? Solo el Medico de enfermos por si mismo, el Creador."},{"id":"p51-b10","pageNumber":51,"indexInPage":10,"text":"Por esto, solo por el poder de la fe de ese hombre, se curo su mano completamente sin ninguna causa – ¡E inmediatamente! El segundo hecho ocurrio con el gran Justo Baba Sali, que levanto a un invalido de la silla de ruedas. Esto tambien fue frente a numerosos testigos. Tambien este hecho nos demuestra totalmente que no existe ninguna naturaleza, porque ese hombre era un invalido hacia ya muchos anos ¿y como es que de repente se revivieron todas las celulas y los nervios que estaban completamente atrofiados?"},{"id":"p51-b11","pageNumber":51,"indexInPage":11,"text":"Solo por el Resucitador de muertos mismo. Por la fuerza de la fe y por la fuerza de la plegaria del Justo, el Creador le revivio los celulas y nervios y el hombre se levanto de la silla de ruedas. El profesor de Annopol El hombre debe saber que el Creador cura toda carne, El y solo El."}],"rawCharCount":4688},{"pageNumber":52,"blocks":[{"id":"p52-b0","pageNumber":52,"indexInPage":0,"text":"La siguiente historia sucedio cuando llego hasta el famoso Justo Mordejai de Nesjiz un hombre, y le conto que sufria una grave enfermedad:"},{"id":"p52-b1","pageNumber":52,"indexInPage":1,"text":"Le preguntó el Justo: \"¿Y al profesor de Annopol ya visitaste?\" Le contestó: \"No lo visité, y la verdad que jamás escuché hablar de él\". Le dijo el Justo: \"Entonces, viaja a él, y ciertamente podrá encontrar una cura a tu enfermedad\". Aceptó el hombre el consejo del Justo, y salió a un largo y agotador viaje, hasta que llegó a la ciudad de Annopol. Cuando bajó del carro que le llevaba, preguntó el primer hombre que encontró donde vivía el famoso profesor."},{"id":"p52-b2","pageNumber":52,"indexInPage":2,"text":"Le preguntó el hombre: \"¿De que profesor estás hablando?\"Le contestó: \"hablo del conocido e importante profesor que vive en esta ciudad\". Le respondió: \"No tenemos en nuestra ciudad ni un médico ni un simple enfermero, y con mayor razón no tenemos un profesor famoso\"."},{"id":"p52-b3","pageNumber":52,"indexInPage":3,"text":"\"Entonces\" - Preguntó el hombre enfermo - \"¿Cómo ustedes se curan?\" Le respondió: \"Muy simple, cuando un hombre tiene una enfermedad, se arrepiente, se dirige al Creador con plegarias, le pide que lo cure, y así se sana.\" Volvió decepcionado el hombre enfermo al Justo y le dijo: \"No hay ni un médico o enfermero en Annopol, ¿Por qué entonces me mandaste en vano allí?\" Le pregunto el Justo: \"¿Y como la gente de Annopol se cura sin tener un médico en su ciudad?\" Le contestó el hombre: \"Cuando les llega un dolor o alguna enfermedad, se arrepienten, y rezan al Creador, y así se curan\"."},{"id":"p52-b4","pageNumber":52,"indexInPage":4,"text":"Le dijo el Justo: \"Este es precisamente el gran profesor al que yo te mande – ¡el profesor de Annopol!\" El Creador es el Profesor que esta en todo lugar. El es el experto en curar cada enfermedad, incluso solo por medio de pan y agua, como esta escrito (Exodus 23:25): \"…y El bendecira tu pan y tus aguas; y Yo quitare las enfermedades de dentro de ti.\" Asi conto el hijo del gran sabio, el autor del libro \"Jafetz Jaim\", que su madre casi nunca pidió ayuda a medicos en la crianza de sus hijos."},{"id":"p52-b5","pageNumber":52,"indexInPage":5,"text":"Cuando alguien de la familia se enfermo, pidio el sabio repartir 18 kilogramos de pan a los pobres, y el mismo subio a rezar en el desvan, y la enfermedad desaparecio."},{"id":"p52-b6","pageNumber":52,"indexInPage":6,"text":"[Nota del Editor: Este artículo refleja la verdad absoluta de la Creacion. Sin embargo, el hombre debe conocer su autentico nivel espiritual sin enganarse y con trabajo espiritual aspirar subir los niveles de la fe. Debe hacer todo lo mejor que pueda, rezando y arrepintiendose, acordándose ante todo tratamiento medico que es el Creador quien le da salud. No obstante, debe rezar y pedirle al Creador que el medico acierte con el tratamiento y la medicacion adecuada y tener fe que El le ayudara."},{"id":"p52-b7","pageNumber":52,"indexInPage":7,"text":"En los siguientes articulos ampliaremos sobre este tema.]"},{"id":"p52-b8","pageNumber":52,"indexInPage":8,"text":"Existe una forma por la cual el hombre puede anular lo que le fue decretado, y así podrá curarse en todo momento por medio de cada médico y medicamentos... Solo El sabe"},{"id":"p52-b9","pageNumber":52,"indexInPage":9,"text":"Nos enseña la Guemara (Tratado Avoda Zara, 55): \"...en la hora que se mandan al hombre los sufrimientos, se establece que le lleguen en determinado dia, y que lo abandonen en determinado dia y hora y por medio de tal hombre y por medio de tal medicamento...\". Y en el libro Likutey Moharán (II, 3) se interroga: En vista que se necesita todas estas condiciones para curar al hombre enfermo, entonces ¿como el medico tiene poder para curarlo por medio de medicamentos y su ciencia?"},{"id":"p52-b10","pageNumber":52,"indexInPage":10,"text":"He aqui, que el no sabe si le llego al enfermo el dia y la hora de sanarse; y no sabe cual es el medicamento decretado por el Cielo para su curacion; y tampoco sabe cual es el medico elegido desde Arriba para ser el emisario de su curacion, etc.… Debido a que el dia, la hora, la droga y el medico son determinados desde el Cielo, ¿como puede este hombre enfermo, que no sabe lo que le fue decretado, a pesar de todo ir al medico y entregarse en sus manos?."},{"id":"p52-b11","pageNumber":52,"indexInPage":11,"text":"Se entiende de todo esto, que dirigirse al medico es como una adivinanza, una apuesta – que quiza se daran todas las condiciones que fueron determinadas en el Cielo para la curacion del enfermo. \"Rescate del alma\" Pero existe una forma por la cual el hombre puede anular lo que le fue decretado, y asi podrá curarse en todo momento por medio de cada medico y medicamentos."},{"id":"p52-b12","pageNumber":52,"indexInPage":12,"text":"Esto es solo por medio de su arrepentimiento, aproximacion a los Justos para que recen por el, y haciendo un \"rescate del alma\", como esta escrito (Likutey Moharán, id.): \"Cuando se produce un rescate del alma, esto mitiga el juicio estricto, y el decreto se anula."}],"rawCharCount":4410},{"pageNumber":53,"blocks":[{"id":"p53-b0","pageNumber":53,"indexInPage":0,"text":"Entonces puede el medico curar al enfermo por medio de drogas… se puede curar mediante cualquier medicamento, porque ya no es necesario usar una determinada droga. Esto es debido a que ya no existe el juicio estricto. Encontramos entonces, que es imposible para el medico curar sino por medio del \"rescate del alma\" que es necesario hacer al comienzo para mitigar el juicio, y solo entonces tiene el medico el permiso para curar\"."},{"id":"p53-b1","pageNumber":53,"indexInPage":1,"text":"La ensenanza es, que despues que el hombre done de su dinero a los Justos para el \"rescate del alma\", puede su esfuerzo, por medio de los medicos, ayudarle para su curacion. Es necesario que traiga su donacion para el rescate, solo a los que saben hacerlo, como los rabinos de Breslev que han herdado laformula precisa."},{"id":"p53-b2","pageNumber":53,"indexInPage":2,"text":"Es tambien necesario que no sea tacaño, y como esta escrito )Likutey Tefilot, 123): \"Que el que da para el \"rescate del alma\" no sera tacano, y donara lo que es debido para que lo abandonen todos los juicios estrictos…\" Debes saber que el \"rescate del alma\" ayuda mucho. Con nuestros oidos escuchamos y con nuestros ojos vimos muchos milagros evidentes de gente que se curo de enfermedades graves, y que se salvaron de distintos decretos por medio del rescate."},{"id":"p53-b3","pageNumber":53,"indexInPage":3,"text":"Un hombre enfermo pregunto el maestro autor de este libro, si debia ir al medico. Le contesto el autor: \"¿Por que te apuras en ir al doctor, acaso el te enfermo? El Creador te enfermo, ve a El y pidele que te muestre porque pecado te mando esta enfermedad, y arrepientete haciendo lo que esta en tu poder, y tambien has rescate de tu alma\"."},{"id":"p53-b4","pageNumber":53,"indexInPage":4,"text":"\"Solamente despues que hiciste todo lo que esta en tu poder para anular el decreto de raiz, y pediste al Medico Supremo que te cure, entonces recien te esta permitido ir tambien al medico como refuerzo, para que la curacion tenga en que manifestarse. Pero ir al medico sin hacer el esfuerzo verdadero con el Creador, esto es falta de fe. Debes saber, que si te fue decretado tantos anos de vida, el medico no podra agregarte mas; maximo, podra reducirlos."},{"id":"p53-b5","pageNumber":53,"indexInPage":5,"text":"Pero el Creador - que es la Fuente de la vida – El te podra agregar mas anos de los que te fueron determinado. Por lo tanto, lo esencial del esfuerzo es con quien te da la vida."},{"id":"p53-b6","pageNumber":53,"indexInPage":6,"text":"Agradece - y cúrate El verdadero medicamento confirmado y verificado para la curacion es la fe. Por esto, el hombre enfermo debe agradecer al Creador que lo enfermo, porque seguramente es para su eterno bien."},{"id":"p53-b7","pageNumber":53,"indexInPage":7,"text":"Y cuando mucho agradezca por su enfermedad, podra curarse mas facilmente, pues el agradecimiento es la expresion mas alta de la fe, el hombre sabe que todo lo que le sucede esta bajo la Supervision del Creador para el bien. Uno de los alumnos principiantes del maestro autor de este libro, que recien empezaba a acercarse al camino de la fe, estaba muy enfermo desde hacia muchos anos y sufria mucho. Todo lo que hizo para curarse no le ayudo, tampoco el arrepentimiento y la plegaria."},{"id":"p53-b8","pageNumber":53,"indexInPage":8,"text":"Hasta que un dia, escucho una clase sobre el agradecimiento, donde se le esclarecio que todo es para el bien, y que el hombre debe agradecer por todas sus faltas y sus sufrimientos de todo corazon. Ese discipulo empezo a dedicar una hora entera cada dia, solo y unicamente al agradecimiento."},{"id":"p53-b9","pageNumber":53,"indexInPage":9,"text":"Le agradecio al Creador por haberlo enfermado y por todos los anos de sufrimientos, porque ciertamente el Creador que es misericordioso lo hizo todo para su completo bien, le expio de sus pecados y tambien asi logro estimularse para el arrepentimiento.. Asi lo hizo cada dia durante una hora entera, y solo le agradecio al Creador que lo enfermo y ni pidio la curacion. ¡En dos semanas se le paso la enfermedad completamente! Sin medicamentos, sin remedios."},{"id":"p53-b10","pageNumber":53,"indexInPage":10,"text":"La enfermedad que lo atormento durante tantos años, y que nada le ayudo a curar – le ayudo el agradecimiento! Porque el agradecimiento es la cuspide de la fe. Y como se ha dicho anteriormente, la falta de fe es el factor principal de todas las graves enfermedades, y de por si cuando rectificamos la fe - nos sanamos. Porque en verdad, los unicos sufrimientos que existen son los que se sufren cuando se le quita al hombre la fe."},{"id":"p53-b11","pageNumber":53,"indexInPage":11,"text":"Pues todo el tiempo en que el hombre cree con fe completa que todo proviene de El y que todo es para el bien - el no siente ninguno sufrimiento. Por esto, si en cada situación el hombre se esforzara a creer que todo es para el bien, y agradeciera por todo, los juicios estrictos sobre el se mitigarian, y no tendria ninguno sufrimiento. Esto es una de las cosas que el hombre enfermo debe pedir del Creador, que le de la creencia que todo es para el bien, y que merecera agradecer con todo su corazon por sus sufrimientos."},{"id":"p53-b12","pageNumber":53,"indexInPage":12,"text":"Porque lo principal en los juicios y los sufrimientos que siente el hombre, son debido a su perdida de su fe. Si pidiera tenerla y lograra agradecer sobre todo con todo el corazon – ¡seguro que todo se le transformaria para el bien!"}],"rawCharCount":4805},{"pageNumber":54,"blocks":[{"id":"p54-b0","pageNumber":54,"indexInPage":0,"text":"La reclamación que el médico está obligado a avisar cual es el \"verdadero\" estado al enfermo o a su familia para no ilusionarlos, es completamente incorrecta... Lo esencial es la fe Hay graves enfermedades que llegan solo por la falta de fe, como esta escrito (Likutey Moharán II, 5): \"Lo esencial es la fe. Y debe cada uno buscar en si mismo la fe, y esforzarse con fe."},{"id":"p54-b1","pageNumber":54,"indexInPage":1,"text":"Porque existen personas que sufren de enfermedadesy reciben golpes extraordinarios, y esto es solo por la perdida de la fe, como esta escrito (Deuteronomio 28:59): \"Entonces hara el Eterno que los golpes que recibas sean extraordinarios... golpes grandes y fieles, y enfermedades malignas y fieles\". La plabra \"fieles\" ensena que estas calamidades llegan por una alteracion en la fe y a estos golpes extraordinariosno ayudan ni las medicinas, ni la plegaria, y ni los méritos de los antepasados\"."},{"id":"p54-b2","pageNumber":54,"indexInPage":2,"text":"¡De esto deducimos, que la falta de fe es el pecado mas grande que existe – el mas grande de todos los pecados, delitos y transgresiones! Por esto su castigo es el mas duro, enfermedades graves e incurables, que solo el arrepentimiento y duro trabajo sobre la fe podra ayudar a curarlas. Por lo tanto, en estos casos dificiles, lo principal del arrepentimiento debe ser por la falta de fe, aprender la fe, y rezar por la fe. Hombres benevolentes Cada persona que se ocupa de medicina debe saber que su ocupacion es muy noble."},{"id":"p54-b3","pageNumber":54,"indexInPage":3,"text":"En general, el que emprende una carrera medica, lo hace por benevolencia y amor a las criaturas. El atributo de la misericordia, conmiseracion y la voluntad de ayudar a la gente, de dar, etc., son el empuje principal para estudiar medicina. Pero, deben cuidarse mucho de no caer en la trampa del orgullo, y siempre saber que son solo emisarios. Solo el Creador es el que determina quien vivira y quien morira; y solo El es el que determina cuantos sufrimientos debe el enfermo tener y pasar, y si se sanara o no."},{"id":"p54-b4","pageNumber":54,"indexInPage":4,"text":"Por lo tanto, el medico debe rezar cada dia antes de empezar su trabajo, y pedirle al Creador que le ayude a ser un buen emisario, y no tener ningun inconveniente en sus manos; que le de el consejo correcto para como conducirse en cada caso que tenga que atender. Debe pedir que el Creador le elija ser emisario de vida, y que no llegue por el a ningun hombre ninguna deuda y ninguna afliccion, y con mayor razon, que no cause ninguna muerte, Di-s nos salve. Debe pedir al Creador la paciencia y el"},{"id":"p54-b5","pageNumber":54,"indexInPage":5,"text":"amor para cada uno que se dirige a el, y lograr alentar, fortalecer y esperanzar a cada enfermo y a su familia. ¡No existe desesperación alguna! Como mencionamos anteriormente, explicaron los Sabios que en el versiculo \"...y hara que le curen\" - se aprende que le fue dado al medico el permiso para curar. ¡El medico recibio este permiso para sanar y no para desesperar!"},{"id":"p54-b6","pageNumber":54,"indexInPage":6,"text":"Hay muchos casos en los cuales el medico atemoriza al enfermo y a su familia, y les da un diagnostico muy penoso; los desespera, y no le da al enfermo ninguna probabilidad y esperanza de vida, y incluso le avisa que le quedan tantos días de vida, etc. ¡Este es un terrible error!"},{"id":"p54-b7","pageNumber":54,"indexInPage":7,"text":"Es sabido que todas las investigaciones medicas admiten que la alegria es una condición esencial en la curacion del enfermo y le refuerza todos los sistemas del cuerpo, hasta existe un metodo que fue ultimamente publicado, donde se trata a los enfermos graves mediante solamente la alegria. Y asi esta escrito (Likutey Moharán II, 24): \"Es un gran Precepto estar siempre alegre, y fortalecerse a alejar la tristeza y la melancolia con toda fuerza. Porque todas las enfermedades del hombre, llegan por el deterioro de la alegría\"."},{"id":"p54-b8","pageNumber":54,"indexInPage":8,"text":"De por si se entiende que cuando el hombre enfermo es fuerte en su fe y en su esperanza, tiene mas posibilidades de curarse. Por lo tanto, no solo le esta prohibido al medico desesperar al enfermo, sino que por el contrario, una de sus mas importantes funciones es alentar al hombre enfermo y alegrarlo, reafirmar en el la esperanza y la fe. Porque debido a que el enfermo confia en la opinion del medico, entonces hay una gran autoridad en sus palabras de aliento, mas que las de cualquier otra persona."},{"id":"p54-b9","pageNumber":54,"indexInPage":9,"text":"Se debe saber muy bien, que la ayuda y el apoyo espiritual es muchas veces mas util para la curacion del enfermo que la ayuda fisica. Los pronósticos La reclamacion que el medico esta obligado a avisar cual es el \"verdadero\" estado al enfermo o a su familia para no ilusionarlos, es completamente incorrecta. Porque incluso si le fue decretado al enfermo morir, debe morirse con fe; hasta el ultimo momento debe vivir con fe y mantenerse esperanzado."},{"id":"p54-b10","pageNumber":54,"indexInPage":10,"text":"Y con mayor razon, si existe segun la medicina la probabilidad que viva, ciertamente solo la alegria y la esperanza le podran dar al enfermo la fuerza de sanarse, y los tratamientos y medicamentos le ayudaran."}],"rawCharCount":4742},{"pageNumber":55,"blocks":[{"id":"p55-b0","pageNumber":55,"indexInPage":0,"text":"Por esto, los medicos que desmoralizan al enfermo, lo intimidan y no le dan ninguna esperanza, e incluso le dicen que tiene un tiempo limitado para vivir, hacen una cosa terrible. Le corrompen su espiritu, y le llevan a la desesperacion total; con eso reducen sus posibilidades de vivir. Una de los favores que el Creador le hizo a los seres humanos es que oculto de ellos el dia de su muerte. Porque si el hombre lo supiera, podria influir negativamente sobre el de muchas maneras."},{"id":"p55-b1","pageNumber":55,"indexInPage":1,"text":"Y debido que el Creador oculto este detalle, ¿como puede un ser humano, de sangre y hueso jactarse de revelarlo? Y especialmente que no revela nada, como se ve en muchos casos en que se descubre que el diagnostico es completamente equivocado. Encontramos entonces, que si le es decretado al enfermo morir, ellos le pueden quitar la posibilidad de morir con esperanza y fe; le llevan a morir con amargura, desesperanza, confusion, enojo al Creador, y mucho mas."},{"id":"p55-b2","pageNumber":55,"indexInPage":2,"text":"Y contrariamente si existe la posibilidad de vivir, eso depende de la creencia del enfermo, y ellos lo alejan de la fe, le sentencian con sus propias manos la muerte. Especialmente cuando ignoran completamente cual es la verdad. ¿Y quien puede afirmar que ese es su estado, o que este estado no puede cambiar repentina e imprevisiblemente? ¿Acaso el medico es Di-s que sabe lo que le fue decretado al enfermo, hasta estar tan seguro que su chequeos y avaluaciones son absolutos?"},{"id":"p55-b3","pageNumber":55,"indexInPage":3,"text":"He aqui, solo en la mano del Creador esta cambiar todas las cosas. Los resultados de los chequeos no determinan lo que le fue decretado al hombre enfermo. Y se ha visto con certeza, que el diagnostico del medico no es una cosa absoluta. Como es sabido, existen un sinnumero de casos de enfermos que vivieron contra todos los pronosticos que les han dado. A veces, puede el hombre cumplir un Precepto, o decidir hacer una buena accion, o pensar sobre el arrepentimiento o algo semejante y todo puede cambiar por esto."},{"id":"p55-b4","pageNumber":55,"indexInPage":4,"text":"Por lo tanto es posible que le hicieran chequeos en un dia determinado cuando su situacion era verdaderamente grave, y hasta la llegada de los resultados, el lograra arrepentirse y todo su estado entonces se transformara para el bien, asi que ellos no serian relevantes en su presente condicion. Por otra parte, ¿quien le pidio al medico dar estos u otros pronosticos?"},{"id":"p55-b5","pageNumber":55,"indexInPage":5,"text":"Y aunque los familiares del enfermo presionen al medico para saber el pronostico\"correcto\", puede el medico dar su opinion segun su parecer superficialmente y clasificar sus palabras, y decir que en verdad no se puede saber con certeza cual es la situacion. Y aunque segun las leyes de la"},{"id":"p55-b6","pageNumber":55,"indexInPage":6,"text":"naturaleza la situacion parece grave, esto es solamente mientras el Creador no intervino y cambio sus leyes. Porque ciertamente si el Creador interviene, todo esta en Su mano, y el puede decidir dar salud y vida contra la ley natural, y sin ningun esfuerzo humano. Un hombre que sufría de dolores de espalda durante un largo período, al extremo que no podía levantar ningún peso, fue a ver a uno de los Justos contemporáneos para preguntarle qué hacer..."},{"id":"p55-b7","pageNumber":55,"indexInPage":7,"text":"El mejor consejo El medico creyente sabe, que el estado del enfermo puede cambiar de un extremo al otro instantaneamente. Suficiente si ese hombre o su familia dieran su nombre a un Justo para que rece por el, o el mismo se arrepintiera y retornara al Creador – entonces sanaria. Y tambien por el contrario, aunque los chequeos dieran buenos resultados, si el enfermo perdiera la fe o hiciera malas acciones, entonces su estado se agravaria. ¡Por lo tanto, el medico debe abstenerse de dar pronosticos dramaticos!"},{"id":"p55-b8","pageNumber":55,"indexInPage":8,"text":"Porque de cualquier manera, incluso si sus predicciones son completamente exactas, es posible que el Creador decidiera en este caso restablecer al enfermo, y entonces el medico quedaria en una situación vergonzosa. Incluso si su prediccion se cumpliera, ¿cual fue la utilidad?, ¿por que intimido al enfermo y lo debilito? Por eso sera juzgado en el Cielo, porque ayudo a agravar todavia mas la enfermedad mediante el miedo que le causo al paciente."},{"id":"p55-b9","pageNumber":55,"indexInPage":9,"text":"Porque quien teme a algo – eso mismo le llega, como esta escrito (Job 3:25): “... lo que temia, me ha acontecido”. Por lo tanto, el mensaje al medico es – ¡No digas nada absoluto! Incluso aunque te presionen, diras que es todavia temprano para dar un pronostico, o un pretexto semejante. Y con mayor razon, no te apures por propia iniciativa a dar predicciones."},{"id":"p55-b10","pageNumber":55,"indexInPage":10,"text":"Hay situaciones, en las que el medico quiere influir sobre el enfermo para que acepte su opinión y su recomendacion de tratamiento, una cirugia o el uso de determinadas drogas, etc. En estos casos la Mala Inclinacion se manifiesta en el medico para obligar y forzar al enfermo a aceptar su opinion. ¡Esto es un error! Porque incluso si su consejo es verdaderamente bueno, debe dejar el libre albedrio en la mano del enfermo, y tanto mas cuando no se sabe en forma absoluta si lo indicado es eficiente o no. ¿Deseas ser medico?"},{"id":"p55-b11","pageNumber":55,"indexInPage":11,"text":"¿Ayudar a la gente? Haz lo tuyo. Tal como dijo el Creador a su profeta (Ezequiel 3:17): “… te he designado centinela” – dice lo tuyo y no intervengas mas que esto."}],"rawCharCount":5057},{"pageNumber":56,"blocks":[{"id":"p56-b0","pageNumber":56,"indexInPage":0,"text":"Dejale al enfermo la opcion de la fe y de su libre albedrio. Y si el enfermo no hara lo que le recomiendas, no es tu problema. Por esto no agregues descripciones y “colores” a tu opinion. Si te parece que la situacion es grave, dile: “La situacion parece grave, y yo recomiendo un determinado tratamiento”. Sin agregados. Y lo que el Creador quiera, pondra en el corazon del enfermo. Si el Creador desea que acepte la opinion, la aceptara; y en caso contrario – no."},{"id":"p56-b1","pageNumber":56,"indexInPage":1,"text":"Esta es la regla – solo el Creador decide que pasara con cada uno de los enfermos; el rol del medico es solo ser un emisario de la Supervision Divina y de Su Misericordia, debe tener la esperanza de merecer que le llegue al enfermo el bien a traves de el; y en su contacto con los enfermos debe fortalecerles su espiritu, y no destruirlo. Asi debe el medico decirle al enfermo: “Nosotros haremos lo que esta a nuestro alcance. Pero debes saber que no depende de nosotros, y necesitamos reforzar nuestra confianza en el Creador."},{"id":"p56-b2","pageNumber":56,"indexInPage":2,"text":"Sean los resultados de los chequeos los que sean, puede haber buenas sorpresas. Nada es definitivo y absoluto pues el Creador puede cambiar cada situacion inmediatamente. Entonces, fortalecete con fe, arrepentimiento, plegaria y caridad, y tambien nosotros nos fortaleceremos en la creencia de que el Creador nos dara el mejor consejo para conducirnos contigo, que tengamos exito en todo lo que hagamos, y que tengas una completa curacion”. Y lo principal – ¡nunca tener miedo!"},{"id":"p56-b3","pageNumber":56,"indexInPage":3,"text":"Como hemos dicho, el mensaje a los medicos es que sepan cual es su lugar y no traten de ser los sustitutos del Creador. Y el mensaje al enfermo es, que no tenga miedo de los medicos y en lo que ellos determinan en forma definitiva, como si ellos fueran los que deciden lo que pasara. Sino que debes saber que todo esta unicamente en las manos del Creador, y fortalecerte. Debemos saber que la medicina misma es como un tipo de fe, porque vemos que la gente cree en ella, pero esta creencia es el principio de la herejia."},{"id":"p56-b4","pageNumber":56,"indexInPage":4,"text":"El hombre teme abandonar la confianza en los medicos y sus remedios, como si fuera que su vida esta en sus manos y no en las del Creador... Por lo tanto, el hombre enfermo al que intimidan y atemorizan que si no acepta el tratamiento que le proponen – pobre de el, no debe asustarse. El miedo significa la perdida de la fe en el Creador y el retorno a las leyes de la naturaleza, como si no hubiera ya lo que hacer."},{"id":"p56-b5","pageNumber":56,"indexInPage":5,"text":"El Libro de los Salmos"},{"id":"p56-b6","pageNumber":56,"indexInPage":6,"text":"La fuerza de los Salmos del Rey David es enorme para implantar dentro del corazon del enfermo la confianza de que el Creador lo curara. Esta misma confianza es la razon de su curacion. Las historias de milagros que existen sobre el recitado del los Salmos son innumerables. Una de las historias es la de un nino cuyo buen amigo enfermo, y a quien los medicos no le daban esperanza de vida. ¿Que hizo? Tomo el libro de los Salmos, y empezo a recitarlo con emocion para la curacion de su amigo."},{"id":"p56-b7","pageNumber":56,"indexInPage":7,"text":"Despues de ocuparse mucho tiempo con la lectura, corrió a la casa de su amigo, y pregunto: “¿Ya mejoro su estado?”. “No”, le contestaron con tristeza. Volvio el nino al libro, y siguio recitando los Salmos con fe completa y esperanza. Despues de un tiempo, dejo de lado el libro y corrio nuevamente a ver a su amigo. Cuando vio que las caras de los familiares seguian estando tristes, volvio otra vez al libro de los Salmos. ¡Asi repitio esto una vez tras otra a lo largo de toda la noche!"},{"id":"p56-b8","pageNumber":56,"indexInPage":8,"text":"Hasta que al amanecer le anunciaron la noticia esperada, que el estado de su amigo mejoro, y que estaba descansando... El libro “Los Nombres de los Justos” Esta escrito (El Libro de los Atributos, tema “Justos” II, 20): “Por medio de la mencion de los nombres de los Justos, se puede modificar la obra de la Creacion, es decir, cambiar la naturaleza”. El nombre de una persona contiene su esencia especifica, por lo tanto, al mencionar los nombres de los Justos se evocan sus buenas cualidades, acciones, rectitud, y sus enormes meritos."},{"id":"p56-b9","pageNumber":56,"indexInPage":9,"text":"El libro “Los Nombres de los Justos” contiene una lista de la mayoria de los Justos desde la creacion del mundo. Cierta vez, una mujer se dirigio al maestro, autor de este libro, llevando sus radiografias que mostraban un tumor en la matriz. La mujer conto al maestro, que los medicos dijeron que necesitaba operarse, y que luego ya no podria tener mas hijos. El maestro le aconsejo leer cada dia el libro de “Los Nombres de los Justos”."},{"id":"p56-b10","pageNumber":56,"indexInPage":10,"text":"Despues de un tiempo, hizo la mujer nuevos examenes, e increiblemente – las radiografias mostraron que el tumor habia desaparecido como si nunca hubiera existido, y mas adelante tuvo tambien el merito de engendrar hijos. El libro “Recolección de Plegarias”"}],"rawCharCount":4637},{"pageNumber":57,"blocks":[{"id":"p57-b0","pageNumber":57,"indexInPage":0,"text":"El libro “Recoleccion de Plegarias” es un libro antiguo escrito hace unos 200 anos e incluye rezos personales y suplicas de lo mas profundo del corazon sobre todo tema existente, para toda situacion y necesidad. Un hombre que sufria de dolores de espalda durante un largo periodo, al extremo que no podía levantar ningun peso, incluso el mas liviano, fue a ver a uno de los Justos contemporaneos para preguntarle que hacer. Le aconsejo el Justo rezar todas las plegarias sobre curacion que hay en el libro “Recoleccion de Plegarias”."},{"id":"p57-b1","pageNumber":57,"indexInPage":1,"text":"El hombre acato el consejo y empezo leyendolas segun el orden. Despues de poco tiempo desaparecieron todos los dolores que los medicos desesperaron de curar. Un gran Justo solía decir: “Cuando los médicos desesperan al hombre, y, a pesar de eso, él se fortalece y pone toda su confianza en el Creador – entonces se le abren las puertas de la curación”... ¡Todo se transformará para bien! Es muy importante saber – ¡El Creador es todopoderoso!"},{"id":"p57-b2","pageNumber":57,"indexInPage":2,"text":"Y cada Decreto puede ser transformado con plegarias, arrepentimiento y caridad, como dijo el Rey Ezequias: “Incluso cuando una filosa espada esta colocada sobre el cuello del hombre – no se evite a si mismo la Misericordia”. “La Misericordia” significa plegaria, y especialmente la plegaria del enfermo que es la mas efectiva, como comentaron los Sabios sobre el versiculo (Genesis 21:17): “Pero Di-s escucho la voz del muchacho…” – aprendemos entonces que la plegaria de una persona sobre si misma es mas eficaz que las plegarias de los otros por el, y es la primera en aceptarse."},{"id":"p57-b3","pageNumber":57,"indexInPage":3,"text":"Como vemos en el versiculo antedicho, que aunque la madre del muchacho tambien lloro, el Creador escucho antes la voz de su hijo que la suya. Por lo tanto, aunque el “Rescate del alma” y las plegarias de los Justos son muy importantes, no existe algo tan poderoso y util como la plegaria del enfermo mismo. Lo esencial de todo, es que hable con el Creador en su propia lengua."},{"id":"p57-b4","pageNumber":57,"indexInPage":4,"text":"Se dirigira al Creador con suplicas, Le contara todo lo que le pasa, se arrepentira y pedira curacion; debe prolongar mucho estos ruegos, incluso horas enteras, en las cuales detallara es su propio idioma todas sus necesidades fisicas y espirituales. Y como dijo el Rey David (Salmos 30:3): “¡Oh Eterno, Di-s mio! Clame a Ti, y Tu me curaste”. Uno de los discipulos del maestro, autor de este libro, tuvo un grave accidente. En su espalda se abrio una honda herida, que dejo al descubierto su columna vertebral, casi hasta los rinones. Los"},{"id":"p57-b5","pageNumber":57,"indexInPage":5,"text":"medicos no podian curar la herida por distintas complicaciones e infecciones, y se desesperaron. Cuando llego el maestro a visitarlo y le conto la situacion, asi le dijo el maestro: “Hasta hoy, poco te aislaste con el Creador en una diaria plegaria personal, aparentemente el Creador quiere mas de ti. Si deseas vivir, empieza desde ahora a aislarte en plegaria por lo menos dos horas por dia”. El alumno obedecio al maestro."},{"id":"p57-b6","pageNumber":57,"indexInPage":6,"text":"Cada noche se acerco con la silla de ruedas al balcon del hospital, y durante unas cuantas horas pidio al Creador, en su propia lengua, que sus tejidos sean reconstituidos en el lugar descubierto. Poco a poco, ante el asombro de los medicos, empezo a formarse un nuevo tejido en su espalda, hasta que la herida cicatrizo y se sano completamente."},{"id":"p57-b7","pageNumber":57,"indexInPage":7,"text":"Un gran Justo solia decir: “Cuando los medicos desesperan al hombre diciendole que no hay curacion para su enfermedad, y, a pesar de eso, él se fortalece y pone toda su confianza en el Creador – entonces se le abren las puertas de la curacion y de la salvacion”... La explicacion de esto es que durante el tiempo que los medicos no desesperan al enfermo, le es dificil confiar unicamente en el Creador, y pone sus esperanzas en los medicos y en los medicamentos."},{"id":"p57-b8","pageNumber":57,"indexInPage":8,"text":"Por eso, no debe el hombre enfermo esperar que los medicos lo desesperen, sino que debe esforzarse desde el principio en confiar exclusivamente en el Todopoderoso. Cada minuto es importante El hombre enfermo debe aprovechar la situacion en que se encuentra para examinar sus acciones. Hay enfermos que estan acostados muchas horas, en los hospitales o en sus casas, sin hacer nada."},{"id":"p57-b9","pageNumber":57,"indexInPage":9,"text":"Ellos deben saber, que todo esto es dirigido desde lo Alto para que aprovechen esa situacion, en la que no estan atareados y ocupados en la carrera de la vida, usando el tiempo libre para hacer examen de conciencia. Mas aun, cuando por la enfermedad se debilitan los apetitos y el hombre tiene la posibilidad de reflexionar sobre la vida en forma objetiva. ¡Que terrible es el fenomeno por el que se le pone al enfermo un aparato de television frente a sus ojos!"},{"id":"p57-b10","pageNumber":57,"indexInPage":10,"text":"Desvia asi sus pensamientos y no se le da la posibilidad de hacer lo que el realmente debe hacer – ocuparse con el arrepentimiento, la plegaria y el examen de conciencia."}],"rawCharCount":4716},{"pageNumber":58,"blocks":[{"id":"p58-b0","pageNumber":58,"indexInPage":0,"text":"¡Que tengas éxito! El hombre que se enfermo y se conduce segun las reglas de la fe, logra una buena calificación en el Cielo y en este mundo. Logra arrepentirse de todos sus pecados al darse cuenta de ellos por el estimulo de su enfermedad; sale reforzado en su fe y conoce mejor al Creador; ciertamente logra una rapida convalecencia y una significativa elevacion espiritual. El merece el bien en este mundo y en el Mundo Venidero."},{"id":"p58-b1","pageNumber":58,"indexInPage":1,"text":"Contrariamente, al que le falta fe, cae en el miedo, la tristeza, la desesperacion y malos pensamientos sobre el Creador, como: ¿Por que merezco esto?, ¿que hice?... Un hombre como este no logra sacar ningun provecho de la enfermedad, y sus pesares y sufrimientos son muy grandes. Seguramente pone toda su confianza en los doctores y medicinas, y puede asi recibir grandes desilusiones. El hombre debe saber, que cuando logra triunfar en el examen de la fe, le da satisfaccion al Creador, dado que por la fe creo el mundo."},{"id":"p58-b2","pageNumber":58,"indexInPage":2,"text":"Con esto el hombre cumple la mision por la cual llego aqui; y por su intermedio lograra facilmente la completa curacion y un buena calificacion en la prueba de la fe. Cada persona – incluso la considerada “normal” – sufre de problemas emocionales en un cierto grado... Salud mental El alma y la fe poseen el mismo aspecto. Por consiguiente, la salud emocional, que es la salud mental del hombre, esta directamente relacionada con su nivel de fe."},{"id":"p58-b3","pageNumber":58,"indexInPage":3,"text":"De esto se desprende que cada perturbacion emocional es el resultado de falta de fe; cada confusion mental resulta de una fe confusa; cada deterioro emocional es el resultado del deterioro de la fe; cada debilidad del espiritu es debilidad de la fe. Esta es una regla basica para toda enfermedad mental. No nos referimos a deficiencias mentales de nacimiento como el sindrome de Down, el autismo, etc. Esas son el resultado de consideraciones Divinas y reencarnaciones de alma, ninguna de las cuales somos capaces de entender."},{"id":"p58-b4","pageNumber":58,"indexInPage":4,"text":"Pero, cuando vemos que una persona nace sana, pero a una edad posterior sucumbe a miedos, angustias, sentimiento de persecucion, depresion, y hasta esquizofrenia, o cualquier otra dificultad mental o emocional, la raiz del problema es la alteracion de fe. Pero he aqui las buenas noticias: si una persona emocionalmente desequilibrada aprendiera sobre la fe y rezaria para vivir segun la fe, se sanaria de su enfermedad."},{"id":"p58-b5","pageNumber":58,"indexInPage":5,"text":"Cuanto mas lograra rectificar y fortalecer su fe – podria corregir su espiritu, y disfrutar de la salud mental y emocional."},{"id":"p58-b6","pageNumber":58,"indexInPage":6,"text":"Cada persona – incluso la considerada “normal” – sufre de problemas emocionales en un cierto grado. Sumado a la tristeza, miedos, ansiedad y depresion, la gente siente aburrimiento, insatisfaccion, colera, preocupaciones, nerviosismo, fluctuaciones extremas de humor, etc., pero sin embargo, la fe cura todos estos problemas. ¿De qué hay que temer? Mucha gente sufre de angustia. Tienen miedo de otra gente, de sus jefes, del servicio de recaudacion de impuestos, de accidentes, de terroristas, de motoristas, etc."},{"id":"p58-b7","pageNumber":58,"indexInPage":7,"text":"Hay quienes se angustian por cada pequeno dolor que sienten y empiezan a imaginar que sufren una grave enfermedad. Todos esos miedos son expresiones de falta de fe, especialmente la falta de fe que “Todo es para bien”. Un hombre que posee fe, no teme a nada, ya que el sabe que esta bajo las manos del Creador, y que todo lo que El hace es para su bien. Entonces, ¿de que hay que temer? ¿Acaso han visto a un hombre al que le espera un hermoso regalo y se preocupa por eso?"},{"id":"p58-b8","pageNumber":58,"indexInPage":8,"text":"Segun la fe, cada cosa que ocurre es segun el Juicio Divino, no hay reglas naturales, y todo es para bien. Por lo tanto, el hombre que dedica una hora por dia a la autoevaluacion, al arrepentimiento y a la plegaria personal, no tiene que tener ningun miedo. Si una persona hacetodo lo posible para mejorarse, ¿por que deberia el Creador castigarle? Y tambien si algo le ocurre, es solo para bien, para estimularlo a entender y ver sus errores, que sin esto, no los hubiera visto."},{"id":"p58-b9","pageNumber":58,"indexInPage":9,"text":"El hombre que cada dia cumple una hora entera de “Aislamiento” con el Creador – pierde todos los miedos, pues confia que el Creador no lo castigara gratuitamente; tambien sabe que los miedos mismos son mandados desde lo Alto para estimularlo a arrepentirse. Por lo tanto, si el hombre se arrepiente por si mismo, no hay ninguna razon de intimidarlo y estimularlo. Estar contento Debemos saber que tambien la severidad y la meticulosidad exagerada en la observancia de la Ley Divina y los Preceptos, es una enajenacion."},{"id":"p58-b10","pageNumber":58,"indexInPage":10,"text":"Por lo tanto, el hombre no debe ser demasiado meticuloso consigo mismo. No debe preocuparse si cumplio perfectamente o no con un Precepto, solo debe hacer lo suyo con honestidad y con simplicidad de pensamiento e intencion, segun sus fuerzas. Debemos recordar que la Ley del Creador no fue dada a angeles, sino a seres humanos con limitaciones humanas. Aquellos que se exigen conducta angelical son candidatos a la frustracion, al rigor, y a la tristeza, que resultan de un sentimiento de arrogancia por el cual piensan que"}],"rawCharCount":4975},{"pageNumber":59,"blocks":[{"id":"p59-b0","pageNumber":59,"indexInPage":0,"text":"deben hacer todo a la perfeccion. Una persona honesta consigo misma esta contenta con lo que puede hacer, sin llegar a rigores extremos. Fe en los Sabios Enseno el gran Justo, el Rabi Najman de Breslev: “El que no obedece a los verdaderos Sabios, los Duenos del verdadero Conocimiento, puede volverse loco. Una persona actua locamente solo porque no cumple los consejos de los Sabios. Si los obedeciera, podria actuar normalmente."},{"id":"p59-b1","pageNumber":59,"indexInPage":1,"text":"Su estado mental podria racionalizar su necesidad de hacer tonterias como andar harapiento o revolverse en la basura u otras tonterias y locuras semejantes. Pero cuando un hombre que llego a ser dueno del verdadero Conocimiento le dice no hacer ciertas cosas – si solo aceptara su opinion, ciertamente se acabarian todas sus locas acciones. Encontramos, que la principal causa de la locura es debida a que el hombre no quiere escuchar y obedecer a los Sabios, y esto debe ser bien entendido”."},{"id":"p59-b2","pageNumber":59,"indexInPage":2,"text":"Aprendemos entonces, que cada uno debe obedecer a los duenos del verdadero Conocimiento, es decir a los que poseen la inteligencia de la fe a la perfeccion, estudiar sus palabras y rezar para llegar a cumplirlas. La creencia en sus palabras junto con la fe en el Creador es la clave del estado mental del hombre."},{"id":"p59-b3","pageNumber":59,"indexInPage":3,"text":"Y, principalmente, debemos obedecer y creer que el Creador nos supervisa y nos ama; que “Todo es para bien” y que “¡No existe ningun mal en el mundo!”; que el Creador no viene a nosotros con quejas; no espera que lleguemos al autentico arrepentimiento en un solo dia, sino que vayamos paso a paso y que progresemos segun nuestro propio ritmo. A decir verdad, todo este libro es una guia a la inteligencia de la fe, y por lo tanto, es un remedio para la salud mental."},{"id":"p59-b4","pageNumber":59,"indexInPage":4,"text":"El estudio de la Ley Divina Por medio del estudio intensivo de la Ley Divina, que contiene las Leyes de la vida, códigos morales y la Sabiduria Divina, el hombre logra salvarse de la locura, como a continuación explicaremos. Debemos saber que la Mala Inclinacion quiere transformar al hombre en un verdadero loco, y como han dicho los Sabios: “Un hombre no peca a menos que un espiritu de locura penetre en su cerebro”. Pero, ¿como le llega al hombre y lo vuelve loco de pronto?"},{"id":"p59-b5","pageNumber":59,"indexInPage":5,"text":"El camino de la Mala Inclinacion es disfrazarse primero de Preceptos y enganar al hombre como si cumpliera uno de ellos. Despues lo engana y lo seduce todavia mas, hasta que llega a cometer alevosamente graves pecados."},{"id":"p59-b6","pageNumber":59,"indexInPage":6,"text":"Este es en efecto, el aspecto de su locura – se confunde y pierde la razon hasta llegar a decir que el mal es bien y viceversa. No obstante, todavia hay en el unas chispas de razonamiento y conocimiento que, incluso con su estupidez y falta de razon, todavia entiende y sabe que hay ciertas cosas que no debe hacer, y a pesar de todo las hace. Para curar al hombre de las locuras de la Mala Inclinacion, se necesita derrotar primero su perfidia, para que no haga lo que el mismo entiende y sabe que es malo y una completa transgresion."},{"id":"p59-b7","pageNumber":59,"indexInPage":7,"text":"Tambien se le debe expulsar el mal espiritu, la tonteria, que se disfraza de Preceptos, lo engana y lo convence a cumplirlos como si lo fueran. Todo esto se logra a la perfeccion solo por medio del estudio reforzado de la Ley Divina que incluye esas dos acciones espirituales, y que dirige al hombre a comportarse como realmente debe ser, dandole una clara y recta vision de fe sobre el mundo y la Creacion entera. Lo esencial de la mente es que esté corregida para poder meditar por medio de los aceites del cuerpo."},{"id":"p59-b8","pageNumber":59,"indexInPage":8,"text":"Porque la mente es como la mecha encendida de la vela... Por malos pensamientos y muchos pensamientos pecaminosos, que Di-s nos guarde, el hombre se vuelve loco, como esta escrito (Likutey Moharan I, 60): \"…lo esencial de la mente es que este corregida para poder meditar por medio de los aceites del cuerpo. Porque la mente es como la mecha encendida de la vela por medio de los aceites que son atraidos por ella, y son (los pensamientos) como el aceite que es atraido por la mecha encendida."},{"id":"p59-b9","pageNumber":59,"indexInPage":9,"text":"Cuando no hay aceites en el cuerpo, no puede la mente estar encendida para meditar. Por esto se vuelven locos, porque se secaron los humores del cuerpo. Y por esto se corrompe el cerebro, porque no tiene los aceites necesarios para estar encendido. Es sabido, que la principal causa por la que se secan estos humores del cuerpo, es por medio del desenfreno sexual, es decir la eyaculacion del esperma en vano."},{"id":"p59-b10","pageNumber":59,"indexInPage":10,"text":"Y tanto mas mediante los muchos malos pensamientos y deseos de apetito sexual, que arruinan el cerebro todavia mas que el hecho mismo, como dijeron los Sabios (Tratado Yoma, 29): \"Mas graves son los pensamientos del pecado que el acto mismo\". El comienzo de la locura llega por medio de los dos intermediarios del pecado, que son los ojos. Todos los jovenes que salen de sus cabales y llegaron a la grave enfermedad, es por observar a las mujeres y todo tipo de diarios y peliculas"}],"rawCharCount":4830},{"pageNumber":60,"blocks":[{"id":"p60-b0","pageNumber":60,"indexInPage":0,"text":"basura etc. que Di-s nos salve, hasta que empiezan a quemarse en sus apetitos con completa locura. Y por supuesto que no encontraron desahogo al apetito que les quema, hasta que se les \"quema\" el cerebro, y sus mentes se lesionan, pobre de ellos. A veces lo que les da el ultimo empuje a su locura es el uso de todo tipo de drogas alucinantes."},{"id":"p60-b1","pageNumber":60,"indexInPage":1,"text":"Y aunque hay personas que estan hundidas en este apetito, y p
