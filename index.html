":"Es posible realizarlo parado, sentado o caminando, como se quiera, sin embargo esta recomendado caminar, pues la marcha inspira las palabras. Así se aconseja conversar: 1) Al principio, debemos tratar de agradecerle al Creador por todo lo que tenemos en la vida, por todas Sus maravillosas"},{"id":"p88-b6","pageNumber":88,"indexInPage":6,"text":"bendiciones que hemos recibido - nuestras buenas acciones, los Preceptos que logramos cumplir, por Su gran regalo del arrepentimiento, por el merito de estar hablando con El, por nuestra salud, familia, el pan de cada dia y hasta la ropa que tenemos puesta. No tomemos nada por sobrentendido. 2) Luego,Le contaremos todo lo que ocurrio en nuestra vida, desde nuestra ultima conversacion del dia anterior, hasta el momento presente. No omitiremos ningun detalle, especialmente en las cosas que nos alegraron y las que nos molestaron."},{"id":"p88-b7","pageNumber":88,"indexInPage":7,"text":"3) Despues le agradeceremos por toda buena accion que alcanzamos a realizar desde la ultima conversacion. 4) Empezaremos el \"Auto-juicio\" examinando si hemos cumplido nuestros actos con la perfeccion requerida o si podemos ser mejores la proxima vez. 5) Luego confesaremos nuestras fallas y transgresiones cumpliendo los \"Cuatro Pasos del Arrepentimiento\" que explicamos a continuacion. 6) Finalmente, aumentaremos nuestras plegarias al Creador sobre nuestras necesidades y privaciones, pidiendole que nos ayude en todo lo que necesitamos."},{"id":"p88-b8","pageNumber":88,"indexInPage":8,"text":"Gracias a las reglas del \"Auto-juicio\", el hombre sabe que sus defectos estánbajo la exacta Supervisión Divina y que su misión en esta reencarnación consiste en rectificarlas... Un hombre que empieza a acercarse al Creador y a arrepentirse, debe estudiar cuidadosamente las Siete Reglas del \"Auto-juicio\" mencionadas en el articulo anterior, y rezar para merecer observarlas, porque sin esas reglas, puede alejarse del Creador, justamente por su deseo de arrepentirse. ¿Por qué?"},{"id":"p88-b9","pageNumber":88,"indexInPage":9,"text":"Como hemos dicho, cuando el hombre comienza a aprender cual es la verdad y cuales deben ser sus cualidades y sus acciones, seobserva y se da cuenta de sus multiples defectos, de un especifico mal apetito o rasgo, y en ese caso, si no sabe como juzgarse segun las reglas mencionadas, caera enseguida en la desesperacion. La causa es que cree segun su razonamiento, que realizar el proceso del arrepentimiento significa culparse, perseguirse, y caer en la tristeza. Empieza a pensar que nunca podra cambiar y mejorar."},{"id":"p88-b10","pageNumber":88,"indexInPage":10,"text":"Desde luego, esos son los pensamientos de la Mala Inclinacion, pero gracias a las reglas del \"Auto-juicio\", sabe que esta insuficiencia o este defecto estanbajo la exacta Supervision Divina y que su mision en esta reencarnacion consiste en rectificarla. Entiende que la demora de su progreso espiritual es para su"}],"rawCharCount":4757},{"pageNumber":89,"blocks":[{"id":"p89-b0","pageNumber":89,"indexInPage":0,"text":"bien, hasta el momento que consiga las herramientas espirituales, por medio de la plegaria y el servicio al Creador, con las cuales lograra la completa rectificacion de su alma y la felicidad en este mundo y en el Mundo Venidero. Para que cada uno pueda aprender como aplicar esos principios sobre cualquier cosa que desea mejorar en su vida, tomemos como ejemplo a un hombre colericoque no consigue desembarazarse de su ira aunque lo desea."},{"id":"p89-b1","pageNumber":89,"indexInPage":1,"text":"Veamos como debe utilizar las Siete Reglas del \"Auto-juicio\" para corregir ese mal rasgo: 1) ¿Qué desea el Creador de mí? Cada vez que se juzga por su ira, o cada vez que fracasa por este mal rasgo, debe preguntarse: ¿Que es lo que desea el Creador de mi ahora - que caiga en la tristeza? ¿en la auto-persecucion?, ¿que resbale todavia mas profundamente en los abismos y en consecuencia no pueda corregir nada?"},{"id":"p89-b2","pageNumber":89,"indexInPage":2,"text":"¿O acaso El quiere que me fortalezca en la alegria, en la fe y en la esperanza y asi poder continuar haciendo buenas acciones segun mi capacidad, y tambien trabajar sobre la correccion de la ira? ¡Por supuesto que el Creador desea que me fortalezca en la alegria y que haga todo lo que esta en mi poder! Es posible entonces pasar a la proxima etapa: 2) El arrepentimiento."},{"id":"p89-b3","pageNumber":89,"indexInPage":3,"text":"El hombre debe conducirse segun los Siete Pasos del arrepentimiento, es decir que debe confesar su coleray sus consecuencias e intentar detallar sus enojos, debe expresar su remordimiento y pedir perdon. Cuando alcance la etapa del compromiso futuro, debera reconocer la realidad que todavia no puede comprometerse a no encolerizarse mas, porque ve que cada vez que se le presenta la oportunidad de perder la paciencia y enojarse, sucumbe y se olvida de todo, una vez tras otra."},{"id":"p89-b4","pageNumber":89,"indexInPage":4,"text":"Por lo tanto, debe ayudarse con la etapa siguiente: 3) ¡Debe creer que el Creador no le manda una prueba que no pueda superar! Es decir que debe creer que posee las fuerzas para desembarazarse de este defecto por medio del estudio y de la oracion. Y esta es la regla siguiente: 4) El estudio. Debe estudiar cada dia sobre la ira y sus perjuicios, y por otro lado, sobre la recompensa, lo conveniente de su dominacion y los consejos para superarla."},{"id":"p89-b5","pageNumber":89,"indexInPage":5,"text":"Es necesario estudiar en este libro lo que ensenamos sobre la colera, como en otros libros como \"El Libro de los Atributos\" en la seccion \"Ira\", en el libro \"Recoleccion de Consejos\", \"Recoleccion de Plegarias\" y otros. El hombre reunira asi una variedad de"},{"id":"p89-b6","pageNumber":89,"indexInPage":6,"text":"palabras para rezar y adquirir la sabiduria con la que podra superar su colera. 5) La plegaria. Cada dia debe dedicar tiempo para rezar por la eliminacion de su colera; ¡y debe creer con completa fe que mediante la plegaria puede reparar todo! Cuando el hombre aumenta sus oraciones sobre un tema en particular, vera con sus propios ojos como progresa y como en la mayoria de los casos en que fallo en el pasado, ya no son mas pruebas para el."},{"id":"p89-b7","pageNumber":89,"indexInPage":7,"text":"Es necesario que se acuerde que en todos los trabajos que debe realizar y en particular en el trabajo sobre la ira, lo esencial de la plegaria debe ser sobre la fe. Debe pedirle al Creador que le de una fe perfecta, porque la colera proviene solo de falta de fe, como lo explicaremos extensamente en el capitulo sexto. 6) Pedir un regalo inmerecido. Si el hombre multiplico considerablemente sus plegarias, y todavia fracasa y cae en la ira, debera siempre acordarse que el Creador no le debe nada."},{"id":"p89-b8","pageNumber":89,"indexInPage":8,"text":"Continuara pidiendo y rogando por un regalo, aunque no lo merezca, con piedad y misericordia. Asi nunca se impacientara, ni se desesperara y ni disminuira su plegaria. Finalmente, con certeza lograra, como muchos otros que cumplieron estas reglas con simpleza, aniquilar completamente el mal rasgo de la colera. 7) Agradecimiento y gratitud. Agradecera cada dia al Creador por el hecho de tener el merito de rezar sobre su colera."},{"id":"p89-b9","pageNumber":89,"indexInPage":9,"text":"Debe agradecerle por cada prueba de ira que pudo superar, aunque no sea en forma completa y solo consiguio atenuarla un poco. Para concluir, debe agradecerle al Creador, sobre todo, lo que logra mejorar y asi se fortalecera para seguir con su trabajo, y el Creador lo ayudara, pues El ve que siente verdadera gratitud. Muchos de nosotros queremos cambiar, corregirnos, sin embargo esperamos que todo suceda automáticamente, sin ningún esfuerzo de nuestra parte... Cierta vez, un grupo de amigos salieron de excursion."},{"id":"p89-b10","pageNumber":89,"indexInPage":10,"text":"En el camino, vieron a un hombre con su mochila parado en el medio de una desolada encrucijada. Unos dias despues, en camino de vuelta a casa, encontraron de nuevo al mismo hombre con su mochila en la desolada encrucijada en pleno calor del dia. Los amigos lo interrogaron: \"¿Por que estas parado aqui?\" \"Quiero llegar a la gran ciudad\", les contesto. \"¿Cuantos dias hace que estas parado aqui?”, le preguntaron. \"Mas de una semana\", les respondio. Se rieron. \"¿Tantos dias estas aqui parado con la esperanza de llegar a la gran"}],"rawCharCount":4821},{"pageNumber":90,"blocks":[{"id":"p90-b0","pageNumber":90,"indexInPage":0,"text":"ciudad? ¡Si hubieras comenzado a caminar, incluso arrastrandote, ya podrias haber llegado alla hace tiempo...!\" Muchos de nosotros queremos cambiar, corregirnos, sin embargo esperamos que todo suceda automaticamente, sin ningun esfuerzo de nuestra parte. Esto se parece al hombre parado en el medio de la encrucijada esperando llegar a la gran ciudad sin andar ni un solo paso hacia su destino."},{"id":"p90-b1","pageNumber":90,"indexInPage":1,"text":"Hay una expresion popular que dice: \"¡Incluso un viaje de mil kilometros empieza con un primer paso!\" - aunque a veces el camino es largo, hay que comenzar a andar para llegar a la meta. El primer paso en el camino del arrepentimiento y de la rectificacion del alma, consiste en consagrar por lo menos sesenta minutos diarios al examen de conciencia y de plegaria personal."},{"id":"p90-b2","pageNumber":90,"indexInPage":2,"text":"Un hombre que quiere cambiar debe dedicar esa hora cada dia, en la cual juzgara sus acciones y anhelos segun las reglas del \"Auto-juicio\", rezara sobre cada detalle de su vida que necesita correccion, agradecera por lo que ya logro, y rezara para poder continuar haciendolo. Un hombre que quiere arrepentirse y corregir sus acciones, pero no consagra el tiempo necesario para el \"Auto-juicio\" y plegaria personal, es comparable a aquel que quiere llegar a un cierto lugar sin dar el primer paso. ¡No te enganes!"},{"id":"p90-b3","pageNumber":90,"indexInPage":3,"text":"¡El arrepentimiento, es decir el examen de conciencia diario y la oracion, son las unicas herramientas practicas que posee el hombre para corregir sus defectos, suprimir sus apetitos, alejarse de todas las transgresiones y llegar a la verdadera felicidad y paz interna! Aunque el hombre tenga la diaria costumbre de leer sus oraciones de un libro de rezos, incluso varias veces por dia, no debe contentarse con ello, porque pocos son los que tienen el merito de hacerlo dirigiendo su corazon como es debido."},{"id":"p90-b4","pageNumber":90,"indexInPage":4,"text":"Pero hasta quien reza con completa intencion, toda su demanda se reduce finalmente a unas lineas. ¿Como puede esperar entonces cambiar y arrepentirse pronunciando solo unas pocas palabras? Tanto mas que los acontecimientos con los cuales el hombre esta confrontado dia tras dia, como la busqueda de pareja, la paz domestica, las cualidades morales, y con mas razon, las pruebas que afronta para las cuales la plegaria es tan necesaria, no encuentran ninguna expresion en el tradicional libro de oraciones."},{"id":"p90-b5","pageNumber":90,"indexInPage":5,"text":"Ademas, es sabido que los Justos de todas las generaciones anadieron sus propias plegarias a las oraciones fijas que recitaban"},{"id":"p90-b6","pageNumber":90,"indexInPage":6,"text":"largamente, y que pronunciaban palabra por palabra con todo su corazon. Cada uno deducira de los Justos esta regla: si ellos aumentaron tanto sus plegarias, anadiendo numerosas suplicas y peticiones para lograr la correccion del alma, cuanto mas alguien como yo, que no soy tan justo, debiera anadir oraciones para merecer conducirme según la voluntad Divina. Ciertamente que no me contentare con las pocas lineas de oracion que se encuentra en el libro de rezos, las que no logro decir con la adecuada intencion."},{"id":"p90-b7","pageNumber":90,"indexInPage":7,"text":"Por lo tanto, el hombre no debe contentarse con las tradicionales oraciones escritas, sino que debe acostumbrarse a rezar una plegaria personal diaria en la que rogara al Creador desde lo mas profundo de su corazon, y ciertamente sus plegarias y peticiones serian atendidas."},{"id":"p90-b8","pageNumber":90,"indexInPage":8,"text":"El hombre afortunado, que ha descubierto el secreto de la buena vida no podrá pasar ni un día sin la plegaria, por cierto rezará por todas sus necesidades, materiales y espirituales… Rezar por la plegaria Un hombre que se despierta y quiere comenzar a juzgarse y a rezar sobre todos los acontecimientos de su vida, debe saber que tambien sobre eso es necesario rezar."},{"id":"p90-b9","pageNumber":90,"indexInPage":9,"text":"Debe pedirle al Creador que le de el merito de realizar el \"Aislamiento\", la plegaria personal, y juzgarse como es debido toda la vida, pues la rectificacion de su alma depende de eso."},{"id":"p90-b10","pageNumber":90,"indexInPage":10,"text":"Un buen consejo consiste en comenzar cada dia la hora de \"Aislamiento\" con cinco minutos dedicados a si mismo, pidiendole al Creador que le de el merito de rezar como es debido; que ponga en sus labios las palabras adecuadas para poder expresarse; tener el merito de agradecerle por todo, el merito de arrepentirse por todas sus fallas y transgresiones y el merito de aumentar sus plegarias sobre todas sus privaciones, puesto que todas ellas provienen solo de la falta de oracion."},{"id":"p90-b11","pageNumber":90,"indexInPage":11,"text":"Ademas, debe pedirle al Creador: \"Déjame merecer creer en mi plegaria, que puedo, por medio de ella, conseguir toda la salvación que necesito, corregir todo lo que debo, y colmar todas mis carencias. Déjame merecer ocuparme cada día con la plegaria y juzgar cada detalle de mi vida, con el auténtico 'Auto-juicio'. Déjeme merecer agradecerte mucho, creer que todo esta bajo Tu Supervisión, y que todo es siempre para bien. Ayúdame a creer que Tú nunca me mandas una prueba que no puedo supera si rezo por ella."},{"id":"p90-b12","pageNumber":90,"indexInPage":12,"text":"Déjame siempre recordar que el único consejo que tengo en"}],"rawCharCount":4802},{"pageNumber":91,"blocks":[{"id":"p91-b0","pageNumber":91,"indexInPage":0,"text":"la vida es la plegaria, y que siempre Te pida sólo un regalo sin sentir que me debes algo...\" Cuando el hombre reza cada dia unos cuantos minutos para recibir el merito de aislarse en plegaria y de juzgarse como es debido - lo lograra, y asi todos los Juicios severos que hay en el Cielo en su contra se anularan, y su vida se transformara en una vida dulce, maravillosa y bella."},{"id":"p91-b1","pageNumber":91,"indexInPage":1,"text":"Esta es una regla esencial en el servicio al Creador: cuando se quiere emprender la realizacion de cualquier Precepto o buena conducta, se necesita prolongar la plegaria. Porque es muy probable que se conduzca segun el principio de \"Con mi propia fuerza y el poder de mi mano\", colmandose de orgullo y de autosuficiencia, lo que lo alejara del Creador mas que si se abstuviera de hacerlo."},{"id":"p91-b2","pageNumber":91,"indexInPage":2,"text":"Por lo tanto, el hombre no recibe un \"permiso Divino\" para cumplir cualquier accion antes de asegurarse que ha rezado lo suficiente, de modo que si recibe el nivel que pide, no se enorgullecera por ello. Porque quien recibe algo despues de muchas oraciones, sabe muy bien que es un don Celestial, y no siente ni el menor orgullo ni la sensacion de haberlo obtenido por su propia fuerza."},{"id":"p91-b3","pageNumber":91,"indexInPage":3,"text":"Y a esto, y solo a esto, se llama exito, pues al haber alcanzado el mas alto de los niveles sigue viviendo con la fe que todo proviene del Creador, y que \"No hay mas nada fuera de El\". El secreto de la buena vida Ya mencionamos la siguiente regla: \"Siempre que hay una carencia - o no se rezo nada sobre ella, o se rezo poco\"."},{"id":"p91-b4","pageNumber":91,"indexInPage":4,"text":"Este dicho contiene el secreto de la buena vida: puesto que la falta de plegaria es la causa de toda privacion, con la plegaria sobre cada detalle de su vida podra el hombre lograr literalmente cualquier cosa y suplir todas sus necesidades, tanto materiales como espirituales. ¡Sin embargo, increiblemente, hay mucha gente que no reza en absoluto! Estas personas que dicen que no tienen el tiempo necesario para hacerlo. ¿A que se parecen? al hijo del Rey que va desharrapado, sucio, lastimado y hambriento."},{"id":"p91-b5","pageNumber":91,"indexInPage":5,"text":"La gente lo ve acostado sobre un banco del parque y le pregunta: \"¿Acaso no eres el principe, el hijo del Rey que gobierna todo los paises y es dueno de toda riqueza\"? \"Si\" contesta, \"soy yo\". Cuando la gente asombrada le pregunta: \"Entonces, ¿por que andas asi? ¿Por que no pides a tu padre, Su Majestad, que te ayude, que te de ropa decente, comida y todo lo que te es necesario?\" ¿Saben cual es la respuesta de este necio? - \"No"},{"id":"p91-b6","pageNumber":91,"indexInPage":6,"text":"tengo tiempo...\" Asi exactamente se parece el hombre que no reza y sigue sufriendo numerosas privaciones - problemas de subsistencia, paz domestica, malos rasgos, apetitos, tristeza, pereza, etc. Y cuando se lo interroga: \"¿Por que no le pides a tu Padre en el Cielo, el Rey del Universo, que colme todas tus privaciones?\", el responde: \"No tengo tiempo\"… El hombre afortunado, que ha descubierto el secreto de la buena vida no podra pasar ni un dia sin la plegaria, por cierto rezara por todas sus necesidades, materiales y espirituales."},{"id":"p91-b7","pageNumber":91,"indexInPage":7,"text":"En realidad, es necesario que lo esencial de su oracion sea sobre su espiritualidad y en consecuencia, tambien sus otras privaciones seran colmadas. Debera rogar por cada detalle de su servicio al Creador: sobre su propia plegaria - poder rezar con alegria, dirigiendo su corazon hacia El, sobre su agradecimiento por todo lo que le da el Creador."},{"id":"p91-b8","pageNumber":91,"indexInPage":8,"text":"Tambien sobre la preservacion de su mirada y juzgarse si se defiende verdaderamente de mirar lo que no es adecuado, si observa el Precepto de no codiciar o envidiar lo que pertenece a su projimo, etc. Asi, debe analizar cada dia que pasa y rogar sobre cada detalle de su trabajo espiritual y de su comportamiento con los demas, aumentando sus oraciones hasta lograr colmar todas sus insuficiencias."},{"id":"p91-b9","pageNumber":91,"indexInPage":9,"text":"Cuanto mas reza el hombre, mas se acerca al Creador, y cuanto mas es la proximidad que tiene con el Creador, mas iluminada esta su alma; cuanto mas iluminada esta su alma - mas feliz se siente. Este es esencialmente el secreto de la buena vida. Pero no solo eso... Gracias a su correcto \"Auto-juicio\" segun las reglas que aprendimos, el hombre podra usar sus propias faltas y caidas para acercarse al Creador y lograr asi salir inocente cada dia del Juicio Celeste."},{"id":"p91-b10","pageNumber":91,"indexInPage":10,"text":"Incluso despues de su muerte sera declarado inocente y merecera entrar directamente al Paraiso. Cada petición al Todopoderoso debe ser detallada, hay que explicar con precisión qué es lo requerido… A la luz de todo lo que aprendimos en los ultimos articulos, la conclusion que se impone es que lo esencial sobre lo cual el hombre debe rezar, es la fe. Es importante saber que cuando el hombre reza y pide alguna cosa al Creador, su peticion debe ser bien detallada, explicando todos los diferentes aspectos de lo requerido."},{"id":"p91-b11","pageNumber":91,"indexInPage":11,"text":"Lo aclaremos por medio de la historia siguiente: Cierta vez un hombre que iba por un largo camino en el desierto, extenuado por la larga marcha, se echo a"}],"rawCharCount":4842},{"pageNumber":92,"blocks":[{"id":"p92-b0","pageNumber":92,"indexInPage":0,"text":"rezar: \"Dueño del Universo, por favor... dame un asno\", sin detallar que lo necesitaba para montarlo. Mientras rezaba, paso cerca de el una caravana, una de cuyas burras acababa de dar a luz un asnillo. Los viajeros de la caravana estaban muy apurados y no sabian que hacer con el pequeno asno, que no podia levantarse sobre sus patas y los retrasaba. Cuando pasaron cerca del hombre y escucharon su oracion, se regocijaron por la excelente oportunidad de desembarazarse del borrico, y se lo dieron graciosamente de regalo."},{"id":"p92-b1","pageNumber":92,"indexInPage":1,"text":"La caravana prosiguio rapidamente su camino, dejando al asombrado hombre detras de ellos. Por un lado, el hombre presencio como su plegaria fue atendida en un abrir y cerrar de ojos, pero por otro lado, su intencion al rezar por un asno no era un borrico recien nacido. Ahora le fue agregado a su ya dificil camino, un pequeno asno para cargar sobre sus hombros..."},{"id":"p92-b2","pageNumber":92,"indexInPage":2,"text":"En efecto la plegaria de este pasajero fue oida, y recibio un asno como habia pedido, pero en lugar de montar al asno, fueel asno el que montaba sobre el, debido a que no habia detallado biensu plegaria. Cada peticion al Todopoderoso debe ser detallada, hay que explicar con precision que es lo requerido. Por lo tanto, tambien cuando el hombre pide fe al Creador, debe detallar su peticion. Incluso si solo pidiera y repitiera su peticion con las mismas palabras, diciendo por ejemplo: \"Señor del Mundo, dame fe."},{"id":"p92-b3","pageNumber":92,"indexInPage":3,"text":"Señor del Mundo, dame fe\" - esta muy bien, pero no se compara a la plegaria del hombre que detalla su pedido, rogando por cada detalle de la fe y sus varios aspectos. Una plegaria bien detallada es bella y enriquecida con gracia, color y contenido; el hombre puede anadir a ella nuevos elementos cada vez. En efecto, a primera vista podemos preguntarnos: ¿por que la oracion es necesaria? ¿Para que tenemos que rezar si el Creador sabe todos nuestros pensamientos y sabe exactamente todo lo que necesitamos?"},{"id":"p92-b4","pageNumber":92,"indexInPage":4,"text":"La respuesta es la siguiente: en verdad el Creador sabe todo, pero nos da el regalo de la plegaria para que tengamos una viviente relacion con El y para que desarrollemos nuestra fe. Si todas nuestras necesidades fueran colmadas automaticamente, nunca nos dirigiriamos al Creador y nunca trabajariamos sobre nuestra fe, lo que provocaria que nuestra alma se marchite. La plegaria es el receptaculo de la abundancia Divina. La abundancia que se recibe es proporcional a las palabras de rezo pronunciadas. Por eso, cuando se reza"},{"id":"p92-b5","pageNumber":92,"indexInPage":5,"text":"con limitacion de palabras, en forma seca y cortante, tambien lo que se recibe sera una cosa limitada y reducida; asi como ese pasajero que pidio un asno sin explicar su necesidad y recibio exactamente lo que pidio, que no le sirvio para nada. En cambio, cuando la plegaria es bien detallada, tambien lo que se recibe en consecuencia es completo y elaborado. Es necesario pues prolongar nuestras plegarias, multiplicando y variando nuestras palabras con el fin de recibir algo pleno y completo."},{"id":"p92-b6","pageNumber":92,"indexInPage":6,"text":"Llevar a la práctica Para que podamos rezar largas plegarias, variadas y ricas en contenido, debemos sentir un gran deseo de adquirir la cosa requerida. Por consiguiente, debemos estudiar bien el asunto sobre el cual queremos rezar, con el fin de conocer sus cualidades, tanto como los danos que resultan por su falta; y esto hasta entender bien cuanto depende nuestra vida de ello. Es entonces cuando nuestro corazon verdaderamente anhela lo deseado, que nuestras plegarias seran bien detalladas."},{"id":"p92-b7","pageNumber":92,"indexInPage":7,"text":"Asi pues, cuando deseamos rezar por nuestra fe, es necesario estudiar y volver a estudiar este libro muy bien; meditar sobre la importancia de cada principio, de cada nivel, de cada prueba estudiada, y asi seguramente podremos rezar con entusiasmo y con voluntad - y tambien podremos detallar y precisar las plegarias hasta que nuestros deseos se hagan realidad. Tomemos un ejemplo: cuando se estudia los niveles de la fe, debemos pedirle al Creador que nos ayude a profundizar y cumplir cada etapa de nuestro estudio."},{"id":"p92-b8","pageNumber":92,"indexInPage":8,"text":"Una vez que aprendemos sobre el primer nivel de la fe, a saber, la creencia que todo en el mundo es producto de la Divina voluntad, debemos luego incorporar todo lo estudiado en nuestras plegarias, detallando todos los aspectos que conciernen a este nivel; y le pediremos al Todopoderoso de esta forma: \"Creador del Universo, dame por favor una fe completa."},{"id":"p92-b9","pageNumber":92,"indexInPage":9,"text":"Ayúdame a creer que Tú eres el Dueño de todas las acciones, que toda acción en el mundo está bajo Tu precisa Divina Supervisión.\" Tambien, debemos rezar para creer que todas las pruebas que nos llegan en la vida provienen de la voluntad Divina, y hay que detallar explicitamente; por ejemplo: \"Señor del Mundo, ayúdame a entender que cuando mi esposa me grita, eres sólo Tú Quien está enfrente mío..."},{"id":"p92-b10","pageNumber":92,"indexInPage":10,"text":"Déjame creer que eres Tú Quien me reprende - no mi esposa, así no me enfadaré y arruinaré la paz domestica...\" o \"Ayúdame, Amo del Universo, a entender"}],"rawCharCount":4851},{"pageNumber":93,"blocks":[{"id":"p93-b0","pageNumber":93,"indexInPage":0,"text":"que mi falta de éxito en el trabajo es porque Tú lo quieres y ayúdame a no atribuirlo a ninguna causa natural..\", y asi sucesivamente. Cuando estudiamos sobre el segundo nivel de la fe, que es la creencia que todo lo que el Creador hace es para bien, podemos crear un nuevo receptaculo de Divina abundancia por medio del rezo. Podemos llenar nuestra boca con las palabras aprendidas en esta seccion: \"¡Dueño del Universo!"},{"id":"p93-b1","pageNumber":93,"indexInPage":1,"text":"Dame la clara fe que 'Todo es para bien', ayúdame a dejar de lado mi propio razonamiento y creer con perfecta fe; que si me parece que lo que me llega es malo y terrible, rechace ese pensamiento que sólo me conduce a la desesperación, y creer con una fe perfecta que también esto es lo mejor que puede suceder; que acepte todo con alegría y amor y que sepa que no existe ningún mal en el mundo porque todo proviene de Ti.\" Tambien, debemos detallar todas las pruebas que nos llegan, y rezar que podamos creer que todas son para nuestro propio bien."},{"id":"p93-b2","pageNumber":93,"indexInPage":2,"text":"De esta manera tambien estudiaremos el tercer nivel, y rezaremos para creer completamente que no hay sufrimientos ni tribulaciones sin transgresiones, y que en todo lo que nos sucede hay un mensaje del Creador."},{"id":"p93-b3","pageNumber":93,"indexInPage":3,"text":"Igualmente en cada capitulo estudiado, por ejemplo, en el capitulo sobre las pruebas de la fe, debemos rezar por las pruebas que nos son relevantes, como la paz domestica; debemos rezar que tengamos el merito de cumplir todo lo que hemos estudiado; que no nos olvidaremos ni por un solo instante que nos encontramos en una prueba de fe; que debemos dominar nuestra colera y creer que \"Todo es para bien\"."},{"id":"p93-b4","pageNumber":93,"indexInPage":4,"text":"Tambien debemos rogar al Creador y hasta suplicarle con todo tipo de expresiones y pedidos, que tenga misericordia y que nos haga merecer tal nivel o tal cualidad, y que nos salve de toda falta de fe. Otra cosa importante es que detallemos en nuestra plegaria las distintas cualidades y virtudes de la fe, cuanto es importante a los ojos del Creador y cuantos beneficios mereceremos si la adquirimos. Y tambien a la inversa - es importante que detallemos todas las perdidas que nos llegan por la falta de fe y los perjuicios que arrastra."},{"id":"p93-b5","pageNumber":93,"indexInPage":5,"text":"Por supuesto que hay numerosos detalles mas, que cada uno puede comprender y utilizar en su plegaria. Cuando el hombre reza de esta forma sobre lo que aprendio detalladamente, tendra siempre lo que decir y podra prolongar su oracion con mucho placer, mereciendo cumplir lo que aprendio. La gracia"},{"id":"p93-b6","pageNumber":93,"indexInPage":6,"text":"de la plegaria La aplicacion practica de la fe es la motivacion mas elevada del estudio de la Ley Divina. Por lo tanto, las plegarias compuestas de nuestro estudio espiritual estan llenas de gracia y hermosura, y el Creador las ama especialmente,pues demuestran el verdadero deseo de interiorizar la fe y aplicarlas en la vida diaria. Estaes tambien la razon por la cual son aceptadas facilmente."},{"id":"p93-b7","pageNumber":93,"indexInPage":7,"text":"¡Mediante el estudio de la fe y luego su conversion en plegarias, nos aseguramos adquirir mas y mas fe, que es el secreto del exito y la felicidad en este mundo y en el venidero! La fe depende de la boca del hombre."},{"id":"p93-b8","pageNumber":93,"indexInPage":8,"text":"Cuando alguien quiere reforzarla o recuperarse de una caída, el consejo es que pronuncie palabras de fe según su comprensión… Consejos adicionales para lograr la fe: Clamor Cuando la fe es deficiente, podemos lograrla clamando al Creador, como ha hecho el Rey David, como esta escrito (Salmos 27:7): \"Oh Eterno, oye mi voz cuando clamo\". Gracias al clamor al Creador, podemos elevar y aumentar nuestra fe hasta la desaparicion de todos nuestros pensamientos de herejia."},{"id":"p93-b9","pageNumber":93,"indexInPage":9,"text":"Y aunque no lo logremos inmediatamente, el clamor en si mismo es beneficioso. Tal clamor no debe ser necesariamente audible, incluso un clamor silencioso expresado dentro del corazon es bueno. El hecho que el hombre clama al Creador, aun desde su corazon, demuestra que todavia tiene una chispa de la sagrada fe, porque sin esta, no clamaria en absoluto. Esto demuestra, que el clamor mismo es una expresion de fe, por el cual la pequena chispa se transforma en una luminosa llama de fe."},{"id":"p93-b10","pageNumber":93,"indexInPage":10,"text":"Pronunciando palabras de fe La fe depende de la boca del hombre. Cuando alguien quiere reforzarla o recuperarse de una caida, el consejo es que pronuncie palabras de fe segun su comprension, como esta escrito en los Salmos (89:2): \"Proclamare Tu fe con mi boca\", es decir que es necesario expresar la fe con los labios."},{"id":"p93-b11","pageNumber":93,"indexInPage":11,"text":"Cuando el hombre comprueba un relajamiento en su fe, sintiendose en la oscuridad y teniendo dificultades para sentir la presencia del Creador, debe expresar palabras de fe y decir claramente:\"Yo creo con fe completa que el Creador es Unico e incomparable; que El me ve, me protege, me supervisa en cada minuto del dia durante toda mi vida; El me ama siempre, en toda circunstancia, y El escucha mis plegarias constantemente\". Cada uno debe continuar pronunciando palabras de fe con el fin de reforzarse, segun el tema que"}],"rawCharCount":4824},{"pageNumber":94,"blocks":[{"id":"p94-b0","pageNumber":94,"indexInPage":0,"text":"quiere consolidar, por ejemplo: \"Yo creo que el Creador, es el Unico que alimenta y sostiene a todas las criaturas. Estoy seguro que me enviara mi sustento\"; o \"Yo creo que el Creador es el Medico de toda carne, y el Unico que me puede curar\"; o \"Yo creo que el Creador es el Unico que me pueda dar el consejo correcto para tal o cual problema\", etc. Cuando pronunciamos palabras de fe, se despierta la chispa de la autentica fe que esta presente en cada ser humano, y entonces merecemos adquirirla. (Expansion del Alma, 45)."},{"id":"p94-b1","pageNumber":94,"indexInPage":1,"text":"Pronunciando palabras de fe, estimulamos la chispa que tenemos dentro, la cual enciende una radiante llama de fe que no solo calienta el alma e ilumina nuestra oscuridad interna, sino que invoca tambien la Divina Compasion. Por el contrario, hay que tener mucho cuidado de no proferir ninguna palabra de herejia o de incredulidad, ni en sorna, es decir que aunque la persona es creyente dentro de su corazon, y solo dice una expresion de herejia para burlarse del hereje, es tambien danino a su fe."},{"id":"p94-b2","pageNumber":94,"indexInPage":2,"text":"Las palabras de herejia o agnosticismo sean cuales fueran, extinguen la chispa de la fe y dejan el alma del hombre fria y oscura. El \"Auto-juicio\" Ya hemos mencionado anteriormente el \"Auto-juicio\", pero es importante saber que su realizacion es tambien muy aconsejable para alcanzar la fe, es decir la costumbre de juzgarse cada dia por cada pensamiento, palabra oaccion y preguntarse si es apropiado conducirse asi o no."},{"id":"p94-b3","pageNumber":94,"indexInPage":3,"text":"Juzgandonos sobre todo,con la creencia que el Creador nos ve y vigila nuestras acciones, implanta la fe dentro nuestros corazones. El hombre temeroso de Di-s, ciertamente no dejara que el Creador lo juzgue por cada uno de sus pensamientos, palabras y acciones. Por consiguiente, eladelantara su \"Auto-juicio\", se confesara, arrepentira, pedira perdon por todo, y corregira sus acciones, sin esperar un Juicio Divino."},{"id":"p94-b4","pageNumber":94,"indexInPage":4,"text":"Pero, el que no se juzga, demuestra de esta manera que se siente como \"su propio dueno\", y que no tiene que rendir cuentas a nadie. Esto demuestra una gran falta de fe, porque segun la fe, hay un Orden, un Juicio y un Juez. El simple \"Temor al castigo\" es el fundamento de la fe. Sin esto, no puede existir la autentica fe. Y lo mas importante, sin esto no podremos alcanzar el \"Temor a la grandeza del Creador\", que representa el nivel mas alto del \"Temor a Di-s\", al que hay que aspirar y que es lo esencial de la fe."},{"id":"p94-b5","pageNumber":94,"indexInPage":5,"text":"Sin embargo, cuando el hombre se esfuerza por conducirse"},{"id":"p94-b6","pageNumber":94,"indexInPage":6,"text":"segun el basico \"Temor a Di-s\", que es el \"Temor al castigo\" y que se manifiesta juzgandose una vez al dia sobre todo lo pasado enel dia anterior, la fe echa raices en el y asi puede tambien llegar a una fe tangible, y finalmente, al \"Temor a la grandeza del Creador\". Conviene aqui recordar y advertir de nuevo al estimado lector, que esta prohibido caer en la tristeza a causa del \"Auto-juicio\"."},{"id":"p94-b7","pageNumber":94,"indexInPage":7,"text":"Tan pronto alguien percibe que su \"Auto-juicio\" lo lleva a la tristeza, debe detener todo, y rezar por la fe y la alegria, con el fin de creer que todo esta bajo la Supervision Divina para bien; hasta sus faltas espirituales estan debajo de ella, segun su mision en este mundo. La razon por la cual no consigue corregirlas por ahora, es debido a que el Creador quiere que aumente sus plegarias. Sólo cuando este alegre, podra seguir juzgandose. Un dicho popular dice que una piedra que tira el tonto al pozo, cien sabios no podrán sacar."},{"id":"p94-b8","pageNumber":94,"indexInPage":8,"text":"La fuerza de la palabra escrita, especialmente de la herética palabra escrita, es que… Consejos adicionales para lograr la fe – Parte 2: Evitar la lectura de filosofía y herejía A menudo hemos comparado la fe a una llama o a una titilante vela en el corazon. La fe es dificil de adquirir pero facil de destruir. La fe se parece tambien a una bella lampara de luces de cristal, hecha a mano durante meses de trabajo tedioso."},{"id":"p94-b9","pageNumber":94,"indexInPage":9,"text":"Con un empujon del codo, la lampara podra caer desde la mesa de trabajo del artesano, y en un solo segundo, se hara anicos en millones de diminutos pedacitos. Un dicho popular dice que una piedra que tira el tonto al pozo, cien sabios no podran sacar. La fuerza de la palabra escrita, especialmente de la heretica palabra escrita, es que penetra en el corazon mas rapido que una espada, destruyendo la fe. Cada hombre nace con impulso a la maldad, es decir a los malos deseos mundanos, esto es parte de la naturaleza humana."},{"id":"p94-b10","pageNumber":94,"indexInPage":10,"text":"Pero, por medio del \"Temor al castigo\" el hombre quiebra sus apetitos y entra en el camino del Creador. Pero cuando estudia doctrinas hereticas, se encuentra con dudas e ideas que apoyan su maldad natural. El resultado de dirigirse a la filosofia o a libros de investigacion para buscar argumentos logicos y evidencias de la existencia del Creador, conduce a la confusion y al eventual colapso de la fe."},{"id":"p94-b11","pageNumber":94,"indexInPage":11,"text":"Cuando nuestra fe es dependiente del poder de nuestro intelecto, estamos peligrosamente expuestos a ideas y opiniones de aquellos que saben como"}],"rawCharCount":4864},{"pageNumber":95,"blocks":[{"id":"p95-b0","pageNumber":95,"indexInPage":0,"text":"presentar argumentos mejor quenosotros, y nuestra fe esta propensa a ser destruida. ¡Por esta razon, el sendero de la autentica fe a seguir, es de \"Por un Maestro a su discipulo\", pasando de uno a otro la sencilla fe en el Creador del Universo, Di-s Todopoderoso, en una cadena continua que llega hasta el dia de hoy, desde la Gran Revelacion del Creador Mismo en el Monte Sinai, en el unico y exclusivo acontecimiento de la historia humana, en elcual entrego Su Ley Eterna a un pueblo entero, en presencia de millones de personas."},{"id":"p95-b1","pageNumber":95,"indexInPage":1,"text":"Debemos abstenernos de todo tipo de informacion heretica – no solamente por medio de libros que debilitan la fe, sino tambien por todo tipo de multimedia – radio, television, internet, periodicos, etc. – programada y publicada por aquellos que difunden ideas y perspectivas agnosticas y ateas. Aprender por uno de esos medios de comunicacion que las difunden, se parece a invitar a un hereje a dar una predica en tu casa..."},{"id":"p95-b2","pageNumber":95,"indexInPage":2,"text":"Podemos comparar la media heretica a una envenenada comida para el alma, solo que los malos pensamientos penetran al alma por medio de los oidos, el corazon, los ojos, y la mente mucho mas rapido que una comida envenenada entra al cuerpo humano. El que fallo y leyo los conceptos hereticos de libros que contradicen a la fe, debe confesarse frente del Creador, pedir Su perdon y desde ese momento en adelante no estudiara o no tendra mas ningun contacto con tales ideas."},{"id":"p95-b3","pageNumber":95,"indexInPage":3,"text":"Es importante que Le ruegue al Creador que elimine de el la mala influencia que recibio, y que le ayude a adquirir de nuevo la fe que ha perdido... El estudio de la fe El estudio de la fe quiebra toda herejia y la incredulidad que posee el hombre en su corazon. En general, la gente interpreta la herejia y el ateismo como la absoluta negacion de la existencia del Creador; esto no es correcto. En realidad, tambien el que cree en la existencia del Creador puede sostener numerosas opiniones y pensamientos que van contra la fe."},{"id":"p95-b4","pageNumber":95,"indexInPage":4,"text":"Esas malas opiniones y conceptos ocultan al hombre la existencia del Creador y Su Providencia. Esto se parece a mala hierba en un hermoso jardin; el estudio de la fe arranca esas hierbas de raiz. Gracias al estudio de la fe, el hombre aprende como conducirse en este mundo, como ver las cosas, como corregirse y como mejorar su vida. Los acontecimientos se aclaran, empieza a pensar correctamente, su herejia es aniquilada y el hombre logra una dulce y buena vida. Por consiguiente, el"},{"id":"p95-b5","pageNumber":95,"indexInPage":5,"text":"estudio de este libro es algo muy elevado e importante, pero no basta leerlo solo una vez, porque como ya fue mencionado, la fe del hombre es muy fragil y necesita un fortalecimiento constante. Este libro debe ser un \"libro de trabajo\" para toda la vida, una guia que acompana al hombre a dondequiera que vaya; hay que leerlo y releerlo examinandose cada vez: ¿ya llegue a realizar tal y cualcosa?; ¿ya llegue a cumplir lo que leo? – y asi, poco a poco, junto con la plegaria sobre lo estudiado, el hombre mejorara cada vez mas y mas."},{"id":"p95-b6","pageNumber":95,"indexInPage":6,"text":"Lo esencial de una verdadera vida espiritual consiste en el deseo de apegarse al Creador, y este deseo depende de la pureza y santidad del hombre… Consejos Adicionales para Lograr la Fe – Parte 3: Cuidar la pureza y la santidad Cuando el Creador quiso firmar un pacto con el primer verdadero creyente, el Patriarca Abraham, y todos sus descendientes, le dijo (Genesis 17:10–14): “Este es Mi pacto que guardareis entre Mi y vosotros, y entre tu futura descendencia: Sera circuncidado todo varon de entre vosotros."},{"id":"p95-b7","pageNumber":95,"indexInPage":7,"text":"Circuncidareis la carne de vuestro prepucio y sera por senal del pacto entre Mi y vosotros... Y Mi pacto estara en vuestra carne, como un pacto eterno”. Vemos, que el lugar del cuerpo que el Creador eligio para realizar su pacto con Abraham, fue justamente en el miembro que es la fuente de todo tipo de apetitos y deseos mundanos; ahi mismo le ordeno circuncidarse. ¿Que nos ensena esto?"},{"id":"p95-b8","pageNumber":95,"indexInPage":8,"text":"Nos ensena que la lujuria, la propension a los apetitos carnales y la concupiscencia, nos alejan del Creador, nos hunden en lo mundano, y destruyen completamente nuestra fe. ¡La pureza y santidad sexual son la base y la esencia para obtener una fuerte y perfecta fe! En el Genesis se cuenta sobre un hombre llamado Er (38:7): “Y Er, el primogenito de Juda, fue malo a los ojos del Eterno, y el Eterno le hizo morir”."},{"id":"p95-b9","pageNumber":95,"indexInPage":9,"text":"¿Que pecado ha cometido Er para ser llamado “malo a los ojos del Eterno”? – derramar su esperma con el fin de que su esposa no quedara gravida y perdiera su belleza. Hay que saber que derramar el semen en vano es un gran pecado, aun mas grave que toda otra transgresion, a tal punto que se considera a la persona que lo hace como si hubiera matado a alguien. ¿Por que? La explicacion brevemente es, que quien malgasta su esperma en vano, no solo realiza un acto fisico lascivo, sino que realiza un acto espiritual con una muy"}],"rawCharCount":4812},{"pageNumber":96,"blocks":[{"id":"p96-b0","pageNumber":96,"indexInPage":0,"text":"grave consecuencia. El semen contiene por si mismo una fuerza increible – el potencial de traer vida al mundo – hijos e hijas, almas dentro de cuerpo. Por medio de la eyaculacion en vano, las almas que deberian llegar al mundo en un cuerpo, nacen “desnudas” y ya no pueden crecer como seres humanos; esto es comparable a matar a los propios hijos no dandoles nunca la oportunidad de nacer."},{"id":"p96-b1","pageNumber":96,"indexInPage":1,"text":"Por lo tanto, el hombre que no se sobrepone a su lujuria y desperdicia su simiente, no solo transgrede un grave precepto, sino que esta excomulgado en el Cielo; en otras palabras, el Creador no presta oidos a sus plegarias, porque es como si hubiera matado a alguien, y como esta escrito (Isaias 1:15): “Aun si multiplicareis las plegarias, Yo no os escucho. Vuestras manos llenas están de sangre”."},{"id":"p96-b2","pageNumber":96,"indexInPage":2,"text":"Cuidar la pureza y la santidad significa usar los organos sexuales solo para el cumplimiento de un Precepto Divino, que es la procreacion, o la dicha matrimonial, o ambas. Para alcanzar esta pureza y santidad, no es suficiente no cometer un acto sexual no apropiado, sino tambien cuidar el pensamiento y la palabra en santidad. Cuanto mas nos concentramos en nuestro crecimiento espiritual y menos nos exponemos a las influencias de la lascivia y permisiva sociedad de hoy en dia, mejor podremos cuidar nuestra pureza espiritual."},{"id":"p96-b3","pageNumber":96,"indexInPage":3,"text":"Practicamente, lo mejor es casarse lo mas temprano posible, evitar observar a las mujeres, y alejarse de todo tipo de media que muestra suciedad y conduce a un ambiente de depravacion y libertinaje. Dado que los ojos son la ventana del alma, mirando todo tipo de imagenes lascivas y prohibidas se mancha el alma inmediatamente. Esta es la razon por la que la Ley Divina especifica y enfaticamente nos exige no observar a ninguna mujer excepto nuestras madres, esposas e hijas."},{"id":"p96-b4","pageNumber":96,"indexInPage":4,"text":"Los Sabios ensenaron que el solo hecho de mantener la imagen de una mujer extrana en la cabeza, es equivalente a un adulterio mental. Los pensamientos lascivos y las palabras groseras llevan a violaciones de la santidad del hombre, ya que ellos profanan la mente y la boca. El cerebro debe ser ocupado con buenos pensamientos, en pensar en la meta y el objetivo final de la vida, de como acercarse al Creador, de como hacer el bien. La regla es que los pensamientos lascivos se intensifican solo en la mente desocupada."},{"id":"p96-b5","pageNumber":96,"indexInPage":5,"text":"La boca debe ser usada para decir buenas palabras, palabras de fe, de aliento, para la plegaria. Una boca que ha sido"},{"id":"p96-b6","pageNumber":96,"indexInPage":6,"text":"contaminada con palabras sucias y lascivas no puede rezar correctamente; la utilizacion de esa boca para la plegaria se parece a usar un inodoro como un tazon de sopa. Incluso si el inodoro estuviera completamente limpio, brillante y desinfectado, ¿quien querria comer de un inodoro? De la misma manera, el Creador no quiere oir los rezos de una boca que es usada para palabras sucias y prohibidas."},{"id":"p96-b7","pageNumber":96,"indexInPage":7,"text":"Cuando el hombre profana su santidad, teniendo pensamientos eroticos o hablando groseramente, tanto mas si pasa a la accion o mira imagenes prohibidas, mancha la pureza de su corazon, y dado que lo esencial de la Divinidad esta en el corazon, ella no puede residir alli. En consecuencia, el hombre no puede sentir la Luz del Creador, no puede mas rezar, y se desarraiga completamente de la santidad y de la fe. Los sentimientos de lujuria son un espiritu impuro que cierra el corazon a la fe, y desconecta el hombre de su Creador."},{"id":"p96-b8","pageNumber":96,"indexInPage":8,"text":"El derramamiento de esperma en vano dana tambien la mente, ya que el origen del esperma es el cerebro. Por lo tanto, como ya hemos aprendido, todas las enfermedades mentales provienen del libertinaje. El sagrado Zohar ensena que la mente danada causa la pobreza. Esto es verdad en todo sentido – en la pobreza fisica, es decir la falta de subsistencia y las deudas, y en la pobreza mental que significa la falta de fe, que se manifiesta en tristeza, depresion y colera, las cuales son todas enfermedades del alma."},{"id":"p96-b9","pageNumber":96,"indexInPage":9,"text":"Cuando la fe del hombre es averiada, toda su vida se perjudica, especialmente su salud, bienestar domestico, su sustento, produciendo la tristeza y la desesperacion. El adulterio es una infraccion notoria de la pureza espiritual del hombre, y va en contra de todo principio de la fe. Nada separa al hombre del Creador tan rapido como el adulterio."},{"id":"p96-b10","pageNumber":96,"indexInPage":10,"text":"Es por eso que cuando el pueblo de Israel estaba pasando cerca el reino de Moab en su camino a la Tierra Prometida, despues de haber salido de Egipto, el malvado Bileam aconsejo a Balak, el rey de Moab, que si no podia vencer a los Israelitas con meDi-s militares, entonces lo que debia hacer era tentarlos con la lujuria y ciertamente triunfaria, pues eso es abominado por Di-s. Lo esencial de una verdadera vida espiritual consiste en el deseo de apegarse al Creador, y este deseo depende de la pureza y santidad del hombre."},{"id":"p96-b11","pageNumber":96,"indexInPage":11,"text":"Ya que la lascivia representa la inclinacion intensa hacia los actos bajos, que es la voluntad contraria a la santidad,"}],"rawCharCount":4861},{"pageNumber":97,"blocks":[{"id":"p97-b0","pageNumber":97,"indexInPage":0,"text":"entonces cuando el hombre es arrastrado a ella, pierde todo amor y anhelo de acercarse al Creador; pierde el deseo de aprender la Ley Divina y la fe, de cumplir la Voluntad Divina, y sobre todo, se aleja de la plegaria y del “Aislamiento”, que son las expresiones principales de la fe. El sagrado libro del Zohar ensena, que la prueba principal del hombre en este mundo, es superar el apetito del adulterio. Por otra parte, ya sabemos que lo principal en la vida es adquirir la fe. Resulta que uno depende del otro."},{"id":"p97-b1","pageNumber":97,"indexInPage":1,"text":"La explicacion es la siguiente: lo esencial de la lujuria depende de los ojos, y la proteccion de la mirada significa una fe completa, pues demuestra que el hombre sabe y entiende que el mundo no esta carente de Dueno, sino que el es un ser creado y que existen tambien otras criaturas para las cuales el mundo fue creado. Por lo tanto, el no mira lo que no le pertenece, sino lo que le ha sido dado."},{"id":"p97-b2","pageNumber":97,"indexInPage":2,"text":"Pero, quien mira y ansia lo que no es suyo, de hecho piensa que es el “dueno del mundo” y que todo le pertenece; esta conducta es lo opuesto completo a la fe, y solo puede traer al hombre tribulaciones y sufrimientos. Los Sabios ensenaron la siguiente regla: “El corazon ansia lo que los ojos ven”, esta es en realidad una ley natural. Es imposible que un hombre que no protege sus ojos no transgreda muy a menudo, y hasta transgreda el Mandamiento de “No codiciaras”, que es un fundamento de la fe."},{"id":"p97-b3","pageNumber":97,"indexInPage":3,"text":"El Rey David menciona algunos versiculos donde se dice la palabra “siempre”, y que son dependientes uno del otro. Uno de ellos es (Salmos 73:23): “Di-s, yo siempre estoy contigo” – que significa apegarse al Creador. El segundo (id. 25:15): “Mis ojos estan siempre dirigidos al Eterno” – es la proteccion de la mirada. Uno depende del otro, porque para merecer lo escrito en el primer versiculo, (es decir lograr el merito de siempre estar apegado al Creador), se necesita ante todo cuidar los ojos segun lo escrito en el segundo versiculo."},{"id":"p97-b4","pageNumber":97,"indexInPage":4,"text":"Lo contrario tambien es verdad: cuidar los ojos en forma inmanente es posible solo a traves de la adhesion completa al Creador, porque el hombre puede cerrar sus ojos fisicos y continuar errando con los “ojos” de su mente – sus pensamientos, imaginando un mundo entero de apetitos y cosas prohibidas. Solamente cuando su pensamiento esta apegado al Creador y sus ojos interiores estan dirigidos hacia El – lo que depende de la fe – realmente cuida sus ojos. Si logra esto, llega a cumplir el tercer"},{"id":"p97-b5","pageNumber":97,"indexInPage":5,"text":"“siempre” (id. 16:8): “He puesto el Eterno siempre delante de mi”. Unas dos semanas antes de su muerte, el gran Justo de Breslev, dejó una enseñanza que es considerada como su testamento, y en ella advierte muy detalladamente que hay que buscar al… Cierta vez, el gran Justo de Breslev alento a un hombre que estaba muy confundido respecto a su fe y le dijo: “Toda la Creacion existe solo debido a gente como tu."},{"id":"p97-b6","pageNumber":97,"indexInPage":6,"text":"El Creador previo que habria gente que se aferraria a la sagrada fe sufriendo en gran manera, debido a la confusión y a las herejias que constantemente le atacarian. El percibio que superarian estas dudas y se mantendrian firmes en la fe. Fue debido a esto que Di-s engendro la Creacion entera”. Gracias a estas palabras, el hombre se sintio muy fortalecido y seguro cada vez que lo asaltaban confusos pensamientos."},{"id":"p97-b7","pageNumber":97,"indexInPage":7,"text":"Muchas veces dijo el Justo que la Creacion se debio esencialmente a la fe, como esta escrito (Salmos 33:4): “Todas Sus obras se deben a la fe”. Hace mas de doscientos anos, este gran Justo y Maestro Espiritual ya alerto sobre “un gran diluvio de ateismo” que esta llegando al mundo. Muchas veces dijo que debido a los numerosos pecados del mundo, se generara un gran descreimiento, y agrego: “Dichoso aquel que se mantenga fuerte en la fe en esos tiempos”."},{"id":"p97-b8","pageNumber":97,"indexInPage":8,"text":"Elaborando y explicando la causa de su sorprendente declaracion dijo: “Yo se que el hecho de que estoy prediciendo y anunciando esto, no sirve de nada para prevenir el crecimiento de ese ateismo y esa confusion. Lo mismo como miles de anos atras, cuando el profeta Daniel y otros profetas predijeron y anunciaron que antes de la llegada del verdadero Mesias „Muchos seran purificados, blanqueados y refinados; pero los malvados haran el mal y no comprenderan, solo los Sabios entenderan‟ (Daniel 12:10)."},{"id":"p97-b9","pageNumber":97,"indexInPage":9,"text":"Asi que ya ha sido profetizada la prueba de fe que precedera a la llegada del Mesias, en la que “muchos seran purificados, blanqueados y refinados”. ¡Afortunado aquel que resista a las tentaciones y se mantenga firme en su fe! Sera digno de El bien que nos han vaticinado los Profetas y Sabios de la . Sabiendo que esto Ha sido profetizado, debería todo hombre tener la inteligencia de apiadarse de sí mismo manteniéndose firme en su fe, y así ya no necesitara ninguna prueba ni purificación de la fe."},{"id":"p97-b10","pageNumber":97,"indexInPage":10,"text":"Pero aun así, todavía habrá una gran prueba y muchos caerán, así como está escrito que „los malvados haran el"}],"rawCharCount":4847},{"pageNumber":98,"blocks":[{"id":"p98-b0","pageNumber":98,"indexInPage":0,"text":"mal...‟. A pesar de todo, yo estoy revelando esto por adelantado para el bien de los pocos hombres rectos que se mantendran fuertes en su fe. Ciertamente que experimentaran grandes conflictos, pero cuando vean que todo eso ha sido anunciado, les sera una fuente de apoyo, fortalecimiento y coraje”. Comprendemos de lo antedicho, que no existe ningun consejo para salvarse del peligroso diluvio de ateismo que se propaga en el mundo, solo estudiar ampliamente sobre la fe, fortaleciendola vigorosamente."},{"id":"p98-b1","pageNumber":98,"indexInPage":1,"text":"Sobre todo, debemos rezar por la fe constantemente, pidiendole al Creador que nos de mas y mas fe. Conviene que cada uno que se apiada de su propia vida, se fortalezca e invierta todas sus fuerzas para alcanzar la fe y fortalecerla. ¡Nuestra vida en este mundo y en el Mundo Venidero depende de esto!"},{"id":"p98-b2","pageNumber":98,"indexInPage":2,"text":"Selección de reflexiones de “El libro de los Atributos”, tema “Fe”: Factores perjudiciales a la fe: •“Quien no prepara su corazon, no puede alcanzar la fe”. •“Transgresiones introducen la herejia en el hombre”. •“Por medio de la envidia el hombre pierde su fe”. •“Quien se cuida de transgredir el Mandamiento de “No codiciaras”, es salvado de la ira, del orgullo y de la falta de fe que provienen de una gran colera”. •“Por medio de juramento falso el hombre pierde su fe”. •“La adulacion conduce a la herejia”."},{"id":"p98-b3","pageNumber":98,"indexInPage":3,"text":"Factores que conducen a la fe: •“Por medio de la humildad se logra fe”. •“Cuando el hombre duda de su fe, debe llorar”. •“Callarse conduce a la fe”. •“La caridad conduce a la fe”. •“Hay tonterias y confusiones que se adhieren al cerebro, y en particular las confusiones de la fe. Por medio de dormir en santidad se separan del cerebro. El sueno en santidad es especialmente beneficioso para la fe”."},{"id":"p98-b4","pageNumber":98,"indexInPage":4,"text":"El hombre que posee fe, nunca cae en un estado de tristeza o desesperación, ya que sabe que nada es malo en el mundo… Todos los rasgos del caracter dependen de la fe, como explicamos brevemente en los capitulos previos. En este capitulo, exploraremos la relacion entre la fe y los rasgos, para ilustrar el critico papel que la fe desempena en nuestra vida diaria y en nuestro bienestar general. Primera Parte: La Tristeza La tristeza es un mal rasgo que resulta directamente de la carencia de fe."},{"id":"p98-b5","pageNumber":98,"indexInPage":5,"text":"Un principio importante de la fe es que el Creador pone Su Divina Supervision Individual sobre cada criatura y le otorga las mejores condiciones para que pueda acercarse a El y conocerlo. El Creador adapta"},{"id":"p98-b6","pageNumber":98,"indexInPage":6,"text":"precisamente cada conjunto de condiciones a cada hombre; por lo general, un problema o deficiencia son el catalizador disenado para estimular el desarrollo espiritual de una persona. Algunas personas sufren de dolencias fisicas mientras otros tienen problemas financieros. Algunas personas sufren penalidades por sus ninos mientras otros encuentran dificultades en el matrimonio. Estas tribulaciones motivan a la persona a buscar al Creador; sin estas condiciones precisas, el hombre nunca podria alcanzar su finalidad."},{"id":"p98-b7","pageNumber":98,"indexInPage":7,"text":"Pero el hombre que posee fe, nunca cae en un estado de tristeza o desesperacion, ya que sabe que nada es malo en el mundo, y que todas sus privaciones y dificultades son todas para su bien. Por otro lado, el hombre carente de fe y que no cree que todo esta bajo la Supervision Divina para bien, tiene muchos motivos para estar triste y deprimido, ya que en este mundo las cosas nunca se desarrollan exactamente como queremos. Por lo tanto, cada vez que algo no anda segun su voluntad, cae en la tristeza y la melancolia."},{"id":"p98-b8","pageNumber":98,"indexInPage":8,"text":"Cuando tiene una privacion o una dificultad, el hombre creyente las utiliza como un medio para acercarse al Creador. Hasta se alegra por su privacion, porque sabe que sin ella, no podria acercarse y conocer al Creador. Este hombre esta verdaderamente “Contento con lo suyo”, es decir, feliz con su vida, incluso con sus privaciones y en situaciones dificiles. Pero el hombre que no posee fe se culpa a si mismo y a su projimo por sus carencias, ¡hasta sospecha que el Creador trata de atormentarle gratuitamente o vengarse de el!"},{"id":"p98-b9","pageNumber":98,"indexInPage":9,"text":"Por lo tanto, cae en la desesperacion y la tristeza. Sabiendo y fortaleciendonos en la creencia que todas nuestras privaciones fueron dadas solo para despertar el conocimiento de nuestra mision en este mundo, no caeremos en la tristeza y no perderemos la fe, sino que rezaremos al Creador y nos acercaremos a El."},{"id":"p98-b10","pageNumber":98,"indexInPage":10,"text":"Todo hombre que realiza un correcto trabajo espiritual sobre si mismo, ve como justamente gracias a sus defectos se estimula a la plegaria, ve como por medio de ella se forman maravillosos instrumentos para su aproximacion al Creador, y empieza a ver bien claro como todo lo que le sucede es para bien. Por medio de su trabajo y plegaria, el hombre logra cambiar y triunfar y puede sentir en su propia carne la Supervision Divina, como esta escrito (Job 19:26): “De mi propia carne vere a Di-s”."},{"id":"p98-b11","pageNumber":98,"indexInPage":11,"text":"La Fe y los Rasgos del Carácter #3: Toda la guerra"}],"rawCharCount":4837},{"pageNumber":99,"blocks":[{"id":"p99-b0","pageNumber":99,"indexInPage":0,"text":"entre la Buena y la Mala Inclinación ocurre en el pensamiento del hombre, ese es el verdadero campo de batalla… Pensamiento Positivo Toda la guerra entre la Buena y la Mala Inclinacion ocurre en el pensamiento, pues la Buena inclinacion es realmente los pensamientos positivos y la Mala Inclinacion los negativos."},{"id":"p99-b1","pageNumber":99,"indexInPage":1,"text":"Por lo tanto, lo esencial de la prueba del hombre consiste en, o sucumbir a los malos pensamientos y creer en ellos, lo que se manifiesta en tristeza, desesperacion y depresion, o reforzarse con pensamientos de fe, lo que le lleva a dominar su tristeza, colmandose de alegria. Sus privaciones se transforman para bien y triunfa, porque supero su prueba segun la Voluntad del Creador. Tomemos el ejemplo de una persona que fracasa durante un largo periodo en encontrar pareja."},{"id":"p99-b2","pageNumber":99,"indexInPage":2,"text":"Esta es ciertamente una prueba dificil, cuya esencia consiste en afrontar los pensamientos de tristeza y desesperacion provocados por la Mala Inclinacion. Ella empieza enumerandole todas sus faltas y carencias que le impiden concretar el matrimonio, con el fin de que pierda su fe, como si no tuviera ninguna posibilidad de casarse alguna vez. ¡Todos esos pensamientos son mentiras! – nada impide al Creador darle a cada uno su pareja en cualquier momento que lo desee."},{"id":"p99-b3","pageNumber":99,"indexInPage":3,"text":"Por consiguiente, lo primero consiste en no culparse a si mismo o a otros y agradecer al Creador por estar soltero hasta el dia hoy, entendiendo que su celibato es la Voluntad Divina y es para su bien. Cuando el posea esta creencia, su plegaria sera verdaderamente eficaz. Si atribuye su situacion a sus acciones, pensando: “Todavia no me arrepenti como es debido, mis transgresiones me impiden encontrar a mi conyuge, y por eso el Creador no quiere que me case...”, estos pensamientos tambien provienen de la falta de fe."},{"id":"p99-b4","pageNumber":99,"indexInPage":4,"text":"Si tuviera fe en el Creador, se dirigiria hacia El y Le pediria: “¡Señor del Universo! Tú sabes cuáles son los pecados que me impiden encontrar a mi cónyuge. Por favor, perdóname por ellos y ayúdame a corregirlos. No actúes según mi conducta y según mis acciones, por favor, dame a mi pareja aunque todavía no reparé lo que es necesario, porque Tú Mismo sabes que una persona no puede realmente corregirse sin transformarse en un hombre completo, que significa estar casado. Por esta razón, por favor ayúdame a encontrar a mi pareja”."},{"id":"p99-b5","pageNumber":99,"indexInPage":5,"text":"La regla es la siguiente: cuando el hombre tiene fe en el Creador,"},{"id":"p99-b6","pageNumber":99,"indexInPage":6,"text":"¡entonces incluso el problema de su alejamiento de El se resuelve con el Creador Mismo – por medio de la plegaria! La fe frente a la herejía Veamos algunos ejemplos de pensamientos de herejia que provienen de la Mala Inclinacion y se manifiestan en la tristeza y la desesperacion, enfrentando a los correctos pensamientos de la fe, dictados por la Buena Inclinacion: La herejía hace pensar: La fe hace pensar: Nunca solucionare mi problema. ¡Si el Creador lo quiere, El puede solucionar todos mis problemas en este mismo instante!"},{"id":"p99-b7","pageNumber":99,"indexInPage":7,"text":"El Creador se olvido de mi. El Creador no olvida a nadie. El ama a cada una de Sus criaturas, incluso a mi. Todo esta bajo la Supervision Divina y para bien; no hay ningun error y todo es exacto. El Creador no quiere ayudarme. No solo que el Creador quiere ayudarme, sino que me creo solo para tener compasion de mi. Aun este mismo obstaculo esconde una gran salvacion. No se rezar. No tengo ganas de rezar. Me es dificil rezar."},{"id":"p99-b8","pageNumber":99,"indexInPage":8,"text":"Pedire al Creador: “Permíteme rezar; Dame las ganas de rezar; dame el amor a la plegaria; ayúdame a prolongar y a multiplicar mis plegarias hasta que sean atendidas; que sepa cómo apaciguarte y complacerte; ‟Oh Eterno, abre mis labios, y mi boca dirá Tu alabanza„”. Soy un perdedor. Nunca tengo exito. El exito proviene del Creador. Hasta ahora intente tener exito “Con mi propia fuerza y el poder de mi mano” y por eso falle. Desde ahora me fortalecere en la fe que todo esta en Sus manos. Rezare y tendre exito. Nada me va como quiero."},{"id":"p99-b9","pageNumber":99,"indexInPage":9,"text":"Me va muy bien, justamente como el Creador lo quiere. Tambien si me parece que no me va bien, esta es la Voluntad del Creador para que despierte y reconozca mi nulidad, y sepa que todo proviene de El. Esta es la mejor cosa que me podia pasar. Me hicieron “mal de ojo”. “No hay mas nada fuera de El”, ningun “mal de ojo” me puede danar si el Creador no lo quiere. Trabajare sobre mi mismo con el fin de que ahora en adelante mire a los demas favorablemente."},{"id":"p99-b10","pageNumber":99,"indexInPage":10,"text":"Por lo tanto, el “mal de ojo” de los otros no me danara, pues el Creador conduce el mundo “medida por medida”. Todo depende de mis propios esfuerzos, y no tengo fuerza para hacer nada. Ningun esfuerzo es necesario. Tan pronto como llegue el momento, me llegara lo que necesito. Lo esencial de mi esfuerzo, es la plegaria. Soy perezoso. Me volvi perezoso porque perdi la fe en mi mismo. Me culpe y cai"}],"rawCharCount":4730},{"pageNumber":100,"blocks":[{"id":"p100-b0","pageNumber":100,"indexInPage":0,"text":"entonces en la tristeza, que se manifiesta en la pereza. Pedire al Creador que me de fe en mi mismo, animo y alegria, y El, con Su Misericordia, me los dara. Asi como se puede comprender segun esta lista, el comun denominador entre todas las expresiones de desesperacion, es que se centran en el “yo”: “Yo no puedo”, “No soy capaz” – lo que demuestra que su raiz es el orgullo."},{"id":"p100-b1","pageNumber":100,"indexInPage":1,"text":"Mientras que todas las expresiones de la fe estan centradas en “El Creador”: “El Creador me ayudara”, “El Creador me dara”, “Todo esta en las manos del Creador” – lo que demuestra humildad. Aportamos aqui solo algunos ejemplos, pero esa es la regla para todos los problemas y privaciones con los cuales el hombre se encuentra en la vida."},{"id":"p100-b2","pageNumber":100,"indexInPage":2,"text":"En todos los casos, el esta en el conflicto donde la Mala Inclinacion le introduce pensamientos de herejia, y le arrastra asi a la tristeza y a la desesperacion; el debe luchar contra esos malos pensamientos con todas sus fuerzas y responder con pensamientos de fe que lo estimulen y lo fortalezcan a rezar. Resulta que lo esencial del conflicto y sus resultados se sitúan en la mente, entre los pensamientos de la fe y de la herejía. La Mala Inclinacion tiene fuerza solo cuando logra introducir la herejia en el hombre."},{"id":"p100-b3","pageNumber":100,"indexInPage":3,"text":"Todo el tiempo que el hombre vive con fe, no tiene Mala Inclinacion. La Fe y los Rasgos del Carácter #4: “¿Por qué me persigo y me culpo? ¿Qué el Creador realmente desea de mí? ¿Qué me falta? ¿Acaso carezco de fe?…”. La “auto-persecución” Los pensamientos de auto-persecucion son la causa primaria de la tristeza y la depresion. Esta es otra expresion de fe deficiente, cuando el hombre piensa que todo depende de el y se culpa por todos sus fracasos y carencias, como si todo estuviera en sus manos."},{"id":"p100-b4","pageNumber":100,"indexInPage":4,"text":"Por eso, no esta contento consigo mismo, y nada puede ser mas deprimente. Esta es realmente una enfermedad cuya unica solucion es la fe, creyendo que “Así el Creador quiere” y que “Todo es para bien”. Debemos creer tambien, que por medio de la plegaria se puede resolver todo. Hay que pedirle al Creador la oracion misma, para que nos ayude a rezar lo suficiente hasta merecer ser salvados."},{"id":"p100-b5","pageNumber":100,"indexInPage":5,"text":"Recordaremos la regla que esta prohibida olvidar: la libertad de eleccion es usada solo antes de la accion, cuando se debe hacer todo lo posible para no fallar. Pero despues de la accion, queda solo la fe que “Asi el Creador lo quiso”. ¿Que hace la Mala Inclinacion?"},{"id":"p100-b6","pageNumber":100,"indexInPage":6,"text":"Confunde al hombre para que invierta el orden de las cosas, piense en su eleccion despues que todo ya esta realizado, y entonces empezara a pensar y pensar y darle vueltas en la cabeza a su fracaso, lo que le traera desesperacion y desanimo. Por lo tanto, el hombre debe hacer orden en las cosas: antes de la accion, hay libre albedrio, pero despues de la accion, la unica eleccion es la fe, aceptando todo con amor y alegria. El debe agradecer por su fracaso, estimularse con la plegaria, y rezar para merecer hacerlo."},{"id":"p100-b7","pageNumber":100,"indexInPage":7,"text":"En resumen, todo esta en las manos del Creador, y podemos pedirle que nos permita rezar mas y mas hasta que recibamos lo que nos hace falta. Por ejemplo: tomemos el caso de una mujer casada durante diez anos y que todavia no fue bendecida con hijos. Sin la fe ella comenzara a perseguirse y culparse a si misma: “No soy normal”; “no merezco tener hijos”; “debo ser una malvada”; “el Creador no me quiere”; “siempre tuve mala suerte”, y otras cosas por el estilo."},{"id":"p100-b8","pageNumber":100,"indexInPage":8,"text":"Ese tipo de pensamientos demuestran que ella piensa que tener hijos depende de ella misma. Si tuviera fe, sabria que en realidad los hijos, como toda otra cosa en la vida, provienen del Creador, y Le agradeceria por no haber tenido hijos hasta este dia, porque si el Creador creyera que le seria bueno tener ninos, se los daria. Si el Creador no le ha dado hijos hasta ahora, es solamente porque es lo mejor para la correccion de su alma en ese momento."},{"id":"p100-b9","pageNumber":100,"indexInPage":9,"text":"Luego, ella deberia dirigirse al Creador para que El le haga saber lo que debe corregir en su vida, y para que le ayude a corregirlo. Se le aconseja rezar de esta manera: “¡Creador del Universo, sólo Tú me puedes ayudar! Muéstrame por favor por qué no tengo hijos, muéstrame mis insuficiencias. Si me falta fe, ¡dame fe! Si no recé lo suficiente ¡ayúdame a multiplicar mis plegarias! Si cometo una transgresión que me causa la falta de hijos, ¡muéstramela y ayúdame a corregirla!"},{"id":"p100-b10","pageNumber":100,"indexInPage":10,"text":"Por favor, dame la creencia que evidentemente todo es para bien, que Tú deseas oír mis plegarias, y que, finalmente, yo podré merecer tener hijos que cumplan con Tu buena voluntad...”. He aqui una regla que se aplica siempre: el hombre que esta comunmente triste a causa de sus fracasos y se persigue a si mismo, significa que ha caido de la fe a la herejia, y empieza a pensar: “No soy bueno para nada”; “no tengo fuerza”; “no tengo temor al Cielo”, “no tengo esperanza”, etc. Pero la fe declara: “Todo"}],"rawCharCount":4807},{"pageNumber":101,"blocks":[{"id":"p101-b0","pageNumber":101,"indexInPage":0,"text":"lo que sucedio hasta ahora fue porque asi el Creador lo quiso y era lo mejor para mi. Mi eleccion es solo de ahora en adelante. Me encuentro en las manos del Creador. Por lo tanto, me dirigire a El para que me ayude desde este momento a hacer la correcta eleccion, corregir todo, empezar una nueva pagina, fortalecerme y aumentar mis plegarias”."},{"id":"p101-b1","pageNumber":101,"indexInPage":1,"text":"Hasta en el campo de la fe, la Mala Inclinacion actua para hacer caer al hombre en sentimientos de culpa; esto es en si mismo una herejia, porque la fe tampoco esta en las manos del hombre y es necesario recibirla del Creador, rezando mucho por ella. El hombre debe efectuar un examen de conciencia y preguntarse: “¿Por que me persigo y me culpo? ¿Que el Creador realmente desea de mi? ¿Que me falta? ¿Acaso carezco de fe? Pero, ¿por que me falta fe? ¡Es porque el Creador todavia no me la ha dado!"},{"id":"p101-b2","pageNumber":101,"indexInPage":2,"text":"Entonces, Le pedire la fe, y ciertamente me la dara! No esta esto en mis manos, sino entre las del Creador; ¡solo El me puede dar la fe!”. Cuando el hombre piensa: “No tengo fuerza”, y que otro si la tiene, se aparta del Creador, porque si el otro tiene fuerza, es solamente porque el Creador se la ha dado. ¡Si es asi, tambien a ti el Creador puede darte fuerza, si supieras que toda fuerza proviene de El! La autopersecucion empieza tan pronto como el hombre no consigue algo y piensa: “Yo no tuve exito”."},{"id":"p101-b3","pageNumber":101,"indexInPage":3,"text":"Este es un pensamiento defectuoso, el correcto pensamiento es: “El Creador no quiere que yo tenga exito en este momento y seguramente es para bien. Por el contrario, este es un verdadero exito porque asi me despierto para retornar a la fe y pedir la ayuda del Creador. Por cierto que tambien hay aqui un mensaje para aprender. Por lo tanto, fortalecere mi fe ahora y Le pedire ayuda...”."},{"id":"p101-b4","pageNumber":101,"indexInPage":4,"text":"El principio es lo siguiente: en el momento que el hombre piensa en las cosas como si dependieran solo de el, se desconecta del Creador, y empieza la auto-persecucion que le trae la tristeza. El hombre debe pues pensar asi: “Si no tuve exito, es solamente para mi bien eterno. Porque si hubiera tenido exito sin rezar, me colmaria de orgullo y eventualmente lo perderia. Entonces, ahora rezare, y lo lograre mediante la plegaria. Asi tendre un exito eterno”."},{"id":"p101-b5","pageNumber":101,"indexInPage":5,"text":"La Fe y los Rasgos del Carácter #5: Un hombre triste se parece al que está enfadado, enojado y se queja al Creador porque no cumple su voluntad... Vencer la tristeza Un hombre triste se parece al que esta enfadado, enojado y se queja al"},{"id":"p101-b6","pageNumber":101,"indexInPage":6,"text":"Creador porque no cumple su voluntad... Para vencer la tristeza, debemos cuidarnos de no enfadarnos y quejarnos por que las cosas no van segun nuestros deseos; debemos aceptar todo lo que nos llega con fe, que significa creer que todo esta bajo la Divina Supervision para bien. Quien posee la fe, nunca se queja de nada y nunca se entristece, pues sabe que todo es para su bien eterno. La “Fuerza de Crecimiento”"},{"id":"p101-b7","pageNumber":101,"indexInPage":7,"text":"En esencia, la fe es la fuerza de desarrollarse y de crecer; es el espiritu de la vida, ella es la que da al hombre las ganas de vivir, de superar todas las dificultades y las pruebas con una sonrisa y con toda seguridad. Cuando el hombre sufre de falta de fe, le falta la “Fuerza de crecimiento”, y entonces el menor soplo de viento lo derriba, la menor confusion lo agita, y por supuesto no puede enfrentar las grandes pruebas. Es comparable a una semilla plantada en una tierra infecunda – no puede crecer y se pudre."},{"id":"p101-b8","pageNumber":101,"indexInPage":8,"text":"Asi mismo este hombre se “pudre” literalmente, a causa de la tristeza que le causa su falta de fe. La fuerza de la fe es inmensa. Un hombre con fe no tiene miedo de nada y ninguna confusion lo puede hacer caer en la tristeza. Hasta en los tiempos mas dificiles, confia que el Creador lo protegera y lo conducira por el mejor camino. Cree que El escucha sus plegarias, y por eso mismo, Le reza por cada pena o dolor que sufre. Este hombre no conoce la tristeza, pues tiene esperanza; el cree en la fuerza de la plegaria."},{"id":"p101-b9","pageNumber":101,"indexInPage":9,"text":"Y si llega a tener una fe perfecta, esta alegre sin cesar. Entonces se parece a la semilla plantada en una tierra fertil – crece y se desarrolla en su vida y en su servicio al Creador, a pesar de toda tormenta, nieve, rayos y truenos. En conclusion: la tristeza es una falta de fe. El Creador supuestamente le esta diciendo al hombre: “¿Tú Crees en Mí?"},{"id":"p101-b10","pageNumber":101,"indexInPage":10,"text":"Entonces, ¿por qué estás triste?, Yo puedo ayudarte en todas las cosas y en cada situación... entonces deja de estar triste, ¡sonríe y dirígete a Mí!”. “Hijo Mío, lo esencial es que Me pidas la creencia que Mi conducta contigo es lo mejor para ti. Evidentemente tú comprendes que Yo sé mejor que tú lo que es bueno para ti. Yo no quiero que disminuyas tu oración. Al contrario, insiste, ruégame y pídeme mucho, pero ante todo y finalmente, acepta con amor y fe que lo que hago contigo es lo mejor posible, aun si no recibes lo que pediste”."},{"id":"p101-b11","pageNumber":101,"indexInPage":11,"text":"El fortalecimiento del espíritu Una de las cualidades espirituales mas necesarias para la vida, es el fortalecimiento del espiritu. El"}],"rawCharCount":4908},{"pageNumber":102,"blocks":[{"id":"p102-b0","pageNumber":102,"indexInPage":0,"text":"hombre debe interpretar todo lo que le pasa de una manera positiva, y encontrar en cada cosa algo con lo cual podra fortalecerse y perfeccionarse. Innumerables son los ejemplos de los Sabios y de los Justos de todas las generaciones, que conocieron revoluciones, crisis y transformaciones radicales en sus vidas, y con todo lograron grandes salvaciones y elevaciones, solamente por la fuerza de la creencia que “Todo es para bien”."},{"id":"p102-b1","pageNumber":102,"indexInPage":1,"text":"Es evidente que si no hubiesen trabajado sobre el fortalecimiento de su espiritu, habrian sido incapaces de superar sus pruebas y habrian caido muy bajo. Tomemos por ejemplo el caso de Jose el Justo. Hasta la edad de diecisiete anos, era el nino mimado de su padre, amado y cuidado. Subitamente todo cambio para el y se encontro con sufrimientos incomparables. Estos llegaron sin preaviso y preparacion, y ciertamente no formaban parte de su plan de vida."},{"id":"p102-b2","pageNumber":102,"indexInPage":2,"text":"Jose no planeo ser vendido como un esclavo; sufrir pruebas tan duras con la esposa de su amo Potifar, el oficial del Faraon, y ser arrojado en prision durante muchos anos, sin saber si saldria alguna vez. Seguramente que habriapreferido, como toda persona, que la vida siguiera segun su plan, es decir quedarse en la casa de su padre, servir al Creador y elevarse espiritualmente, casarse en pureza y santidad, y engendrar hijos que crecieran sobre las rodillas de su padre, Jacob, el gran Justo."},{"id":"p102-b3","pageNumber":102,"indexInPage":3,"text":"Sin embargo, el Creador lo decidio de otro modo y Jose lo acepto con amor y fe, con la conviccion que “Todo es para bien”. La Fe y los Rasgos del Carácter #6: Cada uno de nosotros que tiene problemas que le impiden estar alegre, debe acordarse de José el Justo. Debe reflexionar sobre la realidad que vivió José cuando fue arrojado a la cárcel... Contra viento y marea La historia de Jose el Justo es una buena leccion para aplicar a nuestra vida."},{"id":"p102-b4","pageNumber":102,"indexInPage":4,"text":"Cuando leemos sobre las pruebas sufridas por Jose, cada uno de nosotros debe detenerse e imaginar la realidad tal como fue, ponerse en su sitio, y pensar como reaccionaria si tuviera que vivir los mismos acontecimientos. Jose no tenia la menor idea del tiempo que deberia pasar en prision."},{"id":"p102-b5","pageNumber":102,"indexInPage":5,"text":"Tal vez debia permanecer alli toda su vida, lejos de su familia y sus allegados, sin ningun amigo, sin posibilidad alguna de poder progresar en la vida como todo el mundo, sin posibilidad alguna de trabajar o alcanzar una buena situacion economica, sin poder casarse, engendrar"},{"id":"p102-b6","pageNumber":102,"indexInPage":6,"text":"hijos, comprar una casa, etc. Tampoco tenia ninguna posibilidad de servir al Creador como es debido. Naturalmente le pasaron por la cabeza todo tipo de pensamientos y desanimo, como a toda persona que tiene que atravesar una de esas pruebas, y tanto mas, si tuviera que enfrentarlas todas de una vez."},{"id":"p102-b7","pageNumber":102,"indexInPage":7,"text":"Si Jose el Justo no hubiera fortalecido su espiritu y usado la simple fe que “Todo es para bien”, a pesar que aparentemente todo estaba muy mal, y si no hubiera anulado completamente su razonamiento sin procurar entender las cosas, ¿que habria hecho? – lo que todo el mundo hace cuando algo no sucede como quiere: se habria quebrado, quejado y amargado."},{"id":"p102-b8","pageNumber":102,"indexInPage":8,"text":"Habria acusado a sus hermanos de haberle sumergido en una situacion tan dificil, habria estado lleno de odio y de espiritu de venganza hacia ellos, y lloraria por los dificiles acontecimientos de su vida. El podria empezar culpandose y odiandose, sintiendo desesperacion, tristeza y amargura, o hasta podria haber llegado a tener malos pensamientos hacia el Creador, estar seguro de sus reproches y clamando: “¿Que es esto? ¿Como puede ser que me traten de esta manera? ¡Soy un Justo! ¿Cual es mi transgresion y mi pecado?"},{"id":"p102-b9","pageNumber":102,"indexInPage":9,"text":"¿Acaso es esta la recompensa que recibo despues de haber superado la prueba de la mujer de Potifar? ¿Esta es la recompensa por observar la Divina Voluntad? ¿Como es posible servir al Creador con tales pruebas? ¿Como es posible servirlo entre tantos idolatras y brujos?... Estoy tan lejos de mi familia, en un lugar impuro, sin el menor rastro de santidad y espiritualidad, ¿que sera de mi? ¿Como cai tan profundo? ¡Seguramente el Creador decidio acabar conmigo! ¡El m
