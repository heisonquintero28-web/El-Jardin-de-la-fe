a bien entendido que el marido y la esposa que poseen fe estan contentos con lo suyo - es decir, el esposo esta contento con su mujer y la esposa esta contenta con su marido, con todos sus defectos. Ellos saben muy bien que el Creador los supervisa, y les dio a cada uno la mejor pareja posible segun la correccion que deben efectuar - es decir, que solamente mediante los defectos de cada uno de ellos, podran cumplir su mision de vida. Contrariamente, cuando le falta al hombre fe, entonces tiene muchas quejas."},{"id":"p74-b2","pageNumber":74,"indexInPage":2,"text":"La mujer culpa a su esposo de todas sus aflicciones y el hombre esta lleno de reclamaciones y criticas a su esposa, y piensa que ella es la causa de todos sus sufrimientos. Por supuesto que sus vidas y las vidas de sus hijos no son vida, y las calificaciones que reciben en los examenes de fe son las mas bajas posibles. Encontramos, que la paz que tiene el hombre en su hogar y que de ella depende su sustento, la educacion de sus hijos, su alegria, bienestar, espiritualidad, todo depende de la fe."},{"id":"p74-b3","pageNumber":74,"indexInPage":3,"text":"Existe un grave fenómeno que apareció en nuestra generación, en el que la esposa echa a su marido de la casa, y a veces incluso usa el brazo de la ley... En este capitulo describiremos una prueba de fe, que una gran parte de los lectores nunca experimentara. Sin embargo, este capitulo no debe saltearse pues aprenderemos algunos de los mas importantes fundamentos para la vida en general, y para la felicidad domestica en particular."},{"id":"p74-b4","pageNumber":74,"indexInPage":4,"text":"Todo matrimonio debe saber estos fundamentos, tambien deben aprenderlos aquellos que todavia no se han casado y asi prepararse para la vida conyugal. Como se ha dicho anteriormente, la mayoria de las pruebas de fe que tiene el hombre son en su propia casa. Y es debido saber, que cuando el hombre no trabaja sobre si mismo para superarlas con fe, entonces puede llegar a casos muy extremos, como aprenderemos ahora."},{"id":"p74-b5","pageNumber":74,"indexInPage":5,"text":"Existe un grave fenomeno que aparecio en nuestra generacion, en el que la esposa echa a su marido de la casa, y a veces incluso usa el brazo de la ley para hacerlo por medio de una orden"},{"id":"p74-b6","pageNumber":74,"indexInPage":6,"text":"de alejamiento. Esta bien claro que un acto asi no llega en un momento, sino que fue precedido de muchos conflictos y peleas entre la pareja. Esta bien claro que si la pareja hubiera trabajado sobre su fe, no hubiera llegado a tal situacion, sino que se hubieran dado cuenta mucho tiempo antes que es lo que el Creador les insinua y que es lo que deben corregir. El marido expulsado de su casa por su mujer, debe saber que incluso si le parece que esto es injusto, de parte del Todopoderoso todo es justo."},{"id":"p74-b7","pageNumber":74,"indexInPage":7,"text":"¿Pues quien realmente lo expulso de su casa, sino el Creador Mismo? Si el hombre no se conduce adecuadamente y causa perjuicios a sus familiares y a si mismo, es preferible que salga de su casa para dejar de hacer dano. Sin embargo, aunque le parezca que se comporta adecuadamente, el Creador no hace nada sin razon y ciertamente existe una causa para su expulsion."},{"id":"p74-b8","pageNumber":74,"indexInPage":8,"text":"Por ello, lo que debe este marido hacer es utilizar los Tres Niveles de la fe: El primer nivel - \"Asi el Creador quiere\": Debe creer con absoluta fe que el Creador es el que lo ha expulsado de su hogar, sin asumir ninguna otra consideracion como la auto-culpabilidad o acusar a los demas, como a su suegro y a su suegra que apoyan a su mujer, a las amigas divorciadas que la alientan a poner fin a su vida conyugal, a los policias que aceptan sus denuncias desmedidas (segun su opinion), al juez que tomo partido por su esposa, etc., o llegar a pensamientos de furia, ideas de venganza, tristeza y desesperacion y auto-compasion."},{"id":"p74-b9","pageNumber":74,"indexInPage":9,"text":"Estos proceden solamente de la falta de fe, pues demuestra que el reniega de la Divina Supervision Individual. Si tuviera fe, pensaria solo una y unica cosa, ¡esta es la voluntad del Creador! El segundo nivel - \"Todo es para bien\": Debe creer con absoluta fe que el hecho que el Creador lo haya expulsado de su hogar es para su propio bien y el de su esposa e hijos. Por cierto es una gran accion salvar a alguien del torbellino en que se encuentra y concederle un cierto tiempo para reflexionar y reparar lo que es necesario."},{"id":"p74-b10","pageNumber":74,"indexInPage":10,"text":"Pero la realidad nos demuestra que ni el ni su esposa lograron corregirse a si mismos en todo el tiempo que vivieron juntos. Es evidente que este hombre no presta atencion a las insinuaciones que el Creador le dirige a traves de las denuncias de su mujer, que las peleas y las tensiones en su vida no lo despiertan, que no se conduce en su hogar con fe, y que su hogar esta lleno de conflictos, disputas y penas."},{"id":"p74-b11","pageNumber":74,"indexInPage":11,"text":"En resumen, el y su mujer se encuentran en un torbellino del cual no pueden salir, y puesto que es imposible resolver este problema sin la separacion, el"}],"rawCharCount":5061},{"pageNumber":75,"blocks":[{"id":"p75-b0","pageNumber":75,"indexInPage":0,"text":"Creador del Universo los aleja momentaneamente para darles la oportunidad de trabajar sobre ellos mismos y no llegar al divorcio. Sacar una mujer de su hogar es inmoral, tanto mas cuando hay ninos pequenos que dependen de ella, entonces el Creador, para su bien y para el bien de todos los interesados, expulsa al marido de la casa dandole a su mujer el respiro y la calma necesarios para una introspeccion y un examen de conciencia, para recibir asesoramiento, y para comprender y corregir su vida; lo que por supuesto es un gran favor."},{"id":"p75-b1","pageNumber":75,"indexInPage":1,"text":"El tercer nivel - \"¿Que quiere el Creador de mi?\": Ahora que el marido queda liberado de la tension mental en la que se encontraba en su casa, de los conflictos constantes con su familiares, y de las pruebas y dificultades que tenia con su esposa, las cuales llegaban a menudo juntamente con otros problemas como las deudas, etc., puede finalmente trabajar sobre si mismo, reconocer sus errores, buscar la raiz del problema y como ayudar a las personas de su casa."},{"id":"p75-b2","pageNumber":75,"indexInPage":2,"text":"Puede ahora rezar por lo que hace falta y reparar concretamente lo que es necesario. Asimismo, su mujer efectuara el examen de conciencia necesario, y ciertamente si el se arrepintiera verdaderamente, entonces Quien realmente lo expulso de su casa, El mismo lo autorizara a volver."},{"id":"p75-b3","pageNumber":75,"indexInPage":3,"text":"Cada uno debe aprender de lo que precede, la importancia de resolver los problemas en el primer momento en que se presentan y que el menor obstaculo en la paz del hogar debe ser tratado de raiz segun los Tres Niveles de la fe, sin esperar una terrible y dolorosa prueba. Es cierto que si el marido despierta suficientemente pronto, puede arrepentirse sin tener que salir de su casa y ahorrarse, asi como su mujer y sus hijos, el dolor y danos espirituales."},{"id":"p75-b4","pageNumber":75,"indexInPage":4,"text":"A veces, al marido piensa que se comporta perfectamente bien, está seguro que participa lo mejor posible en la casa, por esto, le resulta difícil aceptar las quejas de su mujer... Estar atento a las insinuaciones Se comprende que en general, le es muy dificil al marido expulsado de su casa por su esposa aceptar la realidad con fe, porque si llego a tal situacion, es un signo evidente que esta alejado de ella."},{"id":"p75-b5","pageNumber":75,"indexInPage":5,"text":"Esta bien claro que nunca ha prestado atencion a las insinuaciones que el Creador le ha mandado, pues se negaba a reconocer sus errores, defectos y faltas, es entonces indudable que no pueda aceptar esta gran humillacion y admitir la verdad... El camino del Creador es siempre"},{"id":"p75-b6","pageNumber":75,"indexInPage":6,"text":"insinuar al hombre suavemente al principio. Pero si el hombre no se despierta, las insinuaciones pasan a ser mas acentuadas y si ello no es suficiente, El lo sacude todavia mas duramente."},{"id":"p75-b7","pageNumber":75,"indexInPage":7,"text":"Ciertamente que este hombre expulsado de su casa, ha recibido muchas alusiones e incluso fuertes bofetadas antes su expulsion; si solo hubiera tratado de mirar con fe las crisis, disputas y denuncias, si hubiera tratado de buscar que es lo que el Creador le sugeria por medio de las palabras de su mujer, y tratara de comprenderla y descubrir la raiz del problema, ciertamente que no hubiera llegado a esta dificil situacion."},{"id":"p75-b8","pageNumber":75,"indexInPage":8,"text":"En lugar de eso, ese hombre solo rechazo las reclamaciones y replicas de su esposa, sin pensar un instante que quizas debia corregir algo en si mismo. Por consiguiente, tambien ahora le resulta dificil aceptar con fe la dolorosa crisis de su expulsion. \"¡Conmigo está todo bien!\" A veces, al marido le parece que se comporta perfectamente bien, esta seguro que participa lo mejor posible en la casa, y por lo tanto, le resulta dificil aceptar las quejas de su mujer."},{"id":"p75-b9","pageNumber":75,"indexInPage":9,"text":"Este hombre debe saber – no tiene ningun sentido lo que crees que realizas en la casa, pues a pesar de todo, tu esposa esta insatisfecha. Punto. ¡Es tu responsabilidad cambiar esto, pues el rol de complacer a tu esposa es tuyo! A que se parece esto? A un mecanico que jura que reparo el motor del automovil lo mejor posible y que cambio todas las piezas... Sin embargo, el motor no funciona. ¿Acaso puede disculparse diciendo que hizo todo lo necesario?"},{"id":"p75-b10","pageNumber":75,"indexInPage":10,"text":"La realidad demuestra que no ha reparado el motor como se debe, como en el dicho popular: \"la cirugia ha sido un exito, solo que el enfermo murio\". Aqui tambien, el marido debe saber que el Todopoderoso dirige el mundo bajo Su Supervision y con justicia. Si su esposa no esta satisfecha, ciertamente existe algo que debera cambiar, e incluso si la acusa, esto no es lo que resolvera el problema, sino que solo lo agravara mas."},{"id":"p75-b11","pageNumber":75,"indexInPage":11,"text":"La falta de fe - la única dificultad Un hombre privado de fe que atraviesa este tipo de crisis, tropieza con todo tipo de obstaculos. Al mismo tiempo acusa a su mujer, vive con rabia, piensa en la venganza, etc., o su corazon se quiebra por dentro porque la extrana, se llena repentinamente de amor por ella o extrana a sus ninos. Se siente totalmente desgraciado, despreciable y quebrado. Pero si poseyera fe, comprenderia que precisamente por el contrario, es bueno estar alejado de ellos por el"}],"rawCharCount":4880},{"pageNumber":76,"blocks":[{"id":"p76-b0","pageNumber":76,"indexInPage":0,"text":"momento, y puesto que ama tanto a su mujer, por esa misma causa debe aprovechar este respiro que le ha concedido el Creador para aprender como no ofenderla en el futuro, como escucharla sin criticas, y como respetarla y alegrarla."},{"id":"p76-b1","pageNumber":76,"indexInPage":1,"text":"Y si ama tanto a sus hijos, por eso debe reforzar su trabajo sobre si mismo con buena voluntad y energia, para que cuando retorne a su hogar, no repita los mismos errores que destruyen la paz hogarena, debilitan la fuerza espiritual y anulan la seguridad en si mismos de sus hijos, necesaria para triunfar en la vida. Malos consejos A menudo, todo tipo de \"asesores\" se suman a esta \"fiesta\": familiares, amigos, conocidos; todos tienen una idea clara y cortante de la manera en como se debe comportar en tal situacion."},{"id":"p76-b2","pageNumber":76,"indexInPage":2,"text":"Uno lo aconseja divorciarse de su mujer; otro lo alienta a que cese de apoyarla; su madre le dice: \"Eres demasiado bueno, ella explota tu buen corazon\". Todos estos malos \"asesoramientos\" solo conducen a la destruccion definitiva del hogar, el cual se podria salvar, si tuviera fe. Por el contrario, el verdadero consejo consiste ahora en \"comportarse como un caballero\" - hacer el bien a su mujer sin esperar retribucion por esto; enviarle dinero; alentar a sus hijos y garantizar que no les falte nada; pedirles obedecer a su madre.."},{"id":"p76-b3","pageNumber":76,"indexInPage":3,"text":"Con mayor razon, ¡no debe afligir a su esposa o usar a sus ninos como un arma contra ella! Un nuevo comienzo Debemos saber que, en verdad, si un hombre ya llego a esta grave situacion, es solamente por los grandes errores que ha cometido. Pero ahora, despues de lo que ha pasado, si asi lo desea, puede comenzar a andar por el camino de la fe, pasar la prueba con exito y corregir todo. Si se fortalece con fe y sin confusion, vera la Supervision Divina con toda claridad y como esta nueva situacion es completamente para su bien."},{"id":"p76-b4","pageNumber":76,"indexInPage":4,"text":"Un regalo maravilloso Como ya hemos dicho, el esposodispone ahora de tiempo libre y la calma para reflexionar y corregir lo que es necesario. En ocasiones, las deudas son las que han provocado las tensiones en el seno de la pareja, arruinando la paz domestica. Ahora, se pueden tratar radicalmente esos problemas lejos de los conflictos familiares. A veces son algunos de los malos rasgos del caracter del hombre los que destruyen la paz del hogar, como la ira, la pereza, la avaricia, la ingratitud."},{"id":"p76-b5","pageNumber":76,"indexInPage":5,"text":"Ahora, tiene todo el tiempo libre para trabajar sobre si y corregir su caracter. Mas aun, si tiene graves problemas, como la adicion a"},{"id":"p76-b6","pageNumber":76,"indexInPage":6,"text":"las drogas, el alcoholismo, las apuestas y la violencia, ahora que esta libre, puede ocuparse de su problema de raiz. Se deduce que, gracias a la fe, no solo no se asusta, sino por el contrario, ve la situacion como una oportunidad ideal para corregirse. En consecuencia, hara todo lo posible y se fortalecera en la plegaria para que el Todopoderoso le ayude a rectificar todo."},{"id":"p76-b7","pageNumber":76,"indexInPage":7,"text":"Cuando el Creador vea que realiza sus deberes, y obviamente su esposa tambien vea que el trabaja sobre si mismo y que esta cambiando, esto le dara esperanzas, entonces, no solo no tendra mas necesidad de esforzarse para volver a su casa, sino que su mujer misma le pedira que retorne. Y cuando vuelva, despues de haber trabajado sobre si mismo y realizado todas las correcciones necesarias, la relacion con su mujer sera totalmente distinta, mejor, sin comparacion con la del pasado."},{"id":"p76-b8","pageNumber":76,"indexInPage":8,"text":"Encontramos, que esta crisis fue en realidad un regalo del Creador; una magnifica oportunidad para empezar un nuevo capitulo en su vida. Este regalo se puede recibir solo por medio de la fe. Es necesario comprender muy bien - la mujer necesita sentir que tiene a su lado al mejor amigo del mundo, que es a la vez un padre, una madre y su mejor amiga..."},{"id":"p76-b9","pageNumber":76,"indexInPage":9,"text":"Una precipitación Satánica Es muy importante que el marido expulsado no trate de precipitar el curso de los acontecimientos intentando volver a casa, sino que crea con fe completa que el Creador sabe cual es el momento adecuado para su retorno. Debe esperar la Salvacion Divina con paciencia, hasta el momento favorable para retornar a su hogar con acuerdo completo y la buena voluntad de cada uno. Mientras, debe hacer lo suyo y aprovechar el tiempo como se debe."},{"id":"p76-b10","pageNumber":76,"indexInPage":10,"text":"Al marido, aunque reclame que su presencia en el hogar es indispensable a fin de tratar tal o cual problema urgente, como las deudas o pago de facturas, le esta prohibido el retorno y debe resolver esas cosas a distancia. Dado que incluso a las parejas que viven en paz domestica, les es muy dificil afrontar la tension provocada por las deudas sin discordia, con mayor razon los que no poseen paz en el hogar no tienen la oportunidad de corregir lo que es necesario en tal situacion."},{"id":"p76-b11","pageNumber":76,"indexInPage":11,"text":"De hecho, el Creador ha visto que no podria tratar sus problemas como es debido- con la plegaria, el examen de conciencia, el arrepentimiento y otros esfuerzos necesarios, a menos que este un cierto tiempo fuera de su casa, en un lugar tranquilo. ¡Todo depende del marido!"}],"rawCharCount":4880},{"pageNumber":77,"blocks":[{"id":"p77-b0","pageNumber":77,"indexInPage":0,"text":"Un esposo que posee fe no acusa a nadie de sus problemas matrimoniales. Incluso si considera que otros son responsables de la crisis, el acepta su cuota de responsabilidad y corrige lo necesario."},{"id":"p77-b1","pageNumber":77,"indexInPage":1,"text":"Porque en efecto, si su mujer se hubiera sentido satisfecha, es decir que el hubiera sabido como alegrarla, escucharla, comprenderla, aliviar sus tensiones, alentarla, consolarla, estar atento a sus peticiones, o en otras palabras, si su esposa hubiera sentido que el es su mejor amigo, entonces ella no hubiera tenido la necesidad de buscar a alguien para contarle sus penas y problemas matrimoniales, y no hubiera escuchado los consejos de ninguna persona."},{"id":"p77-b2","pageNumber":77,"indexInPage":2,"text":"Ella habria tenido confianza solo en su esposo y entonces no hubieran llegado a esta situacion, que ha obligado a sus padres o a quien sea, a darle consejos. Es necesario comprender muy bien - la mujer necesita sentir que tiene a su lado al mejor amigo del mundo, que es a la vez un padre, una madre y su mejor amiga. Debe sentir con plena confianza, que tiene quien la escucha, comprende y la justifica en toda ocasion."},{"id":"p77-b3","pageNumber":77,"indexInPage":3,"text":"No como esos maridos que cuando sus mujeres abren su corazon, se comportan como acusadores, la reprenden, la culpan de todo e incluso la desprecian por sus sentimientos, en lugar de apoyarla, justificarla y de estar siempre a su lado."},{"id":"p77-b4","pageNumber":77,"indexInPage":4,"text":"Hombre, debes saber - todo el tiempo que tu esposa siente la necesidad de contar lo que tiene en su corazon a sus amigas, es un signo de que ella no puede contarte todo; si tu esposa necesita el apoyo de sus padres, es signo que no recibe de ti el apoyo y el amor que necesita; toda vez que tu esposa pasa horas hablando por telefono, es un indicio que no tiene tu oido atento cuando lo necesita."},{"id":"p77-b5","pageNumber":77,"indexInPage":5,"text":"Como resultado de lo que hemos aprendido, que todo depende del marido, es posible que algunos lectores tengan pensamientos depresivos o auto-acusaciones, pero este no es el camino. Aunque verdaderamente el esposo se comporto hasta hoy en forma equivocada, la tristeza, la desesperanza, la auto-persecucion, no pueden ayudar. La senda recta es aprender lo que se debe corregir, empezar una nueva pagina y actuar para reparar los errores. Por supuesto que se debe rezar mucho y pedirle al Creador ayuda en cada paso que se tome."},{"id":"p77-b6","pageNumber":77,"indexInPage":6,"text":"\"¡Afuera de Casa!\", Ultima Parte Una de los fundamentos de la paz en el hogar consiste en nunca criticar a la esposa. Es un problema que para ser resuelto requiere"},{"id":"p77-b7","pageNumber":77,"indexInPage":7,"text":"muchas plegarias... Presentaremos ahora un plan de trabajo para la prueba del hombre expulsado de su hogar por su esposa. Con este podra el lector aprender como conducirse en las demas pruebas de la vida, y como enfrentarlas con fe para superarlas con exito. Al comenzar a trabajar sobre si mismo, es necesario antes todo que la persona cambie su mala conducta inmediatamente."},{"id":"p77-b8","pageNumber":77,"indexInPage":8,"text":"Si hasta hoy era avaro, tacano y cruel, entonces debe esforzarse a ser en lo sucesivo bueno, darle a su mujer sin limites, enviarle dinero y regalos, y si puede hablar con ella, hacerlo y prometerle ocuparse de todos sus problemas materiales y espirituales, darle la confianza que el es el que toma entera responsabilidad sobre todo. Debe hablar tambien con sus hijos y tranquilizarlos que no los ha abandonado; debe explicarles que viajo para ocuparse de algunos asuntos importantes, que es para bien de todos ausentarse de casa."},{"id":"p77-b9","pageNumber":77,"indexInPage":9,"text":"Les pedira que acaten las ordenes de su madre y la ayuden. En otras palabras, desde ahora debe comenzar a \"convertirse en una persona\" en todo el sentido de la palabra. Presentaremos las etapas de su trabajo sobre si mismo: 1. Fe - la primera etapa consiste en rezar mucho para poder aceptar lo que le ocurre con la fe que todo lo que le pasa proviene del Creador, sin enfrentarse con ninguna persona ni con si mismo."},{"id":"p77-b10","pageNumber":77,"indexInPage":10,"text":"Hasta que no crea con fe completa que \"Asi el Creador quiere\", sin tristeza y sin acusaciones, no puede empezar su trabajo. Solamente cuando acepte la realidad con la creencia que esta es la Voluntad Divina, con alegria y reflexion, solo entonces podra pasar a las etapas siguientes. 2."},{"id":"p77-b11","pageNumber":77,"indexInPage":11,"text":"Estudio - debe aprender muy bien las reglas de la paz domestica, tales como figuran en este libro y con mas profundidad en el libro \"En el Jardin de la Paz\" de este mismo autor, escuchar los CD´s sobre este tema y asi podra entender que errores cometio durante su vida conyugal. Es necesario que estudie honestamente con el fin de saber lo que debe corregir y sobre que debe orar, no para caer en auto-acusaciones y tristeza. 3."},{"id":"p77-b12","pageNumber":77,"indexInPage":12,"text":"Examen de conciencia y arrepentimiento - debe dedicar cada dia tiempo para rezar por su problema, pedirle al Creador que le perdone por haber hecho sufrir a su mujer y a sus hijos, detallando como la afligio segun lo que ha aprendido, y repetir sus oraciones pidiendole al Todopoderoso que inspire en el corazon de su mujer un completo perdon. 4. Introspección - debe profundizar intensivamente"}],"rawCharCount":4823},{"pageNumber":78,"blocks":[{"id":"p78-b0","pageNumber":78,"indexInPage":0,"text":"sobre los temas en los cuales fracaso; debera insistir en estudiarlos y particularmente esforzarse en rezar sobre cada tema hasta que penetre en su corazon, para poder corregir y conducirse como es debido. Por ejemplo: una de los fundamentos de la paz en el hogar consiste en nunca criticar a la esposa. Es un problema que para ser resuelto requiere muchas plegarias, ya que es una propension natural y cruel en el hombre criticar a su entorno por sus errores o deficiencias."},{"id":"p78-b1","pageNumber":78,"indexInPage":1,"text":"El marido incluso cree que es su obligacion criticar a su mujer para que se corrija, pero en verdad, la critica no ayuda en nada a la correccion, sino que destruye la confianza en si misma y la lleva a la conclusion que su marido la aborrece; piensa que su esposo ya no la ama y que ella no es la mujer perfecta - que este es su objetivo e ideal, ser perfecta a los ojos de su marido."},{"id":"p78-b2","pageNumber":78,"indexInPage":2,"text":"Por lo tanto, es necesario multiplicar las plegarias al Creador, y decirle: \"Señor del Universo, Te doy las gracias por haberme alejado de mi casa para trabajar sobre mí mismo y reparar mis errores. Por favor Creador del Mundo, ayúdame a superar las pruebas que me traes. Tú me has enseñado que está prohibido formular la menor crítica a la esposa, pero con gran dolor, me es muy difícil obedecer esto."},{"id":"p78-b3","pageNumber":78,"indexInPage":3,"text":"Cada vez que veo a mi mujer cometer un error, o cada cosa contraria a mi voluntad o a mi entendimiento, enseguida mi corazón se llena de orgullo lo que me lleva a criticarla. Así me siento superior a ella, que yo soy el \"bueno\" y que ella es la \"mala\", lo cual me hace conducir con crueldad y criticarla. Hay incluso algunas veces que la critico sin darme cuenta y me justifico pensando que hago lo correcto. \"Te pido por favor, Rey Misericordioso, ten piedad de mí, de mi mujer y de mis hijos."},{"id":"p78-b4","pageNumber":78,"indexInPage":4,"text":"Dame la sabiduría, la comprensión y el conocimiento para saber muy bien que estas críticas son destructivas y que no mejoran nada. Que cada crítica dirigida a mi esposa es una humillación, y con esto le arruino la confianza en sí misma y su imagen positiva, lo que causa llantos, gritos y disputas. Ello destruye la paz del hogar y lastima a nuestros hijos más que cualquier otra cosa."},{"id":"p78-b5","pageNumber":78,"indexInPage":5,"text":"Dueño del Mundo, Ten piedad de mí y dame la fuerza mental e intelectual para no criticar sobre ningún asunto y de ningún modo, en ningún momento y lugar, sea lo que sea - ya que esa no es la senda para corregir sino para destruir. \"Creador del Universo, Te ruego que tengas piedad de mí. ¡Dame por favor"},{"id":"p78-b6","pageNumber":78,"indexInPage":6,"text":"el conocimiento perfecto que mi esposa es mi espejo, y que todas las deficiencias que veo en ella son las mías! Incluso en lo que ella realmente debe cambiar, yo no puedo estimularla por medio de críticas y reproches, sino sólo por medio de darle más y más amor y respeto. Ayúdame a buscar la raíz de mi defecto y rezar para rectificarlo."},{"id":"p78-b7","pageNumber":78,"indexInPage":7,"text":"Déjame creer con fe completa que cuanto más la ame y respete, mi esposa cambiará para bien, lo que sólo será posible si no le haré ninguna crítica, sino que por el contrario, la alabaré y le diré más y más palabras de amor. \"Por favor, ayúdame a controlar mi Mala Inclinación que me impulsa a la crítica. Saca de mí la crueldad de ver las faltas y los defectos de mi esposa y criticarla por ellos. Por el contrario, dame el conocimiento, la misericordia y buenos ojos para ver su belleza, sus buenas acciones."},{"id":"p78-b8","pageNumber":78,"indexInPage":8,"text":"Ayúdame a apreciarla, respetarla, alentarla, alabarla y glorificarla. Que siempre, en toda ocasión, me controle y me esfuerce en callarme y multiplique mis plegarias. Dame preferir caer en un horno de fuego en lugar de humillar mi esposa.\" De este modo, el marido debe rezar mucho por cada punto y cada cosa que debe obtener, pues sin ello no puede existir la paz domestica. 5."},{"id":"p78-b9","pageNumber":78,"indexInPage":9,"text":"Paciencia -debe el marido cumplir las recomendaciones recordadas arriba durante un largo periodo y entre tanto, beneficiar a su esposa sin esperar aun la menor gratitud de su parte. Debe tratar de no volver a su casa, solo esperar el momento en que el Creador lo retornara. Y este es el punto esencial de su prueba: creer que solo el Creador es el que decide cuando volvera a su hogar y por lo tanto abstenerse de toda iniciativa practica con respecto a eso."},{"id":"p78-b10","pageNumber":78,"indexInPage":10,"text":"Incluso si ve que a pesar de todos sus esfuerzos para hacerle bien, su esposa reacciona cada vez peor, no debe desanimarse, solo seguir cumpliendo sus deberes con fe, seguir rezando y beneficiarla mas. Si en verdad actua como es necesario, vera que su esposa misma le pedira retornar al hogar, gozaran de paz y su vida sera una vida nueva, como si fueran recien casados... Para concluir este capítulo, es importante volver y subrayar algunos puntos aprendidos que afectan a todas las situaciones de la vida: 1."},{"id":"p78-b11","pageNumber":78,"indexInPage":11,"text":"Hay que tratar los problemas cuando estan todavia en una primera etapa de su desarrollo, y no esperar la crisis. 2. La unica via para tratar los problemas es la aplicacion de los Tres Niveles de la fe, y sobre todo la parte dedicada al"}],"rawCharCount":4870},{"pageNumber":79,"blocks":[{"id":"p79-b0","pageNumber":79,"indexInPage":0,"text":"arrepentimiento. 3. Gracias a la fe, se ve que incluso la mayor de las crisis - es para bien. El hombre que no se conoce a sí mismo y se desanima completamente cada vez que la Mala Inclinación lo domina, nunca podrá corregirse. ¿A qué es comparable?... La Auto-Corrección del Hombre: El Primer Principio - \"Conócete a ti mismo\" El primer principio y la condicion indispensable para que el hombre pueda corregirse en este mundo, es que se conozca a si mismo, es decir que sepa que posee la Mala Inclinacion."},{"id":"p79-b1","pageNumber":79,"indexInPage":1,"text":"El hombre debe saber que tal como nacio con manos, piernas, oidos, etc. y no tiene ninguna pregunta ni critica sobre su estructura fisica, asi debe saber, sin dudas o preguntas, que nacio con la Mala Inclinacion. ¡Muchos viven desmoralizados por el hecho de poseerla, esto es una gran estupidez! Asi fuiste constituido, con el fin de sobreponerte a ella. El hombre que no se conoce a si mismo y se desanima completamente cada vez que la Mala Inclinacion lo domina, nunca podra corregirse."},{"id":"p79-b2","pageNumber":79,"indexInPage":2,"text":"¿A que es comparable? a alguien que tiene entre sus manos un mapa de carreteras pero no sabe donde se encuentra; aunque tenga el mapa mas preciso y detallado del mundo en sus manos, no le sera de ninguna ayuda, y no podra de ninguna manera encontrar su camino si no sabe en que lugar esta. El mapa del camino del arrepentimiento es todavia mas dificil de interpretar y contiene numerosas ocultaciones e impedimentos."},{"id":"p79-b3","pageNumber":79,"indexInPage":3,"text":"Incluso el hombre que sabe donde se encuentra, es decir que se conoce a si mismo, debe trabajar duro para encontrar su camino y corregirse. Pero si no sabe donde esta, ciertamente se perdera y se equivocara mas y mas… ¡Hay que comprender bien este punto! Para llegar a transformarse en un perfecto justo que no transgrede y que tambien cumple todos los Preceptos Divinos a la perfeccion, hay que recorrer un camino muy largo, tan largo como toda la vida del hombre."},{"id":"p79-b4","pageNumber":79,"indexInPage":4,"text":"Incluso un hombre serio, perseverante y que hace el maximo para alcanzar su perfeccion y correccion, es inevitable que tropiece varias veces en su senda, una vez tal transgresion, y otra vez otra. Una vez la colera, y otra vez la maledicencia, o los apetitos que lo persiguen por todas partes y que no le dan tregua. Sin hablar de las numerosas pruebas que lo esperan, como su subsistencia, las confrontaciones con su familia... En resumen, el hombre no deja de luchar en este mundo hasta el dia de su"},{"id":"p79-b5","pageNumber":79,"indexInPage":5,"text":"muerte, y como en toda guerra, a veces es el vencedor, y a veces es el vencido. A veces el aventaja, y otras veces es el abrumado, igual como dos hombres que luchan uno contra otro: cuando uno ve que el otro lo domina, se esfuerza todavia mas para aventajarlo. La regla es la siguiente - cuando el hombre desea acercarse al Creador y arrepentirse, debe atravesar miles y miles de altos y bajos..."},{"id":"p79-b6","pageNumber":79,"indexInPage":6,"text":"Ademas, a medida que el hombre progresa en la via del arrepentimiento, su Mala Inclinacion se refuerza y crece con el, como ensenaron los Sabios: \"Cuanto mas grande es espiritualmente el hombre que su projimo, asi tambien su Mala Inclinacion es mas grande.\" Muchos se equivocan y creen que despues de haber logrado un cierto nivel o exito en el camino de la espiritualidad, la Mala Inclinacion los deja definitivamente; pero de pronto ven que es exactamente lo contrario, ellos poseen una Mala Inclinacion mucho mas poderosa."},{"id":"p79-b7","pageNumber":79,"indexInPage":7,"text":"La explicacion es esta: cuando el hombre tiene un pensamiento de arrepentimiento, entonces mediante sus buenas acciones mata la Mala Inclinacion que posee en ese momento. Luego, otra Mala Inclinacion lo ataca, todavia mas fuerte que la primera. Por lo tanto, si el hombre no se sobrepone a ella, la nueva Mala Inclinacion lo dominara, y necesitara fortalecerse nuevamente contra esta, todavia mas."},{"id":"p79-b8","pageNumber":79,"indexInPage":8,"text":"Por consiguiente, si el hombre cae en la tristeza cada vez que la Mala Inclinacion o los impedimentos lo abruman, pasara todos sus dias en la tristeza y ciertamente perdera esta guerra. Pero solo si se despierta, comprende y acepta que esta es la realidad, solo entonces podra comenzar a luchar verdaderamente. Y si asi lo hara, ciertamente ganara la batalla, e incluso sentira un gran placer del combate mismo."},{"id":"p79-b9","pageNumber":79,"indexInPage":9,"text":"La principal Mala Inclinación del hombre consiste en confundirle el orden de las cosas, haciéndole pensar en su elección después de ejecutar su acción. El resultado es... La Auto-Corrección del Hombre, Segunda Parte: Conoce Tu Mala Inclinación Cuando el hombre acepta que posee la Mala Inclinacion, debe conocerla y saber como combatirla. La esencia de la Mala Inclinacion consiste en provocar en el hombre la herejia para que pierda su fe, y esa es en realidad la unica forma por la cual puede someterlo con gran facilidad."},{"id":"p79-b10","pageNumber":79,"indexInPage":10,"text":"Por otro lado, mientras el hombre se aferra fuertemente a la fe, tiene todas las herramientas para salvarse de la Mala Inclinacion."}],"rawCharCount":4760},{"pageNumber":80,"blocks":[{"id":"p80-b0","pageNumber":80,"indexInPage":0,"text":"Practicamente hablando, un hombre que verdaderamente posee la fe - no posee la Mala Inclinacion. ¿Como actua la Mala Inclinacion? En algunos induce a la herejia de negacion del Creador; en otros a la herejia hacia los Preceptos Divinos y les hace pensar que saben por si solos lo que esta prohibido y lo que les esta permitido. A algunos les hace aceptar ciertos Preceptos y rechazar otros que parecen demasiado dificiles de cumplir. En algunos introduce malos deseos y apetitos."},{"id":"p80-b1","pageNumber":80,"indexInPage":1,"text":"En otros induce a la pereza, a la rebelion, o a la hostilidad contra los Justos, etc. Es lo que utiliza la Mala Inclinacion para hacer caer al hombre en la herejia. El hombre que ya ha merecido dominar todas estas malas inclinaciones, posee completa fe en el Creador y en sus Preceptos y su unica intencion es cumplir la voluntad Divina. En ese caso, ¿cual seria su Mala Inclinacion?, ¿que herejia puede infundirle? Respuesta: ¡la Mala Inclinacion le puede infundir la herejia del orgullo, o sea la de la autoculpabilidad!"},{"id":"p80-b2","pageNumber":80,"indexInPage":2,"text":"Ahora, explicaremos como dominar esta Mala Inclinacion. Hay una regla: el hombre posee el libre albedrio y esta en sus manos la eleccion entre el bien y el mal, simplemente si quiere - actua, y si no - no."},{"id":"p80-b3","pageNumber":80,"indexInPage":3,"text":"Sin embargo, este libre albedrio se ejercita solamente antes de la accion, cuando debe utilizar todo lo que esta en su poder y usar los recursos que el Creador le dio para escoger correctamente: el debe armarse ante todo de la poderosa voluntad de escoger el bien, con la creencia que nada impide al Creador darle la fuerza de elegir correctamente. Debe tambien aprender a reforzar su capacidad intelectual, buscando en los libros consejos y apoyo."},{"id":"p80-b4","pageNumber":80,"indexInPage":4,"text":"Debe pedir consejo a los Justos, y rogar y suplicar al Creador que le ayude a escoger como es debido. ¡Pero despues de la accion, queda solo la fe! Un instante despues de la ejecucion de una accion, sea buena o mala, el hombre debe saber que despues de todo, realizo esta eleccion solo porque el Creador lo quiso. Porque \"No hay mas nada fuera de El\" y solo el Creador es el que ejecuto, ejecuta y ejecutara todas las acciones."},{"id":"p80-b5","pageNumber":80,"indexInPage":5,"text":"Resulta, que cuando el hombre escoge el bien, no tiene ninguna razon para enorgullecerse porque sabe que todo proviene de la fuerza del Creador que quiso que tuviera exito. Tambien lo contrario es verdad, el hombre que fracasa debe saber que esto proviene del Creador que quiso que tropezara, porque si hubiera querido que tuviera exito, El le habria dado la"},{"id":"p80-b6","pageNumber":80,"indexInPage":6,"text":"fuerza para lograrlo. La principal Mala Inclinacion del hombre consiste en confundirle el orden de las cosas, haciendole pensar en su eleccion despues de ejecutar su accion. El resultado es el siguiente: si el hombre tuvo exito en su eleccion, la Mala Inclinacion le infunde el orgullo segun el principio de \"Con mi propia fuerza y el poder de mi mano\", haciendo depender su exito de su buena eleccion. Si el fracasa, la Mala Inclinacion le infunde la autoculpabilidad, se acusa de haber escogido mal y se sumerge en la tristeza."},{"id":"p80-b7","pageNumber":80,"indexInPage":7,"text":"Asi es como la Mala Inclinacion inspira en el hombre la incredulidad, porque el libre albedrio no es relevante sobre el pasado. Despues de la accion, queda solo la creencia que esa fue la voluntad del Creador. Concretamente, esta fe es todavia una eleccion, ya que expresa la eleccion del hombre despues de la accion, de creer que asi el Creador lo quiso. En conclusión: antes de la acción, la elección consiste simplemente en escoger el bien y en cumplir la Voluntad Divina."},{"id":"p80-b8","pageNumber":80,"indexInPage":8,"text":"Después de la acción, la elección consiste en creer que el Creador quiso lo que elegiste hacer y que \"Todo es para bien\". Hay que entender que el Conocimiento Divino y el libre albedrío son dos conceptos que están prohibido mezclar, aunque cada uno por sí mismo es verdadero... La Auto-Corrección del Hombre, Tercera Parte: El libre albedrío y el Conocimiento Divino Existe la pregunta famosa sobre el libre albedrio y el Conocimiento Divino."},{"id":"p80-b9","pageNumber":80,"indexInPage":9,"text":"En efecto, no podemos comprender como puede tener el hombre libre albedrio, dado que el Creador conoce por anticipado todos los futuros acontecimientos. Aguzaremos la pregunta: el Conocimiento Divino significa, que todo esta bajo el control absoluto del Creador, que efectuo, efectua y efectuara todas las acciones; el hombre no es capaz ni de mover un dedo sin que esta sea la Voluntad del Creador; incluso cuando el hombre peca, esto proviene del Creador que sabe por anticipado que este hombre pecara."},{"id":"p80-b10","pageNumber":80,"indexInPage":10,"text":"El libre albedrio significa, simplemente, que el hombre posee la eleccion: si lo quiere – actua, si no – no actua. Resulta de esto, que todo esta en las manos del hombre, el puede escoger entre el bien y el mal, y el es quien decide exclusivamente su vida. ¿Como puede existir esta contradiccion? ¡O todo esta en las manos del hombre, o todo esta en las manos del Creador! La respuesta es la siguiente: debemos saber que esto es algo que no puede ser captado por la razon, como"}],"rawCharCount":4866},{"pageNumber":81,"blocks":[{"id":"p81-b0","pageNumber":81,"indexInPage":0,"text":"explico uno de los grandes Justos: \"Debes Saber que esto es lo esencial de la fuerza de la eleccion: lo que el intelecto humano no es bastante poderoso para comprender, el tema del Conocimiento Divino y el libre albedrio, es la causa para que la fuerza de la eleccion pueda subsistir, asi el hombre puede escoger la vida o lo contrario."},{"id":"p81-b1","pageNumber":81,"indexInPage":1,"text":"Pero si el intelecto humano fuera mayor y la respuesta al problema del Conocimiento Divino y el libre albedrio le fuera revelado, entonces su libertad de eleccion seria anulada; porque con ese desarrollo del intelecto, el hombre sobrepasaria la categoria de humano y alcanzaria la de los angeles. Por eso mismo el principio de la fuerza del libre albedrio existe solo mientras no se entiende el funcionamiento del Conocimiento Divino y el libre albedrio\"."},{"id":"p81-b2","pageNumber":81,"indexInPage":2,"text":"Por consiguiente, el hombre como tal, sea quien sea, es incapaz de dar la respuesta a esta pregunta. Y si se empena en procurar resolver este problema, llegara a una incredulidad completa, confusion, dudas e incluso podria perder la cordura. Como han ensenado los Sabios sobre quien intenta resolver el problema del Conocimiento Divino y el libre albedrio, se dice el versiculo (Proverbios 2:19): \"Todos los que entran en eso no volveran, y no alcanzaran los caminos de la vida...\"."},{"id":"p81-b3","pageNumber":81,"indexInPage":3,"text":"Hay que entender que el Conocimiento Divino y el libre albedrio son dos conceptos que estan prohibido mezclar, aunque cada uno por si mismo es verdadero. Es decir, por cierto que el hombre posee el libre albedrio, y ciertamente que todo esta bajo el control del Creador que sabe todo por anticipado, pero todo esto es verdad solo cuando cada concepto es independiente y no se los mezcla. Esto es comparable a dos materiales diferentes, cada uno por si mismo es bueno y eficiente, pero cuando se lo mezcla producen una gran explosion."},{"id":"p81-b4","pageNumber":81,"indexInPage":4,"text":"Por lo tanto, cuando se habla del libre albedrio, se hace referencia solo a este y hay que abstenerse de asociarlo con el Conocimiento Divino. Y por el contrario, cuando se habla del Conocimiento Divino, se hace referencia solo a este y hay que abstenerse de asociarlo con el libre albedrio. En la practica, el libre albedrio y el Conocimiento Divino son dos herramientas que es necesario utilizar cada una en su determinado tiempo y no hace falta comprenderlas para usarlas."},{"id":"p81-b5","pageNumber":81,"indexInPage":5,"text":"Antes de hacer algo, el hombre debe elegir como comportarse, como deben ser sus pensamientos, palabras y acciones, debe considerar solo"},{"id":"p81-b6","pageNumber":81,"indexInPage":6,"text":"el libre albedrio y saber con certeza que tiene toda la eleccion; de actuar o de no actuar, o de como actuar, etc. En cada prueba, el hombre dispone del libre albedrio para hacer el bien o el mal. Y le esta prohibido mezclar el Conocimiento Divino cuando debe tratarse segun el libre albedrio. En conclusion: antes de la accion, el hombre debe solamente utilizar su libre albedrio, porque la libertad de eleccion simplemente esta en sus manos,."},{"id":"p81-b7","pageNumber":81,"indexInPage":7,"text":"Pero despues de la accion, el debe solamente utilizar el Conocimiento Divino, porque simplemente todo esta en las manos del Creador. No seas malvado a los ojos del Creador Por lo tanto, esta bien entendido porque le esta prohibido al hombre pensar: \"He aqui, todo esta determinado en el Cielo, entonces ¿que diferencia hay si me esfuerzo para superar mis pruebas o no, o si me conduzco segun las reglas de la moral o no?; de cualquier manera todo esta en las manos del Creador, y El sabe por anticipado si pecare o no."},{"id":"p81-b8","pageNumber":81,"indexInPage":8,"text":"Ya esta establecido si sere un justo o un malvado, ¡entonces actuare como quiero y dire que asi es como el Creador quiere que me conduzca!\". Este tipo de pensamientos son una absoluta herejia, ¡porque el hombre posee el libre albedrio! Punto."},{"id":"p81-b9","pageNumber":81,"indexInPage":9,"text":"Asi como esta escrito (Deuteronomio 30:15–19): \"Mira, Yo he puesto hoy delante de ti la vida y el bien, la muerte y el mal..., escoge la vida\" – vemos entonces que le esta ordenado al hombre hacer todo lo posible para escoger el bien, conducir su vida con rectitud y con responsabilidad, sin pecar o cometer ni la mas pequena falta. Si el hombre no escoge el bien, ninguna excusa sera aceptada en el Cielo. Esta escrito bien claro en el Pentateuco, la Ley del Creador, que el hombre posee el libre albedrio y sera juzgado segun su eleccion."},{"id":"p81-b10","pageNumber":81,"indexInPage":10,"text":"Pero el hombre debe saber, ¡despues de la accion – aunque haya cometido el mas grave de los pecados – que el Creador lo quiso asi, y es para bien! Y si el lector avispado preguntara: \"¡¿Como podemos decir que si cometi un pecado, es eso para bien?!\", hay que saber que el Creador observa cada alma y que supervisa a todo hombre para proporcionarle las condiciones mas justas y precisas, pues solo por medio de ellas podra alcanzar su meta."},{"id":"p81-b11","pageNumber":81,"indexInPage":11,"text":"En consecuencia, incluso cuando los apetitos lo dominan, o fracasa, o peca, o tiene dificultades y las cosas no le van como se debe, todo esta bajo la Divina Supervision con el fin de estimularlo, empujarlo, dirigirlo hacia los puntos sobre los cuales"}],"rawCharCount":4850},{"pageNumber":82,"blocks":[{"id":"p82-b0","pageNumber":82,"indexInPage":0,"text":"debe trabajar y corregir, y para guiarlo y ponerlo en el camino que debe seguir para la correccion de su alma en este mundo. ¡Así ciertamente todo es para bien, ya que el hombre necesita de todas sus privaciones para el fin de ser guiado a su finalidad! Después que el hombre aprende de sus fracasos a acercarse al Creador, a abandonar su orgullo, reconocer su debilidad, entonces el beneficio de su caída espiritual y de su fracaso es muy grande..."},{"id":"p82-b1","pageNumber":82,"indexInPage":1,"text":"La Auto-Corrección del Hombre El fin de la Mala Inclinación Cuando el hombre sabe, despues de fracasar o pecar, que su falta era para su bien, y se despierta de ese fracaso para acercarse al Creador, entonces en efecto ya no posee mas la Mala Inclinacion. Porque como se ha dicho, la Mala Inclinacion no es nada mas que la herejia que lleva al hombre a la auto-persecucion y de la que podra sobreponerse."},{"id":"p82-b2","pageNumber":82,"indexInPage":2,"text":"No debemos olvidar que nos referimos a despues de la accion, lo pasado ya paso, y como ya hemos aprendido, el libre albedrio despues de una accion es creer que asi lo quiso el Creador, y por lo tanto todo es, sin ninguna duda, para bien. Cuando el hombre cree asi, no tiene ningun contacto con la Mala Inclinacion."},{"id":"p82-b3","pageNumber":82,"indexInPage":3,"text":"No se culpa y no se persigue por sus fracasos, sino que los acepta con fe y amor y se anima para buscar y comprender lo que el Creador espera de el, al permitirle cometer tal transgresion, sin haberle ayudado a dominar su inclinacion. Entonces, puede comenzar el trabajo adecuado segun la Voluntad Divina, es decir, aprender una buena leccion, saber como conducirse en el futuro, rezar al Creador, y utilizar todas las herramientas que posee, para de ahora en adelante, mejorar su conducta."},{"id":"p82-b4","pageNumber":82,"indexInPage":4,"text":"Como resultado, el hombre despues de su falta, ya no se ocupa de ninguna manera de la Mala Inclinacion, sino que vive solamente con la Supervision Divina: antes de todo acto, estudia, reza y pide al Creador que le ayude a hacer una buena eleccion. Y despues, aprende del pasado los mensajes del Creador, es decir, como elegir correctamente de ahora en adelante."},{"id":"p82-b5","pageNumber":82,"indexInPage":5,"text":"Despues que el hombre aprende de sus fracasos a acercarse al Creador, a abandonar su orgullo, reconocer su debilidad, fortalecerse en su oracion y en su servicio al Creador o aprender un nuevo mensaje, entonces el beneficio de su caida espiritual y de su fracaso es muy grande, y es apropiado entonces agradecerle al Todopoderoso con todo el corazon, por esa misma caida que le hizo"},{"id":"p82-b6","pageNumber":82,"indexInPage":6,"text":"despertar y reforzarse. Y asi debe decir: \"Creador del Universo, Te agradezco por cuidarme con Tu precisa Supervisión Individual. Gracias por haberme traído este fracaso, y por haberme despertado por su intermedio para acercarme a Ti. Te agradezco mucho esta proximidad, la cual es el resultado directo de mi caída\"."},{"id":"p82-b7","pageNumber":82,"indexInPage":7,"text":"Vemos entonces, que tambien los fracasos son en efecto un gran bien, y el hombre debe agradecerle al Creador con todo su corazon por haberselos enviado, y como ensenaron los Sabios: \"El hombre debe agradecer por el mal con todo conocimiento y todo su corazon, como agradece por el bien\". Porque tambien las fallas estan bajo la Divina Supervision Individual, y ya sabemos la regla: \"Todo lo que el Creador hace, lo hace para bien\". Es necesario subrayar otra vez que aqui hablamos de despues de la accion."},{"id":"p82-b8","pageNumber":82,"indexInPage":8,"text":"Antes de la accion, el hombre esta obligado a saber que esta prohibido pecar y debe hacer todo lo posible para no transgredir. Arrepentimiento por amor El hombre que posee fe y sabe utilizar cada uno de los conceptos mencionados en su momento adecuado, ciertamente que agradece por sus fracasos y caidas, y esto es lo que se llama \"arrepentirse por amor\", porque no siente ninguna debilidad intelectual o tristeza por sus fallas."},{"id":"p82-b9","pageNumber":82,"indexInPage":9,"text":"Este hombre sabe que el ego no existe y que todo proviene del Creador para el bien, con el fin de despertarlo para un trabajo espiritual mas intensivo."},{"id":"p82-b10","pageNumber":82,"indexInPage":10,"text":"Esta es la explicacion de lo que nos han ensenado los Sabios: \"Las transgresiones del que se arrepiente por amor, se convierten en meritos\", es decir que aunque el hombre haya transgredido deliberadamente, pero no cae ni en la tristeza ni en la desesperacion, sino que se estimula a arrepentirse debido a que se conmociono por su accion, y se anima a transformarse para el bien, entonces es evidente que su trasgresion se transforma en un gran merito, puesto que debido a su caida fue conmovido a arrepentirse."},{"id":"p82-b11","pageNumber":82,"indexInPage":11,"text":"Una cosa es cierta, antes de caer y cometer un grave pecado, este hombre se parecia a alguien que duerme en vida, es decir que estaba sumergido en la apatia, en la rutina diaria y aceptando los malos rasgos que le llevaron a esa caida. Solamente despues que transgredio tan gravemente, se alarmo y se estimulo para trabajar seriamente, para desarraigar definitivamente su mal. ¡Vemos entonces que es la transgresion la que le condujo al merito del verdadero arrepentimiento! Los Sabios"}],"rawCharCount":4796},{"pageNumber":83,"blocks":[{"id":"p83-b0","pageNumber":83,"indexInPage":0,"text":"tambien ensenaron que no podemos verdaderamente comprender un Precepto o un servicio al Creador, sino hasta despues de haber fracasado. La razon es que el hombre que no se desanima por su fracaso, puede por cierto aprender mucho de sus fracasos y caidas, hasta llegar a entender cual fue el error y la causa y asi dominar el problema. Esto es verdad solo cuando acepta todo con alegria, pero si comienza a mortificarse por su mala eleccion, cae entonces en la herejia y esta caida arrastrara a muchas otras."},{"id":"p83-b1","pageNumber":83,"indexInPage":1,"text":"Debe ser bien entendido - ¡despues de la accion, ya no se puede cambiar el pasado, pero hay que hacer todo lo posible para no perder el futuro...! Admitir la verdad El hombre debe saber por anticipado que hay fracasos y caidas en la vida, que tropezara todavia muchas veces mas y debe prepararse sin enganarse,conocer su verdadero nivel y no pensar que ya llego a la perfeccion y que nada le pasara."},{"id":"p83-b2","pageNumber":83,"indexInPage":2,"text":"Todo el tiempo que el hombre no reconoce sus defectos y su bajeza y no admite la realidad de que las caidas son una parte integral del camino que debe seguir, ¡el vive en la mentira, y no se puede alcanzar la verdad a partir de una mentira! Entendiendo lo anterior, podremos explicar un gran prodigio. Cuando el Creador le pregunto a Adan, el primer hombre (Genesis, 3:9-11): \"¿Donde estas? ...¿Acaso del arbol que te ordene que no comieras, comiste?\", Adan respondio: \"La mujer que me diste por companera, me dio del arbol, y comeré\"."},{"id":"p83-b3","pageNumber":83,"indexInPage":3,"text":"La expresion \"y comeré\" es en futuro, lo que quiere decir que ya comio y que en el futuro comera mas. Y la pregunta necesaria es: \"¡¿No es esta una gran insolencia?! ¡El Todopoderoso le pregunta si comio del Arbol del Conocimiento y en lugar de confesar su pecado, pedir disculpas y prometer que jamas lo volvera a hacer, declara Adan que tiene la intencion de continuar comiendo!\". La respuesta es la siguiente - no hay aqui ninguna insolencia. La pregunta del Creador \"Donde estas?\" significa ¿Donde te encuentras? ¿Donde caiste?"},{"id":"p83-b4","pageNumber":83,"indexInPage":4,"text":"¿En que nivel te encuentras despues de haber pecado? ¿Acaso estas en un nivel en el cual puedes dominar tu Mala Inclinacion y no comeras mas del Arbol del Conocimiento? Y Adan supuestamente Le respondio: \"No, me encuentro en un nivel mas bajo, donde mi Mala Inclinacion me domina y continuare comiendo...\". El supo reconocer su verdadero nivel y no se hizo ilusiones pretendiendo que jamas dejara de pecar. Esta es la respuesta a lo que la"},{"id":"p83-b5","pageNumber":83,"indexInPage":5,"text":"gente comunmente pregunta: \"Todo estaria muy bien si realmente dejara de pecar despues de mi arrepentimiento, mientras que en realidad, continuo pecando mas y mas. ¿Como puedo dirigirme al Creador y pedirle perdon, cuando se que pecare otra vez?\". La respuesta es esta: Debemos reconocer nuestro nivel, debemos saber que poseemos la Mala Inclinacion y que es dificil sobreponernos a ella."},{"id":"p83-b6","pageNumber":83,"indexInPage":6,"text":"Debemos saber que probablemente fallaremos y pecaremos todavia numerosas veces, y que a pesar de esto debemos sentirnos contentos con lo nuestro y con nuestro trabajo espiritual. Si admites tus defectos - los corregirás Para verdaderamente seguir el sendero del arrepentimiento, debemos alcanzar el nivel de la fe en el cual aceptaremos estar alegres y agradecer cada hecho y acontecimiento de nuestra vida."},{"id":"p83-b7","pageNumber":83,"indexInPage":7,"text":"Si el hombre no admite y reconoce sus faltas, no podra remediarlas y rectificarlas, es decir que vive sin fe, que significa vivir sin el Creador, ¿y como podemos arrepentirnos sin El? Tener fe significa que el hombre agradece por todo, incluso por sus fracasos y faltas, y solamente entonces puede rezar y pedirle al Creador que lo ayude la proxima vez. Conoce a tu Creador ¡Acuerdate! El Todopoderoso te conoce muy bien; El sabe perfectamente que tienes Mala Inclinacion, y sabe muy bien que no puedes vencerla sin Su ayuda."},{"id":"p83-b8","pageNumber":83,"indexInPage":8,"text":"Por lo tanto, ¡deja de culparte! Aun si cometiste el peor pecado y caiste lo mas bajo posible, el Creador no quiere que caigas en la depresion y que pienses en tu enorme fracaso, sino que dejes todo y recomiences. Solo despues que cobres fuerza en la alegria y retornes al buen camino, podras arrepentirte por tu caida espiritual o transgresion. ¡Acuerdate! El Creador te ama siempre. El siempre quiere ayudarte. El te creo solo para manifestarte Su misericordia y otorgarte Sus beneficios."},{"id":"p83-b9","pageNumber":83,"indexInPage":9,"text":"Su compasion es infinita y te puede asistir en las peores situaciones. ¡Su misericordia es eterna y Su bondad es inmutable! La razón por la cual las personas están alejadas del Creador, es sólo por su falta de claridad y serenidad mental, que es el resultado de la falta de alegría... La Auto-Corrección del Hombre El Tercer Principio -\"Sólo con Alegría\" El tercer principio para que el hombre pueda corregirse es, ante todo, que se convenza de la idea que el arrepentimiento es posible solo a traves de la alegria."},{"id":"p83-b10","pageNumber":83,"indexInPage":10,"text":"Debemos saber, que la razon por la cual las personas"}],"rawCharCount":4788},{"pageNumber":84,"blocks":[{"id":"p84-b0","pageNumber":84,"indexInPage":0,"text":"estan alejadas del Creador, es solo por su falta de claridad y serenidad mental. La claridad y serenidad mental significan pensar sanamente cual es la finalidad de todos los asuntos mundanos y apetitos, sean interiores como los apetitos fisicos o exteriores como la busqueda de honores, lo que estimulara a retornar al Creador. La tristeza impide controlar la mente y hace dificil pensar con claridad. Solamente por medio de la alegría se puede hacer funcionar el cerebro como es debido, y llegar a una mente clara."},{"id":"p84-b1","pageNumber":84,"indexInPage":1,"text":"La alegria es \"el mundo de la libertad\", que permite al hombre liberarse y salir de su exilio mental, como dice el versiculo (Isaias 55:12): \"Porque con alegria, saldreis\" - con la alegria se puede salir del exilio que nos impide tener una mente tranquila, con la cual podriamos pensar con claridad sobre el objetivo final de la vida. Hasta el temor al Creador es imperfecto sin la alegria, y esta mezclado con tonterias."},{"id":"p84-b2","pageNumber":84,"indexInPage":2,"text":"Por lo tanto, tambien el examen de consciencia que debe hacerse el hombre, que es un aspecto del temor a Di-s, no puede ser el adecuado sin ella. Tambien hasta para la confesion de los pecados frente al Creador se necesita la alegria, para poder expresar oralmente las transgresiones, y para no olvidarlas previamente a la confesion."},{"id":"p84-b3","pageNumber":84,"indexInPage":3,"text":"Una gran leccion podremos aprender de lo dicho por el gran Justo de Breslev sobre si mismo: \"Tal como ustedes me ven (es decir como un gran Justo), aunque fracasara y transgrediera el peor de los pecados, Di-s no lo quiera, de ninguna manera caeria en la desesperacion, continuaria siendo un hombre recto como antes, solo que despues me arrepentiria\", Resulta entonces, que la alegria es indispensable para el arrepentimiento del hombre y para su \"Autojuicio\". ¡Esta prohibido comenzar a juzgarse, mientras no se esta alegre!"},{"id":"p84-b4","pageNumber":84,"indexInPage":4,"text":"Este es uno de los principales obstaculos que encuentra el hombre en su camino hacia el completo arrepentimiento, y retorno al Creador. En esto todos, sin excepcion, tienen dificultades - como afrontar los fracasos, caidas o una simple falta de exito, sin caer en la tristeza, la melancolia y la autoculpabilidad. Y este consejo nos ensena el gran Justo de Breslev: estar siempre alegre sin importar lo que ha pasado."},{"id":"p84-b5","pageNumber":84,"indexInPage":5,"text":"Pero, aunque la gente quiere interiorizar este consejo y utilizarlo, no siempre lo logra, no pueden alegrarse despues de fallar. Se dicen a si mismos: \"¡¿Pero como?!"},{"id":"p84-b6","pageNumber":84,"indexInPage":6,"text":"¡¿alegrarme despues de haber pecado?!\". Simplemente no lo pueden aceptar... ¿Por que? La respuesta es que la gente se equivoca completamente con respecto al sentido del concepto \"arrepentimiento\". Las personas creen que arrepentirse significa perseguirse a si mismo y sentirse culpable por tener Mala Inclinacion. Esto es una tonteria, como ya hemos explicado, porque despues de haber usado la libertad de eleccion queda solo la fe, y la fe se manifiesta en la alegria. ¿Y cual es esa fe?"},{"id":"p84-b7","pageNumber":84,"indexInPage":7,"text":"La creencia que todo es para bien trae la alegria, y solo entonces el hombre puede verdaderamente arrepentirse. Y si todavia te interrogas: \"¿Como podre estar alegre? Si supiera que jamas pecare podria estarlo, pero sabiendo que todavia puedo fallar y pecar mas y mas, ¿como puedo estar alegre?\" La respuesta ya fue dada anteriormente: esta pregunta es la del hombre que no conoce su nivel."},{"id":"p84-b8","pageNumber":84,"indexInPage":8,"text":"Si solamente supiera donde se encuentra, y por supuesto que el Creador lo sabe tambien, entonces se regocijaria facilmente, porque sabria que este es el verdadero trabajo espiritual segun su nivel. El lector que ya alcanzo estas lineas y todavia se pregunta esto, debe repasar de nuevo este capitulo desde el principio y estudiarlo con mucha atencion. Resumen de los Tres Principios 1."},{"id":"p84-b9","pageNumber":84,"indexInPage":9,"text":"El Primer Principio –\"Conócete a ti mismo\" - El hombre que se desespera cada vez que se rinde a la Mala Inclinacion por sus malos deseos y rasgos, simplemente no tiene consciencia de la realidad y vive en la ilusion de que es intrinsecoy naturalmente bueno, sin mal alguno, lo que es completamente falso. La Mala Inclinacion forma parte de la naturaleza del hombre, como esta escrito (Genesis 8:21): \"Pues la inclinacion del corazon del hombre es mala desde su infancia\", y por lo tanto no sorprende que posea malos deseos y apetitos. 2."},{"id":"p84-b10","pageNumber":84,"indexInPage":10,"text":"El Segundo Principio – \"Necesitas Su ayuda\"- ¡No solo posees una Mala Inclinacion, sino que tampoco la puedes vencer! Entonces, ¿por que estas triste? ¡Es una ley de la Creacion que la Mala Inclinacion venza al hombre! Y como ensenaron los grandes Sabios: \"Cada dia, la Mala Inclinacion trata de dominar al hombre, y si no fuera por la ayuda del Todopoderoso - no la podria vencer\". 3."},{"id":"p84-b11","pageNumber":84,"indexInPage":11,"text":"El Tercer Principio – \"Sólo con alegría\" - Regocijate con lo tuyo y con tu realidad y conoce tu trabajo: multiplicar las plegarias y \"Aislamientos\" con el Creador, pidiendo Su ayuda. No desesperes. Es muy posible que te confieses y que Le pidas"}],"rawCharCount":4805},{"pageNumber":85,"blocks":[{"id":"p85-b0","pageNumber":85,"indexInPage":0,"text":"que te ayude a vencer tu Mala Inclinacion, y que a pesar de todo caigas otra vez mas, y entonces empieces de nuevo a confesarte y rezar y otra vez fracases, y asi sucesivamente durante varios dias, y varios anos. ¡No te desesperes! Sigue dirigiendote al Creador y pide Su ayuda, hasta que en el curso de los dias, la acumulacion de todas tus plegarias y suplicas, alcancen la cantidad requerida y entonces dejaras de pecar."},{"id":"p85-b1","pageNumber":85,"indexInPage":1,"text":"Por lo tanto, si verdaderamente te duele cada vez que caes, el consejo es aumentar tus plegarias durante varias horas consecutivas. Aunque el principal Juicio del hombre es en el primer día del año, hay veinticuatro Tribunales en el Cielo, que juzgan al hombre en cada hora del día uno según sus acciones... Hay veinticuatro Tribunales en el Cielo, en cada hora del dia uno de ellos juzga al hombre segun sus acciones. Cuando sus acciones son buenas, es juzgado favorablemente, se siente alegre y le llegan bendiciones y apacibilidad."},{"id":"p85-b2","pageNumber":85,"indexInPage":2,"text":"Por el contrario, si sus acciones no son buenas, es juzgado desfavorablemente y en consecuencia siente tristeza, abatimiento, sufrimientos y obstaculos. Como han dicho los Sabios: \"Tus acciones te acercaran y tus acciones te alejaran\". Aunque el principal Juicio Divino del hombre es en el primer dia del ano nuevo, este se refiere a temas generales como si vivira o morira, cuanto dinero ganara en el ano, etc."},{"id":"p85-b3","pageNumber":85,"indexInPage":3,"text":"Pero como sera cada dia y cada hora de su vida, buena o mala, esto depende unicamente del veredicto diario del Tribunal Celeste, segun sus acciones en esa hora determinada. Podemos ilustrar este tema con la siguiente historia: Cierta vez, un gran Justo encontro a un viejo que extraia agua del pozo para vivir. Cuando el Justo le pregunto como iba su vida, le contesto con gran alegria que todo era maravilloso y que agradecia al Creador por haberle dado la fuerza para mantenerse con dignidad."},{"id":"p85-b4","pageNumber":85,"indexInPage":4,"text":"En otra ocasion, cuando el Justo lo encontro nuevamente, la cara del viejo aguatero estaba triste. El Justo le pregunto como estaba y el viejo le conto llorando y gimiendo sobre su mala suerte, teniendo a su vejez que trabajar tan duro. El gran Justo se extrano del brusco y radical cambio de humor del viejo y despues de meditar sobre el asunto, dijo: \"Ahora acabo de encontrar la respuesta a una dificil pregunta que me he hecho."},{"id":"p85-b5","pageNumber":85,"indexInPage":5,"text":"Recibimos la herencia de los antiguos Sabios que nos ensenan que el hombre es juzgado al principio del nuevo ano, y por el otro"},{"id":"p85-b6","pageNumber":85,"indexInPage":6,"text":"lado nos ensenan tambien que el hombre es juzgado cada dia y cada hora. ¿Entonces, si el Creador juzga al hombre al comienzo del ano respecto a lo que le pasara durante el mismo, por que lo juzga de nuevo cada dia y cada hora?\" Explico el Justo, que el cambio de humor de este viejo aguateroexplicaba perfectamente la contradiccion aparente en las ensenanzas de los Sabios."},{"id":"p85-b7","pageNumber":85,"indexInPage":7,"text":"Es verdad que al primer dia del ano nuevo, el hombre es juzgado y le es determinado cual sera su trabajo, cuantas sus ganancias, etc., pero como aceptara el decreto, si se resignara serenamente o con pesar, esto esta determinado cada dia y cada hora, segun sus acciones en ese determinado momento. Por consiguiente, cuando el viejo fue declarado inocente por el Tribunal Celeste, recibio alegria y bendicion desde el Cielo y sintio que su vida era bella y feliz."},{"id":"p85-b8","pageNumber":85,"indexInPage":8,"text":"Sin embargo, cuando fue considerado culpable en otro momento, le fue decretado recibir sufrimientos y es por eso que sintio las dificultades y la amargura. En realidad, lo que le fue decretado en el comienzo del ano no cambio, que su sustento le llegaria como aguatero, pero el modo de como aceptara su trabajo, con alegria o con tristeza, eso cambiaria segun sus acciones."},{"id":"p85-b9","pageNumber":85,"indexInPage":9,"text":"Nota: conviene recordar que por medio del arrepentimiento, la plegaria y la caridad, puede aun el hombre cambiar el decreto que le fue fijado en el Juicio del primer dia de ano. Prestar atención a las alusiones De la historia anterior, podemos comprender los cambios que suceden en nuestra vida de un dia para otro, ya sea en nuestro estado de animo, en nuestras relaciones familiares, etc."},{"id":"p85-b10","pageNumber":85,"indexInPage":10,"text":"Por ejemplo, a una cierta hora el hombre tiene exito, todo se resuelve perfectamente, goza de buen humor, y de repente siente debilidad y tristeza y todo se le complica. O goza de paz y de armonia en la relacion con su esposa y repentinamente estalla entre ellos una disputa por algo ridiculo."},{"id":"p85-b11","pageNumber":85,"indexInPage":11,"text":"La unica explicacion para tales cambios bruscos, es que el hombre es juzgado a cada momento; cuando le es decretado que debe sufrir, los problemas lo hostigan por todas partes, en su salud, en su humor, en la paz domestica, en el sustento, y tambien lo contrario es verdad. Se debe saber que la menor de las molestias, hasta una picazon en la cabeza, forman parte de los sufrimientos decretados por el Tribunal Celeste. La mas pequena herida en el dedo de un hombre, es causada por una decision Celeste, como esta"}],"rawCharCount":4824},{"pageNumber":86,"blocks":[{"id":"p86-b0","pageNumber":86,"indexInPage":0,"text":"escrito (Salmos 37:23): \"Los pasos del hombre son establecidos por el Eterno\", y (Proverbios 20:24): \"¿Como puede el hombre entender su camino?\" Por lo tanto, el hombre debe darse cuenta de esto para arrepentirse, y no considerar estos simples acontecimientos como causados por la naturaleza o el azar. ¿Cual es la minima medida para que algo sea considerado como un sufrimiento? Ensenaron los Sabios que aun hasta coserte un vestido que no te sienta bien, o ponerte la blusa al reves."},{"id":"p86-b1","pageNumber":86,"indexInPage":1,"text":"Incluso ordenar una bebida caliente en un restaurante y recibir una fria, o lo contrario. O cuando quieres sacar tres monedas de tu bolsillo y te salen solo dos, esto tambien se considera un sufrimiento... Debe penetrar bien en el corazon del hombre, la creencia que cada alegria y felicidad, pena o dificultad, no es ni un azar ni un error sino que esta todo dirigido desde lo Alto, segun sus propias acciones."},{"id":"p86-b2","pageNumber":86,"indexInPage":2,"text":"Aunque el principal Juicio del hombre es en el primer día del año, hay veinticuatro Tribunales en el Cielo, que juzgan al hombre en cada hora del día uno según sus acciones... Un hombre que atribuye sus sufrimientos a la naturaleza o al azar, o se culpa a si mismo, comete un gran error que solo le engendra frustracion y amargura y ademas, invoca sobre el la ira Divina. ¿A que es esto comparable?"},{"id":"p86-b3","pageNumber":86,"indexInPage":3,"text":"A un nino castigado por su padre que, en lugar de obedecer y corregir sus acciones, acusa y rine con su hermano, entonces su padre se enoja todavia mas con el y le dice: \"¿No solo no me obedeces para corregir tus acciones, sino que ademas, rines con tu hermano?\"."},{"id":"p86-b4","pageNumber":86,"indexInPage":4,"text":"Y existe otra concepcion suplementaria erronea y muy difundida, cuando el hombre verdaderamente cree que todo esta bajo la Supervision Divina, pero siente que el Creador se equivoca en su Juicio y no se conduce justamente con el, piensa que no puede afrontar la prueba a la que esta sometido. En otras palabras, el discute la veracidad del Juicio Divino. Por ejemplo, la mayoria de los hombres dicen que no pueden servir al Creador debido a su falta de subsistencia."},{"id":"p86-b5","pageNumber":86,"indexInPage":5,"text":"Segun ellos, el Creador es injusto exigiendo que actuen por encima de sus fuerzas. Pero la verdad es que el Creador no demanda nada que el hombre no es capaz de cumplir. Cada uno debe creer que el Creador es Justo y que Su Juicio es recto. El no viene con quejas a Sus criaturasy no le exige al hombre que actue por encima de sus fuerzas. El Creador sabe perfectamente"},{"id":"p86-b6","pageNumber":86,"indexInPage":6,"text":"la exacta posicion espiritual de cada uno y que condiciones necesita para la correccion de su alma. Debemos saber que nunca recibiremos una prueba que no podamos superar, aunque nos parezca invencible. Debemos apartar nuestra propia razon e inteligencia y creer que la conducta y los Juicios del Creador son justos. Debemos reconocer que necesitamos atravesar los acontecimientos y dificultades que el Creador nos trae en este mundo, tanto la riqueza como la pobreza, o la intensificación de los malos deseos y pensamientos."},{"id":"p86-b7","pageNumber":86,"indexInPage":7,"text":"En vez de entender que el Creador es Justo y Recto y que toda Su intencion es acercarlos a El, como esta escrito (Proverbios 3, 12): \"El Eterno reprende a quien ama\", las personas se equivocan y piensan que El los castiga sin causa. En lugar de despertarse, de arrepentirse y acercarse al Creador, ellos caen en la herejia, piensan que no los ama e incluso se enojan con El. Existen historias de personas que despues de haber sufrido penas y tribulaciones, se rebelaron contra el Creador y Sus Juicios, creyendo que El estaba en su contra."},{"id":"p86-b8","pageNumber":86,"indexInPage":8,"text":"La regla general es la siguiente - asi como debemos creer que todo lo que nos llega proviene del Creador, asi debemos tambien creer con completa fe que el Creador es justo y recto y que ninguna injusticia proviene de El. Debemos entender muy bien que todas las pruebas, sufrimientos y Juicios son una manifestacion de Su gran misericordia, ¡cuya finalidad es acercarnos a El, no alejarnos!"},{"id":"p86-b9","pageNumber":86,"indexInPage":9,"text":"La inmensa Misericordia del Creador Como se ha dicho, el camino para llegar a ser un justo es muy largo, y la pregunta es: ¿Que debe hacer el hombre hasta llegar al completo arrepentimiento, ya que todavia fracasa con pecados y transgresiones? ¿Como abstenerse del Juicio diario y de las tribulaciones que llegan por su causa? Al fin de cuentas, todo hombre desea arrepentirse y cumplir la Voluntad Divina con perfeccion, pero la senda es forzosamente larga; ¿acaso esta condenado a sufrir hasta lograr el arrepentimiento completo?"},{"id":"p86-b10","pageNumber":86,"indexInPage":10,"text":"La repuesta es - no. En su clemencia infinita, el Todopoderoso nos ha dado un gran consejo: si el hombre realiza un \"Auto-juicio\", es decir que se juzga a si mismo cada dia, no sera juzgado por el Tribunal Celeste, dado que el Creador no permite un doble juicio por la misma acusacion, en otras palabras, \"Cuando hay Juicio en la Tierra, no hay Juicio en el Cielo\". Esto tambien ensena el sagrado libro del Zohar, que cuando el hombre se"}],"rawCharCount":4811},{"pageNumber":87,"blocks":[{"id":"p87-b0","pageNumber":87,"indexInPage":0,"text":"juzga a si mismo, es decir que cada dia hace un examen de conciencia, confiesa sus pecados al Creador, pide Su perdon, se compromete a no reincidir, entonces no es juzgado por los Tribunales Celestes sino que el Creador lo juzga personalmente, sin Su tribunal. Existe una gran diferencia entre cuando el Creador juzga al hombre y cuando un Tribunal Celeste lo juzga. Mientras que los Tribunales Celestes juzgan con severidad ycon justicia estricta, segun la letra de la ley, los Juicios del Creador son misericordiosos y clementes."},{"id":"p87-b1","pageNumber":87,"indexInPage":1,"text":"Cuando el hombre es juzgado por medio del Tribunal Celeste, casi siempre es declarado culpable. Cuando el Creador juzga al hombre, él es siempre declarado inocente, y no solo eso, sino que tambien es recompensado por su arrepentimiento. Por lo tanto, si deseamos evitarnos sufrimientos y tribulaciones, debemos aprender como conducir el \"Auto-juicio\", juzgandonos frente al Creador, lo que significa dedicar sesenta minutos por dia en un lugar aislado y tranquilo para rezar una plegaria personal y realizar un examen de conciencia."},{"id":"p87-b2","pageNumber":87,"indexInPage":2,"text":"Debemos examinar cada pensamiento, palabra y accion. Si descubrimos que no actuamos como es debido, todo lo que tenemos que hacer es arrepentirnos como aclararemos mas adelante. Si cumplimos con lo anterior, podemos estar seguros que tambien sobre nosotros no habra unJuicio en el Cielo."},{"id":"p87-b3","pageNumber":87,"indexInPage":3,"text":"Nota: Es importante aclarar que cuando hablamos de juzgarse a si mismo, no significa castigarse o multarse, sino aclararse a si mismo la verdad, y como explicamos anteriormente,examinar si su comportamiento fue adecuado, o no, y simplemente arrepentirse. Con la ayuda del Creador explicaremos mas adelante las reglas del \"Auto-juicio\". Cada persona, hombre o mujer, viejo o joven, debe tomarse una hora entera de \"Hitbodedút\" – \"Plegaria Personal en 'Aislamiento'\" cada día..."},{"id":"p87-b4","pageNumber":87,"indexInPage":4,"text":"El hombre que cada dia se aparta una hora para aislarse con el Creador, en el crucial Juicio anual de comienzo del ano nuevo, lograra un veredicto favorable, pues ya se arrepintio de sus pecados cada dia del ano. Tambien, ¡le estara asegurado que dejara inocente este mundo y no vera el Infierno! Un gran Sabio enseno a sus discipulos que el hombre debe arrepentirse un dia antes de su muerte, para morir sin pecados. Le preguntaron sus discipulos: \"¿Pero quien puede saber cuando morira?\". Les respondio: \"Esta"},{"id":"p87-b5","pageNumber":87,"indexInPage":5,"text":"es la explicacion del versiculo (Eclesiastes 9:8): 'En todo tiempo sean blancos tus vestidos' - tener la ropa siempre blanca significa estar siempre 'limpio' de pecados. ¿Y como realizamos esto? Arrepintiendonos hoy, pues quizas moriremos manana. Asi, viviremos constantemente en arrepentimiento\". ¡Mira cuan misericordioso es el Creador del Universo, dandole al hombre la posibilidad de juzgarse a si mismo, y evitarse asi el castigo. ¡Pero no solo eso, sino tambien la de ser recompensado por arrepentirse!"},{"id":"p87-b6","pageNumber":87,"indexInPage":6,"text":"Cada uno debe meditar sobre esto verdaderamente - si en este mundo las autoridades judiciales le darian al inculpado la posibilidad de confesar sus transgresiones, ser perdonado y otorgarle un premio, ¿habria alguien que no la aprovecharia? He aqui una parabola que demuestra como seria este mundo, si la justicia mundana fuera como la Celestial: Un hombre esta manejando su automovil, y pasa el semaforo en rojo."},{"id":"p87-b7","pageNumber":87,"indexInPage":7,"text":"De pronto ve en su espejo retrovisor luces oscilantes y escucha la sirena conocida de la policia senalandole parar a un costado... El conductor para inmediatamente, sale de su coche y empieza a arrepentirse diciendo: \"Señor del Universo, me confieso frente a Ti por haber transgredido deliberadamente las leyes de tráfico y haber avanzado con luz roja. Lo lamento y pido Tu disculpa por haber realizado un acto tan irresponsable, poniéndome a mí mismo y a los demás conductores en peligro, prometo nunca más reincidir mientras viva."},{"id":"p87-b8","pageNumber":87,"indexInPage":8,"text":"¡Por favor perdóname! Al haber escuchado su confesion, remordimiento y peticion de perdon, la cara severa del policia se calma y se dirige al hombre con una calida sonrisa en los labios diciendole: \"Debe saber senor, que al principio pense castigarle con la maxima multa, revocar su licencia de conducir y convocarle al tribunal de justicia. Pero veo que se arrepintio, y por lo tanto... todo le esta perdonado. Ah, y otra cosa mas, usted se merece una recompensa por haberse arrepentido."},{"id":"p87-b9","pageNumber":87,"indexInPage":9,"text":"\"¡Sin demora, el policia saca de su bolsillo un talonario de cheques, y redacta delante del conductor un cheque de cien mil dolares, colmandole de numerosas bendiciones y deseandole un buen viaje! Si nuestro mundo se condujera de esta forma, ¿existiria un conductor que no se arrepintiera en vez de que su licencia sea revocada, recibiendo una gran multa y una convocatoria al tribunal y perdiendose asi los cien mil dolares por su arrepentimiento? ¿Existe en el mundo un ser tan"}],"rawCharCount":4757},{"pageNumber":88,"blocks":[{"id":"p88-b0","pageNumber":88,"indexInPage":0,"text":"tonto? ¡Exactamente asi se conduce el mundo espiritual! El Creador del Universo le ha dado al hombre la posibilidad de arrepentirse despues de todo pecado cometido, ¿es posible entonces no tomar provecho del mas grande regalo que un ser humano podria recibir? ¿Como se puede entonces no hacer cada dia una hora de examen de conciencia para verificar tus acciones desde la vispera hasta ahora, con el fin de corregirlas evitando asi el Juicio Celeste? ¿Que puedes decir, que no tienes tiempo?"},{"id":"p88-b1","pageNumber":88,"indexInPage":1,"text":"¿que no sabes de que hablar durante una hora entera? ¿acaso no cometes transgresiones? ¿acaso eres un perfecto Justo? - ¡¿Podra haber un hombre que entienda esto y a pesar de todo no se aisle en plegaria cada dia, prefiriendo sufrir en este mundo y en el venidero a causa de sus transgresiones, y renunciando a la gran recompensa del Precepto del arrepentimiento?!"},{"id":"p88-b2","pageNumber":88,"indexInPage":2,"text":"El Creador, en Su clemencia, nos ha dado un camino facil para retornar hacia El, como dijo el profeta (Oseas 14:3): \"Tomad con vosotros palabras, y retornad al Eterno\" - ¡todo lo que se necesita es decir unas palabras! El proceso del arrepentimiento consiste en hablarle al Creador diciendole palabras de confesion, remordimiento, perdon, plegaria y suplicas."},{"id":"p88-b3","pageNumber":88,"indexInPage":3,"text":"¿Que hombre seria tan indolente que se obstinaria en no cumplir este privilegio, quedandose con las numerosas acusaciones en su contra que le causan tantos sufrimientos en este mundo, sin hablar de la cuenta abierta que le esperara en el Mundo Venidero? Por consiguiente, con la ayuda del Todopoderoso, aprenderemos como arrepentirnos y como juzgarnos correctamente cada dia, con el fin de ser inocentes toda la vida."},{"id":"p88-b4","pageNumber":88,"indexInPage":4,"text":"El único consejo Cada persona, hombre o mujer, viejo o joven, debe tomarse una hora entera de \"Hitbodedút\" - \"Aislamiento\" - cada dia, donde se arrepentira y rezara al Creador. Esta hora puede ser escogida segun su conveniencia, de dia o de noche. El lugar no importa, con tal que sea comodo y retirado, como un jardin, un bosque, un cuarto privado, un balcon, etc. Lo esencial es que el hombre este solo con el Creador, sin interferencias y sin ser distraido."},{"id":"p88-b5","pageNumber":88,"indexInPage":5,"text
