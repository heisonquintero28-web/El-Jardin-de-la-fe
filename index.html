areceria que sus mentes no estan enredadas completamente, ciertamente estan confundidos y asustados; no tienen descanso, y estan hundidos en la tristeza, en la desesperacion, el enojo, etc. que esto mismo es tambien un tipo de locura, aunque todavia se comportan, mas o menos, como la gente comun."},{"id":"p60-b2","pageNumber":60,"indexInPage":2,"text":"Por lo tanto, el consejo principal al que se le deterioraron los humores del cuerpo es, que empiece desde ahora a proteger sus ojos, y especialmente su mente, que no la deje vagar por los apetitos, malos pensamientos y locuras. Y el que no logra detener sus pensamientos, es bueno que los enfoque incluso en asuntos materiales, como por ejemplo: trabajo, arte etc. Como es sabido es esta una de las medicinas para los locos, darles una ocupacion que mantenga ocupados sus cerebros, y detenga sus pensamientos de vagar y volar sin control."},{"id":"p60-b3","pageNumber":60,"indexInPage":3,"text":"Y lo principal, como fue dicho anteriormente, es ocuparse en el estudio de la Tora con esfuerzo, que tiene el poder de curar el insano de sus muchos apetitos. Esta es la ventaja del estudio de la Tora sobre cualquier otra ocupacion, porque ademas de detener el vagabundeo del pensamiento del hombre, tambien expulsa el espiritu de tonteria mediante los sagrados Nombres que contiene. Y tambien por su intermedio le advierte y atemoriza de pecar y de conducirse con locura."},{"id":"p60-b4","pageNumber":60,"indexInPage":4,"text":"Como se ha dicho anteriormente, uno de las mas graves problemas del loco es, que el no reconoce su locura."},{"id":"p60-b5","pageNumber":60,"indexInPage":5,"text":"Por esto, antes de todo, debe dejar su orgullo y confesar la verdad, que su mente esta enredada y confundida; anular su mente frente a los duenos de la verdadera inteligencia, es decir, los Justos que ensenan la autentica inteligencia de la Tora; debe rezar y pedir al Creador la curacion de su alma y su espiritu; pedira perdon por lo que dano su cerebro, que es la morada del alma; pedira tambien tener completa fe en los Justos y en los Guias de la generacion, que les pueda obedecer sin desviarse de lo que dicen ni a izquierda ni derecha; debe pedir mucho tener alegria que ella es el buen espiritu, que por medio de ella pueda eliminar todos los malos espiritus – de impudicia, tristeza, espiritu de orgullo, etc., y que merezca estar siempre alegre, cantando y entonando melodias de alegria."},{"id":"p60-b6","pageNumber":60,"indexInPage":6,"text":"Porque la alegria y el canto son una gran curacion para todas las enfermedades, y especialmente las enfermedades de la mente. Y debido a que en nuestra generacion se multiplicaron las enfermedades del espiritu, por esto el consejo de la alegria es relevante para todos; y se debe aumentar las plegarias, y pedirle del Creador fe, alegria y confianza en El. Y por supuesto que el que aumente sus plegarias sobre la alegria, lograra el buen espiritu y la clara fe."},{"id":"p60-b7","pageNumber":60,"indexInPage":7,"text":"Según la fe debe cada uno saber que el Creador alimenta a todas sus criaturas, \"desde los huevos de los piojos hasta los cuernos de los antílopes\", y con mayor razón al hombre... El sustento del hombre depende de su grado de confianza en el Creador. La manera de lograr esta confianza es por medio de la fe. El hombre que tiene dificultades con su sustento, debe trabajar esencialmente sobre su fe y confianza en el Creador."},{"id":"p60-b8","pageNumber":60,"indexInPage":8,"text":"Segun la fe debe cada uno saber que el Creador alimenta a todas las criaturas, \"desde los huevos de los piojos hasta los cuernos de los antilopes\", y con mayor razon al hombre. Dijeron los Sabios \"El que da vida – da tambien la manutencion\", que significa que el que cree que el Creador es el que da vida, debe tambien creer que todo tiempo que el Creador quiere que el viva – le dara con que vivir. Pero, si El no quiere que viva, no necesita sacarle su manutencion para que muera, sino que El puede tomar su alma de cualquier manera."},{"id":"p60-b9","pageNumber":60,"indexInPage":9,"text":"Por lo tanto, el hombre que posee fe completa, sabe que el Creador lo Supervisa tambien en el sustento, esto se llama que posee completa confianza en el Creador. Y por supuesto este hombre no tiene ninguna preocupacion por su sustento, pues el sabe que no es su rol inquietarse por esto, sino que es el rol del Creador, y ciertamente que El lo cumple con fidelidad. La senal evidente del hombre que posee la confianza en el Creador es que jamas piensa en el dinero y con mayor razon, no se preocupa por el."},{"id":"p60-b10","pageNumber":60,"indexInPage":10,"text":"Cuando le falta sustento, cree que su falta proviene del Creador y no culpa a nadie – ni a si mismo – por su falta de subsistencia."},{"id":"p60-b11","pageNumber":60,"indexInPage":11,"text":"Cuando tiene el hombre una perdida de dinero de cualquier forma que sea, si le fue robado, o perdio algo, o se le deterioro un aparato valioso, etc. debe creer que esto proviene del Creador (primera regla de la fe: \"Asi el Creador quiere\"); y debe creer que es para su bien (segunda regla: \"Todo es para bien\"); debe examinar sus actos para ver lo que tiene que corregir (tercera regla: \"El Creador me manda un mensaje\"); porque no hay sufrimientos sin"}],"rawCharCount":5125},{"pageNumber":61,"blocks":[{"id":"p61-b0","pageNumber":61,"indexInPage":0,"text":"pecados, y hay pecados que por su causa le llega al hombre falta de sustento, como esta explicado largamente en el libro \"En el jardin de la riqueza\" del autor de este libro. Traeremos algunos ejemplos de \"El libro de los Atributos\" (\"Sefer HaMidot\"): \"Al que se le perdio alguna cosa, es sabido que cayo su fe\". \"Al que mezcla con agua las bebidas que vende, le llegan ladrones\". \"Por ocuparse con cosas vanas (como por ejemplo: mirar la TV o leer diarios etc.) le llegan ladrones."},{"id":"p61-b1","pageNumber":61,"indexInPage":1,"text":"\"Por medio de escuchar tonterias (como la TV, etc. segun se mencionara) llegan ladrones\". \"Por medio de la mentira llegan ladrones\". Encontramos que el creyente, que sabe que el Creador es el unico Sostenedor, cuando le llega una reduccion o falta de sustento, se conduce por el camino de la Tora y de la fe para completar sus privaciones."},{"id":"p61-b2","pageNumber":61,"indexInPage":2,"text":"Se arrepiente por los pecados que causan la disminucion del sustento, y reza y pide misericordia al Creador, que lo sostenga y que le complete la falta, como esta explicado largamente en el libro del autor mencionado arriba. Y el logra pasar todo en paz; y lo principal – logra el merito de recibir el conocimiento de la confianza en el Creador, que lo acompanara toda su vida."},{"id":"p61-b3","pageNumber":61,"indexInPage":3,"text":"\"Con el sudor de tu rostro...\" Pero si, que Di-s nos guarde, le falte fe, entonces el hombre atribuye su falta de sustento a todo tipo de causas – se inculpa a si mismo o a otros, o piensa que le hicieron mal de ojo o un embrujo, o lo atribuye a su falta de suerte, o piensa que el Creador no lo ama etc. etc. Piensa en cada designio posible que existe para justificar su privacion –excepto en el unico consejo, que verdaderamente le podra ayudar – la plegaria."},{"id":"p61-b4","pageNumber":61,"indexInPage":4,"text":"Dia y noche hace calculos y planes, como: tomar prestado dinero, o mudarse al exterior, o aumentar su trabajo \"desde la salida del sol hasta la salida del alma\", y sobre esto dijo el Sabio Israel Salanter, que el que trabaja horas extraordinarias, persigue la maldicion escrita en la Tora (Genesis 3:19): \"Con el sudor de tu rostro comeras pan\". Este hombre desgraciado, no tiene reposo no en este mundo y no en el mundo venidero. \"No hurtarás\" A veces decae tanto la fe del hombre , que piensa como ganar el sustento en forma prohibida:"},{"id":"p61-b5","pageNumber":61,"indexInPage":5,"text":"fraudes, mentiras y robos... Por supuesto, que cada hombre razonable, que posee un minimo de fe, cree que el Creador es el que da el sustento, que cada dinero que tiene que llegar a su mano, le llegara de una manera completamente permitida. Y debe sabe con claridad, que cada dinero que le llega en forma prohibida - no contiene ninguna bendicion, y dana tambien al que lo posee ganado honestamente, como la manzana podrida que arruina a las otras manzanas en el canasto."},{"id":"p61-b6","pageNumber":61,"indexInPage":6,"text":"Ese tipo de dinero solo trae con el un diluvio de angustias y de sufrimientos, que Di-s nos salve. Confianza en el Creador Como fue dicho, el consejo esencial para problemas de sustento, es adquirir la confianza en el Creador. Por esto, un camino comprobado para obtener sustento facilmente, es aprender en el libro \"Deberes de los corazones\" el capitulo \"Seccion sobre la Confianza\"."},{"id":"p61-b7","pageNumber":61,"indexInPage":7,"text":"El hombre lo aprendera en la forma siguiente: en el primer dia aprendera un parrafo de quince lineas, y lo repetira cuatro veces; al dia siguiente estudiara el parrafo siguiente, y tambien lo repetira cuatro veces. Y asi seguira cada dia hasta que terminara el capitulo, y de nuevo empezara a estudiarlo desde el principio en la forma mencionada, hasta el final. Y asi seguira de vuelta una vez tras otra hasta lograr por medio de esto adquirir el atributo de la confianza – que es el principal instrumento para conseguir el sustento."},{"id":"p61-b8","pageNumber":61,"indexInPage":8,"text":"Ademas, despues de cada estudio rezara sobre su necesidad, y se le cumplira lo que dijeron los Sabios (Tratado Brajot, 63): \"A todo aquel que asocia el nombre del Creador con su pesar, se le multiplica su sustento\". Debes saber, que el que verdaderamente quiere solucionar sus problemas de sustento de raiz, debe rezar solamente con fe y confianza, y entonces no debera pedir por el."},{"id":"p61-b9","pageNumber":61,"indexInPage":9,"text":"Porque cuando el hombre pide sustento, eso le ayuda solo por ahora, como un remiendo en el vestido, pero eso no le resuelve el problema de raiz; despues de un tiempo se encontrara a si mismo otra vez ocupado con problemas de sustento. Contrariamente, si rezara y pidiera al Creador que le de fe y confianza, resolvera sus problemas de manutencion para siempre."},{"id":"p61-b10","pageNumber":61,"indexInPage":10,"text":"Porque como fue dicho, el instrumento para tener sustento es la confianza en el Creador, y si lograra fe y confianza tendra el instrumento que por su intermedio tendra facilmente sustento toda su vida. Un hombre cuya situacion es muy apretada y esta hundido en deudas, debe hacer mucho aislamiento, por lo menos una hora cada dia, donde se arrepentira por el pecado por cuya causa se endeudo. Pedira al Creador que"}],"rawCharCount":4742},{"pageNumber":62,"blocks":[{"id":"p62-b0","pageNumber":62,"indexInPage":0,"text":"le de fe y confianza, hasta lograr construirse a si mismo instrumentos de confianza, y asi podra recibir sustento en abundancia solamente mediante la plegaria. Llegó una época en Polonia de crisis económica, y el piadoso Isaac fue despedido de su empleo. Eso les tomó a su familia y a él por sorpresa, pero él no perdió la calma... La preocupación y la fe no van juntos Una vez llego al maestro, autor de este libro, un estudiante de la Tora, y le conto sobre las dificultades de sustento que tenia."},{"id":"p62-b1","pageNumber":62,"indexInPage":1,"text":"Le dijo el maestro: \"¡Reza por la fe!, ¡Te falta fe!\" Se sorprendio el estudiante: \"¿¡Yo falto de fe?! ¡Yo tengo fe! Pero es que estoy preocupado que sera de los ninos, los pagos, las deudas...\" Le dijo el maestro: \"¡Que tus oidos escuchen lo que habla tu boca! ¡¿Tu dices que tienes fe, y al mismo tiempo dices que te preocupas?! Es una contradiccion. Si tienes fe, como es posible que estes preocupado? ¡Un hombre que tiene completa fe, cree que el Creador lo sostiene, y no tiene ninguna preocupacion!"},{"id":"p62-b2","pageNumber":62,"indexInPage":2,"text":"¿En tu vida viste a un nino que se preocupe de donde le llegara su sustento? Claro que no. ¡Cada nino sabe, que no es su rol mantenerse, sino que es el rol de su padre mantenerlo, y el confia en que su padre lo haga! De esta misma manera el creyente sabe, que no es su rol mantenerse, sino que es el rol de su Padre en el Cielo, y que seguramente El le traera sustento. Lo que tu debes saber es que tu rol es unicamente – servir al Creador y arrepentirte, y la preocupacion por el sustento dejasela a El."},{"id":"p62-b3","pageNumber":62,"indexInPage":3,"text":"Habla con el Creador y dile: \"Amo del universo, no tengo ninguna otra direccion excepto Tu, porque Tu eres El que da el sustento y nadie mas; y ciertamente que mi sustento no esta en mis manos. Y por esto, no es mi preocupacion pensar de donde vendra mi manutencion, y tampoco me interesa."},{"id":"p62-b4","pageNumber":62,"indexInPage":4,"text":"Has Tu lo que es bueno a Tus ojos, solo ayudame a creer que esta es la verdad, tener confianza en Ti, y aceptar Tu conduccion con alegria y fe, y siempre acercarme a Ti.\" Cuando el hombre cree con completa fe que el Creador es la unica direccion que tiene para dirigirse con el tema del sustento, enseguida siente la seguridad que El no lo abandonara. Cree, que todo el sustento que consiguio hasta hoy, llego del Creador, bendito sea, y de por si, cree que el Creador continuara manteniendolo siempre."},{"id":"p62-b5","pageNumber":62,"indexInPage":5,"text":"\" Aquel que confía en el Eterno – le rodea bondad\" (Salmos 32:10) El hombre debe creer que el Creador es el que lo alimenta y mantiene, sin ninguna relacion con su esfuerzo o rectitud. Y debe ver frente a sus ojos el"},{"id":"p62-b6","pageNumber":62,"indexInPage":6,"text":"ejemplo del nino y su padre. ¿Acaso cuando el hijo no se comporta como se debe, su padre deja de sostenerlo? ¿de alimentarlo? ¿de vestirlo? Y si asi es con los seres de sangre y hueso, con mayor razon con el Creador que esta lleno de misericordia y bondad, sostiene a sus criaturas y les provee sus necesidades, sin ninguna relacion con sus rectitud."},{"id":"p62-b7","pageNumber":62,"indexInPage":7,"text":"Y como se dice en la plegaria: \"Que sostiene a los seres con bondad…\" y no sostiene a los seres vivientes por su rectitud… Como dijeron los Sabios: \"El que da vida – da tambien la manutencion\", que significa sin ninguna condicion."},{"id":"p62-b8","pageNumber":62,"indexInPage":8,"text":"Por lo tanto, El hombre que tiene dificultades con su sustento, debe examinar sus actos, quizá tiene en sus manos pecados que aflijan directamente su sustento, por ejemplo: hurto, robo, eyaculacion de esperma en vano, enojo, tristeza e inquietud, impedimento de embarazo sin una verdadera y autorizada causa y mas – estos son muy graves pecados, y llegan ciertamente por una gran falta de fe."},{"id":"p62-b9","pageNumber":62,"indexInPage":9,"text":"Si es culpable de alguno de ellos o mas, debe confesarlo frente al Creador, pedir disculpas y rectificar sus acciones; y principalmente debe rezar con fe y temor a Di-s. Si no es culpable de uno de esos pecados, debe saber que le insinuan desde el Cielo una falta de fe y confianza en general."},{"id":"p62-b10","pageNumber":62,"indexInPage":10,"text":"Debe empezar y centralizar todas sus fuerzas para trabajar sobre la fe de todas maneras – aprender mucho sobre la fe, rezar mucho, pedir al Creador que le de fe, y hacer cada dia examen de conciencia si hay un defecto en ella y arrepentirse por su falta. Debes saber que el sustento es el examen principal de la fe del hombre."},{"id":"p62-b11","pageNumber":62,"indexInPage":11,"text":"Porque en esto es imposible enganar y representar – o en verdad tu crees que el Creador te mantiene, y no tienes ninguna preocupacion; o estas ocupado con esfuerzos e inquietudes, lo que significa que estas muy lejos de la fe. Se cuenta sobre el famoso devoto Isaac Breiter, que durante muchos anos trabajaba como el contable de un importante comercio en Varsovia, con ese cargo se mantenia beneficiosamente, y podia ocuparse del servicio al Creador con tranquilidad y seguridad."},{"id":"p62-b12","pageNumber":62,"indexInPage":12,"text":"Pero llego una epoca en Polonia de crisis economica antes de la guerra mundial, y el piadoso Isaac fue despedido de su empleo. Eso les tomo a su familia y a el por sorpresa, pero el no perdio la calma. Y cuando vio que la situacion no le posibilitaba conseguir otro sustento, se sento en la casa de estudios y se ocupo en el estudio de la Tora y la plegaria con mucha constancia. El calculo que hizo fue el siguiente: Visto que es el rol del Creador sostenerlo, mientras que su rol"}],"rawCharCount":5065},{"pageNumber":63,"blocks":[{"id":"p63-b0","pageNumber":63,"indexInPage":0,"text":"es servir al Creador, entonces, si el Creador no lo sostiene es debido a que el no cumple su rol como se debe, y debe esforzarse en cumplir mejor su parte. Es decir, estudiar mas, rezar mas, creer mas y confiar mas en El. A medida que la situacion economica se hizo mas grave, asi el se esforzo con mas dedicacion y con mas fuerza al estudio de la Tora y la plegaria, mientras se apoyaba con gran confianza en el Creador que lo sustentaria."},{"id":"p63-b1","pageNumber":63,"indexInPage":1,"text":"Y asi fue, que durante esa epoca, en la cual todos sufrian la grave crisis economica, recibieron el y toda su familia su alimento en forma sobrenatural. En uno de esos dias, cuando estaba sentado solo en la casa de estudios, entro un hombre a quien no conocia, y le dio una limosna importante para su sustento. Isaac el piadoso no se conmovio, le agradecio al hombre y volvio a su estudio. El hombre que ya se habia dado vuelta para irse, se volvio, parose frente al piadoso Isaac y le dijo: \"Una pregunta no me deja tranquilo."},{"id":"p63-b2","pageNumber":63,"indexInPage":2,"text":"Esta escrito (Salmos 37:25): \"He sido joven y tambien envejeci, y jamas he visto a un justo abandonado y su simiente mendigando pan\". Entonces, ¿como es posible que un justo como tu, que se ocupa dia y noche al servicio de Di-s, necesita mendigar pan de otros?\" Le contesto Isaac el piadoso: \"Sal ahora al mercado, ve al negocio de un rico comerciante, mira a su hijo parado en la entrada proclamando su comercio, y persuadiendo a los paseantes a entrar en su negocio y ver su buena mercaderia."},{"id":"p63-b3","pageNumber":63,"indexInPage":3,"text":"El muchacho se esfuerza mucho, hasta que consigue seducir a alguien comprar la mercaderia de su padre – acaso no es el simiente de ese hombre mendigando pan? Pero yo, estoy sentado en la casa del estudio ocupandome del servicio al Creador, ¿acaso yo te llame aqui? ¿O acaso te pedi alguna vez sustento?"},{"id":"p63-b4","pageNumber":63,"indexInPage":4,"text":"Tu mismo por tu libre albedrio llegaste aqui y me diste mi alimentacion…\" Dijeron los Sabios, que cuando el hombre cree que el Creador es el que sustenta, el es digno del mas alla, y como esta explicado en la Guemara (Tratado Brajot, 4) que todo el que recita el \"Salmo de alabanza de David\" (Salmos 145) tres veces por dia, tiene la seguridad que merecerá estar en el mundo venidero."},{"id":"p63-b5","pageNumber":63,"indexInPage":5,"text":"La razon es que en este salmo se manifiesta la fe y confianza en el Creador, que El es el que alimenta y sostiene, como esta escrito: \"Abres Tu mano y satisfaces a todo lo viviente segun su deseo\". Por lo tanto, tambien la esencia del sustento es la fe. Y al contrario – la preocupacion es la causa principal que hace perder el sustento."},{"id":"p63-b6","pageNumber":63,"indexInPage":6,"text":"Escribieron los Sabios sobre la relación entre la fe y el sustento (De \"El libro de los Atributos): \"Cada hombre que tiene verdadera fe – finalmente enriquece\". \"Mediante la fe se aumenta el sustento\". \"La alegria constante (la alegria es la manifestacion de la fe) es propicia al exito\". \"Todo el que asocia el nombre del Creador a su pesar, se le multiplica su sustento y tambien le llega el sustento facilmente como el vuelo un pajaro\". \"La fe es beneficiosa para el sustento."},{"id":"p63-b7","pageNumber":63,"indexInPage":7,"text":"Mira el comentario de Rashi sobre el versiculo (Salmos 37:3): \"…y cultivaras la fe\": que te alimentaras y te sustentaras gracias a la fe\". \"El que no tiene sustento, debe ocuparse con el estudio de la Tora, y despues rezar por el sustento. Seguramente su plegaria sera recibida\". \"Mediante la herejia se llega a la pobreza\". \"La tristeza (falta de fe) causa la perdida del sustento\". Encontramos, que lo esencial del trabajo del hombre debe ser sobre la fe. Y por medio de esto merecera sobreponerse a todas sus privaciones."},{"id":"p63-b8","pageNumber":63,"indexInPage":8,"text":"\"He aquí que existe una transgresión cuyo castigo es que el hombre siempre sea un deudor. Incluso todo subterfugio posible y acciones que realice no le ayudarán...\" El hombre que debe dinero tiene una prueba de fe. El puede acusarse a si mismo o a otros, o a distintos factores como la suerte etc., que son segun su opinion las causas de sus deudas; o puede vivir segun las reglas de la fe – asi lo quiere el Creador, todo es para bien, y no existen sufrimientos sin pecados."},{"id":"p63-b9","pageNumber":63,"indexInPage":9,"text":"Es decir el atribuye sus deudas economicas a sus pecados, y sabe que el unico consejo para salir de ellas es por medio del arrepentimiento, como esta escrito (Conversaciones de Rabi Najman ,conversación No. 112): \"He aqui que existe una transgresion cuyo castigo es que el hombre siempre sea un deudor. Incluso todo subterfugio posible y acciones que realice no le ayudaran, seguira siendo siempre un deudor. Y a veces esa transgresion causa que otros sean tambien deudores\"."},{"id":"p63-b10","pageNumber":63,"indexInPage":10,"text":"Hubo ciertos periodos en los cuales se propagaron deudores en el mundo, y a esto se debe que esta transgresion se intensifico en el. El consejo contra esto es retornar al Creador, suplicarle que nos salve de esa transgresion, y arrepentirse de ella. Y el momento adecuado para"}],"rawCharCount":4713},{"pageNumber":64,"blocks":[{"id":"p64-b0","pageNumber":64,"indexInPage":0,"text":"arrepentirse es cuando el hombre esta \"alto de espiritu\", entonces es bueno arrepentirse y pedirle al Creador; porque el estado de \"bajo de espiritu\" es el que corresponde a un deudor. Dijeron los Sabios, de bendita memoria (Tratado Kidushin, 49b): \"Diez porciones de sueno descendieron al mundo, nueve tomaron los esclavos\", el sueno corresponde al estado de \"bajo de espiritu\"; los esclavos estan representados en el versiculo \"el deudor es el esclavo del prestamista\" (Proverbios 2:7)."},{"id":"p64-b1","pageNumber":64,"indexInPage":1,"text":"Y por esto cuando el hombre esta en estado de \"alto de espiritu\", ese es el momento para arrepentirse y anular el castigo del deudor, que es la representacion del estado \"bajo de espiritu\". Encontramos que el hombre que tiene deudas economicas, debe esforzarse con todas sus fuerzas en estar alegre. Entonces, cuando su mente esta liberada y en estado de \"alto de espiritu\", se arrepentira de la transgresion por la que fue castigado a ser un deudor."},{"id":"p64-b2","pageNumber":64,"indexInPage":2,"text":"Tambien debe examinar todas sus acciones y buscar otras causas por las que le llega la falta de sustento, y tambien se arrepentira por ellas. Negocios La vida de un hombre de negocios que no tiene fe, no es vida. Una vez, un hombre de negocios se presento al maestro, autor de este libro. El maestro observo que estaba triste por causa de sus problemas financieros y le dijo: \"Todo lo que sufres por tus negocios es debido a que piensas que eres el dueno de tus actividades comerciales."},{"id":"p64-b3","pageNumber":64,"indexInPage":3,"text":"Por eso mismo estas tenso y preocupado como si fuera que todo el peso y la responsabilidad estan sobre tus hombros. Y por causa que confias en tu inteligencia, sentidos, y tu conocimiento en los negocios, te desilusionas por cada cosa que no sale como quieres; y te sientes lastimado cuando descubres que las personas en la que confiaste son estafadores y traidores."},{"id":"p64-b4","pageNumber":64,"indexInPage":4,"text":"Si supieras que el Creador es el Dueno de tus negocios, y tu eres solo Su empleado, hubieras hecho tu trabajo en la mejor forma, como todo trabajador leal y toda la tension bajaria."},{"id":"p64-b5","pageNumber":64,"indexInPage":5,"text":"Y cuando irias a completar una transaccion, te dirigirias al Creador y le dirias: Creador de mundo, yo deseo conducir Tu negocio en la mejor forma, pero como esta escrito \"El hombre ve el exterior, mientras el Eterno ve el corazon\" (Samuel I 16:7), es decir que yo no tengo ninguna posibilidad de saber si el hombre que se encuentra frente a mi es recto o un charlatan, o si esta transaccion es ventajosa o no, pero yo confio solo en Ti. Por eso, si es Tu voluntad que yo realice este negocio"},{"id":"p64-b6","pageNumber":64,"indexInPage":6,"text":"– haz Tu que se materialice; y si Tu no quieres que se lleve a cabo por una causa cualquiera – haz Tu que no se realice\". Y siguio el maestro diciendo: \"Y asi debes hacer antes de cada operacion que realices – antes de emplear a un trabajador, o de despedir a otro, aconsejate con tu Dueno – el Creador."},{"id":"p64-b7","pageNumber":64,"indexInPage":7,"text":"Si tienes la voluntad de extender tus negocios o reducirlos – reza, y ciertamente triunfaras; porque \"Aquel que confia en el Eterno – le rodea bondad.\" \" El hombre que reza con fe, puede conducir sus negocios sin \"Con mi propia fuerza y el poder de mi mano\", facilmente y sin ninguna tension nerviosa. Esto es debido a que en cada cosa se conseja con su Consejero financiero – el Creador – que ciertamente sabe todo, El es recto y fiel, y es el unico en Quien se puede confiar."},{"id":"p64-b8","pageNumber":64,"indexInPage":8,"text":"Por lo tanto, conduce todos sus negocios con seguridad, y no se asusta de nada. En pocas palabras, existen solo dos posibilidades: o que el hombre ponga al Creador como el Dueño de sus negocios – y entonces tendra la vida facil, e incluso podra realizar grandes transacciones con facilidad, sin ningun miedo; o que siga pensando que es el dueno de sus transacciones – y entonces le esperan presiones, nervios, fracasos, desilusiones y depresiones. Un mal hábito difundido en nuestra época es el del refinanciamiento continuo."},{"id":"p64-b9","pageNumber":64,"indexInPage":9,"text":"Es una traicionera seguridad en la que cae todo hombre ávido en hacer circular el dinero. Un mal habito difundido en nuestra epoca es el del refinanciamiento continuo. Es una traicionera seguridad en la que cae todo hombre avido en hacer circular el dinero. Este tipo de hombre no hace los calculos correctos, no presta atencion que sus gastos son mayores que sus ganancias. Solamente esta deslumbrado por el dinero en efectivo que llega a sus manos, al final se derrumba y contrae enormes deudas."},{"id":"p64-b10","pageNumber":64,"indexInPage":10,"text":"Por supuesto, que lo anterior es el resultado de un alteracion en su fe, pues el hombre no calcula sus actos rectamente y no deja que las cosas se dirijan segun lo que el Creador desea y le da, sea poco o sea mucho. Porque el hombre creyente sabe, que si el Creador quisiera que invierta una gran suma de dinero, El se la hubiera hecho llegar. ¿Acaso le falta dinero al Creador que necesita financiacion? ¿O acaso El necesita un prestamo en el mercado negro?"},{"id":"p64-b11","pageNumber":64,"indexInPage":11,"text":"Si el Creador le da una suma mas pequena, es senal que El desea que conduzca sus negocios en pequena escala, esto sera bendecido y de ahi en adelante podra seguir haciendo otros negocios. Pero el hombre que no posee fe, piensa que solo podra ganar por medio de grandes inversiones, y por lo"}],"rawCharCount":5013},{"pageNumber":65,"blocks":[{"id":"p65-b0","pageNumber":65,"indexInPage":0,"text":"tanto cae en grandes peligros, invierte dinero que no es suyo en un negocio que no es seguro que prospere; y tambien si prosperara – es dudoso si podra pagar las deudas en que incurrio para hacerlo. El mas grande y difundido error en los negocios es, que el hombre quiere hacer girar grandes sumas de dinero y asi le parece que gana mas. Pero en verdad, si hiciera un calculo exacto de la circulacion anual de su dinero, cuanto invirtio y cuanto gano, y cuanto dinero le quedo en las manos, finalmente veria que no gano mucho."},{"id":"p65-b1","pageNumber":65,"indexInPage":1,"text":"Porque el hombre puede ganar solo lo que le fue asignado en el Cielo, y no interesa cuantos miles de millones giraran en sus manos. Nunca podra ganar ni una moneda mas de lo que le fue determinado en el comienzo del ano hebreo. Por esto, generalmente, despues de calcular sus gastos y entradas, vera con claridad que no gano mas que un simple sueldo."},{"id":"p65-b2","pageNumber":65,"indexInPage":2,"text":"El unico camino para aumentar las ganancias de lo que le fue determinado en el comienzo del año hebreo, es por medio de muchas plegarias, mucha caridad y donacion del diezmo de sus entradas como es debido. Solo entonces es posible que le seran agregadas ganancias sobre lo que le fue determinado."},{"id":"p65-b3","pageNumber":65,"indexInPage":3,"text":"Si el unico problema fuera que no gano lo que imagino, eso seria medio consuelo; pero el problema es, que cuando el hombre invierte en un gran negocio grandes sumas que no tiene y necesita financiamiento, mantiene empleados sobrantes, invierte en publicidad etc., entonces gasta su presupuesto anual y incluso llega a extralimitarse y hundirse en grandes perdidas."},{"id":"p65-b4","pageNumber":65,"indexInPage":4,"text":"Porque respecto a lo que el hombre debe ganar en todo lo largo del ano, esta todo decretado desde lo Alto, pero respecto a lo que debe perder, puede elegir perder mas y mas, sin limites."},{"id":"p65-b5","pageNumber":65,"indexInPage":5,"text":"Es decir que la ganancia tiene un limite y la perdida no lo tiene, y si el hombre hubiera conducido sus negocios en una escala mas pequena segun sus verdaderas posibilidades, solo hubiera perdido esas sumas en empleados suplementarios, publicidad, intereses del financiamiento y cosas semejantes, y en el calculo final ganaria mas, porque ganaria la cantidad completa que le fue determinada."},{"id":"p65-b6","pageNumber":65,"indexInPage":6,"text":"Encontramos, que cuando hizo negocios en gran escala, se endeudo, y perdió inutilmente el dinero que le fue decretado a comienzos del ano hebreo, y mucho mas. Incluso hay hombres de negocios que se encuentran de pronto con deudas millonarias. Tu Contable"},{"id":"p65-b7","pageNumber":65,"indexInPage":7,"text":"El hombre creyente cumple el versiculo (Proverbios 28:20): \"El hombre Creyente esta colmado de bendiciones, pero el que se apura a enriquecerse no saldra limpio \". El cree en la bendición del Creador, y por esto esta contento con lo suyo y no se apura a enriquecerse. Cuando quiere invertir su dinero, aunque consulta con expertos como su director de banco o un economista, se acuerda siempre que el Creador es el unico que decide de donde le llegara su sustento."},{"id":"p65-b8","pageNumber":65,"indexInPage":8,"text":"Y antes de terminar una transaccion comercial, reza de esta manera: \"Amo del universo, Te agradezco por todo el sustento que me diste hasta hoy. Conduceme con un buen consejo como invertir mi dinero en forma que tenga ganancias para poder hacer caridad y beneficencia\". Y cuando piensa en invertir en algo determinado, le reza asi al Creador: \"Amo del universo, me preparo a invertir en este negocio, por favor, dame completa confianza en Ti, que todo lo que me daras – ganancias o perdidas –lo aceptare con amor."},{"id":"p65-b9","pageNumber":65,"indexInPage":9,"text":"Sobre este tipo de hombre fue dicho (Jeremias 17:5): \"Bendito sea el hombre que confia en el Eterno, y que el Eterno mismo sea su confianza\"; y tambien (Salmos 32:10): \"Aquel que confía en el Eterno, le rodea bondad\". Por el contrario, el hombre que tiene su fe debilitada y confia en el experto o en el economista con ojos cerrados, realiza la transaccion con demasiada precipitacion, como si el experto fuera el que le distribuye el sustento."},{"id":"p65-b10","pageNumber":65,"indexInPage":10,"text":"Sobre este tipo de hombre se ha dicho (Jeremias 17:5): \"Maldito sea el hombre que confiara en el hombre\"; o que confia en si mismo, en su inteligencia y buena suerte, pues podra decepcionarse. Porque el que confia en algo o alguien salvo el Creador, cae por medio de eso mismo."},{"id":"p65-b11","pageNumber":65,"indexInPage":11,"text":"El Sabio Menajem Mendel de Kotzk explica lo que esta escrito en el Midrash (Mejilta, Beshalaj 17): \"La tora no fue dada sino a los que comen de la mana\" – que la Tora no fue dada sino a los que estan satisfechos con lo que tienen hoy, y estan contentos con lo suyo y no se preocupan por el manana\". Porque asi fue cuando el pueblo de Israel estaba en el desierto despues de salir de Egipto, el mana bajaba desde el Cielo en cantidad suficiente solo para ese dia, y asi fue durante todos los cuarenta anos que estuvieron en el desierto."},{"id":"p65-b12","pageNumber":65,"indexInPage":12,"text":"Y asi continua en todas las generaciones, que solo el que es dueno de fe y confianza, se merece adquirir la Tora, porque sin este atributo el hombre ciertamente gastaria su vida en persecucion obsesiva tras su sustento, y no se desocuparia para el estudio de la Tora. Hay un fundamento de la fe que es la base de todo asunto de negocios, comercio, negociaciones y sustento..."}],"rawCharCount":4974},{"pageNumber":66,"blocks":[{"id":"p66-b0","pageNumber":66,"indexInPage":0,"text":"Hay un fundamento de la fe, que es la base de todo asunto de negocios, comercio, negociaciones y sustento, y es la creencia que todo el sustento del hombre esta determinado en el comienzo del ano hebreo. La expresion practica de la fe es la confianza en el Creador. Es decir, que el hombre sabe que el rol del Creador es sustentar a sus criaturas, y que el Creador cumple lealmente su rol. Por lo tanto, todo lo que le es determinado al hombre, le llegara sin duda."},{"id":"p66-b1","pageNumber":66,"indexInPage":1,"text":"Y esto no depende del esfuerzo, ni de la inteligencia y ni de la rectitud del hombre, como esta escrito en la bendición posterior a la comida (version antigua): \"El es el que nos alimenta – y no por nuestras acciones, El es el que nos sustenta - y no por nuestra rectitud. El prefiere Su bien sobre nosotros...\"."},{"id":"p66-b2","pageNumber":66,"indexInPage":2,"text":"Y de ninguna manera, puede ningun hombre tocar lo que no se merece, y sustraer lo que no le fue decretado desde el Cielo, como dijeron los Sabios (Tratado Yoma, 38): \"No hay un hombre que pueda tocar lo que esta dispuesto para su projimo\". Solo cuando el hombre entiende este fundamento, y cree en el con fe completa y simple, solo entonces puede tratar todos sus asuntos financieros, y pasar todas las pruebas de fe con exito, tranquilidad y alegria, sin llegar al enojo, a la impaciencia, al hurto y al fraude."},{"id":"p66-b3","pageNumber":66,"indexInPage":3,"text":"En la practica, un hombre que posee confianza en el Creador, jamas piensa en el dinero. El sabe que el Creador es el que le sustenta, y no piensa en nada mas que esto. Toda su relacion con el tema del sustento concluye en tres palabras: El Creador sustenta. Punto. Lo que te fue determinado - te llegará He aqui que todo negocio es una serie de pruebas de fe."},{"id":"p66-b4","pageNumber":66,"indexInPage":4,"text":"En cada momento el comerciante atraviesa esta prueba: Si creer, que todo su sustento esta determinado desde el Cielo, y entonces estara calmado y alegre y conducira todos sus negocios con tranquilidad, honradez y rectitud. O por el contrario pensar que todo su sustento depende de su esfuerzo, y entonces estara nervioso y tenso, y comenzara a hacer muchos esfuerzos y subterfugios e incluso fraudes. Todo reposa sobre la simple fe que todo el sustento del hombre le esta fijado desde el Cielo con exactitud."},{"id":"p66-b5","pageNumber":66,"indexInPage":5,"text":"Y el unico libre albedrio que tiene el hombre es solo elegir de que canal le llegara su prosperidad – si por un canal de oro – es decir por caminos de rectitud, con alegria y tranquilidad, o por un canal de alcantarilla - por medio de nervios, intrigas, y caminos enganosos. No existen tres posibilidades, solo dos – o que tu crees que recibiras lo que te fue determinado, en su tiempo y su momento; y si no de este lugar – sera"},{"id":"p66-b6","pageNumber":66,"indexInPage":6,"text":"de otro lugar; y si no hoy – manana. Y el resultado es que estes en calma, y asi vivaras una buena vida, y ciertamente que no te complicaras con transgresiones, enganos, hurtos etc., o que tu no crees, y entonces el resultado es que estas tenso y nervioso, tu vida es un infierno, y te complicas con malos negocios y deudas. Hay personas que llegaron incluso a la carcel como consecuencia de negocios precipitados."},{"id":"p66-b7","pageNumber":66,"indexInPage":7,"text":"Y si todavia no llegaste a esto, de cualquier manera tu vida esta llena de agitacion e inquietudes, y seguro que llegaras a transgresiones de fraudes y hurtos. ¡Es debido acordarse! Todo lo que le esta fijado al hombre con gran precision, y el que se conduzca con rectitud o no, no lo beneficiara ni con una moneda mas de lo que le fue determinado."},{"id":"p66-b8","pageNumber":66,"indexInPage":8,"text":"Encontramos, que tambien el comerciante que hizo un negocio honestamente y tambien el comerciante que tomo dinero en forma fraudulenta, recibieron justamente lo que les fue determinado; pero la diferencia es, que el que recibio dinero con rectitud – lo gozara, y al que lo tomo fraudulentamente – lo danara y solo le hara sufrir... Josecito llegó a la entrada de la propiedad, y he aquí, el portal estaba abierto, el guardián estaba durmiendo un sueño profundo, y los mastines movían alegremente sus colas..."},{"id":"p66-b9","pageNumber":66,"indexInPage":9,"text":"Les presentamos a continuacion una historia sorprendente y maravillosa sobre el tema - \"Quien roba, se roba a si mismo\": El gran Justo, el Baal Shem Tov, tenia un discipulo llamado Josecito y al que su Mala Inclinacion le indujo a robar. Josecito no pudo sobreponerse a la atraccion de robar, y por la noche, cuando toda la ciudad dormia, salio de su casa dirigiendose a la lujosa mansion de la rica dama Sara, que estaba ubicada en el extremo de la ciudad."},{"id":"p66-b10","pageNumber":66,"indexInPage":10,"text":"Sara, la dama, era la hija unica de un hombre muy rico, que no hacia mucho tiempo había fallecio, y debido a que no tuvo mas hijos, dejo todos sus bienes a Sara. Josecito llego a la entrada de la propiedad, y he aqui, el portal estaba abierto, el guardian estaba durmiendo un sueno profundo, y los mastines movian alegremente sus colas..."},{"id":"p66-b11","pageNumber":66,"indexInPage":11,"text":"Josecito siguio su camino sin interrupciones a traves del lujoso jardin, y llego a la mansion, y tambien aca estaba todo listo y dispuesto para el - la puerta no estaba cerrada, y parecia que la tierra se hubiera tragado a los sirvientes... Josecito entro silenciosamente en la casa, se detuvo un momento para observar toda la abundancia y la riqueza, las alfombras valiosas, las pinturas"}],"rawCharCount":5037},{"pageNumber":67,"blocks":[{"id":"p67-b0","pageNumber":67,"indexInPage":0,"text":"singulares, los cubiertos de oro y los lujosos candelabros. Despues siguio su camino, paso el lujoso salon dirigiendose al escritorio, ahi - sabia de sus pasadas visitas al padre de la senora Sara -estaba la caja de caudales. Para su gran alegria, encontro la caja abierta completamente, y adentro ordenados y acomodados unos al lado del otros, paquetes de dinero, lingotes de oro, joyas caras y piedras preciosas."},{"id":"p67-b1","pageNumber":67,"indexInPage":1,"text":"Josecito no pudo dejar de impresionarse de que las cosas le fueran tan facilmente - el guardian durmiendo, los mastines no ladran, la mansion abierta, todos los sirvientes desaparecidos, la caja de caudales abierta - Josecito comenzo a sentir que tenia - si se puede decir - ayuda del Cielo. Josecito comenzo a pensar: \"¿Que es esto que me hace el Creador? ¿Por que todo me va tan facilmente? Parece como si todas estas riquezas fueran mias, y todo lo que tengo que hacer es tomarlas sin ningun obstaculo; que extrano\"."},{"id":"p67-b2","pageNumber":67,"indexInPage":2,"text":"Se detuvo y miro toda la abundancia que tenia frente a sus ojos, y poco a poco empezo su corazon a palpitar con fuerza por la transgresion que estaba por cometer. Empezo a pensar \"En verdad, toda la manutencion del hombre le esta determinada en el comienzo del ano hebreo, ¿Por que tengo que tocar los bienes de otros?\" Pero le parecia como si los gruesos fajos de dinero y los brillantes lingotes de oro lo estaban llamando: ¡Josecito!"},{"id":"p67-b3","pageNumber":67,"indexInPage":3,"text":"Somos tuyos, llevanos… Y asi permanecio Josecito parado y vacilando, y poco a poco la fe comenzo a iluminar su corazon. \"Ciertamente si toda esta abundancia es verdaderamente mia, llegara a mis manos en forma completamente permitida\", penso, \"Entonces, ¿Por que tomarla en forma prohibida y transgrediendo la voluntad del Creador?\" De pronto el corazon de Josecito se animo y se lleno con un gran temor a Di-s."},{"id":"p67-b4","pageNumber":67,"indexInPage":4,"text":"El percibio el gran peligro en que se encontraba, y enseguida grito desde dentro de su corazon: \"¡Amo del universo, salvame!\" Entonces giro sobre sus talones y escapo de la mansion sin llevarse nada. Al dia siguiente, al anochecer, despues de haber pasado un largo dia de arrepentimiento, verguenzay llanto frente al Creador para que le perdone su voluntad de robar, le llego un emisario con un mensaje de su maestro, el Ba'al Shem Tov, que lo llamaba inmediatamente."},{"id":"p67-b5","pageNumber":67,"indexInPage":5,"text":"Con pies temblorosos fue Josecito y entro en el cuarto del Ba'al Shem Tov lleno de miedo y verguenza. Estaba completamente seguro, que el Justo Ba'al Shem Tov vio, con su Inspiracion"},{"id":"p67-b6","pageNumber":67,"indexInPage":6,"text":"Divina, todas sus acciones. \"Josecito\", se dirigio a el el Ba'al Shem Tov, \"Sientate por favor, ¿Como estas?\" \"Gracias a Di-s\", contesto Josecito, esperando con temor la continuacion de sus palabras. \"Josecito\", Dijo el Ba'al Shem Tov, \"Se dirigio a mi la dama Sara, ¿Sabes quien es ella?\" \"S…si, p…p..por supuesto, su senoria\", tartamudeo Josecito. ¡Ya esta! Ahora estaba seguro que la dama Sara lo vio en medio de la noche en su casa y se lo conto a su maestro. ¿Donde se podria esconder? ¿Y como mirar a su maestro a los ojos?"},{"id":"p67-b7","pageNumber":67,"indexInPage":7,"text":"Ay que verguenza, ay que bochorno... Continuo el Justo, \"Como sabes, Sara es unica hija, y antes de fallecer, su padre me pidió supervisar todos sus asuntos, que me preocupara por ella y la cuidase...\", aca hizo el Ba'al Shem Tov una pausa, y clavo una mirada penetrante en Josecito que empezo a temblar. Despues continuo el Ba'al Shem Tov y dijo: \"Sara se dirigio a mi esta manana, y me pidio que le encuentre un novio. Su voluntad es que el novio sea un erudito de la Tora, que se ocupe del estudio y del servicio a Di-s."},{"id":"p67-b8","pageNumber":67,"indexInPage":8,"text":"Ella no quiere que dirija sus negocios y propiedades, sino que estudie sin ninguna interrupcion, y que no tenga nada que ver con las cosas materiales de este mundo… Ella misma es suficientemente habil para dirigirlo todo, es una mujer virtuosa y experimentada en los negocios de su padre. El Ba'al Shem Tov sonrio a Josecito y continuo: \"Y he aqui que al comienzo no pude pensar en ningun candidato."},{"id":"p67-b9","pageNumber":67,"indexInPage":9,"text":"Pero despues el Creador me sugirio que a llegado el momento que te cases, y enseguida El me ilumino con la certeza que ustedes son la pareja perfecta. Si aceptas, ve inmediatamente a prepararte para la boda. Mi voluntad es realizarla sin mucha demora, antes de las proximas fiestas \". Josecito salio completamente asombrado del cuarto de su maestro a la calle llena de sol, sintiendo su cabeza agitada."},{"id":"p67-b10","pageNumber":67,"indexInPage":10,"text":"Se sento sobre una banco lateral, y los ultimos acontecimientos pasaron frente sus ojos; su corazon se expandio y se impresiono por la maravillosa Supervision Divina y la misericordia del Creador. Casi se desmayo pensando lo que hubiera pasado si no triunfaba en la prueba… si realizaba el robo, de hecho hubiera robado su propio dinero, ¡Y con esto perdia todo un buen futuro!"},{"id":"p67-b11","pageNumber":67,"indexInPage":11,"text":"En vez de vivir bien y ocuparse en el estudio de la Tora y la plegaria, el tendria ahora que esconder su fortuna y escaparse al extranjero, y ciertamente que hubiera tambien abandonado el camino de la fe y de la Tora…"}],"rawCharCount":4875},{"pageNumber":68,"blocks":[{"id":"p68-b0","pageNumber":68,"indexInPage":0,"text":"Josecito agradecio con lagrimas al Creador por Su misericordia y Su ayuda para hacerlo triunfar en la prueba. El tambien le hizo ver con sus propios ojos como la abundancia esta preparada, y toda la prueba consiste en armarse de paciencia y entonces se la recibira en su momento y en su tiempo, en forma permitida - y verdaderamente podra ser gozada. O, si el hombre tratara de precipitarse a los acontecimientos y la tomara en forma prohibida - entonces seguro que no la gozaria."},{"id":"p68-b1","pageNumber":68,"indexInPage":1,"text":"Una mejor leccion de fe y de Supervision Divina no podria recibir en ningun lado... Ciertamente, que no cada uno tiene el merito de ver en forma tan clara como su dinero le esta dispuesto, y como todo su libre albedrio es solo como lo recibira."},{"id":"p68-b2","pageNumber":68,"indexInPage":2,"text":"Pero en verdad, asi es en todas las pruebas de sustento que tiene el hombre - su dinero le esta dispuesto previamente, y desde el Cielo esta puesto a prueba, si tratara de precipitarse a los acontecimientos, como tomar prestado dinero, entonces se tensaria, se pelearia con la gente y incluso enganaria, robaria, hurtaria y explotaria a los demas. O por el contrario esperaria con paciencia, y lo recibiria por el buen camino."},{"id":"p68-b3","pageNumber":68,"indexInPage":3,"text":"Debemos saber, que incluso si Josecito no se hubiera casado con Sara, dado que ese dinero le fue dispuesto -lo hubiera recibido de cualquier otra manera, por ejemplo la dama hubiera decidido dar su dinero para mantener un estudiante de la Tora, o hubiera realizado un negocio con ella, etc. Porque el Creador tiene muchos caminos para sustentar sus criaturas. Todo el que se ocupa de negocios puede testiguar que a veces una mercadería que estaba seguro le sería arrebatada, se llenó de polvo en los estantes, y también por el contrario..."},{"id":"p68-b4","pageNumber":68,"indexInPage":4,"text":"Un comerciante dueno de fe debe saber que existe Supervision Individual sobre cada objeto en venta – es decir, cuando y a quien se vendera. El Creador supervisa con Supervision completa cada articulo o mercaderia, y crea las causas para que cada uno llegue a quien es debido. Cada articulo tiene un determinado comprador, pues las chispas espirituales que contiene ese objeto le pertenecen."},{"id":"p68-b5","pageNumber":68,"indexInPage":5,"text":"Y como esta escrito en Likutey Moharán (I, 54): \"Porque en cada cosa en el mundo hay chispas de santidad, que cayeron en el momento de \"la destrucción Espiritual\" (que acontecio en el comienzo de la creacion), esta destrucción se caracteriza por la rotura de las letras que cayeron dentro de cada cosa que existe en este mundo. Y cada cosa tiene su momento en la que llegara a un determinado hombre, que tiene la misma raiz espiritual que las chispas que hay en ese objeto\"."},{"id":"p68-b6","pageNumber":68,"indexInPage":6,"text":"Encontramos entonces, que cada transaccion que se ejecuta, es solo debida a que el Creador determino que se realizara. Porque cuando llega el momento"},{"id":"p68-b7","pageNumber":68,"indexInPage":7,"text":"y la hora que una mercaderia pase a las manos de un determinado hombre, para la perfeccion de su alma por medio de las chispas espirituales que hay en ella, entonces el Creador supervisa y crea las causas para que ese hombre llegue al lugar donde esta ese objeto, y entonces se le despertara el deseo de comprarlo para la perfeccion de su alma."},{"id":"p68-b8","pageNumber":68,"indexInPage":8,"text":"Por eso esta bien entendido, que cuando un hombre no tiene una relacion con un determinado objeto o mercaderia, entonces simplemente no esta interesado en comprarlo, y el comerciante que trata de persuadirlo para que lo compre esta precipitandose a los acontecimientos, y por cierto que esta venta le traera malos resultados. Todo el que se ocupa de negocios puede testiguar que a veces una mercaderia que estaba seguro le seria arrebatada, se lleno de polvo en los estantes."},{"id":"p68-b9","pageNumber":68,"indexInPage":9,"text":"Y tambien por el contrario, una mercaderia que no espero que se vendiera, la vendio rapidamente y a un buen precio. Hay veces que una transaccion se demora en forme incomprensible, hasta que le llega a sus chispas el momento de llegar a quien pertenece, y entonces todo se arregla y se materializa. Y hay mucho otros casos que el observador vera que la unica explicacion es la exacta Supervision de cuando y como el objeto o la mercaderia cambiara de duenos.."},{"id":"p68-b10","pageNumber":68,"indexInPage":10,"text":"Negociación con fe Lo que entendemos de lo anterior es, que cuando el hombre es dueno de fe, ciertamente esta contento con lo suyo y todas sus negociaciones se realizan por medio de la verdad y la fe. El puede contestar positivamente a la primera pregunta que se le hace al hombre despues de morir: ¿Negociaste durante tu vida con fe?"},{"id":"p68-b11","pageNumber":68,"indexInPage":11,"text":"\"Con fe\" significa que el hombre es fiel a su palabra sin cambiar la verdad, y este es el significado de la pregunta: ¿Acaso utilizaste durante tu vida al comerciar el atributo de la verdad sin ninguna mentira y engano? Un comerciante dueno de fe no alabara su mercaderia mas de lo debido, porque el sabe que cada mercaderia esta destinada por la Supervision Individual a un determinado hombre, y a el le gustara sin que se la adornen con mentiras."},{"id":"p68-b12","pageNumber":68,"indexInPage":12,"text":"Tampoco nunca enganara y lisonjeara al comprador porque sabe que solo el Creador es el que lo sustenta y no su cliente. Y como fue dicho anteriormente, no tratara de persuadir al comprador y obligarlo a que le compre, pues de esta forma se puede llegar a causar danos, como por ejemplo que el cliente se lamente porque compro un objeto que no necesitaba solo porque fue presionado, y es posible que se enfade con el comerciante, y incluso lo maldiga."}],"rawCharCount":5212},{"pageNumber":69,"blocks":[{"id":"p69-b0","pageNumber":69,"indexInPage":0,"text":"El comerciante poseedor de fe no se asusta y no se desilusiona de ninguna cosa. Tambien cuando el comprador decide no comprarle, no le importa, porque sabe que el Creador es el que le da el sustento, y es probable que esta vez le llegue el sustento de otro lugar y no por medio de su negocio o su comercio. Este comerciante logra una buena calificacion por su fe, y tiene una vida buena y tranquila en este mundo."},{"id":"p69-b1","pageNumber":69,"indexInPage":1,"text":"El aprobara el Juicio en el mundo venidero por su honestidad y decencia, su cortesia y sus buenas cualidades y porque no afligio a otros. Contrariamente, Un comerciante al que le falta fe, piensa que el comprador es el que le da sustento, y por esto lisonjea a sus clientes y se muestra servil frente a ellos."},{"id":"p69-b2","pageNumber":69,"indexInPage":2,"text":"Y debido a que piensa que todo su comercio depende de su esfuerzo, confia en su inteligencia y subterfugios y por eso se permite mentir, enganar, denigrar a sus competidores (trasgrediendo asi el pecado de la maledicencia y la difamacion), y promete cosas que no existen y maravillosas. Cuando este tipo de comerciante tiene exito en su comercio, se llena de auto estima y orgullo, pues esta seguro que su inteligencia y su talento en los negocios fueron la causa de su triunfo."},{"id":"p69-b3","pageNumber":69,"indexInPage":3,"text":"Y si vende su mercaderia a mas de su valor, se alaba a si mismo diciendo que sabe ganar dinero. Por supuesto que esa ganancia es su perdida, porque debido a que engano al comprador y tiene en su bolsillo dinero impuro, ese dinero lo derrumbara espiritual y materialmente."},{"id":"p69-b4","pageNumber":69,"indexInPage":4,"text":"Sobre esto se reza: \"Que el Creador que es el Misericordioso nos sustentara en forma permitida y no prohibida\"… De todos modos hubiera ganado la misma suma que le fue determinada en el Cielo, incluso si hubiera vendido la mercaderia a su verdadero precio, mas bajo, porque la diferencia le llegaria de otro lado. Pero cuando no logra vender, se lamenta, se enerva, insulta y blasfema, se queja y se amarga, su vida no es vida, y su calificacion de la fe es muy baja."},{"id":"p69-b5","pageNumber":69,"indexInPage":5,"text":"Si el comerciante elige ganar su dinero con engaños, el Creador le dejará prosperar, pues \"En el camino que el hombre quiere andar - por este lo conducen desde el Cielo...\" Supuestamente hay que hacer una pregunta, he aqui que vemos con nuestros propios ojos no una vez ni dos, que un comerciante sagaz logra \"persuadir\" a un cliente inocente para que compre su mercaderia, ¿entonces donde esta la Supervision Individual? O vemos que fulano estafo a zutano en una suma enorme de dinero, y esta completamente claro que gano el dinero"},{"id":"p69-b6","pageNumber":69,"indexInPage":6,"text":"solo por medio de fraude - ¿entonces como se puede decir que hay aca una SupervisionIndividual? La respuesta esta en la ensenanza de los Sabios (Tratado Makót, 10): \"En el sendero que el hombre quiere andar - por este lo conducen desde el Cielo\", lo que significa que es obligatorio que la Supervision Divina sea ocultadapara que la libre eleccion quede en las manos del hombre."},{"id":"p69-b7","pageNumber":69,"indexInPage":7,"text":"Por eso, cuando el hombre elige vivir con fe y simplicidad, le llegara su sustento sin ningún esfuerzo, sin convencimientos, sin servilismo y sin lisonjas, y por supuesto sin mentiras y engaños. En otras palabras, el recibira su sustento sin ningun pesar."},{"id":"p69-b8","pageNumber":69,"indexInPage":8,"text":"Pero, si el elige conducirse con \"Mi propia fuerza y el poder de mi mano\", y atribuye su exito a sus esfuerzos, talento, etc. entonces desde el Cielo le dan lugar para errar, hasta que crea que él logro vender su mercaderia solo gracias a su facilidad de palabra, y por supuesto acompañado con mucha tension y pesar. Sobre esto se pide en la plegaria: \"El Creador, que es Misericordioso nos sustentara con tranquilidad y no con angustia\"."},{"id":"p69-b9","pageNumber":69,"indexInPage":9,"text":"Y en verdad recibe solo lo que le fue fijado, y por supuesto que de todas maneras lo recibira de una u otra forma en el tiempo y momento que el Creador determine, y como esta escrito (Salmos 145:15): \"Los ojos de todos Te esperan, y Tu les das su sustento a su debido tiempo\"… Tambien si el comerciante elige ganar su dinero con enganos, el Creador le dejara prosperar, como se ha dicho: \"En el camino que el hombre quiere andar - por este lo conducen desde el Cielo\", y en vista que \"El causa un castigo mediante un deudor\" y el es un malhechor - es elegido para ser la vara que castigue a quien le fue decretado ser enganado, y despues el mismo será castigado por esto."},{"id":"p69-b10","pageNumber":69,"indexInPage":10,"text":"En verdad, si hubiera andado por el camino integro y no por el malo, ciertamente llegaria toda esa suma a sus manos, ni una moneda menos - y en forma totalmente honesta... Precipitar el curso de los acontecimientos Los resultados de precipitar el momento de las cosas son varios. Por ejemplo, es posible que el comerciante con su persuasion, precipito al cliente a comprar un objeto que no le corresponde, por esta causa el cliente no consigue usarlo, entonces vendra con quejas al comerciante."},{"id":"p69-b11","pageNumber":69,"indexInPage":11,"text":"El resultado es que el comerciante perdio en esta transaccion solo porque precipito el curso de los acontecimientos. Agregado a esto, el afligio a su projimo, arruino su prestigio y mas - estas son perdidas que llegan unicamente por el deterioro en la fe."}],"rawCharCount":4960},{"pageNumber":70,"blocks":[{"id":"p70-b0","pageNumber":70,"indexInPage":0,"text":"Es tambien posible, que el objeto si pertenece a ese cliente, solo que deberia llegar a sus manos mas tarde. El comerciante que precipito el momento, recibio el dinero demasiado temprano y lo utilizo. El resultado es que gasto el dinero que tenia que llegarle en otro momento, cuando verdaderamente lo necesitara."},{"id":"p70-b1","pageNumber":70,"indexInPage":1,"text":"Y hay un sin fin de casos, a veces el hombre precipita tanto el curso de los acontecimientos, hasta llegar a robar una enorme suma de dinero, pero en efecto - ese fue todo el dinero que le fue ordenado a el y a sus descendientes para toda la vida, y ahora lo esta gastando todo sindejar nada para si y para su familia, con esto se decreta a si mismo y a sus hijos la sentencia de muerte."},{"id":"p70-b2","pageNumber":70,"indexInPage":2,"text":"Existen mas combinaciones que el ser humano ni puede imaginar, pero una cosa es evidente como el sol, que toda manera de precipitar los acontecimientos, desde el mas simple convencimiento hasta el fraude y el hurto - engendran solo angustias y confusiones, como han dichos los Sabios con sencillez - \"El que precipita el curso de los acontecimientos - es rechazado por ellos…\" Esta es la regla de oro que debe cada uno recordar, y que todo depende de ella: Lo que te esta decretado - te llegara de una manera u otra."},{"id":"p70-b3","pageNumber":70,"indexInPage":3,"text":"O tu crees en esto y confias en el Creador que todo esta en Sus manos, y le dejas decidir de donde te mantendras y estaras tranquilo, apacible y alegre; entonces no enganas o robas. O no crees en esto y corres y te esfuerzas y trabajas duro y precipitas el tiempo y toda tu vida es un infierno, entonces probablemente te toparas con innumerables obstaculos como robar y enganar. Se debe saber, que el hombre no es el dueño de su dinero, sino que le fue depositado en sus manos por el Creador, para que lo use según Su voluntad."},{"id":"p70-b4","pageNumber":70,"indexInPage":4,"text":"Las apuestas son una terrible calamidad, y el que es atraido por ellas se adicta aun mas que el que se adicta a las drogas. Generalmente causan el colapso del hombre y lo llevan a un estado deplorable; el hombre creyente no debe tener nada que ver con ellas. Las apuestas son derivadas del amor al dinero, sacan al hombre de sus cabales, lo alejan completamente de la verdad y de la fe en la Supervision Divina."},{"id":"p70-b5","pageNumber":70,"indexInPage":5,"text":"Estas parecen ser unl camino facil para ganar grandes sumas de dinero, pero en verdad es una senda muy dificil, que lleva al hombre y a todo su familia a una vida amarga e insoportable."},{"id":"p70-b6","pageNumber":70,"indexInPage":6,"text":"Las apuestas marean al hombre, pues la Mala Inclinacion siempre se preocupa que algunos ganen sumas enormes, asi quien los ve se come el corazon de envidia y se imagina que la proxima vez el sera el ganador. El hombre se marea y gasta en pocas horas sumas enormes, con las cuales podria hacer muchas cosas positivas. El apostador causa una terrible afliccion a todos sus parientes, y especialmente a su esposa e hijos, que ven desesperadamente como toda esa abundancia se pierde en lugar de llegar a ellos que verdaderamente la necesitan."},{"id":"p70-b7","pageNumber":70,"indexInPage":7,"text":"Segun la ley judia (Halajá) y las leyes morales, todo dinero que se gana mediante las apuestas es un hurto, porque el hombre gana por la perdida de otros y por tal razon no trae ninguna bendicion. No hay gozo en el dinero que llega por un sucio camino, solo sufrimiento. El apostador siempre pierde Esto se debe saber, al comienzo del ano (Rosh HaShaná) le es decretado al hombre cuanto ganará y cuanto perderá en el ano que comienza."},{"id":"p70-b8","pageNumber":70,"indexInPage":8,"text":"Con respecto a lo que le fue decretado al hombre que gane, incluso si hara todos los esfuerzos posibles, y aunque apostara con grandes probabilidades y calculos sofisticados, nunca podrá ganar mas de lo que le fue decretado desde el Cielo. Pero ¡atencion! – con respecto a lo que le fue decretado perder – es posible perder aun mas de lo que le fue decretado e incluso es posible perder toda la fortuna y el dinero, y todavia quedarse con enormes deudas."},{"id":"p70-b9","pageNumber":70,"indexInPage":9,"text":"Entonces, una de dos – si el apostador perdera en las apuestas, es posible que pierda todos sus bienes y todavia mas; y si gana, nunca podra gozar mas de lo que le fue decretado, en especial porque ese dinero no contiene ninguna bendicion. Es decir que de todas maneras el solo perdera, y entonces para que le ayudaron todas las apuestas… ¿acaso podra cambiar lo que le fue decretado desde el Cielo? Lo mejor es que espere, y reciba lo que es suyo en forma recta y con dignidad."},{"id":"p70-b10","pageNumber":70,"indexInPage":10,"text":"El apostador es cruel Se debe saber, que el hombre no es el dueno de su dinero, sino que le fue depositado en sus manos por el Creador, para que lo use segun Su voluntad. La mayoria del dinero que el Creador le da al hombre que tiene esposa y hijos es solo para sostenerlos, y si no tuviera familia, tampoco tendria todo ese dinero – y entonces ¿quien le permitio usar el dinero que le fue dado por el Creador para ellos y apostarlo?"},{"id":"p70-b11","pageNumber":70,"indexInPage":11,"text":"Vemos entonces, que el hombre que apuesta, hurta lo que pertenece a su familia, y que le fue dado por el Creador"}],"rawCharCount":4788},{"pageNumber":71,"blocks":[{"id":"p71-b0","pageNumber":71,"indexInPage":0,"text":"para que lo use inteligentemente para bienestar de ellos, y no para que los afecte con su frivolidad y su quimeras. No existe alguien tan cruel con su esposa y hijos como este apostador, porque no importa si gana o pierde, de todas maneras el causa angustia a sus familiares; si pierde – entonces perdio el dinero de su familia y debera dar rendicion de cuentas al Creador por toda la afliccion que le causo, y mientras tanto tambien les llegan todo tipo de sufrimientos por esa culpa."},{"id":"p71-b1","pageNumber":71,"indexInPage":1,"text":"Y tambien si gana en sus apuestas –nada le sale de eso porque recibe solamente lo que le fue decretado, y ese dinero no tiene ninguna bendicion debido a que lo recibio por medio de un camino impropio. Su familiares sufren por sus perdidas, y se averguenzan porque el sustento les llega por medio de las apuestas. El apostador goza a cuenta del pesar de los otros Las apuestas son terriblemente inmorales."},{"id":"p71-b2","pageNumber":71,"indexInPage":2,"text":"En la mayoria de los casos, la ganancia de las apuestas es a cuenta de otro; ¿como puede ser que un hombre creyente acepte gozar a cuenta del pesar de su projimo? Y a decir verdad, no solo su projimo sufre, porque como se ha dicho anteriormente, el apostador pierde el dinero de su familia, y a veces pierde tambien el dinero de otra gente de la que tomo prestado, o a la que robo. ¿Como le seria posible a un hombre creyente gozar de este tipo de dinero ensuciado con la sangre de los demas?"},{"id":"p71-b3","pageNumber":71,"indexInPage":3,"text":"Con mayor razon, los duenos de las distintas casas de apuestas son realmente asesinos del espiritu. Todas sus enormes ganancias son a cuenta de la terrible afliccion de los que fueron seducidos a apostar en sus casas de juego, y especialmente de sus familiares. Y no solo eso, sino que les \"ayudan\" con prestamos para que puedan seguir apostando despues que su dinero se termino, y con esto los arruinan a ellos y a sus familiares. La conclusion es que el hombre creyente no tiene nada que ver con las apuestas."},{"id":"p71-b4","pageNumber":71,"indexInPage":4,"text":"En el caso que el hombre posea una fuerte pasion por las apuestas, debe pedirle al Creador del Universo, que le saque su apetito de dinero, pues esa es la razon por la cual es atraido por las apuestas – el enfermizo amor al dinero - desea tener mucho dinero aunque no tenga problemas de sustento."},{"id":"p71-b5","pageNumber":71,"indexInPage":5,"text":"Tambien debe rezar muchisimo para tener fe, porque la raiz de su apetito por el dinero y las apuestas es la herejia, es decir, que no cree que todo su sustento esta fijado desde el Cielo, y aun peor, ¡el cree con falsa fe que podra, a traves de las apuestas, ganar grandes sumas sin la Supervision Divina. ¿Que crees, que piensa que el Creador le quiere dar dinero"},{"id":"p71-b6","pageNumber":71,"indexInPage":6,"text":"mediante sus apuestas? Es ridiculo, el hombre debe saber que el Creador tiene muchos caminos para sostenerlo y no necesita su ayuda, y ciertamente no por el mal camino de las apuestas. Un hombre que adquiera más de un billete demuestra que no posee la fe que el Creador es el que determina quien ganará, y confía en los pronósticos, las probabilidades..."},{"id":"p71-b7","pageNumber":71,"indexInPage":7,"text":"Billetes de lotería Segun las leyes morales, aunque esto tampoco corresponde completamente al espiritu de estas leyes, la unica forma de apuestas que podria ser considerada como permitida es la loteria, pues la ganancia no es a cuenta de la perdida de otros. Si el hombre desea esforzarse en esa direccion, la unica forma permitida segun la fe, es que compre un solo billete."},{"id":"p71-b8","pageNumber":71,"indexInPage":8,"text":"La razon es que solamente el Creador es el que determina quien ganara el premio, y asi, si es Su Voluntad sustentar al hombre de esta forma, El provocara que la suerte caiga en su billete, el Creador no necesita su ayuda con otro billete mas. Por lo tanto, un hombre que adquiera mas de un billete demuestra que no posee la fe que el Creador es el que determina quien ganara, y confia en los pronosticos, las probabilidades, etc."},{"id":"p71-b9","pageNumber":71,"indexInPage":9,"text":"Y no solo eso, sino que este hombre gasta el dinero que le fue depositado en sus manos por el Creador en tonterias y vanidades, en contra de Su Voluntad, y debera dar rendicion de cuentas sobre esto. Esta es su prueba de fe: si cree que el Creador determina su subsistencia – no comprara mas que un solo billete. Si gana – estara alegre, y si no –tendra la creencia que asi el Creador lo quiere, y que es para su propio bien no haber ganado y no tendra ninguna pena. En tal caso lograra una buena calificacion en su prueba de fe."},{"id":"p71-b10","pageNumber":71,"indexInPage":10,"text":"Pero si contrariamente, no cree en la Supervision Divina, entonces piensa que cuanto mas billetes comprara, aumentan sus probabilidades de ganar, o tiene la esperanza que esta vez tendra suerte, etc. Este hombre gasta su dinero inutilmente, se llena de vanas esperanzas, desilusiones, herejias, confusiones, y su calificacion en la prueba de la fe es muy baja."},{"id":"p71-b11","pageNumber":71,"indexInPage":11,"text":"Una prueba difícil El hombre que repentinamente gana una gran suma de dinero, sea por ganar la loteria, o sea por otra razon como una herencia, o al hacer la transaccion de su vida, esta en una prueba de fe – un muy dificil examen. Y la realidad"}],"rawCharCount":4844},{"pageNumber":72,"blocks":[{"id":"p72-b0","pageNumber":72,"indexInPage":0,"text":"ya probo que la mayoria de esos ganadores, ganaron una gran suma de dinero, pero perdieron sus vidas... ¿Cual es la causa? Es que en la mayoria de los casos la gente no posee las herramientas espirituales y mentales para quedarse tal cual es, cuando en sus manos cae una riqueza excepcional, a la cual no estan acostumbrados. Por lo tanto se llenan de arrogancia y de repente, el esposo no quiere mas vivir con su esposa, o la esposa no quiere mas a su marido."},{"id":"p72-b1","pageNumber":72,"indexInPage":1,"text":"Sus pensamientos se embrollan con todas las nuevas y grandes posibilidades que les esperan y asi se complican con malas inversiones, caen en las trampas de impostores, abogados, nuevos familiares y en todo tipo de embrollos y tienen asi grandes aflicciones. Solo cuando el hombre tiene completa fe, entonces posee las herramientas para recibir una riqueza tan grande, y como sabe que el dinero no es de el – no se enorgullece."},{"id":"p72-b2","pageNumber":72,"indexInPage":2,"text":"Este hombre sabe bien que el dinero le fue depositado por el Creador para que lo use adecuadamente segun Su Voluntad, que solo El es el que enriquece y empobrece, y que asi como lo enriquecio, con la misma rapidez puede tomarle toda su fortuna si no se comporta como es debido. Por lo tanto, este hombre no se conduce con imprudencia y con apuro, sino que piensa y calcula juiciosamente como invertir el dinero que le llego, y confia en el Creador para que lo guie en todo lo que hace."},{"id":"p72-b3","pageNumber":72,"indexInPage":3,"text":"El da un diezmo de su dinero para caridad (quien desea cumplir de la mejor manera el precepto de \"Y amaras al Senor... con todos tus recursos\", es conveniente que de la quinta parte de su ganancias, es decir el veinte por ciento),e invierte en negocios mientras consulta con el Creador y le reza para que lo dirija en cada paso; tambien invierte solo una parte de la suma y no corre tras las riquezas (vease cap. \"Los negocios\"); tambien invierte en establecimientos de Tora y beneficencia – que son inversiones eternas."},{"id":"p72-b4","pageNumber":72,"indexInPage":4,"text":"Este hombre logra una excelente calificacion en el examen de la fe, y no se danara por la repentina ganancia que le llego, ni material ni espiritualmente. Por el contrario, el que no posee fe, piensa que el dinero es suyo y que lo puede usar como desea, sin dar cuentas. Empieza a confundirse sobre como y donde invertira el dinero de forma que no lo pueda perder."},{"id":"p72-b5","pageNumber":72,"indexInPage":5,"text":"Se enorgullece, siente que su esposa ya no es para el, despues de todo – el es rico... pierde a sus amigos, empieza a temer de todos los que lo rodean y a sospechar que quieren explotarlo para gozar de su ganancia; esta lleno de miedos, inquietudes, sospechas"},{"id":"p72-b6","pageNumber":72,"indexInPage":6,"text":"y todo tipo de sufrimientos y confusiones. En muchos casos pierde todo su dinero y todavia se queda con grandes deudas, si no fuera por esa ganancia, nunca llegaria a estas situaciones. Este hombre ha fracasado en el examen de la fe, y su vida se destruye precisamente por medio de esa gran ganancia, de la cual espero le resuelva todos sus problemas."},{"id":"p72-b7","pageNumber":72,"indexInPage":7,"text":"Felicidad o riqueza Como se ha dicho anteriormente, este tipo de esfuerzo demuestra la falta de fe, porque por supuesto el hombre apostador quiere ganar un gran suma de dinero y piensa que eso le resolvera todos sus problemas. Pero el hombre creyente sabe, que su buena vida no depende de cuanto dinero posee, sino de cuanto logra cumplir la Voluntad del Creador, y esencialmente, de cuanta fe tiene. Y la unica solucion a sus problemas es el arrepentimiento, la plegaria y la caridad – y trabajar mucho para adquirir la fe."},{"id":"p72-b8","pageNumber":72,"indexInPage":8,"text":"Porque esta bien claro que si el Creador le da sufrimientos en forma de falta de sustento, entonces incluso si ganara toda suma de dinero que sea, no le ayudara para escaparse de ellos, y solo los cambiaria por otro tipo de sufrimientos, probablemente todavia mas dificiles. ¡Solo el arrepentimiento y retorno al Creador le podra ayudar al hombre a eliminar sus sufrimientos!, pues no existen sufrimientos sin pecados."},{"id":"p72-b9","pageNumber":72,"indexInPage":9,"text":"Y de por si, todo el tiempo que no se arrepintio, aunque tuviera todo el dinero del mundo, estuviera sano completamente y no le faltara nada, siempre tendria sufrimientos por causa de sus pecados. Lo que no seria asi si tuviera el merito de arrepentirse, entonces su vida seria placentera y feliz, aunque no tuviera ni siquiera una moneda usada en el bolsillo. Como se cuenta del maestro Aharon de Kivlitch, que siempre tenia una extraordinaria alegria aunque vivia en una gran pobreza."},{"id":"p72-b10","pageNumber":72,"indexInPage":10,"text":"Una vez le dijo su amigo, que era un hombre de fortuna, que lo envidiaba mucho, pues aunque siempre les compra a su esposa e hijos todo lo que ellos quieren y los trata de satisfacer todo el tiempo, siempre hay peleas en su casa y nunca estan satisfechos. ¡Pero a pesar de su pobreza en el hogar del maestro Aharon, que esta siempre alegre y alegra a su esposa e hijos, estan todos siempre contentos y felices!"},{"id":"p72-b11","pageNumber":72,"indexInPage":11,"text":"Por lo tanto, el hombre debe estar contento con lo suyo, y no aspirar a enriquecerse porque \"El que aumenta sus bienes – aumenta sus preocupaciones\" y no aumenta su felicidad, salud o toda otra buena cosa. Y por supuesto que la frase que dijeron los Sabios: \"¿Cual es el rico? El que"}],"rawCharCount":4986},{"pageNumber":73,"blocks":[{"id":"p73-b0","pageNumber":73,"indexInPage":0,"text":"esta contento con lo suyo\" – es la pura verdad. ¿Y si verdaderamente le falta algo al hombre? Debe pedirle al Creador con misericordia y con suplicas, y lograra lo que desea. Se cuenta de un hombre que llegó hasta un gran sabio y le dijo: \"No me gusta mi esposa, no es bella\". Le preguntó el sabio: \"¿Cuál es su nombre?...\" \"Paz en el hogar\" - el examen principal El examen principal de la fe del hombre es en su propia casa, con su esposa e hijos."},{"id":"p73-b1","pageNumber":73,"indexInPage":1,"text":"Hay veces en que el hombre sufre desprecios de parte de sus familiares, a veces no le obedecen, a veces algun familiar tiene problemas de salud o de educacion, a veces hay dificultades de sustento… La unica forma de sobreponerse a los problemas, es por medio de la fe."},{"id":"p73-b2","pageNumber":73,"indexInPage":2,"text":"Es debido saber que la relacion matrimonial, con todas las dificultades que la acompanan, obliga al hombre a vivir con mucha mas fe, que en las relaciones de fuera del hogar y sus dificultades, pues el matrimonio es una relacion obligatoria y no existe ninguna manera de desligarse de ella. Por eso, la esencia de la rectificacion del hombre empieza solo cuando contrae matrimonio. Pues durante todo el tiempo que el hombre no esta casado, se puede arreglar sin que necesite verdaderamente trabajar profundamente sobre su fe."},{"id":"p73-b3","pageNumber":73,"indexInPage":3,"text":"Pero cuando se casa, recibe la verdadera medida de su nivel de fe, lo que lo obliga a empezar a trabajar en ella. Por ejemplo, un hombre soltero que no se entiende con una determinada persona, puede simplemente alejarse o ignorarla, ¿acaso alguien lo obliga a tener una relacion con ella? de por si, el no tiene ningun trabajo sobre su fe y ninguna medida para saber su grado de fe. Pero el hombre casado no puede abandonar su casa ni escapar de las pruebas que le llegan de sus familiares."},{"id":"p73-b4","pageNumber":73,"indexInPage":4,"text":"El debe quedarse donde esta, sobreponerse a esas pruebas y a pesar suyo ve el grado exacto de su fe y debe trabajar en ella. Si un hombre soltero es agraviado, puede devolver el agravio en forma violenta sin que esto aflija a su vida privada. E incluso si no es un tipo de persona que devuelve y contesta a los que lo ofenden, es solo porque le es comodo presentarse a los que lo rodean como una persona de buen caracter."},{"id":"p73-b5","pageNumber":73,"indexInPage":5,"text":"Pero el hombre casado cuya esposa lo desdena, o uno de sus hijos no lo obedece, responde exactamente segun los rasgos de su caracter. Si es una persona irascible, no puede esconder su ira, y por supuesto que cada"},{"id":"p73-b6","pageNumber":73,"indexInPage":6,"text":"reaccion en su casa que no responde a su deseo, recibe su enojo. Entonces este hombre entiende que sin un verdadero trabajo sobre su fe, nunca tendra paz en su hogar. El hombre soltero no necesita estar en la constante situacion de dar a otro, de entenderlo, de escucharlo, mientras que el hombre casado siempre debe dar, influir, escuchar y entender. Y para hacer todo esto, debe tener su espiritu calmo y entero, lo cual es imposible sin la fe."},{"id":"p73-b7","pageNumber":73,"indexInPage":7,"text":"El hombre soltero puede presentarse como un ser alegre y sociable, pero cuando esta casado se revela su verdadera alegria cuando necesita alegrar a su familia y a hacerle la vida placentera... Y por supuesto, es imposible ser una persona verdaderamente alegre sin fe. En general, las relaciones del hombre con la sociedad que lo rodea estan fundadas en el principio de \"toma y da\", en actos y disfraces cuyo fin es recibir honores, aprecio, posicion, sustento, etc."},{"id":"p73-b8","pageNumber":73,"indexInPage":8,"text":"Pero en su propia casa, el hombre se saca todas sus mascaras y se conduce precisamente como es. Si no posee fe, esto resaltara mucho en su conducta, dejara una marca en su felicidad domestica, y lo obligara a empezar a trabajar sobre la fe. La paz en el hogar depende del nivel de la fe Esta es la regla - toda la paz domestica del hombre depende de su fe, y por lo tanto, solo cuando contrae matrimonio, puede verdaderamente empezar a trabajar sobre su fe con profundidad."},{"id":"p73-b9","pageNumber":73,"indexInPage":9,"text":"Por eso, la pareja debe aprender a ver todo lo que sucede en su hogar con fe, saber que en cualquier cuestion problematica que se le presenta - con los hijos o parientes, o con el sustento, esta en una prueba de fe, y debe conducirse segun las tres reglas de la misma. Debe entender muy bien que existe solo uno y unico consejo para cada problema de su vida que es: ir solo por el camino de la fe con sumision, arrepentimiento y mucha plegaria."},{"id":"p73-b10","pageNumber":73,"indexInPage":10,"text":"\"Contento con lo suyo\" Se cuenta de un hombre que llegó hasta un gran sabio y le dijo: \"No me gusta mi esposa, no es bella\". Le preguntó el sabio: \"¿Cuál es su nombre?\" \"Ana\", le contestó. Dijo el sabio: \"¡Que se embellezca Ana!\", y así fue que Ana embelleció. Después de un tiempo, volvió otra vez el hombre al sabio y reclamó de nuevo que no estaba satisfecho de su esposa. Le contó que desde que su esposa embelleció, comenzó a enorgullecerse frente él. Dijo el sabio: \"¡Que vuelva Ana a su fealdad!\", y así fue..."},{"id":"p73-b11","pageNumber":73,"indexInPage":11,"text":"¿Que podemos aprender de esta historia? ¿Que nos ensena que el hombre quiso de vuelta la fealdad de su esposa? La ensenanza es que el Creador sabe perfectamente lo que es bueno"}],"rawCharCount":4885},{"pageNumber":74,"blocks":[{"id":"p74-b0","pageNumber":74,"indexInPage":0,"text":"para cada uno, y que debemos creer que todo lo que El hace es para nuestro bien; esto se llama tener fe en la Supervision Individual de Di-s. Todo el que logra esta creencia, esta siempre contento con lo que tiene, pues sabe que todas sus privaciones estan bajo Su Supervision y son para su eterno bien, precisamente segun la correccion del alma que debe hacer y segun la meta para la cual llego a este mundo."},{"id":"p74-b1","pageNumber":74,"indexInPage":1,"text":"De por si, est
